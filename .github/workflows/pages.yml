name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl zhconv

      - name: Build site (HTML + Excel)
        run: python build.py

      - name: Assemble _site
        run: |
          mkdir -p _site
          cp 施工图材料代码多语对照表.html _site/index.html
          cp 施工图材料代码多语对照表.xlsx _site/ 2>/dev/null || true
          cp README.md _site/ 2>/dev/null || true

      - name: Commit rebuilt page back to repo
        continue-on-error: true
        run: |
          cp 施工图材料代码多语对照表.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: rebuild index.html"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
