name: Publish offline build to Gitee

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gitee-publish
  cancel-in-progress: false

jobs:
  gitee:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 推完整历史到 Gitee 必须是完整克隆（浅克隆会被远端拒绝）
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl zhconv

      - name: Sync code to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          set -uo pipefail
          if [ -z "${GITEE_TOKEN:-}" ] || [ -z "${GITEE_OWNER:-}" ] || [ -z "${GITEE_REPO:-}" ]; then
            echo "Gitee 未配置（缺少 token/owner/repo），跳过代码同步"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://${GITEE_OWNER}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          # Gitee 端初始与 GitHub 无共同祖先，故用覆盖式同步
          git push --force gitee HEAD:main
          git remote remove gitee

      - name: Publish to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          if [ -z "${GITEE_TOKEN:-}" ] || [ -z "${GITEE_OWNER:-}" ]; then
            echo "Gitee 未配置，跳过发布"
            exit 0
          fi
          python tools/publish_gitee.py --build

      - name: Commit back meta
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta.csv
          git add "施工图材料代码多语对照表.html" "施工图材料代码多语对照表.xlsx" || true
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: publish to gitee and record release tag"
            git push
          fi
