name: Publish offline build to Gitee

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gitee:
    # 注意：secrets 上下文在 job 级 if 不可用，令牌判断必须放在 step 级
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 推完整历史到 Gitee 必须是完整克隆（浅克隆会被远端拒绝）
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl zhconv

      - name: Sync code to Gitee (镜像 main 分支)
        if: ${{ secrets.GITEE_TOKEN != '' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://${GITEE_OWNER}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          # Gitee 端初始为空仓（与 GitHub 无共同祖先），故用覆盖式同步
          git push --force gitee HEAD:main
          git remote remove gitee

      - name: Publish to Gitee (release + 附件)
        if: ${{ secrets.GITEE_TOKEN != '' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: python tools/publish_gitee.py --build

      - name: Commit back meta (Gitee 坐标与版本标签)
        if: ${{ secrets.GITEE_TOKEN != '' }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta.csv "施工图材料代码多语对照表.html" "施工图材料代码多语对照表.xlsx"
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: publish to gitee and record release tag"
            git push
          fi
