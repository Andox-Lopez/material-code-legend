iti (divisione 09 Finishes) con le norme ASTM/AWI, NBS Source Work Sections 05/06 e le revisioni trimestrali di Uniclass 2026 del Regno Unito, BS 8300, BS EN 14411, gli Eurocodes europei, DIN 18202 e EN 12004, più la pratica del Finish Schedule redatto dall'architetto.\"\nwest,pt,Ocidente (EUA / Reino Unido / UE),\"As legendas ocidentais escrevem-se em inglês e usam abreviaturas do sector como Gypsum Board, Acoustic Ceiling Tile, VCT/LVP, MDF ou WBP. A iluminação separa a luminária (LT) do downlight (DL) e as placas de saída são EX. Repare-se que Matte (MT) no quadro de acabamentos colide com Metal (MT) no quadro de materiais. Duas actualizações de 2026 afectam directamente a leitura dos desenhos: a CSI MasterFormat 2026 aplicou actualizações de manutenção à divisão 09 Finishes (clarificações de título e pequenas reestruturações; 2.185 entradas novas e 617 reestruturadas no total, com mais de 80 por cento da alteração estrutural na Division 32 Exterior Improvements e na Division 34 Transportation), e a NBS Uniclass alargou a sua tabela CAD nas actualizações trimestrais de janeiro, abril e julho de 2026 para suportar a nomenclatura de camadas AutoCAD alinhada com as normas ISO.\",As abreviaturas são definidas por cada arquiteto: MR pode significar Marble ou Mirror conforme o projeto.,\"Referências: CSI MasterFormat, NBS Source, BS 8300, BS EN 14411, DIN 18202, EN 12004.\",\"Estados Unidos: CSI MasterFormat 2026 (2.185 entradas novas e 617 reestruturadas; a divisão 09 Finishes juntamente com as divisões 01, 06, 10 e 26 receberam actualizações de manutenção, enquanto a Division 32 Exterior Improvements e a Division 34 Transportation concentram mais de 80 por cento da alteração estrutural) e as normas de produto ASTM e AWI ; Reino Unido: NBS Source Work Sections 05 e 06 e as tabelas NBS Uniclass (actualizações trimestrais de janeiro, abril e julho de 2026: a versão de janeiro alargou a tabela CAD para a nomenclatura de camadas AutoCAD alinhada com a ISO e acrescentou códigos de pegada do edifício e de superfície exterior bruta, a de abril acrescentou 12 classificações e alterou 40, a de julho acrescentou 42 classificações, alterou 5 e renomeou Smoke dampers para Smoke control dampers; a correspondência completa com o NRM3 está em curso), com BS 8300 e BS EN 14411 ; Europa: EN 1991–1995 Eurocodes, DIN 18202 Drylining, EN 12004 Adhesives for tiling ; Prática do Finish Schedule do próprio arquitecto e das fichas de produto (as abreviaturas nos EUA são mais longas e variam de projecto para projecto)\",\"Fontes: CSI MasterFormat 2026 dos EUA (divisão 09 Finishes) com as normas ASTM/AWI, NBS Source Work Sections 05/06 e as actualizações trimestrais do Uniclass 2026 do Reino Unido, BS 8300, BS EN 14411, os Eurocodes europeus, DIN 18202 e EN 12004, mais a prática do Finish Schedule do próprio arquitecto.\"\nwest,ru,Запад (США / Великобритания / ЕС),\"Легенды в западных проектах пишут по-английски и используют отраслевые сокращения вроде Gypsum Board, Acoustic Ceiling Tile, VCT/LVP, MDF, WBP. Освещение разделяет светильник (LT) и точечный светильник (DL), указатели выхода — EX. Обратите внимание: Matt (MT) в ведомости отделок совпадает с Metal (MT) в ведомости материалов. Два обновления 2026 года прямо влияют на чтение чертежей: CSI MasterFormat 2026 внёс поддерживающие правки в раздел 09 Finishes (уточнение заголовков и небольшие перестройки; всего 2 185 новых и 617 переработанных позиций, при этом более 80 процентов структурных изменений приходится на Division 32 Exterior Improvements и Division 34 Transportation), а NBS Uniclass расширила таблицу CAD в квартальных обновлениях января, апреля и июля 2026 года, чтобы поддержать согласованное со стандартами ISO именование слоёв AutoCAD.\",Сокращения каждый архитектор вводит сам: MR может означать Marble или Mirror — в зависимости от проекта.,\"Ориентиры: CSI MasterFormat, NBS Source, BS 8300, BS EN 14411, DIN 18202, EN 12004.\",\"США: CSI MasterFormat 2026 (2 185 новых и 617 переработанных позиций; раздел 09 Finishes, а также разделы 01, 06, 10 и 26 получили поддерживающие правки, тогда как Division 32 Exterior Improvements и Division 34 Transportation дают более 80 процентов структурных изменений) и продуктовые стандарты ASTM и AWI ; Великобритания: NBS Source Work Sections 05 и 06, а также таблицы NBS Uniclass (квартальные обновления января, апреля и июля 2026 года: январское расширило таблицу CAD для согласованного со стандартами ISO именования слоёв AutoCAD и добавило коды контура здания и общей внешней площади, апрельское добавило 12 классификаций и изменило 40, июльское добавило 42 классификации, изменило 5 и переименовало Smoke dampers в Smoke control dampers; полное сопоставление с NRM3 находится в разработке), а также BS 8300 и BS EN 14411 ; Европа: EN 1991–1995 Eurocodes, DIN 18202 Drylining, EN 12004 Adhesives for tiling ; Практика собственных Finish Schedule архитектора и продуктовых каталогов (американские сокращения длиннее и задаются на каждом проекте)\",\"Источники: американский CSI MasterFormat 2026 (раздел 09 Finishes) со стандартами ASTM/AWI, британские NBS Source Work Sections 05/06 и квартальные обновления Uniclass 2026 года, BS 8300, BS EN 14411, европейские Eurocodes, DIN 18202 и EN 12004, а также практика собственного Finish Schedule архитектора.\"\nlatam,fr,Espagne et Amérique latine,\"En Espagne et en Amérique latine, les codes viennent surtout des normes techniques et des traditions de dessin de chaque pays (CTE, NBE, NCh), et se standardisent dans le Cuadro de Materiales du bureau d'études, organisé par familles : pierre, carrelage, peinture. Les finitions suivent la terminologie espagnole de la pierre et de la céramique (apomazado mat, pulido poli, arenado sablage, apagado ou flameado flammé, abujardado bouchardé, envejecido antiqué) ; les luminaires suivent le système espagnol de luminarias (empotrada encastrable, plafón plafonnier, suspension suspendue, proyector sobre carril sur rail, applique applique murale).\",\"Les acronymes varient d'un pays à l'autre : PIED, MAR, CT, PINT ne se lisent pas partout de la même façon.\",\"Renvois : CTE, NBE, NCh, UNE / NMX.\",\"Espagne : CTE Código Técnico de la Edificación (DB-SI incendie, DB-HS santé, DB-HR acoustique) ; Mexique : NBE Normas Básicas de Edificación ; Chili : normes NCh ; Séries de produit UNE (Espagne) et NMX (Mexique) ; Pratique du Cuadro de Materiales : regroupement par familles pierre, carrelage, peinture (PIED / MAR / CT / PINT)\",\"Sources : CTE espagnol, NBE mexicaines, normes NCh chiliennes, séries UNE/NMX et la pratique de rédaction du Cuadro de Materiales.\"\nlatam,it,Spagna e America Latina,\"In Spagna e in America Latina i codici derivano soprattutto dalle norme tecniche e dalle tradizioni di disegno di ciascun paese (CTE, NBE, NCh) e si uniformano nel Cuadro de Materiales dello studio, articolato per famiglie: pietra, ceramica, vernice. Le finiture seguono la terminologia spagnola di pietra e ceramica (apomazado satinato, pulido lucido, arenato sabbiato, apagado o flameado fiammato, abujardato bocciardato, envejecido anticato) ; i corpi illuminanti seguono il sistema spagnolo delle luminarias (empotrada incassata, plafón plafoniera, suspensión sospesa, proyector sobre carril su binario, applique appliqua).\",\"Gli acronimi variano da paese a paese: PIED, MAR, CT e PINT non si leggono ovunque allo stesso modo.\",\"Riferimenti: CTE, NBE, NCh, UNE / NMX.\",\"Spagna: CTE Código Técnico de la Edificación (DB-SI incendio, DB-HS salute, DB-HR acustica) ; Messico: NBE Normas Básicas de Edificación; Cile: norme NCh ; Serie di prodotto UNE (Spagna) e NMX (Messico) ; Prassi del Cuadro de Materiales: suddivisione per famiglie pietra, ceramica, vernice (PIED / MAR / CT / PINT)\",\"Fonti: CTE spagnolo, NBE messicane, norme NCh cilene, serie UNE/NMX e la prassi di stesura del Cuadro de Materiales.\"\nlatam,pt,Espanha e América Latina,\"Em Espanha e na América Latina, os códigos provêm sobretudo das normas técnicas e das tradições de desenho de cada país (CTE, NBE, NCh), padronizando-se no Cuadro de Materiales do escritório, organizado por famílias: pedra, azulejo, tinta. Os acabamentos seguem a terminologia espanhola de pedra e cerâmica (apomazado acetinado, pulido polido, arenado jateado, apagado ou flameado flamejado, abujardado bujardado, envejecido envelhecido) ; as luminárias seguem o sistema espanhol de luminárias (empotrada embutida, plafón plafon, suspensión suspensa, proyector sobre carril trilho, aplique applique).\",\"Os acrónimos variam de país para país: PIED, MAR, CT e PINT não se lêem igual em todo o lado.\",\"Referências: CTE, NBE, NCh, UNE / NMX.\",\"Espanha: CTE Código Técnico de la Edificación (DB-SI incêndio, DB-HS saúde, DB-HR acústica) ; México: NBE Normas Básicas de Edificación; Chile: normas NCh ; Séries de produto UNE (Espanha) e NMX (México) ; Prática do Cuadro de Materiales: agrupamento por famílias pedra, azulejo e tinta (PIED / MAR / CT / PINT)\",\"Fontes: CTE espanhol, NBE sighted mexicanas, normas NCh chilenas, séries UNE/NMX e a prática de redação do Cuadro de Materiales.\"\nlatam,ru,Испания и Латинская Америка,\"В Испании и Латинской Америке коды происходят главным образом из технических норм и традиций черчения каждой страны (CTE, NBE, NCh) и приводятся к единому виду в Cuadro de Materiales проектного бюро — по семействам: камень, плитка, краска. Отделка следует испанской терминологии камня и керамики (apomazado — матовая, pulido — полированная, arenado — пескоструйная, apagado/flameado — обожжённая, abujardado — бучардированная, envejecido — античная); светильники — по испанской системе luminaria (empotrada — встроенный, plafón — потолочный, suspensión — подвесной, proyector sobre carril — трековый, applique — настенный).\",\"Аббревиатуры различаются от страны к стране: PIED, MAR, CT, PINT читаются не везде одинаково.\",\"Ориентиры: CTE, NBE, NCh, UNE / NMX.\",\"Испания: CTE Código Técnico de la Edificación (DB-SI пожар, DB-HS санитария, DB-HR акустика) ; Мексика: NBE Normas Básicas de Edificación; Чили: стандарты NCh ; Серии продукции UNE (Испания) и NMX (Мексика) ; Практика Cuadro de Materiales: группировка по семействам — камень, плитка, краска (PIED / MAR / CT / PINT)\",\"Источники: испанский CTE, мексиканские NBE, чилийские NCh, серии UNE/NMX и практика составления Cuadro de Materiales.\"\nmena,fr,Moyen-Orient et Asie du Sud-Est,\"Ni le Moyen-Orient ni l'Asie du Sud-Est n'ont de norme locale : la pratique repose sur les légendes du consultant et de l'entrepreneur, ainsi que sur le circuit de soumission (Submittal). Les codes sont le plus souvent en anglais, avec des notations d'achèvement (TBC, MOQ, GP).\",Le même code change selon le lot : DL désigne l'éclairage dans le lot interiors et l'éclairage de paysage dans le lot paysages ; chaque TBC doit être levé avant diffusion.,\"Renvois : SBC, GCC (ESMA/GSO), Dubai Municipality, Estidama, BCA et SS 563.\",\"Saudi Building Code (SBC) ; codes généraux du GCC (ESMA / GSO) ; Dubai Municipality Manual of Building Regulations ; système de pearls Estidama d'Abu Dhabi ; Code on Accessibility de BCA de Singapour et SS 563 Code de pratique pour la sécurité contre l'incendie ; série MS ISO ; Notations de submittal : TBC, TBA, MOQ, GP, MFG (plafond en fibres minérales)\",\"Sources : Saudi Building Code, codes du GCC, manuel de construction de Dubaï, système Estidama, BCA et SS 563 de Singapour, lus avec la pratique des légendes au stade de la soumission.\"\nmena,it,Medio Oriente e Sud-est asiatico,\"Né il Medio Oriente né il Sud-est asiatico hanno norme locali: la pratica si regge su legende di consulente e impresa e sul circuito di approvazione (Submittal). I codici sono per lo più in inglese, con sigle di completamento (TBC, MOQ, GP).\",Lo stesso codice cambia da lotto a lotto: DL indica l'illuminazione nel lotto interni e l'illuminazione di paesaggio nel lotto paesaggio; ogni TBC va chiuso prima della pubblicazione.,\"Riferimenti: SBC, GCC (ESMA/GSO), Dubai Municipality, Estidama, BCA e SS 563.\",\"Saudi Building Code (SBC); codici generali del GCC (ESMA / GSO) ; Dubai Municipality Manual of Building Regulations; sistema perle Estidama di Abu Dhabi ; Code on Accessibility del BCA di Singapore e SS 563 Codice di pratica per la sicurezza antincendio; serie MS ISO ; Sigle nelle approvazioni: TBC, TBA, MOQ, GP, MFG (controsoffitto in fibre minerali)\",\"Fonti: Saudi Building Code, codici del GCC, manuale di costruzione di Dubai, sistema Estidama, BCA e SS 563 di Singapore, insieme alla prassi delle legende in fase di approvazione.\"\nmena,pt,Médio Oriente e Sudeste Asiático,\"Nem o Médio Oriente nem o Sudeste Asiático têm norma local: a prática assenta nas legendas do consultor e do empreiteiro e no circuito de aprovação (Submittal). Os códigos são em geral em inglês, com siglas de fecho (TBC, MOQ, GP).\",O mesmo código muda conforme o pacote: DL é a iluminação no pacote de interiores e a iluminação paisagística no pacote de paisagismo; cada TBC tem de ser fechado antes da emissão.,\"Referências: SBC, GCC (ESMA/GSO), Dubai Municipality, Estidama, BCA e SS 563.\",\"Saudi Building Code (SBC); códigos gerais do GCC (ESMA / GSO) ; Manual of Building Regulations do Municipality de Dubai; sistema de pérolas Estidama de Abu Dhabi ; Code on Accessibility do BCA de Singapura e SS 563 Código de Prática para Segurança contra Incêndio; série MS ISO ; Siglas nas aprovações: TBC, TBA, MOQ, GP, MFG (teto de fibra mineral)\",\"Fontes: Saudi Building Code, códigos do GCC, manual de construção de Dubai, sistema Estidama, BCA e SS 563 de Singapura, lidos com a prática de legendas na fase de aprovação.\"\nmena,ru,Ближний Восток и Юго-Восточная Азия,\"Ни на Ближнем Востоке, ни в Юго-Восточной Азии нет местных норм: практика держится на легендах консультанта и подрядчика и на процедуре согласований (Submittal). Коды обычно английские, с пометками о незавершённости (TBC, MOQ, GP).\",Один код означает разное в разных разделах: DL — освещение в разделе интерьеров и ландшафтное освещение в разделе благоустройства; каждый TBC закрывается до выпуска.,\"Ориентиры: SBC, GCC (ESMA/GSO), Dubai Municipality, Estidama, BCA и SS 563.\",\"Saudi Building Code (SBC); общие нормы GCC (ESMA / GSO) ; Manual of Building Regulations Департамента муниципалитета Дубая; система «жемчужин» Estidama Абу-Даби ; Code on Accessibility BCA Сингапура и SS 563 «Кодекс практики пожарной безопасности»; серия MS ISO ; Обозначения в согласованиях: TBC, TBA, MOQ, GP, MFG (подвесной потолок из минерального волокна)\",\"Источники: Saudi Building Code, нормы GCC, руководство по строительству Дубая, система Estidama, BCA и SS 563 Сингапура — вместе с практикой легенд на стадии согласований.\"\nmo,zh,中国澳门,澳门的装修工程图例没有统一强制国标，材料表与图例由项目方与设计方自订；实务上沿用港式粤语区缩写习惯，云石（大理石）、瓷砖、石膏板 GYB、防火板 FP、假天花、傢俬等写法常见，灯具大类写 LT、筒灯仍写 DL。石材与板材类材料则按《材料白皮书》的「两位类别字母＋两位序号」编排，例如 PM01 人造石（雅士白）、WD01 浅色木纹生态板。同时，墙面与天花饰面须符合《都市建筑法律制度》及防火安全法律制度所定的遇火反应等级（A1–F，并注烟雾 s1–s3、滴落 d0–d2）。以本项目 Material Legend 为准。,澳门本地码与内地、港台写法有多处高频冲突：LT 与 DL 按港式分工（LT＝灯具大类、DL＝筒灯），与内地 DL 一字双义相反；PM（PM01 人造石）勿与内地 ST 石材混用，WD 多为木纹生态板而非实木。饰面代码 FC（假天花与氟碳喷涂）、FL（火烧面与泛光灯）、CL（亮漆罩面与吸顶灯）同码不同义，须按图纸类型与所在图层判断。饰面遇火反应等级 A1–F 与烟雾 s1–s3、滴落 d0–d2 的分级还须与消防局口径一致，娱乐场所的墙面与天花饰面尤其要核对。跨项目套用前，必须先读该项目的 Material Legend。,澳门没有统一的装饰材料代码规范，材料表图例由发展商、总承建商与设计顾问按土地工务局《装修工程注意事项》的三级分类（家居简单装修工程／非家居简单装修工程／非简单装修工程）自行编制，所列范围包括假天花、内墙饰面、地板饰面、踢脚线、间隔墙、房门及洗手间配套。技术依据为第14/2021号法律《都市建筑法律制度》与第38/2022号行政法规细则、第15/2021号法律《楼宇及场地防火安全的法律制度》与第39/2022号行政法规《核准楼宇及场地防火安全技术规章》；市政署 IAM 负责公共工程、绿化区域与市政建设。,第14/2021号法律《都市建筑法律制度》（2022年8月17日生效）与第38/2022号行政法规《都市建筑法律制度施行细则》（原第79/85/M号法令《都市建筑总章程》已废止） ; 第15/2021号法律《楼宇及场地防火安全的法律制度》（2022年8月17日生效）与第39/2022号行政法规《核准楼宇及场地防火安全技术规章》（第34至36条：遇火反应 A1–F、烟雾 s1–s3、滴落 d0–d2，并接受 EN 13501-1:2018 试验方法） ; 土地工务局《装修工程注意事项》（家居简单装修工程／非家居简单装修工程／非简单装修工程三级分类） ; 市政署 IAM（公共工程、绿化区域与市政建设；第14/2026号行政法规《市政署的组织及运作》，2026年6月1日生效） ; 澳门城市大学科研中心《材料白皮书》（材料编号惯例：两位类别字母＋两位序号，如 PM01 人造石、WD01 浅色木纹生态板） ; 第1600号立法性法规《都市建筑总章程（技术篇）》,资料口径：按第14/2021号法律《都市建筑法律制度》及第38/2022号行政法规细则、第15/2021号法律《楼宇及场地防火安全的法律制度》及第39/2022号行政法规《核准楼宇及场地防火安全技术规章》、土地工务局《装修工程注意事项》与市政署 IAM 的实务要求整理；材料命名沿用《材料白皮书》的「两位类别字母＋两位序号」写法（PM、WD 等前缀）。\nmo,en,Macao,\"Macao has no mandatory national code standard for fit-out material legends; each project team draws up its own schedule, but practice follows Hong Kong-style Cantonese abbreviations — 云石 for marble, 瓷砖 for ceramic tile, GYB for gypsum board, FP for fire-rated laminate, 傢俬 for furniture — with LT used for the general lighting category and DL kept for downlights. Stone and board items are numbered with a two-letter category prefix plus a two-digit serial, as PM01 engineered stone (PM01 人造石·雅士白) and WD01 light wood-look board (WD01 浅色木纹生态板). Wall and ceiling finishes must at the same time meet the reaction-to-fire classes A1–F (with smoke classes s1–s3 and droplet classes d0–d2) set by the Urban Construction Legal System and the fire-safety legal system. The project's Material Legend still rules.\",\"Several local codes collide with Mainland and other regional practice: LT and DL are split the Hong Kong way (LT = luminaires, DL = downlights), the opposite of the Mainland double meaning of DL; PM (PM01 engineered stone) must not be mixed up with Mainland ST for stone, and WD usually means wood-look melamine board rather than solid timber. In the finish codes, FC (false ceiling / fluorine coat), FL (flamed finish / flood light) and CL (clear lacquer / ceiling light) each carry two meanings and can only be resolved from the drawing type and the layer they sit in. The reaction-to-fire grading A1–F with smoke s1–s3 and droplet d0–d2 must also agree with the Fire Services Bureau, particularly for wall and ceiling finishes in entertainment premises. Read the project's own Material Legend before reusing any code.\",\"Macao has no unified decoration-code standard: material legends are drawn up by developers, main contractors and design consultants against the three-tier classification of the DSSCU Notes on Renovation Works (simple domestic renovation works / non-domestic simple renovation works / non-simple renovation works), whose scope covers false ceilings, internal wall finishes, floor finishes, skirtings, partitions built of brick, glass or board, doors and washroom fittings. The technical basis is Law No. 14/2021 on the Urban Construction Legal System with Administrative Regulation No. 38/2022, and Law No. 15/2021 on Fire Safety of Buildings and Premises with Administrative Regulation No. 39/2022 on technical fire-safety approval; the Municipal Affairs Bureau (IAM) covers public works, green areas and municipal construction.\",\"Law No. 14/2021 on the Urban Construction Legal System (in force since 17 August 2022) and Administrative Regulation No. 38/2022 on the detailed implementation of the urban construction legal system (the former Decree-Law No. 79/85/M, the Urban Construction General Charter, has been repealed) ; Law No. 15/2021 on Fire Safety of Buildings and Premises (in force since 17 August 2022) and Administrative Regulation No. 39/2022 on the technical approval of fire safety of buildings and premises (Articles 34 to 36: reaction to fire A1–F, smoke s1–s3, droplets d0–d2, assessed by the EN 13501-1:2018 test method) ; DSSCU Notes on Renovation Works (three-tier classification: simple domestic renovation works / non-domestic simple renovation works / non-simple renovation works) ; Municipal Affairs Bureau (IAM) — public works, green areas and municipal construction, and Administrative Regulation No. 14/2026 on the organisation and operation of the Municipal Affairs Bureau (in force since 1 June 2026) ; City University of Macau research centre, Materials White Paper (material numbering convention: two category letters plus a two-digit serial, e.g. PM01 engineered stone, WD01 light wood-look board) ; Legislative Regulation No. 1600 (Urban Construction General Charter — Technical Part)\",\"Sources: Law No. 14/2021 and Administrative Regulation No. 38/2022 on the urban construction legal system, Law No. 15/2021 and Administrative Regulation No. 39/2022 on fire safety of buildings and premises, the DSSCU Notes on Renovation Works and the IAM; material naming follows the two-letter category prefix plus two-digit serial convention of the Materials White Paper (PM, WD and similar prefixes).\"\nmo,ja,マカオ,マカオの内装図の凡例には強制的な統一規格が定められておらず、工事ごとに設計者・施工者が材料表を作成します。実務では香港式の広東語圏の略稱が通用し、雲石（大理石）、瓷磚（タイル）、GYB（石膏板）、FP（防火板）、假天花（吊り天井）、傢俬（家具）などの書き方が見られ、照明は LT＝照明器具の大分類、DL＝ダウンライトと分かれます。石材や板材は《材料白皮書》の「類別2文字＋連番2桁」の方式で、PM01 人造石（雅士白）、WD01 淺色木紋生態板（淡色木目調エコボード）のように番号を振ります。壁面と天井の仕上げは、《都市建築法律制度》と《樓宇及場地防火安全的法律制度》が定める対火性能クラス（A1–F、煙 s1–s3、滴下 d0–d2）を満たす必要があります。判斷の基準は対象プロジェクトの Material Legend です。,マカオのコードには中国本土・他地域の表記と衝突する箇所があります。LT と DL は香港式（LT＝照明器具の大分類、DL＝ダウンライト）で、中国本土では DL に二つの意味が与えられるのとは逆に、香港式では LT と DL を別コードに分けています。PM（PM01 人造石）は中国本土の ST（石材）と混同しないよう注意が必要で、WD は 實木（実物の木材）ではなく木目調 melamine 板を指すことが多いものです。仕上げコードの FC（假天花／氟碳噴塗）はそれぞれ吊り天井／フッ素炭素吹付塗装を、FL（火燒面／泛光灯）は焼石目の仕上げ／投光器を、CL（亮漆罩面／吸頂灯）は艶出し塗装／天井照明を指し、同じ文字で意味が二通りあるため、図の種別と図層で判斷します。対火性能クラス A1–F と煙 s1–s3、滴下 d0–d2 の区分は消防局の基準と揃える必要があり、娯楽施設の壁面と天井の仕上げでは特に確認が必要です。転用前に必ず対象プロジェクトの Material Legend を確認してください。,マカオには統一された装飾材料コードの規範がなく、材料表の凡例は開発者・ゼネコン・設計顧問が土地工務局《装修工程注意事項》の三区分である家居簡單装修工程（一般住宅の簡易内装工事）、非家居簡單装修工程（非住宅の簡易内装工事）、非簡單装修工程（非簡易の内装工事）に沿って自ら作成します。その適用範囲には假天花（吊り天井）、内牆飾面（内壁仕上げ）、地板飾面（床仕上げ）、踢脚線（巾木）、レンガ・ガラス・板材による间隔牆（間仕切り壁）、房门（扉・建具）、洗手间配套（便所設備）が含まれます。技術的根拠は第14/2021号法律《都市建築法律制度》と第38/2022号行政法規、第15/2021号法律《樓宇及場地防火安全的法律制度》と第39/2022号行政法規《核準樓宇及場地防火安全技术规章》であり、公共工事・緑地・市政建設は市政署 IAM が擔當します。,第14/2021号法律《都市建築法律制度》（2022年8月17日施行）と第38/2022号行政法規《都市建築法律制度施行細則》（舊第79/85/M号法令《都市建築总章程》廃止） ; 第15/2021号法律《樓宇及場地防火安全的法律制度》（2022年8月17日施行）と第39/2022号行政法規《核準樓宇及場地防火安全技术规章》（第34條〜第36條：対火性能クラス A1–F、煙 s1–s3、滴下 d0–d2、EN 13501-1:2018 の試験方法による判定） ; 土地工務局《装修工程注意事項》（家居簡單装修工程／非家居簡單装修工程／非簡單装修工程の三区分） ; 市政署 IAM — 公共工事・緑地・市政建設、第14/2026号行政法規《市政署的組織及运作》（2026年6月1日施行） ; マカオシティ大學（澳門城市大學）研究センター《材料白皮書》（材料番号の慣例：類別2文字＋連番2桁、たとえば PM01 人造石、WD01 淺色木紋生態板） ; 第1600号立法性法規《都市建築总章程（技术篇）》,資料の口徑：第14/2021号法律《都市建築法律制度》と第38/2022号行政法規、第15/2021号法律《樓宇及場地防火安全的法律制度》と第39/2022号行政法規《核準樓宇及場地防火安全技术规章》、土地工務局《装修工程注意事項》、市政署 IAM の実務要求に基づき整理。材料の命名は《材料白皮書》の「類別2文字＋連番2桁」（PM、WD などの接頭辞）に倣っています。\nmo,ko,마카오,\"마카오 인테리어 도면의 범례에는 강제되는 통일 규격이 없어, 프로젝트마다 발주자·시공자·설계 컨설턴트가 재료표를 자체 작성합니다. 실무에서는 홍콩식 광둥어 관용어 약호를 따르며 雲石(대리석), 瓷磚(타일), GYB(석고보드), FP(내화 합판), 假天花(천장 마감), 傢俬(가구) 같은 표기가 쓰이고, 조명은 LT＝조명기구 대분류, DL＝다운라이트로 나뉩니다. 석재와 판재는 《材料白皮書》 방식대로 「두 글자 분류＋두 자리 연번」으로 번호를 매겨 PM01 인조석(雅士白), WD01 옅은 무늬 에코보드처럼 씁니다. 벽면과 천장 마감은 《都市建築法律制度》와 《樓宇及場地防火安全的法律制度》가 정한 반화 성능 등급(A1–F, 연기 s1–s3, 낙하 d0–d2)을 충족해야 합니다. 기준은 해당 프로젝트의 Material Legend입니다.\",\"마카오 약호에는 중국 본토·타 지역 표기와 겹치는 부분이 있습니다. LT와 DL은 홍콩식(LT＝조명기구 대분류, DL＝다운라이트)으로, 중국 본토에서 DL에 이중 의미가 붙는 표기와는 반대로 LT와 DL을 서로 다른 코드로 나눕니다. PM(PM01 인조석)은 본토의 ST(석재)와 혼동하지 않아야 하고, WD는 實木(실제 목재)가 아니라 무늬 에코보드를 가리킵니다. 마감 코드 FC(假天花／氟碳噴塗)는 각각 천장 마감／불소탄소 분말도장을, FL(火燒面／泛光灯)는 불타는 돌 마감／플러드 조명을, CL(亮漆罩面／吸頂灯)는 광택 래커 마감／천장등을 가리켜 같은 문자가 두 뜻을 가지므로 도면 종류와 레이어로 구분합니다. 반화 성능 등급 A1–F와 연기 s1–s3, 낙하 d0–d2 구분은 소방서(消防局)의 기준과 일치시켜야 하며, 특히 오락시설의 벽면·천장 마감은 확인이 필요합니다. 적용 전 반드시 해당 Material Legend를 확인하세요.\",\"마카오에는 통일된 마감 재료 코드 규범이 없으며, 재료표 범례는 발주자·시공자·설계 컨설턴트가 土地工務局 《装修工程注意事項》의 세 단계 분류인 가정용(家居簡單装修工程), 비가정용(非家居簡單装修工程), 비단순(非簡單装修工程)을 기준으로 자체 작성합니다. 그 범위에는 假天花(천장 마감), 内牆飾面(내벽 마감), 地板飾面(바닥 마감), 踢脚線(걸레받이), 벽돌·유리·판재로 만든 间隔牆(칸막이벽), 房门(문), 洗手间配套(위생 설비)가 포함됩니다. 기술 근거는 제14/2021호 법률 《都市建築法律制度》와 제38/2022호 행정규칙, 제15/2021호 법률 《樓宇及場地防火安全的法律制度》와 제39/2022호 행정규칙 《核準樓宇及場地防火安全技术规章》이며, 공공사업·녹지·시행은 市政署 IAM이 담당합니다.\",\"제14/2021호 법률 《都市建築法律制度》(2022년 8월 17일 시행)와 제38/2022호 행정규칙 《都市建築法律制度施行細則》(원 제79/85/M호 법령 《都市建築总章程》 폐지) ; 제15/2021호 법률 《樓宇及場地防火安全的法律制度》(2022년 8월 17일 시행)와 제39/2022호 행정규칙 《核準樓宇及場地防火安全技术规章》(제34~36조: 반화 성능 등급 A1–F, 연기 s1–s3, 낙하 d0–d2, EN 13501-1:2018 시험 방법 적용) ; 土地工務局 《装修工程注意事項》(가정 단순装修工程／비가정 단순装修工程／비단순装修工程의 세 단계 분류) ; 市政署 IAM — 공공사업·녹지·시행, 제14/2026호 행정규칙 《市政署的組織及运作》(2026년 6월 1일부터 시행) ; 마카오 도시대학교(澳門城市大學) 연구센터 《材料白皮書》(재료 번호 관행: 두 글자 분류＋두 자리 연번, 예: PM01 인조석, WD01 옅은 무늬 에코보드) ; 제1600호 입법성 규정 《都市建築总章程（技术篇）》\",\"자료 근거: 제14/2021호 법률 《都市建築法律制度》와 제38/2022호 행정규칙, 제15/2021호 법률 《樓宇及場地防火安全的法律制度》와 제39/2022호 행정규칙 《核準樓宇及場地防火安全技术规章》, 土地工務局 《装修工程注意事項》, 市政署 IAM의 실무 요건에 따라 정리했다. 재료 명명은 《材料白皮書》의 「두 글자 분류＋두 자리 연번」(PM·WD 등 접두사) 관행을 따랐다.\"\nmo,es,Macao,\"En Macao no existe una norma nacional obligatoria para los códigos de materiales: cada equipo de proyecto redacta su propia tabla, aunque en la práctica se siguen las abreviaturas cantonenses de estilo hongkonés — 云石 para el mármol, 瓷砖 para el azulejo, GYB para el placo, FP para el laminado ignífugo, 假天花 para el falso techo y 傢俬 para el mobiliario — y la iluminación se reparte como LT (categoría de luminarias) y DL (downlights). La piedra y los tableros se numeran con prefijo de categoría de dos letras más número de serie de dos dígitos, como PM01 piedra artificial (PM01 人造石·雅士白) y WD01 tablero melamínico claro (WD01 浅色木纹生态板). Al mismo tiempo, los revestimientos de pared y techo deben cumplir las clases de reacción al fuego A1–F (con clases de humo s1–s3 y de goteo d0–d2) del sistema jurídico de construcción urbana y del régimen de seguridad contra incendios. Mandará la leyenda de materiales del proyecto.\",\"Varios códigos locales chocan con los de la China continental y otras regiones: LT y DL se reparten al modo hongkonés (LT = luminarias, DL = downlights), justo lo contrario del doble sentido de DL en la China continental; PM (PM01 piedra artificial) no debe confundirse con el ST de piedra continental, y WD suele designar el tablero melamínico con veta de madera y no la madera maciza. En los acabados, FC (falso techo / recubrimiento de fluorocarbono), FL (apomazado / reflectores) y CL (barniz transparente / plafón) tienen cada uno dos significados y se distinguen por el tipo de plano y por la capa en que aparecen. La clasificación de reacción al fuego A1–F con humo s1–s3 y goteo d0–d2 debe además coincidir con el criterio de los Servicios de Incendios, en especial en revestimientos de pared y techo de locales de ocio. Lea la leyenda de materiales del proyecto antes de reutilizar.\",\"Macao no tiene norma unificada de códigos de decoración: cada promotor, contratista y consultor redacta su leyenda conforme a la clasificación en tres niveles de las Notas sobre Obras de Remodelación del DSSCU (obras de remodelación residencial simples / no residenciales simples / no simples), cuyo alcance comprende falsos techos, revestimientos interiores de pared, revestimientos de suelo, rodapiés, tabiques de ladrillo, vidrio o tablero, puertas y equipamientos de baños. La base técnica son la Ley n.º 14/2021 sobre el sistema jurídico de construcción urbana con su Reglamento Administrativo n.º 38/2022, y la Ley n.º 15/2021 sobre seguridad contra incendios de edificios y locales con el Reglamento Administrativo n.º 39/2022 sobre la aprobación técnica de la seguridad contra incendios; el IAM cubre las obras públicas, las zonas verdes y la construcción municipal.\",\"Ley n.º 14/2021 sobre el sistema jurídico de construcción urbana (en vigor desde el 17 de agosto de 2022) y Reglamento Administrativo n.º 38/2022 sobre la aplicación del sistema jurídico de construcción urbana (queda derogado el anterior Decreto-Ley n.º 79/85/M, Carta General de Construcción Urbana) ; Ley n.º 15/2021 sobre seguridad contra incendios de edificios y locales (en vigor desde el 17 de agosto de 2022) y Reglamento Administrativo n.º 39/2022 sobre la aprobación técnica de la seguridad contra incendios (artículos 34 a 36: reacción al fuego A1–F, humo s1–s3, goteo d0–d2, con aceptación del método de ensayo EN 13501-1:2018) ; Notas sobre Obras de Remodelación del DSSCU (clasificación en tres niveles: obras de remodelación residencial simples / no residenciales simples / no simples) ; IAM — obras públicas, zonas verdes y construcción municipal, y Reglamento Administrativo n.º 14/2026 sobre la organización y el funcionamiento del IAM (en vigor desde el 1 de junio de 2026) ; Centro de investigación de la Universidad de Macao, Libro Blanco de Materiales (convención de numeración de materiales: prefijo de categoría de dos letras más número de serie de dos dígitos, como PM01 piedra artificial, WD01 tablero melamínico claro) ; Reglamento Legislativo n.º 1600 (Carta General de Construcción Urbana — parte técnica)\",\"Fuentes: la Ley n.º 14/2021 y el Reglamento n.º 38/2022 sobre el sistema jurídico de construcción urbana, la Ley n.º 15/2021 y el Reglamento n.º 39/2022 sobre seguridad contra incendios de edificios y locales, las Notas sobre Obras de Remodelación del DSSCU y el IAM; la nomenclatura de materiales sigue el prefijo de categoría de dos letras más número de serie de dos dígitos del Libro Blanco de Materiales (prefijos PM, WD y similares).\"\nmo,fr,Macao,\"À Macao, il n'existe pas de norme nationale obligatoire pour les codes de matériaux : chaque équipe de projet établit sa propre table, tout en suivant dans la pratique les abréviations cantonaises de style hongkongais — 云石 pour le marbre, 瓷砖 pour le carrelage, GYB pour la plaque de plâtre, FP pour le stratifié ignifuge, 假天花 pour le faux plafond et 傢俬 pour le mobilier — et l'éclairage se répartit comme LT (catégorie des luminaires) et DL (downlights). Les pierres et les panneaux sont numérotés avec un préfixe de catégorie de deux lettres suivi d'un numéro de série de deux chiffres, comme PM01 pierre artificielle (PM01 人造石·雅士白) et WD01 panneau mélaminé clair (WD01 浅色木纹生态板). En outre, les revêtements muraux et plafonniques doivent respecter les classes de réaction au feu A1–F (avec classes de fumée s1–s3 et de coulure d0–d2) du système juridique de construction urbaine et du régime de sécurité contre l'incendie. La légende de matériaux du projet fait foi.\",\"Plusieurs codes locaux coïncident avec ceux de la Chine continentale ou d'autres régions : LT et DL se répartissent à la hongkongaise (LT = luminaires, DL = downlights), à l'inverse du double sens de DL en Chine continentale ; PM (PM01 pierre artificielle) ne doit pas être confondu avec ST (pierre) de la Chine continentale, et WD désigne le plus souvent le panneau mélaminé à veine de bois plutôt que le bois massif. En finition, FC (faux plafond / revêtement fluorocarbone), FL (flammé / projecteurs) et CL (vernis transparent / plafonnier) portent chacun deux sens et se distinguent selon le type de plan et la couche concernée. Le classement de réaction au feu A1–F avec fumée s1–s3 et coulure d0–d2 doit en outre coïncider avec la position des Services d'incendie, en particulier pour les revêtements muraux et plafonniques des locaux de loisirs. Vérifiez la légende de matériaux du projet avant toute réutilisation.\",\"Macao ne dispose pas de norme unifiée des codes de décoration : les légendes sont rédigées par le maître d'ouvrage, l'entreprise générale et le bureau d'études, selon la classification à trois niveaux des Notes sur les travaux de rénovation de la DSSCU (travaux de rénovation résidentielle simples / non résidentielle simples / non simples), dont le champ d'application couvre les faux plafonds, les revêtements muraux intérieurs, les revêtements de sol, les plinthes, les cloisons en brique, verre ou panneau, les portes et les équipements de sanitaires. La base technique est la loi n° 14/2021 sur le système juridique de construction urbaine et son règlement administratif n° 38/2022, ainsi que la loi n° 15/2021 sur la sécurité contre l'incendie des bâtiments et des locaux et le règlement administratif n° 39/2022 sur l'approbation technique de la sécurité contre l'incendie ; l'IAM traite les travaux publics, les espaces verts et la construction municipale.\",\"loi n° 14/2021 sur le système juridique de construction urbaine (en vigueur depuis le 17 août 2022) et règlement administratif n° 38/2022 sur l'application du système juridique de construction urbaine (l'ancien décret-loi n° 79/85/M, Charte générale de construction urbaine, est abrogé) ; loi n° 15/2021 sur la sécurité contre l'incendie des bâtiments et des locaux (en vigueur depuis le 17 août 2022) et règlement administratif n° 39/2022 sur l'approbation technique de la sécurité contre l'incendie (articles 34 à 36 : réaction au feu A1–F, fumée s1–s3, coulure d0–d2, avec acceptation de la méthode d'essai EN 13501-1:2018) ; Notes sur les travaux de rénovation de la DSSCU (classification à trois niveaux : travaux de rénovation résidentielle simples / non résidentielle simples / non simples) ; l'IAM — travaux publics, espaces verts et construction municipale, et règlement administratif n° 14/2026 sur l'organisation et le fonctionnement de l'IAM (en vigueur depuis le 1er juin 2026) ; Centre de recherche de l'Université de Macao, Livre blanc des matériaux (convention de numérotation des matériaux : préfixe de catégorie de deux lettres suivi d'un numéro de série de deux chiffres, comme PM01 pierre artificielle, WD01 panneau mélaminé clair) ; Règlement législatif n° 1600 (Charte générale de construction urbaine — partie technique)\",\"Sources : la loi n° 14/2021 et le règlement n° 38/2022 sur le système juridique de construction urbaine, la loi n° 15/2021 et le règlement n° 39/2022 sur la sécurité contre l'incendie des bâtiments et des locaux, les Notes sur les travaux de rénovation de la DSSCU et l'IAM ; la nomenclature des matériaux suit la convention du Livre blanc des matériaux, soit un préfixe de catégorie de deux lettres suivi d'un numéro de série de deux chiffres (PM, WD et assimilés).\"\nmo,it,Macao,\"A Macao non esiste una norma nazionale obbligatoria per i codici dei materiali: ogni team di progetto redige il proprio elenco, pur seguendo nella pratica le abbreviazioni cantonesi in stile hongkonghese — 云石 per il marmo, 瓷砖 per la ceramica, GYB per il cartongesso, FP per il laminato ignifugo, 假天花 per il controsoffitto e 傢俬 per l'arredo — mentre l'illuminazione si divide come LT (categoria dei corpi illuminanti) e DL (downlight). Pietre e pannelli sono numerati con un prefisso di categoria di due lettere più un numero di serie di due cifre, come PM01 pietra artificiale (PM01 人造石·雅士白) e WD01 pannello melaminico chiaro (WD01 浅色木纹生态板). Parallelamente, le finiture murali e soffittarie devono rispettare le classi di reazione al fuoco A1–F (con classi di fumo s1–s3 e di gocciolamento d0–d2) del sistema giuridico della costruzione urbana e del regime di sicurezza antincendio. Fa fede la legenda dei materiali del progetto.\",\"Diversi codici locali coincidono con quelli della Cina continentale o di altre aree: LT e DL si dividono alla hongkonghese (LT = corpi illuminanti, DL = downlight), esattamente il contrario del doppio senso di DL nella Cina continentale; PM (PM01 pietra artificiale) non va confuso con ST (pietra) della Cina continentale, e WD indica più spesso il pannello melaminico con venatura del legno e non il legno massello. Nelle finiture, FC (controsoffitto / rivestimento al fluoro), FL (fiammato / proiettori) e CL (vernice trasparente / plafoniera) hanno ciascuno due significati e si distinguono dal tipo di tavola e dallo strato in cui compaiono. La classificazione di reazione al fuoco A1–F con fumo s1–s3 e gocciolamento d0–d2 deve inoltre coincidere con il criterio dei Vigili del Fuoco, in particolare per finiture murali e soffittarie dei locali di svago. Verificare la legenda dei materiali del progetto prima di riutilizzare i codici.\",\"Macao non ha una norma unificata sui codici decorativi: le legende sono redatte da committente, impresa generale e progettista, seguendo la classificazione in tre livelli delle Note sui lavori di ristrutturazione del DSSCU (lavori di ristrutturazione domestica semplici / non domestica semplici / non semplici), il cui campo comprende controsoffitti, rivestimenti interni delle pareti, rivestimenti pavimentali, battiscopa, tramezzi in mattone, vetro o pannello, porte e complementi dei servizi igienici. La base tecnica è la Legge n. 14/2021 sul sistema giuridico della costruzione urbana con il Regolamento amministrativo n. 38/2022, e la Legge n. 15/2021 sulla sicurezza antincendio di edifici e locali con il Regolamento amministrativo n. 39/2022 sull'approvazione tecnica della sicurezza antincendio; l'IAM cura i lavori pubblici, le aree verdi e la costruzione municipale.\",\"Legge n. 14/2021 sul sistema giuridico della costruzione urbana (in vigore dal 17 agosto 2022) e Regolamento amministrativo n. 38/2022 sull'applicazione del sistema giuridico della costruzione urbana (abrogato il precedente decreto-legge n. 79/85/M, Carta generale di costruzione urbana) ; Legge n. 15/2021 sulla sicurezza antincendio di edifici e locali (in vigore dal 17 agosto 2022) e Regolamento amministrativo n. 39/2022 sull'approvazione tecnica della sicurezza antincendio (articoli da 34 a 36: reazione al fuoco A1–F, fumo s1–s3, gocciolamento d0–d2, con accettazione del metodo di prova EN 13501-1:2018) ; Note sui lavori di ristrutturazione del DSSCU (classificazione in tre livelli: lavori di ristrutturazione domestica semplici / non domestica semplici / non semplici) ; IAM — lavori pubblici, aree verdi e costruzione municipale, e Regolamento amministrativo n. 14/2026 sull'organizzazione e sul funzionamento dell'IAM (in vigore dal 1° giugno 2026) ; Centro di ricerca dell'Università di Macao, Libro bianco dei materiali (convenzione di numerazione dei materiali: prefisso di categoria di due lettere più numero di serie di due cifre, come PM01 pietra artificiale, WD01 pannello melaminato chiaro) ; Regolamento legislativo n. 1600 (Carta generale di costruzione urbana — parte tecnica)\",\"Fonti: la Legge n. 14/2021 e il Regolamento n. 38/2022 sul sistema giuridico della costruzione urbana, la Legge n. 15/2021 e il Regolamento n. 39/2022 sulla sicurezza antincendio di edifici e locali, le Note sui lavori di ristrutturazione del DSSCU e l'IAM; la nomenclatura dei materiali segue la convenzione del Libro bianco dei materiali, cioè un prefisso di categoria di due lettere più un numero di serie di due cifre (PM, WD e simili).\"\nmo,pt,Macau,\"Em Macau não existe norma nacional obrigatória para os códigos de materiais: cada equipa de projeto redige o seu próprio quadro, seguindo na prática as abreviaturas cantonenses de estilo hongconguês — 云石 para o mármore, 瓷砖 para a cerâmica, GYB para a placa de gesso, FP para o laminado resistente ao fogo, 假天花 para o teto falso e 傢俬 para o mobiliário — e a iluminação divide-se como LT (categoria de luminárias) e DL (downlights). Pedras e painéis são numerados com prefixo de categoria de duas letras mais número de série de dois dígitos, como PM01 pedra artificial (PM01 人造石·雅士白) e WD01 painel melamínico claro (WD01 浅色木纹生态板). Em paralelo, os revestimentos de parede e teto devem cumprir as classes de reação ao fogo A1–F (com classes de fumo s1–s3 e de gotejamento d0–d2) do sistema jurídico de construção urbana e do regime de segurança contra incêndio. Prevalece a legenda de materiais do projeto.\",\"Vários códigos locais coincidem com os da China continental ou de outras regiões: LT e DL dividem-se à hongconguesa (LT = luminárias, DL = downlights), ao contrário do duplo sentido de DL na China continental; PM (PM01 pedra artificial) não deve ser confundido com ST (pedra) da China continental, e WD designa mais frequentemente o painel melamínico com veio de madeira e não madeira maciça. Nos revestimentos, FC (teto falso / revestimento de fluorocarbono), FL (apomazado / refletores) e CL (verniz transparente / plafoniera) têm cada um dois sentidos e distinguem-se pelo tipo de prancha e pela camada onde aparecem. A classe de reação ao fogo A1–F com fumo s1–s3 e gotejamento d0–d2 tem ainda de coincidir com o critério dos Serviços de Incêndio, sobretudo nos revestimentos de parede e teto dos estabelecimentos de lazer. Leia a legenda de materiais do projeto antes de reutilizar.\",\"Macau não tem norma unificada de códigos de decoração: as legendas são redigidas pelo promotor, pela empreiteira e pelo projetista, de acordo com a classificação em três níveis das Notas sobre Obras de Remodelação da DSSCU (obras de remodelação habitacional simples / não habitacional simples / não simples), cujo âmbito abrange tetos falsos, revestimentos interiores de parede, revestimentos de pavimento, rodapés, tabiques de tijolo, vidro ou painel, portas e equipamentos de instalações sanitárias. A base técnica é a Lei n.º 14/2021 sobre o sistema jurídico de construção urbana e o respetivo Regulamento Administrativo n.º 38/2022, e a Lei n.º 15/2021 sobre segurança contra incêndio de edifícios e locais com o Regulamento Administrativo n.º 39/2022 sobre a aprovação técnica da segurança contra incêndio; o IAM cobre as obras públicas, as zonas verdes e a construção municipal.\",\"Lei n.º 14/2021 sobre o sistema jurídico de construção urbana (em vigor desde 17 de agosto de 2022) e Regulamento Administrativo n.º 38/2022 sobre a aplicação do sistema jurídico de construção urbana (revogado o anterior Decreto-Lei n.º 79/85/M, Carta Geral de Construção Urbana) ; Lei n.º 15/2021 sobre segurança contra incêndio de edifícios e locais (em vigor desde 17 de agosto de 2022) e Regulamento Administrativo n.º 39/2022 sobre a aprovação técnica da segurança contra incêndio (artigos 34 a 36: reação ao fogo A1–F, fumo s1–s3, gotejamento d0–d2, com aceitação do método de ensaio EN 13501-1:2018) ; Notas sobre Obras de Remodelação da DSSCU (classificação em três níveis: obras de remodelação habitacional simples / não habitacional simples / não simples) ; IAM — obras públicas, zonas verdes e construção municipal, e Regulamento Administrativo n.º 14/2026 sobre a organização e o funcionamento do IAM (em vigor desde 1 de junho de 2026) ; Centro de investigação da Universidade de Macau, Livro Branco de Materiais (convenção de numeração de materiais: prefixo de categoria de duas letras mais número de série de dois dígitos, como PM01 pedra artificial, WD01 painel melamínico claro) ; Regulamento Legislativo n.º 1600 (Carta Geral de Construção Urbana — parte técnica)\",\"Fontes: a Lei n.º 14/2021 e o Regulamento n.º 38/2022 sobre o sistema jurídico de construção urbana, a Lei n.º 15/2021 e o Regulamento n.º 39/2022 sobre segurança contra incêndio de edifícios e locais, as Notas sobre Obras de Remodelação da DSSCU e o IAM; a nomenclatura dos materiais segue a convenção do Livro Branco de Materiais — prefixo de categoria de duas letras mais número de série de dois dígitos (prefixos PM, WD e afins).\"\nmo,ru,Макао,\"В Макао нет обязательного национального стандарта кодов материалов: каждая проектная команда составляет собственный ведомость, но на практике здесь следуют кантонским сокращениям в гонконгском стиле — 云石 для мрамора, 瓷砖 для керамики, GYB для гипсокартона, FP для огнестойкого ламината, 假天花 для подвесного потолка и 傢俬 для мебели, — а освещение делится как LT (категория светильников) и DL (встраиваемые точечные светильники). Камень и плиты нумеруются префиксом категории из двух букв плюс двухзначный порядковый номер: PM01 искусственный камень (PM01 人造石·雅士白), WD01 светлая плита с текстурой дерева (WD01 浅色木纹生态板). Одновременно отделка стен и потолков должна соответствовать классам реакции на огонь A1–F (с классами дыма s1–s3 и капель d0–d2), установленным Законной системой городского строительства и законодательством о пожарной безопасности зданий и помещений. Приоритет имеет легенда материалов проекта.\",\"Часть местных кодов совпадает с принятыми в материковом Китае и других регионах: LT и DL делятся по гонконгски (LT — светильники, DL — точечные встраиваемые), в отличие от двойного смысла DL в материковом Китае; PM (PM01 искусственный камень) не следует путать с ST (камень) материкового Китая, а WD обычно означает меламиновую плиту с древесной текстурой, а не массив. В отделке FC (подвесной потолок / фторкарбонное покрытие), FL (фактурный камень / прожекторы) и CL (прозрачный лак / плафон) имеют по два значения и различаются по типу чертежа и по слою. Классификация реакции на огонь A1–F с дымом s1–s3 и каплями d0–d2 должна также совпадать с позицией пожарной службы, особенно для отделки стен и потолков в развлекательных заведениях. Перед повторным использованием сверяйтесь с легендой материалов проекта.\",\"В Макао отсутствует единая норма кодов отделочных материалов: ведомости составляют заказчик, генеральный подрядчик и проектировщик с учётом трёхуровневой классификации Департамента транспорта и общественных работ «Замечания по отделочным работам» (простые бытовые отделочные работы / простые небытовые / непростые отделочные работы), в область которых входят подвесные потолки, внутренняя отделка стен, отделка пола, плинтусы, перегородки из кирпича, стекла или плит, двери и сантехническое оснащение санузлов. Техническая основа — Закон № 14/2021 о Законной системе городского строительства и Административный регламент № 38/2022, а также Закон № 15/2021 о пожарной безопасности зданий и помещений и Административный регламент № 39/2022 об утверждении пожарной безопасности; Управление по муниципальным делам (市政署 IAM) ведает общественными работами, зелёными зонами и муниципальным строительством.\",\"Закон № 14/2021 о Законной системе городского строительства (вступил в силу 17 августа 2022 г.) и Административный регламент № 38/2022 о порядке применения Законной системы городского строительства (прежний Декрет-Закон № 79/85/M «Общий устав городского строительства» отменён) ; Закон № 15/2021 о пожарной безопасности зданий и помещений (вступил в силу 17 августа 2022 г.) и Административный регламент № 39/2022 об утверждении пожарной безопасности (статьи 34–36: реакция на огонь A1–F, дым s1–s3, капли d0–d2, с применением метода испытаний EN 13501-1:2018) ; «Замечания по отделочным работам» Департамента транспорта и общественных работ (трёхуровневая классификация: простые бытовые отделочные работы / простые небытовые / непростые отделочные работы) ; Управление по муниципальным делам (IAM) — общественные работы, зелёные зоны и муниципальное строительство, и Административный регламент № 14/2026 об организации и деятельности Управления по муниципальным делам (вступил в силу 1 июня 2026 г.) ; Исследовательский центр Университета Макао, «Белая книга по материалам» (правила нумерации материалов: префикс категории из двух букв плюс двухзначный порядковый номер, например PM01 искусственный камень, WD01 светлая плита с текстурой дерева) ; Законодательный регламент № 1600 «Общий устав городского строительства (техническая часть)»\",\"Источники: Закон № 14/2021 и Административный регламент № 38/2022 о Законной системе городского строительства, Закон № 15/2021 и Административный регламент № 39/2022 о пожарной безопасности зданий и помещений, «Замечания по отделочным работам» Департамента транспорта и общественных работ и Управление по муниципальным делам; наименования материалов даны по правилам «Белой книги по материалам» — префикс категории из двух букв плюс двухзначный порядковый номер (префиксы PM, WD и т. п.).\"\nin,zh,印度 / India,印度没有强制的装饰材料代码体系，材料表（Schedule of Materials）由顾问与总包按项目自编，图面以英文技术缩写为主：玻化砖写 VIT（细分 GVT／PGVT）、石膏板写 GPB、装饰石膏写 POP、铝塑板写 ACP、镀锌钢龙骨写 GI、软钢写 MS、不锈钢写 SS；照明大类写 LT、筒灯写 DL、疏散指示写 EX，工程量清单另按 IS 1200 的计量规则执行。以本项目 Material Legend 为准。,印度项目的缩写在项目内自定，跨承包商没有共识，同一缩写极易一码多义：WC 在给排水图里是坐便器（Water Closet），在材料表里却可能是墙面饰材；MR 在饰面表里是大理石（Marble），在洁具或家具表里是镜子（Mirror）；AC 在机电图里是空调（Air Conditioner），在材料表里是亚克力（Acrylic）；MS 在钢结构表里是软钢，在饰面表里 MT 却是哑光。跨项目套用前必须先读该项目的 Material Legend 与工程量清单口径。,印度没有统一的装饰材料代码规范，体系由 BIS（印度标准局）产品标准、SP 7:2016《国家建筑规范（印度）》与 IS 1200《建筑工程计量方法》共同支撑；材料表与工程量清单的分类、计量与扣除规则按这些文件执行。,SP 7:2016《国家建筑规范（印度）2016》（BIS 发布，12 部分 33 章，第 11 部分为可持续性方法） ; IS 15622:2017《釉面、玻化与无釉陶瓷砖》与 IS 13712:2019《陶瓷砖——定义、分类、特性与标记》 ; IS 3495（Parts 1–4:2019／Part 5:2021／Part 6:2022）《烧结黏土砖试验方法》、IS 1077:1992《普通烧结黏土砖》与 IS 2691:2017《烧结黏土饰面砖》 ; IS 1200《建筑工程与土木工程计量方法》（第 2 部分混凝土、第 3 部分砖砌体、第 7 部分五金、第 12 部分抹灰、第 13 部分涂料）,资料口径：按 BIS 的 SP 7:2016《国家建筑规范（印度）》、IS 15622:2017 与 IS 13712:2019 陶瓷砖系列、IS 3495 与 IS 1077／IS 2691 砖系列、IS 1200 计量规则，并结合印度项目材料表的英文缩写惯例整理。\nin,en,India,\"India has no mandatory decoration-code system: the Schedule of Materials is written per project by the consultant and the contractor, and drawings are annotated with English technical abbreviations — VIT for vitrified tile (GVT / PGVT), GPB for gypsum board, POP for plaster of Paris, ACP for aluminium composite panel, GI for galvanised framing, MS for mild steel and SS for stainless steel; LT for the lighting category, DL for downlights and EX for exit signs. Quantities follow the IS 1200 rules. This project legend prevails.\",\"Abbreviations in Indian projects are defined inside each project and carry no cross-contractor consensus, so one code easily means two things: WC is Water Closet on a plumbing drawing but may be wall covering in a materials schedule; MR is Marble in a finish schedule but Mirror in a sanitaryware or furniture schedule; AC is Air Conditioner on an MEP drawing but Acrylic in a materials schedule; MS is mild steel in a structural schedule while MT is Matte in a finish schedule. Read the project's own legend and its BOQ basis before reuse.\",\"India has no unified decoration-code standard: the system rests on BIS product standards, SP 7:2016 National Building Code of India and the IS 1200 methods of measurement, which govern classification, measurement and deductions in schedules and bills of quantities.\",\"SP 7:2016 National Building Code of India 2016 (BIS; 12 Parts, 33 chapters, Part 11 Approach to Sustainability) ; IS 15622:2017 Glazed, Vitrified and Unglazed Ceramic Tiles with IS 13712:2019 Ceramic tiles — definitions, classification, characteristics and marking ; IS 3495 (Parts 1–4:2019, Part 5:2021, Part 6:2022) Methods of tests on burnt clay building bricks, with IS 1077:1992 Common burnt clay building bricks and IS 2691:2017 Burnt clay facing bricks ; IS 1200 Methods of measurement of building and civil engineering works (Part 2 concrete, Part 3 brickwork, Part 7 hardware, Part 12 plastering, Part 13 painting)\",\"Sources: BIS SP 7:2016 National Building Code of India, the IS 15622:2017 and IS 13712:2019 ceramic-tile series, the IS 3495 brick series with IS 1077 / IS 2691, the IS 1200 measurement rules, and the English-abbreviation practice of Indian material schedules.\"\nin,ja,インド,インドには装飾内装の材料コード統一基準がなく、Schedule of Materials はプロジェクトごとにコンサルタントと施工者が自行して作成する。図面の表記は英語略称が中心で、ガラス質タイルは VIT（GVT／PGVT）、石膏ボードは GPB、装飾石膏は POP、アルミ複合パネルは ACP、亜鉛鋼下地は GI、軟鋼は MS、ステンレスは SS とする。照明類は LT、ダウンライトは DL、誘導灯は EX。数量計算は IS 1200 の規定に従う。本表の Material Legend を優先する。,インドの略称はプロジェクト内で個別に定義され、請負人をまたぐ共通認識がないため、同じ略称が二つ三つの意味を持つことが多い。WC は給排水図では便器（Water Closet）、材料表では壁内装材になりうる。MR は仕上げ表では大理石（Marble）、衛生器具や家具の表では鏡（Mirror）になる。AC は設備図では空調（Air Conditioner）、材料表ではアクリル（Acrylic）になる。MS は鉄骨表では軟鋼、仕上げ表の MT はマットである。他プロジェクトの凡例を流用する前に、その材料表と数量表の基準を必ず確認する。,インドには装飾内装の統一コード基準がない。体系は BIS 製品規格、SP 7:2016《国家建築規範（インド）》および IS 1200《建築・土木工事の測量方法》によって支えられ、材料表と数量表の分類・測量・控除の規則はこれらの文書に従う。,SP 7:2016《国家建築規範（インド）2016》（BIS 発行、12 部 33 章、第 11 部「持続可能性へのアプローチ」） ; IS 15622:2017《釉薬・ガラス質・無釉窯業タイル》および IS 13712:2019《セラミックタイル―定義、分類、特性および表示》 ; IS 3495（Parts 1–4:2019、Part 5:2021、Part 6:2022）《焼成粘土煉瓦試験方法》、IS 1077:1992《普通焼成粘土煉瓦》、IS 2691:2017《焼成粘土見掛け煉瓦》 ; IS 1200《建築・土木工事の測量方法》（第 2 部コンクリート、第 3 部レンガ積み、第 7 部金物、第 12 部モルタル、第 13 部塗装）,資料の根拠：BIS の SP 7:2016《国家建築規範（インド）》、IS 15622:2017 と IS 13712:2019 のセラミックタイル規格、IS 3495 と IS 1077／IS 2691 のレンガ規格、IS 1200 の測量規定、およびインドの材料表で使われる英語略称の慣行。\nin,ko,인도,\"인도에는 인테리어 마감재 코드에 대한 통일된 규정이 없으며, Schedule of Materials 는 프로젝트마다 컨설턴트와 시공사가 직접 작성한다. 도면 표기는 영어 약어가 중심이며, 유약 타일은 VIT(GVT/PGVT), 석고보드는 GPB, 장식 석고는 POP, 알루미늄 복합패널은 ACP, 아연 도강 천장틀은 GI, 연강은 MS, 스테인리스는 SS 로 표기한다. 조명 분류는 LT, 다운라이트는 DL, 유도등은 EX 이며, 물량은 IS 1200 규정에 따른다. 본 표의 Material Legend 를 우선한다.\",\"인도 프로젝트의 약어는 프로젝트 안에서 자체 정의되고 하청업체 간 공통 기준이 없어, 하나의 약어가 여러 의미를 갖는 경우가 많다. WC 는 배관도에서 화장기(Water Closet), 재료표에서는 벽 마감재가 될 수 있다. MR 는 마감표에서 대리석(Marble), 위생기구·가구표에서는 거울(Mirror)이 된다. AC 는 기계설비도에서 냉난방(Air Conditioner), 재료표에서는 아크릴(Acrylic)이 된다. MS 는 철골표에서 연강이지만, 마감표의 MT 는 매트다. 다른 프로젝트의 범례를 옮기기 전에 해당 프로젝트의 Material Legend 와 물량표 기준을 반드시 확인할 것.\",\"인도에는 통합된 인테리어 코드 기준이 없다. 체계는 BIS 제품 규격, SP 7:2016《国家建筑规范（印度）》그리고 IS 1200《건축·토목 공사의 량측 방법》에 의해 뒷받침되며, 재료표와 물량표의 분류·측정·공제 규칙은 이 문서를 따른다.\",\"SP 7:2016《国家建筑规范（印度）2016》（BIS 발행, 12부 33장, 제11부 지속가능성 접근） ; IS 15622:2017《세라믹 타일 규격(유약·유약질·무약)》및 IS 13712:2019《세라믹 타일―정의, 분류, 특성 및 표시》 ; IS 3495(Parts 1–4:2019, Part 5:2021, Part 6:2022)《소성 점토 벽돌 시험방법》, IS 1077:1992《일반 소성 점토 벽돌》, IS 2691:2017《소성 점토 마감 벽돌》 ; IS 1200《건축·토목 공사의 량측 방법》(제2부 콘크리트, 제3부 조적, 제7부 철물, 제12부 미장, 제13부 도장)\",\"자료 출처: BIS의 SP 7:2016《国家建筑规范（印度）》, IS 15622:2017 및 IS 13712:2019 세라믹 타일 규격, IS 3495 와 IS 1077／IS 2691 벽돌 규격, IS 1200 물량 측정 규정, 그리고 인도 프로젝트 재료표의 영문 약어 관행.\"\nin,es,India,\"India no tiene un sistema obligatorio de códigos de decoración: el Schedule of Materials lo escribe en cada proyecto el consultor y el contratista, y los planos se anotan con abreviaturas técnicas en inglés — VIT para baldosa vitrificada (GVT / PGVT), GPB para placa de yeso, POP para yeso de París, ACP para panel compuesto de aluminio, GI para estructura galvanizada, MS para acero al carbono y SS para acero inoxidable; LT para la categoría de iluminación, DL para downlights y EX para señales de salida. Los metrados siguen IS 1200. Prevalece la leyenda de este proyecto.\",\"Las abreviaturas de los proyectos indianos se definen dentro de cada proyecto y no hay consenso entre contratistas, por lo que un mismo código suele tener dos o tres significados: WC es Water Closet en un plano de fontanería pero puede ser revestimiento mural en el cuadro de materiales; MR es Marble en el cuadro de acabados y Mirror en el cuadro de sanitarios o mobiliario; AC es Air Conditioner en un plano de AVAC y Acrylic en el cuadro de materiales; MS es acero al carbono en un cuadro de estructuras mientras MT es mate en un cuadro de acabados. Leer la leyenda y el criterio de medición del proyecto antes de reutilizar otra leyenda.\",\"India carece de norma unificada de códigos de decoración: el sistema se apoya en las normas de producto de BIS, en el SP 7:2016 National Building Code of India y en los métodos de medición IS 1200, que rigen la clasificación, la medición y las deducciones en los cuadros y los presupuestos.\",\"SP 7:2016 National Building Code of India 2016 (BIS; 12 Parts, 33 chapters, Part 11 Approach to Sustainability) ; IS 15622:2017 Azulejos cerámicos vidrados, vitrificados y no vidrados e IS 13712:2019 Azulejos cerámicos — definiciones, clasificación, características y marcado ; IS 3495 (Parts 1–4:2019, Part 5:2021, Part 6:2022) Métodos de ensayo de ladrillos de arcilla cocida, con IS 1077:1992 Ladrillos de arcilla cocida comunes e IS 2691:2017 Ladrillos de arcilla cocida de revestimiento ; IS 1200 Métodos de medición de obras de edificación e ingeniería civil (Part 2 hormigón, Part 3 albañilería, Part 7 herrajes, Part 12 revocos, Part 13 pintura)\",\"Fuentes: el SP 7:2016 National Building Code of India del BIS, las normas de baldosa cerámica IS 15622:2017 e IS 13712:2019, la serie de ladrillos IS 3495 con IS 1077 / IS 2691, las reglas de medición IS 1200 y la práctica de abreviaturas en inglés de los cuadros de materiales de la India.\"\nin,fr,Inde,\"L'Inde n'a pas de système obligatoire de codes de décoration : le Schedule of Materials est établi projet par projet par le consultant et l'entreprise, et les plans sont annotés avec des abréviations techniques anglaises — VIT pour le carrelage vitrifié (GVT / PGVT), GPB pour la plaque de plâtre, POP pour le plâtre de Paris, ACP pour le panneau composite aluminium, GI pour l'ossature galvanisée, MS pour l'acier doux et SS pour l'inox ; LT pour la catégorie d'éclairage, DL pour les downlights et EX pour les panneaux de sortie. Les métrés relèvent de IS 1200. La légende de ce projet fait foi.\",\"Les abréviatures des projets indiens sont définies projet par projet, sans consensus entre entreprises : un même code porte souvent deux ou trois sens. WC vaut Water Closet sur un plan de plomberie mais peut désigner le revêtement mural dans un tableau de matériaux ; MR vaut Marble dans un tableau de finitions et Mirror dans un tableau de sanitaires ou de mobilier ; AC vaut Air Conditioner sur un plan de CVC et Acrylic dans un tableau de matériaux ; MS est l'acier doux dans un tableau de structures, tandis que MT est le mat dans un tableau de finitions. Lire la légende et le métré du projet avant toute reprise.\",\"L'Inde ne dispose pas de norme unifiée de codes de décoration : le système repose sur les normes produits du BIS, sur le SP 7:2016 National Building Code of India et sur les règles de métré IS 1200, qui régissent le classement, le métré et les déductions dans les tableaux et les bordereaux.\",\"SP 7:2016 National Building Code of India 2016 (BIS ; 12 parties, 33 chapitres, partie 11 Approche de la durabilité) ; IS 15622:2017 Carreaux céramiques émaillés, vitrifiés et non émaillés et IS 13712:2019 Carreaux céramiques — définitions, classification, caractéristiques et marquage ; IS 3495 (parties 1 à 4:2019, partie 5:2021, partie 6:2022) Méthodes d'essai des briques en terre cuite, avec IS 1077:1992 Briques en terre cuite communes et IS 2691:2017 Briques de parement en terre cuite ; IS 1200 Méthodes de métré des travaux de bâtiment et de génie civil (partie 2 béton, partie 3 maçonnerie, partie 7 quincaillerie, partie 12 enduits, partie 13 peinture)\",\"Sources : le SP 7:2016 National Building Code of India du BIS, les normes de carreaux céramiques IS 15622:2017 et IS 13712:2019, la série de briques IS 3495 avec IS 1077 / IS 2691, les règles de métré IS 1200 et la pratique des abréviations anglaises des tableaux de matériaux en Inde.\"\nin,it,India,\"L'India non ha un sistema obbligatorio di codici per le finiture: lo Schedule of Materials viene redatto in ogni progetto dal consultant e dall'impresa, e sui disegni si usano abbreviazioni tecniche inglesi — VIT per la piastrella gressificata (GVT / PGVT), GPB per il cartongesso, POP per il gesso di Parigi, ACP per il pannello composito in alluminio, GI per la struttura zincata, MS per l'acciaio dolce e SS per l'inox; LT per la categoria di illuminazione, DL per i downlight ed EX per la segnaletica di uscita. Le quantità seguono IS 1200. Prevale la legenda di questo progetto.\",Le abbreviazioni nei progetti indiani sono definite all'interno di ogni progetto e non esiste un consenso tra le imprese: uno stesso codice ha spesso due o tre significati. WC è Water Closet nel piano impiantistica ma può essere rivestimento murale nel quadro dei materiali; MR è Marble nel quadro delle finiture e Mirror nel quadro dei sanitari o dell'arredo; AC è Air Conditioner nel piano MEP e Acrylic nel quadro dei materiali; MS è acciaio dolce nel quadro delle strutture mentre MT è opaco nel quadro delle finiture. Leggere la legenda e il computo metrico del progetto prima di riutilizzare la legenda di un'altra regione.,\"L'India non ha una norma unificata sui codici delle finiture: il sistema poggia sulle norme di prodotto BIS, sullo SP 7:2016 National Building Code of India e sulle regole di misura IS 1200, che disciplinano classificazione, misurazione e deduzioni nei quadri e nei computi.\",\"SP 7:2016 National Building Code of India 2016 (BIS; 12 parti, 33 capitoli, parte 11 Approach to Sustainability) ; IS 15622:2017 Piastrelle ceramiche smaltate, gressificate e non smaltate e IS 13712:2019 Piastrelle ceramiche — definizioni, classificazione, caratteristiche e marcatura ; IS 3495 (Parti 1–4:2019, Parte 5:2021, Parte 6:2022) Metodi di prova dei mattoni in argilla cotta, con IS 1077:1992 Mattoni in argilla cotta comuni e IS 2691:2017 Mattoni facciata in argilla cotta ; IS 1200 Metodi di misurazione dei lavori edili e delle opere di ingegneria civile (parte 2 calcestruzzo, parte 3 muratura, parte 7 ferramenta, parte 12 intonaci, parte 13 pitture)\",\"Fonti: lo SP 7:2016 National Building Code of India del BIS, le norme sui piastrelle ceramiche IS 15622:2017 e IS 13712:2019, la serie dei mattoni IS 3495 con IS 1077 / IS 2691, le regole di misura IS 1200 e la prassi delle abbreviazioni inglesi nei quadri dei materiali indiani.\"\nin,pt,Índia,\"A Índia não tem um sistema obrigatório de códigos de acabamentos: o Schedule of Materials é escrito em cada projeto pelo consultant e pelo empreiteiro, e nos drawings usam-se abreviaturas técnicas em inglês — VIT para azulejo vitrificado (GVT / PGVT), GPB para placa de gesso, POP para gesso de Paris, ACP para painel composto de alumínio, GI para estrutura galvanizada, MS para aço-carbono e SS para aço inoxidável; LT para a categoria de iluminação, DL para downlights e EX para placas de saída. As medições seguem a IS 1200. Prevalece a legenda deste projeto.\",\"As abreviaturas dos projetos indianos são definidas dentro de cada projeto e não há consenso entre empreiteiros, pelo que o mesmo código acaba por ter dois ou três sentidos: WC é Water Closet num plano de watersanitárias mas pode ser revestimento de parede no quadro de materiais; MR é Marble no quadro de acabamentos e Mirror no quadro de sanitários ou mobiliário; AC é Air Conditioner num plano de AVAC e Acrylic no quadro de materiais; MS é aço-carbono num quadro de estruturas enquanto MT é fosco num quadro de acabamentos. Ler a legenda e o critério de medição do projeto antes de reutilizar a legenda de outra região.\",\"A Índia não tem norma unificada de códigos de acabamentos: o sistema assenta nas normas de produto do BIS, no SP 7:2016 National Building Code of India e nas regras de medição da IS 1200, que regem a classificação, a medição e as deduções nos quadros e nas medições.\",\"SP 7:2016 National Building Code of India 2016 (BIS; 12 Parts, 33 chapters, Part 11 Approach to Sustainability) ; IS 15622:2017 Azulejos cerâmicos vidrados, vitrificados e não vidrados e IS 13712:2019 Azulejos cerâmicos — definições, classificação, características e marcação ; IS 3495 (Parts 1–4:2019, Part 5:2021, Part 6:2022) Métodos de ensaio de tijolos de argila cozida, com IS 1077:1992 Tijolos de argila cozida comuns e IS 2691:2017 Tijolos de argila cozida de revestimento ; IS 1200 Métodos de medição de obras de construção e de engenharia civil (Part 2 betão, Part 3 alvenaria, Part 7 ferragens, Part 12 rebocos, Part 13 pintura)\",\"Fontes: o SP 7:2016 National Building Code of India do BIS, as normas de azulejo cerâmico IS 15622:2017 e IS 13712:2019, a série de tijolos IS 3495 com IS 1077 / IS 2691, as regras de medição IS 1200 e a prática de abreviaturas em inglês nos quadros de materiais da Índia.\"\nin,ru,Индия,\"В Индии нет обязательной системы кодов отделочных материалов: Schedule of Materials каждое проектировщик и подрядчик составляют самостоятельно, а на чертежах преобладают английские технические сокращения: VIT — керамогранит (GVT / PGVT), GPB — гипсокартон, POP — парижский гипс, ACP — алюминиевый композитный лист, GI — оцинкованный каркас, MS — мягкая сталь, SS — нержавеющая сталь; LT — категория освещения, DL — точечные светильники, EX — указатели выхода. Объёмы считают по IS 1200. Приоритет имеет легенда настоящего проекта.\",\"Сокращения в индийских проектах вводятся внутри каждого проекта, и между подрядчиками общего согласия нет, поэтому один код часто означает два-три разных предмета: WC на сантехническом плане — Water Closet (унитаз), а в ведомости материалов может означать отделку стен; MR в ведомости отделок — Marble (мрамор), а в ведомости сантехники или мебели — Mirror (зеркало); AC на инженерном плане — Air Conditioner (кондиционер), а в ведомости материалов — Acrylic (акрил); MS — мягкая сталь в ведомости конструкций, а MT — матовая поверхность в ведомости отделок. Перед переносом легенды из другого проекта обязательно читайте его легенду и ведомость объёмов.\",\"Единого стандарта кодов отделочных материалов в Индии нет: система опирается на продуктовые стандарты BIS, SP 7:2016 «Национальный строительный код Индии» и правила обмера IS 1200, которые задают классификацию, обмер и вычеты в ведомостях и актах выполненных работ.\",\"SP 7:2016 «Национальный строительный код Индии 2016» (BIS; 12 частей, 33 главы, часть 11 «Подход к устойчивости») ; IS 15622:2017 «Глазурованные, витрифицированные и неглазурованные керамические плитки» и IS 13712:2019 «Керамические плитки — определения, классификация, характеристики и маркировка» ; IS 3495 (части 1–4:2019, часть 5:2021, часть 6:2022) «Методы испытаний обожжённых глиняных кирпичей», а также IS 1077:1992 «Обычные обожжённые глиняные кирпичи» и IS 2691:2017 «Облицовочные обожжённые глиняные кирпичи» ; IS 1200 «Методы обмера строительных и гражданских работ» (часть 2 — бетон, часть 3 — каменная кладка, часть 7 — фурнитура, часть 12 — штукатурка, часть 13 — окраска)\",\"Источники: SP 7:2016 «Национальный строительный код Индии» (BIS), стандарты по керамической плитке IS 15622:2017 и IS 13712:2019, серия по кирпичу IS 3495 вместе с IS 1077 / IS 2691, правила обмера IS 1200 и практика английских сокращений в индийских ведомостях материалов.\"\n","region_codes.csv":"region_id,group,base_code,code,name,full,note\ncn,mat,SL,,,,SL 在材料表＝硬碾玉／树脂饰面（特殊饰面类）；在电气图例＝灯带／射灯\ncn,mat,SP,,,,SP 在材料表＝特殊涂料；在电气图例＝射灯（Spot Light）。\ncn,obj,DL,,,,材料表／物料清单＝灯具大类；灯位图与型号（DL-Φ100-12W）＝筒灯。国内项目若把两类混用，必须在图例中写明。\nhk,,AC,ACR,亚加力（有机玻璃）,Acrylic,ACR 为亚加力，但港式亦有 ACR 指 Acoustic（吸音）材料，看 AC-01 后接字判断。\nhk,,AL,ALU,,Aluminium,\nhk,,AP,ACU,,,\nhk,,CA,CAR,,Carpet,\nhk,,CT,TIL,,Ceramic Tile,\nhk,,LP,LAM,,Laminate,\nhk,,MC,,金属复合板,,\nhk,,MO,MOS,,,\nhk,,MT,MTL,,Metal,\nhk,,PB,GYB,,Gypsum Board,GYB = Gypsum Board（石膏板），与 GR（玻璃钢）、MF（夹板）不同。\nhk,,PL,PLA,塑胶（亚加力／胶片／塑胶板）,,\nhk,,PT,PNT,,,\nhk,,SC,SCF,,,\nhk,,SF,SPF,,,\nhk,,UP,,软硬包（皮革／布艺）,,\nhk,,VF,VNL,地胶板（PVC 地板）,,\nhk,,WC,WAL,墙面饰材（墙纸／墙布）,Wallpaper,\nhk,,WR,WPF,防水卷材,,\nhk,finish,CL,,亮漆罩面,,CL 在港式既可指 Clear Lacquer，也可在灯具图例指 Ceiling Light，按图层判断。\nhk,finish,FL,,火烧面,,\nhk,finish,H,HL,拉丝饰面,,\nhk,finish,MA,,毛光·哑光饰面,,\nhk,finish,PC,,粉体喷涂,,\nhk,light,EL,EMG,,,\nhk,light,EXIT,EXI,疏散指示灯,Exit Sign,\nhk,light,IL,IGL,,,\nhk,light,ML,MAG,,,\nhk,light,SL,SP,,,\nhk,light,TL,TRK,轨道灯,,\nhk,light,UL,UCB,,,\nhk,light,UW,UWL,,,\nhk,light,WW,WWL,,,\nhk,mat,TL,TIL,,,港式瓷砖多用 TIL；TIL 与 TL 同义，全册须统一。\nhk,obj,AR,ART,,,\nhk,obj,BDG,BED,寝具用品,,\nhk,obj,DL,LT,灯具,,港式常把灯具大类写成 LT，DL 留给筒灯；材料表与灯位图要用同一套写法。\nhk,obj,EA,ELE,电器设备,E et),Унитаз (Water Closet),看它出现在哪张表：材料表与饰面表里的 WC 是墙纸墙布；给排水图与洁具表里的 WC 是坐便器。,\"Check which sheet the code sits on: in a materials or finishes schedule WC is wall covering, while on a plumbing drawing or a sanitaryware schedule WC is the water closet.\",どの表に現れるか確認する。材料表・仕上げ表の WC は壁紙・クロス、給排水図や衛生器具表の WC は便器。,\"어느 시트에 나타나는지 확인: 재료표·마감표의 WC는 벽지·벽布, 배관도나 위생기구표의 WC는 변기다.\",Mirar en qué hoja aparece: en el cuadro de materiales o acabados WC es revestimiento mural; en un plano de fontanería o en el cuadro de sanitarios WC es el inodoro.,\"Regarder la feuille concernée : dans un tableau de matériaux ou de finitions, WC est le revêtement mural ; sur un plan de plomberie ou dans un tableau de sanitaires, WC est le water closet.\",Guardare il foglio in cui compare: nel quadro dei materiali o delle finiture WC è il rivestimento a parete; in un piano impiantistico o nel quadro dei sanitari WC è il vaso igienico.,Ver em que folha aparece: no quadro de materiais ou de acabamentos WC é revestimento de parede; num plano de watersanitárias ou no quadro de sanitários WC é o vaso sanitário.,\"Посмотрите, в каком ведомости стоит код: в ведомости материалов или отделок WC — это настенное покрытие, а на сантехническом плане или в ведомости сантехники WC — унитаз.\"\nin,MR,镜子（Mirror）,Mirror,鏡（Mirror）,거울(Mirror),Espejo (Mirror),Miroir (Mirror),Specchio (Mirror),Espelho (Mirror),Зеркало (Mirror),大理石（Marble）,Marble,大理石（Marble）,대리석(Marble),Mármol (Marble),Marbre (Marble),Marmo (Marble),Mármore (Marble),Мрамор (Marble),看所在表与后接内容：饰面表与石材表里的 MR 多指大理石，洁具表与家具表里的 MR 多指镜子；后面写厚度或产地的多属石材。,\"Look at the table and at what follows the code: in a finish or stone schedule MR usually means marble, in a sanitaryware or furniture schedule it usually means mirror; a thickness or a quarry name after it points to stone.\",どの表か、その後ろに何が付くか確認する。仕上げ表・石材表の MR は主に大理石、衛生器具表や家具表の MR は主に鏡。後ろに厚みや産地名があれば石材。,\"어느 표인지, 코드 뒤에 무엇이 따라오는지 확인: 마감·석재표의 MR은 주로 대리석, 위생기구·가구표의 MR은 주로 거울. 뒤에 두께나 산지가 붙으면石材다.\",\"Mirar la tabla y lo que sigue abla.\",\"Regarder le tableau : dans un tableau de charpente ou de quincaillerie, MS est l'acier doux ; dans un tableau de finitions, MT est le mat. Les deux codes sont usités en Inde : c'est le titre du tableau qui tranche.\",\"Guardare la tabella: nel quadro delle strutture o della ferramenta MS è l'acciaio dolce, nel quadro delle finiture MT è l'opaco. In India compaiono entrambi i codici: decide il titolo della tabella.\",\"Ver a tabela: num quadro de estruturas ou ferragens MS é aço-carbono, e num quadro de acabamentos MT é fosco. Na Índia aparecem os dois códigos, pelo que decide o título da tabela.\",\"Посмотрите, в какой ведомости код: в ведомости конструкций или фурнитуры MS — мягкая сталь, а в ведомости отделок MT — матовая поверхность. В Индии встречаются обе аббревиатуры, поэтому смотрите заголовок ведомости.\"\n","conflicts.csv":"code,a_ref,b_ref,a_zh,a_en,a_ja,a_ko,a_es,a_fr,a_it,a_pt,a_ru,b_zh,b_en,b_ja,b_ko,b_es,b_fr,b_it,b_pt,b_ru\nDL,obj:DL,light:DL,,,,,,,,,,,,,,,,,,\nSL,,,特殊饰面（Solid Acrylic / Special）,Special finish (Solid Acrylic / Special),特殊仕上げ（ソリッドアクリル／スペシャル）,특수 마감(솔리드 아크릴/스페셜),Acabado especial (acrílico macizo / especial),Finition spéciale (Solid Acrylic / Special).,Finitura speciale (Solid Acrylic / Special).,Acabamento especial (Solid Acrylic / Special).,Специальная отделка (Solid Acrylic / Special).,灯带（Strip Light）/ 射灯（Spot Light）,Strip light / Spot light,ストリップライト／スポットライト,스트립 라이트 / 스포트라이트,Tira de LED / foco direccional,Bande LED (Strip Light) / spot (Spot Light).,Strip LED (Strip Light) / spot (Spot Light).,Fita de LED (Strip Light) / spot (Spot Light).,LED-лента (Strip Light) / спот (Spot Light).\nSF,mat:SF,,,,,,,,,,,金银箔（Silver Foil）,Gold / silver foil (Silver Foil),金箔・銀箔（Silver Foil）,금박·은박(Silver Foil),Pan de oro o plata (Silver Foil),Feuille d'or ou d'argent (Silver Foil).,Foglia d'oro o d'argento (Silver Foil).,Folha de ouro ou prata (Silver Foil).,Золотая или серебряная фольга (Silver Foil).\nSP,mat:SP,,,,,,,,,,,射灯（Spot Light）,Spot li
