as e espelhos d'água,\"UW é só para uso submerso: indique o grau IP e a montagem em piscinas e espelhos d'água, e não confunda com a luminária embutida no solo IL.\"\nlight,UW,ru,Подсветка бассейнов и водных объектов,UW предназначен только для погружного применения: укажите степень защиты IP и способ монтажа для бассейнов и водных объектов и не смешивайте с грунтовыми светильниками IL.\nlight,EL,fr,Downlights de sécurité et blocs autonomes,\"Légende du lot électricité, pas un code de finition.\"\nlight,EL,it,Downlight di emergenza e unità gemellate,\"Leggenda del lotto elettrico, non un codice di finitura.\"\nlight,EL,pt,Downlights de emergência e luminárias duplas,\"Legenda do lote elétrico, não é código de acabamento.\"\nlight,EL,ru,Аварийные точечные светильники и двуголовые блоки,\"Легенда электрического раздела, а не код отделки.\"\nlight,EXIT,fr,Sorties de secours et signalisation d'évacuation,Légende du lot électricité.\nlight,EXIT,it,Uscite di sicurezza e segnaletica di fuga,Leggenda del lotto elettrico.\nlight,EXIT,pt,Saídas de emergência e sinalização de evacuação,Legenda do lote elétrico.\nlight,EXIT,ru,Эвакуационные выходы и знаки эвакуации,Легенда электрического раздела.\nfinish,B,fr,Chants biseautés ou polis en biseau sur miroirs et vitrages,Traitement de chant et non de surface ; souvent cumulé avec E ou F sous EB et FB.\nfinish,B,it,Smusso o lucidatura a becco su specchi e vetri,Trattamento di bordo e non di superficie; spesso abbinato a E o F come EB e FB.\nfinish,B,pt,Cantos biselados ou polidos em espelhos e vidros,Tratamento de bordo e não de superfície; frequentemente combinado com E ou F como EB e FB.\nfinish,B,ru,Скошенные или подшлифованные кромки зеркал и стекла,\"Обработка кромки, а не поверхности; часто совмещается с E или F как EB и FB.\"\nfinish,E,fr,Gravure chimique ou attaque acide,Utilisé surtout sur le verre et souvent confondu avec la surface mate sablée F de la pierre.\nfinish,E,it,Incisione chimica o attacco acido,Usato soprattutto sul vetro e spesso confuso con la superficie opaca sabbiata F della pietra.\nfinish,E,pt,Gravação química ou jateamento ácido,Usado sobretudo em vidro e confundido com a superfície fosca jateada F da pedra.\nfinish,E,ru,Химическое травление или кислотное матирование,Применяется в основном на стекле и часто путается с матовой пескоструйной поверхностью F на камне.\nfinish,EB,fr,Face gravée avec chant biseauté,Associe biseau et gravure ; souvent confondu avec le simple dépoli F et avec le seul biseau B.\nfinish,EB,it,Faccia satinata con bordo smussato,Combina smusso e incisione; spesso confuso con il semplice satinato F e con il solo smusso B.\nfinish,EB,pt,Face gravada com canto biselado,Combina bisel e gravação; costuma ser confundido com o simples jateado F e com o só bisel B.\nfinish,EB,ru,Травлёная поверхность со скосом кромки,Совмещает фаску и травление; часто путают с простым матированием F и с одной фаской B.\nfinish,F,fr,Surface dépolie par attaque acide ou sablage,\"Mate abrasé surtout sur la pierre ; à ne pas confondre avec la gravure du verre E, autre procédé.\"\nfinish,F,it,Superficie satinata per attacco acido o sabbiatura,\"Opaco abrasivo soprattutto sulla pietra; da non confondere con l'incisione del vetro E, altro processo.\"\nfinish,F,pt,Superfície jateada por ataque ácido ou jateamento,\"Fosco abrasionado sobretudo em pedra; não confundir com a gravação ácida do vidro E, outro processo.\"\nfinish,F,ru,Матовая поверхность кислотной обработки или пескоструйной обработки,\"Матовый абразивный, в основном на камне; не путать с травлением стекла E — это другой процесс.\"\nfinish,FB,fr,Face dépolie avec chant biseauté,\"Code combiné, mate plus biseau ; se confond souvent avec l'EB gravé et biseauté.\"\nfinish,FB,it,Faccia satinata con bordo smussato,\"Codice combinato, opaco più smusso; spesso confuso con l'EB inciso e smussato.\"\nfinish,FB,pt,Face jateada com canto biselado,\"Código combinado, fosco mais bisel; confundido com frequência com o EB gravado e biselado.\"\nfinish,FB,ru,Матовая поверхность со скосом кромки,Комбинированный код — матовая поверхность и фаска; часто путают с EB (травление и фаска).\nfinish,H,fr,Brossage long sur acier inoxydable et aluminium,Écrit aussi BS (Brushed).\nfinish,H,it,Spazzolatura lunga su inox e alluminio,Indicato anche come BS (Brushed).\nfinish,H,pt,Escovado longo em inox e alumínio,Também escrito BS (Brushed).\nfinish,H,ru,Продольная шлифовка нержавейки и алюминия,Также пишут BS (Brushed).\nfinish,ND,fr,Grain court sans orientation,C'est l'inverse du H brossé : le grain n'a pas de direction et les deux se confondent souvent.\nfinish,ND,it,Grana corta senza direzione,È l'inverso della H spazzolata: la grana non ha direzione e i due codici si confondono spesso.\nfinish,ND,pt,Grão curto sem direção,É o contrário do H escovado: o grão não tem direção e os dois são confundidos com frequência.\nfinish,ND,ru,Короткий рисунок без направления,\"Обратное H (шлифовке): рисунок не направленный, поэтому их часто путают в легендах.\"\nfinish,OX,fr,\"Noircissage, patine bronze et vieillissement\",\"Réservé au métal — patine de bronze, laiton ou cuivre ; jamais sur la pierre.\"\nfinish,OX,it,\"Nero, patina bronzata e invecchiamento\",\"Solo per metallo — patina di bronzo, ottone o rame; non si usa sulla pietra.\"\nfinish,OX,pt,\"Escurecimento, pátina de bronze e envelhecimento\",\"Apenas para metal — pátina de bronze, latão ou cobre; nunca em pedra.\"\nfinish,OX,ru,\"Почернение, бронзовая патина и патина старения\",\"Только для металла — патина бронзы, латуни или меди; на камне не применяется.\"\nfinish,S,fr,Finition satinée semi-mate,\"L'éclat se situe entre le mat MA et le poli P ; ce n'est pas un niveau de brillance comme G, 30G, 50G ou 70G.\"\nfinish,S,it,Finitura satinata semimatta,\"La lucidità è tra l'opaco MA e il lucido P; non è un livello di brillantezza come G, 30G, 50G o 70G.\"\nfinish,S,pt,Acabamento acetinado semibrilho,O brilho fica entre o fosco MA e o polido P; não é um nível de brilho como G 30G 50G ou 70G.\nfinish,S,ru,Полуматовый сатиновый финиш,\"Блеск находится между матовым MA и полировкой P; это не уровень глянца, как G 30G 50G или 70G.\"\nfinish,P,fr,Poli miroir 8K et pierre polie,\"À ne pas confondre avec G, qui est un brillant de couche de finition et non un poli miroir.\"\nfinish,P,it,Lucidatura specchio 8K e pietra lucidata,Da non confondere con G che è la lucidità di una mano di finitura e non un polimento a specchio.\nfinish,P,pt,Polimento espelhado 8K e pedra polida,Não confundir com G que é o brilho de uma camada de acabamento e não um polimento espelhado.\nfinish,P,ru,Полировка до зеркального блеска 8K и полированный камень,\"Не путать с G: G — блеск покровного слоя, а P — зеркальная шлифовка самого материала.\"\nfinish,HA,fr,Cuivre et inox martelés à la main,\"Traitement mécanique au marteau ou au ciseau, à ne pas confondre avec le sablage SB (projection d'abrasif).\"\nfinish,HA,it,Rame e inox martellati a mano,\"Lavorazione meccanica a martello o scalpello, diversa dalla sabbiatura SB che proietta abrasivo.\"\nfinish,HA,pt,Cobre e inox martelados à mão,\"É um mecanismo de martelo ou cinzel, diferente do jateado SB que projeta abrasivo.\"\nfinish,HA,ru,\"Медь и нержавейка, обработанные вручную молотком\",\"Механическая обработка молотком или зубилом, в отличие от пескоструйной SB с подачей абразива.\"\nfinish,FL,fr,Traitement thermique du granit ( flammé),À ne pas confondre avec le projecteur (FL).\nfinish,FL,it,Trattamento termico del granito (fiammato),Da non confondere con il floodlight (FL).\nfinish,FL,pt,Tratamento térmico do granito (flamado),Não confundir com o floodlight (FL).\nfinish,FL,ru,Термообработка гранита (огненная),Не путать с прожектором (FL).\nfinish,MA,fr,\"Finition mate, sans brillance\",\"Dans les tableaux occidentaux on écrit MT (Matte), alors que MT désigne le métal dans la table des matériaux.\"\nfinish,MA,it,\"Finitura opaca, senza luminosità\",\"Nei quadri occidentali si scrive MT (Matte), mentre MT indica il metallo nella tabella dei materiali.\"\nfinish,MA,pt,\"Acabamento fosco, sem brilho\",\"Nos quadros ocidentais escreve-se MT (Matte), enquanto MT significa Metal na tabela de materiais.\"\nfinish,MA,ru,Матовый финиш без блеска,\"В западных ведомостях пишут MT (Matte), а в таблице материалов MT означает Metal.\"\nfinish,SB,fr,Verre et métal sablés,\"Sablage par abrasif, à ne pas confondre avec le martelé HA (mécanique) ni avec le grain non directionnel ND.\"\nfinish,SB,it,Vetro e metallo sabbiati,\"Sabbiatura con abrasivo, diversa dal martellato HA (meccanico) e dal grano non direzionale ND.\"\nfinish,SB,pt,Vidro e metal jateados,\"Jateamento por abrasivo, diferente do martelado HA (mecânico) e do grão não direcional ND.\"\nfinish,SB,ru,Пескоструйное стекло и металл,\"Абразивная обработка, не путать с чеканкой HA (механической) и с безнаправленным зерном ND.\"\nfinish,CL,fr,Couche de vernis transparent protectrice,À ne pas confondre avec le plafonnier (CL).\nfinish,CL,it,Strato protettivo di vernice trasparente,Da non confondere con il plafoniera (CL).\nfinish,CL,pt,Camada protetora de verniz transparente,Não confundir com a luminária de teto (CL).\nfinish,CL,ru,Защитный слой прозрачного лака,Не путать с потолочным светильником (CL).\nfinish,OSCL,fr,Bois teinté à l'huile puis vernis,\"Système traditionnel à pores ouverts pour le bois ; la poudre PC et le fluorocarbone FC visent les profilés métalliques, pas le bois.\"\nfinish,OSCL,it,Legno tinta a olio e poi verniciato,\"Sistema tradizionale a poro aperto per il legno; PC e FC riguardano i profili metallici, non il legno.\"\nfinish,OSCL,pt,Madeira tingida a óleo e vernizada,\"Sistema tradicional de poro aberto; o pó PC e o fluorocarbono FC aplicam-se a perfis metálicos, não à madeira.\"\nfinish,OSCL,ru,Древесина тонируется маслом и покрывается лаком,\"Традиционная открыто-пористая система для дерева; PC и FC относятся к металлическим профилям, а не к дереву.\"\nfinish,FC,fr,Peinture fluorocarbone sur aluminium et extérieur,\"Dans les légendes de Hong Kong, Macao et du Moyen-Orient, FC désigne aussi le faux plafond (False Ceiling) ; vérifier le tableau concerné.\"\nfinish,FC,it,Vernice fluorocarbonica su alluminio ed esterni,\"Nelle legende di Hong Kong, Macao e Medio Oriente FC indica anche il controsoffitto (False Ceiling); controllare in quale tabella compare.\"\nfinish,FC,pt,Tinta fluorocarbono em alumínio e exteriores,\"Em legendas de Hong Kong, Macau e Oriente Médio FC significa também falso teto (False Ceiling); ver em qual quadro aparece.\"\nfinish,FC,ru,Фторуглеродная краска по алюминию и для фасадов,\"В легендах Гонконга, Макао и Ближнего Востока FC означает также подвесной потолок (False Ceiling) — проверить, в какой таблице он указан.\"\nfinish,ZC,fr,Galvanisation à chaud et zingage électrolytique,Protection du substrat et non finition décorative ; généralement cotée à part du système de peinture.\nfinish,ZC,it,Zincatura a caldo e zincatura elettrolitica,È protezione del substrato e non finitura decorativa; di solito elencata separatamente dal sistema di verniciatura.\nfinish,ZC,pt,Galvanização a quente e zincagem eletrolítica,\"É proteção do substrato, não acabamento decorativo; normalmente vem separado do sistema de pintura.\"\nfinish,ZC,ru,Горячее цинкование и электролитическое цинкование,\"Защита основы, а не декоративная отделка; обычно указывается отдельно от системы окраски.\"\nfinish,WX,fr,Cire sur pierre et bois,Étape d'entretien appliquée par-dessus une autre finition ; la finition de base doit être indiquée séparément.\nfinish,WX,it,Cera su pietra e legno,È un passo di manutenzione sopra un'altra finitura; la finitura di base va indicata separatamente.\nfinish,WX,pt,Cera sobre pedra e madeira,É um passo de manutenção sobre outro acabamento; o acabamento base deve ser indicado à parte.\nfinish,WX,ru,Воск на камне и дереве,Это этап ухода поверх другой отделки; базовое покрытие всё равно указывается отдельно.\nfinish,G,fr,Finition brillante,\"Appartient à la même échelle de brillance que 30G, 50G et 70G ; uniformiser la notation de brillance par projet.\"\nfinish,G,it,Finitura lucida,\"Appartiene alla stessa scala di brillantezza di 30G, 50G e 70G; conviene uniformare la notazione in ogni progetto.\"\nfinish,G,pt,Acabamento brilhante,\"Faz parte da mesma escala de brilho que 30G, 50G e 70G; convém unificar a notação de brilho em cada projeto.\"\nfinish,G,ru,Глянцевая поверхность,\"Относится к той же шкале блеска, что 30G, 50G и 70G; лучше придерживаться одного обозначения в проекте.\"\nfinish,30G,fr,30 pour cent de brillance — trois points,\"Même famille d'échelle de brillance que G, 50G et 70G ; garder une seule convention sur la même planche.\"\nfinish,30G,it,30 per cento di brillantezza — tre punti,\"Stessa famiglia di scala di brillantezza di G, 50G e 70G; meglio usare un solo criterio in ogni tavola.\"\nfinish,30G,pt,Trinta por cento de brilho — três pontos,\"Mesma família da escala de brilho que G, 50G e 70G; convém adotar um único critério em cada prancha.\"\nfinish,30G,ru,Глянцевитость 30% — три пункта,\"Та же шкала блеска, что G, 50G и 70G; на одном листе лучше придерживаться одного обозначения.\"\nfinish,50G,fr,50 pour cent de brillance — cinq points,\"Même famille d'échelle de brillance que G, 30G et 70G ; garder une seule convention sur la même planche.\"\nfinish,50G,it,50 per cento di brillantezza — cinque punti,\"Stessa famiglia di scala di brillantezza di G, 30G e 70G; meglio usare un solo criterio in ogni tavola.\"\nfinish,50G,pt,Cinquenta por cento de brilho — cinco pontos,\"Mesma família da escala de brilho que G, 30G e 70G; convém adotar um único critério em cada prancha.\"\nfinish,50G,ru,Глянцевитость 50% — пять пунктов,\"Та же шкала блеска, что G, 30G и 70G; на одном листе лучше придерживаться одного обозначения.\"\nfinish,70G,fr,70 pour cent de brillance — sept points,\"Même famille d'échelle de brillance que G, 30G et 50G ; garder une seule convention sur la même planche.\"\nfinish,70G,it,70 per cento di brillantezza — sette punti,\"Stessa famiglia di scala di brillantezza di G, 30G e 50G; meglio usare un solo criterio in ogni tavola.\"\nfinish,70G,pt,Setenta por cento de brilho — sete pontos,\"Mesma família da escala de brilho que G, 30G e 50G; convém adotar um único critério em cada prancha.\"\nfinish,70G,ru,Глянцевитость 70% — семь пунктов,\"Та же шкала блеска, что G, 30G и 50G; на одном листе лучше придерживаться одного обозначения.\"\nfinish,PC,fr,Application électrostatique de poudre sur profilés aluminium,En conflit avec le sol vinyl (PC) : la légende tranche.\nfinish,PC,it,Verniciatura elettrostatica a polvere su profili in alluminio,In conflitto con il pavimento in vinile (PC): decide la legenda.\nfinish,PC,pt,Aplicação eletrostática de pó em perfis de alumínio,Em conflito com o piso vinílico (PC): a legenda decide.\nfinish,PC,ru,Электростатическая порошковая окраска алюминиевых профилей,Конфликт с виниловым полом (PC) — решает легенда.\nmat,SL,zh,硬碾玉（实心亚克力）台面、树脂板、树脂线条、树脂艺术造型,SL 在材料表＝硬碾玉/树脂饰面，在电气图例＝灯带/射灯（Strip Light / Spot Light）——必须看所在表。属特殊饰面类，非玻璃制品。\nmat,SL,en,\"Solid acrylic (solid surface) countertops, resin wall and ceiling panels, resin mouldings, resin art forms\",\"SL in the material schedule = solid acrylic / resin finish, in the electrical legend = strip light / spot light (Strip Light / Spot Light) — check which schedule the code appears in; it is a special finish family, not a glass product\"\nmat,SL,ja,ソリッドアクリル（実心アクリル）のカウンター、樹脂壁パネル、樹脂見切り、樹脂アートの造形,SL はマテリアル表ではソリッドアクリル（樹脂）仕上げ、電気凡例ではストリップライト／スポットライト（Strip Light / Spot Light）を表し、どちらの表にあるか必ず確認が必要で、特殊仕上げの系統であってガラス製品ではない\nmat,SL,ko,\"솔리드 아크릴(실체 아크릴) 상판, 수지 벽 패널, 수지 몰딩, 수지 아트 조형물\",\"SL은(는) 자재표에서는 솔리드 아크릴(수지) 마감, 전기 범례에서는 스트립 라이트/스포트 라이트(Strip Light / Spot Light)를 뜻함 — 어느 표에 있는지 반드시 확인. 특수 마감 계열이며 유리 제품이 아님\"\nmat,SL,es,\"Encimeras de acrílico macizo, paneles de pared y techo de resina, molduras de resina, formas artísticas de resina\",\"SL en el cuadro de materiales = acabado de acrílico macizo / resina, en la leyenda eléctrica = tira de luz / foco (Strip Light / Spot Light) — hay que comprobar en qué cuadro aparece el código; es una familia de acabados especiales, no un producto de vidrio\"\nmat,SL,fr,\"Plans de travail en acrylique massif, panneaux muraux et plafonds en résine, moulures en résine, volumes artistiques en résine\",\"SL dans le tableau des matériaux = finition acrylique massif / résine, dans la légende électrique = ruban lumineux / spot (Strip Light / Spot Light) — vérifier dans quel tableau le code apparaît ; c'est une famille de finitions spéciales, ce n'est pas un produit verrier.\"\nmat,SL,it,\"Piani in acrilico massiccio, pannelli murali e soffittali in resina, cornici in resina, forme artistiche in resina\",\"SL nella tabella dei materiali = finitura in acrilico massiccio / resina, nella legenda elettrica = strip / spot (Strip Light / Spot Light) — controllare in quale tabella compare il codice; è una famiglia di finiture speciali, non un prodotto in vetro.\"\nmat,SL,pt,\"Bancadas de acrílico maciço, painéis de parede e teto em resina, molduras de resina, formas artísticas de resina\",\"SL no quadro de materiais = acabamento em acrílico maciço / resina, na legenda elétrica = fita de luz / spot (Strip Light / Spot Light) — é preciso verificar em que quadro o código aparece; é uma família de acabamentos especiais, não um produto de vidro.\"\nmat,SL,ru,\"Столешницы из массивного акрила, стеновые и потолочные панели из смолы, молдинги из смолы, художественные объёмы из смолы\",\"SL в таблице материалов = отделка массивным акрилом / смолой, в условных обозначениях электрики = линейный светильник / прожектор (Strip Light / Spot Light) — обязательно смотреть, в какой таблице указан код; это семейство специальных отделок, а не стекло.\"\nmat,RA,zh,藤编饰面、藤编家具、藤编吊顶、藤编屏风,RA 为藤编/藤制品，与其他材料代码（FR 家具等）区分；港澳与东南亚项目常见，酒店与度假村精装中尤常见。\nmat,RA,en,\"Rattan wall panels, rattan furniture, rattan ceilings, rattan screens\",\"RA stands for rattan / wicker products and must be distinguished from other material codes (FR furniture, etc.); common in Hong Kong, Macau and Southeast Asian projects, especially in hotel and resort fit-out\"\nmat,RA,ja,籐の壁パネル、籐の家具、籐の天井、籐の屏風,RA は籐・籐製品を示し、FR（家具）などの他のマテリアルコードと区別する点で、香港・マカオおよび東南アジアのプロジェクトでは一般的で、ホテルやリゾート先の仕上げにも多く使われる\nmat,RA,ko,\"라탄 벽 패널, 라탄 가구, 라탄 천장, 라탄 스크린\",RA는 라탄/위빙 제품을 뜻하며 FR(가구) 등 다른 재료 코드와 구분해야 함; 홍콩·마카오 및 동남아 프로젝트에서 흔하며 호텔·리조트 마감에도 널리 쓰인다\nmat,RA,es,\"Paneles de mimbre, mobiliario de mimbre, techos de mimbre, biombos de mimbre\",\"RA designa productos de mimbre/rattan y debe distinguirse de otros códigos de material (FR mobiliario, etc.); es habitual en proyectos de Hong Kong, Macao y el Sudeste Asiático, sobre todo en interiores de hoteles y resorts\"\nmat,RA,fr,\"Panneaux en rotin, mobilier en rotin, plafonds en rotin, paravents en rotin\",\"RA désigne les produits en rotin et doit être distingué d'autres codes de matériaux (FR mobilier, etc.) ; fréquent à Hong Kong, Macao et en Asie du Sud-Est, notamment dans les projets d'hôtels et de complexes de villégiature.\"\nmat,RA,it,\"Pannelli in vimini, arredi in vimini, soffitti in vimini, paraventi in vimini\",\"RA indica i prodotti in vimini e va distinto dagli altri codici di materiale (FR mobiliario, ecc.); comune nei progetti a Hong Kong, Macao e nel sud-est asiatico, in particolare negli interni di hotel e resort.\"\nmat,RA,pt,\"Painéis em rattan/vime, mobiliário em rattan, tetos em rattan, biombos em rattan\",\"RA designa produtos em rattan/vime e deve ser distinguido de outros códigos de material (FR mobiliário, etc.); comum em projetos de Hong Kong, Macau e do Sudeste Asiático, sobretudo em interiores de hotéis e resorts.\"\nmat,RA,ru,\"Панели из ротанга, мебель из ротанга, потолки из ротанга, ширмы из ротанга\",\"RA обозначает изделия из ротанга и отличается от других кодов материалов (FR мебель и т. п.); часто встречается в проектах Гонконга, Макао и Юго-Восточной Азии, особенно в отелях и курортных комплексах.\"\nmat,BR,zh,烧结砖、页岩砖、清水砖、釉面砖、饰面砖、混凝土砌块,属砌体材料而非饰面；与饰面表的斜边 B 同首字母，须按所在表区分。\nmat,BR,en,\"Fired clay brick, shale brick, fair-faced brick, glazed brick, facing brick, concrete block\",\"A masonry material rather than a finish; the code collides with the bevelled-edge entry in the finish schedule, so check which schedule it sits on.\"\nmat,BR,ja,焼成レンガ、頁岩レンガ、清水煉瓦、釉薬煉瓦、化粧煉瓦、コンクリートブロック,仕上げではなく構造材として扱う。仕上げ表の面取り（B）と先頭文字が同じなので、どの表のコードか確認する。\nmat,BR,ko,\"소성 벽돌, 셰일 벽돌, 미장 벽돌, 유리 벽돌, 외장 벽돌, 콘크리트 블록\",\"마감재가 아니라 조적 구조재이며, 마감표의 모따기(B)와 첫 글자가 같으므로 어느 표의 코드인지 확인한다.\"\nmat,BR,es,\"Ladrillo cocido, ladrillo de esquisto, ladrillo visto, ladrillo esmaltado, ladrillo de fachada, bloque de hormigón\",\"Es un material de mampostería y no un acabado; comparte iniciales con el biselado de la tabla de acabados, así que hay que ver en qué tabla aparece.\"\nmat,BR,fr,\"Brique cuite, brique de schiste, brique de parement, brique émaillée, brique de façade, bloc béton\",\"Matériau de maçonnerie et non finition ; le code coïncide avec le biseau du tableau des finitions, il faut donc regarder la table concernée.\"\nmat,BR,it,\"Mattoni cotti, mattoni di argilla, mattoni a vista, mattoni smaltati, mattoni facciata, blocchi di calcestruzzo\",\"È un materiale murario e non una finitura; la sigla coincide con lo smusso della tabella delle finiture, quindi va guardata la tabella in cui compare.\"\nmat,BR,pt,\"Tijolo cozido, tijolo de xisto, tijolo aparente, tijolo esmaltado, tijolo de fachada, bloco de betão\",\"É um material de alvenaria e não um acabamento; a sigla coincide com o biselado do quadro de acabamentos, pelo que se deve ver em que quadro aparece.\"\nmat,BR,ru,\"Керамический кирпич, сланцевый кирпич, лицевой кирпич, глазурованный кирпич, облицовочный кирпич, блоки\",\"Это кладочный материал, а не отделка; обозначение совпадает с фаской в ведомости отделок, поэтому смотрите, в какой ведомости стоит код.\"\nmat,SS,zh,不锈钢板、方管、圆管、异型管、不锈钢饰面、楼梯扶手,与镀锌钢 GI、软钢 MS 分列；图例里 SS 有时也指不锈钢管件。\nmat,SS,en,\"Stainless steel sheet, square and round tube, profiled tube, stainless steel finishes, stair and handrail\",Keep it apart from galvanised steel (GI) and mild steel (MS); in legends SS can also cover stainless fittings.\nmat,SS,ja,ステンレス板、角パイプ、円管、特殊管、ステンレス仕上げ、手すり,亜鉛鋼（GI）、軟鋼（MS）とは分けて記載する。凡例では SS がステンレス金具を指すこともある。\nmat,SS,ko,\"스테인리스 판, 각형·원형 강관, specialty tube, 스테인리스 마감, 난간\",아연도강(GI) 및 연강(MS)과 구분해 표기한다. 범례에서 SS는 스테인리스 철물을 뜻하기도 한다.\nmat,SS,es,\"Chapa de acero inoxidable, tubo cuadrado y redondo, tubo perfilado, acabados inoxidables, barandilla\",Debe listarse aparte del acero galvanizado (GI) y del acero al carbono (MS); en la leyenda SS puede designar también accesorios inoxidables.\nmat,SS,fr,\"Tôle inox, tube carré et rond, tube profilé, finitions inoxydables, main courante\",À distinguer de l'acier galvanisé (GI) et de l'acier doux (MS) ; dans la légende SS peut aussi désigner les accessoires inox.\nmat,SS,it,\"Lamiera inox, tubo quadro e tondo, tubo profilato, finiture inox, corrimano\",Va tenuto distinto dall'acciaio zincato (GI) e dall'acciaio dolce (MS); nelle legende SS può indicare anche i complementi in inox.\nmat,SS,pt,\"Chapa de aço inoxidável, tubo quadrado e redondo, tubo perfilado, acabamentos inox, corrimão\",Deve ser listado à parte do aço galvanizado (GI) e do aço-carbono (MS); na legenda SS pode designar também os acessórios em inox.\nmat,SS,ru,\"Лист из нержавеющей стали, квадратная и круглая труба, профильная труба, нержавеющие отделки, поручни\",Отделяют от оцинкованной стали (GI) и мягкой стали (MS); в легенде SS может означать и нержавеющие фурнитурные изделия.\nmat,EM,zh,环氧自流平、环氧砂浆、环氧彩砂、环氧防静电地坪,多见于车位、机房、酒店后场；与 PVC 地胶、丙烯酸地坪分列。\nmat,EM,en,\"Self-levelling epoxy, epoxy mortar, coloured flake epoxy, antistatic epoxy flooring\",\"Common in car parks, plant rooms and back-of-house areas; list it apart from PVC sheet vinyl and acrylic flooring.\"\nmat,EM,ja,セルフレベリングエポキシ、エポキモルタル、フレーク塗床、静電防止エポキシ床,駐車場や機械室、バックヤードに多い。塩ビ床材、アクリル床材とは別に記載する。\nmat,EM,ko,\"자정형 에폭시, 에폭시 모르타르, 플레이크 에폭시, 정전기 방지 에폭시 바닥\",\"주차장·기계실·백야드에 흔하며, PVC 바닥재와 아크릴 바닥재와 구분해 표기한다.\"\nmat,EM,es,\"Epoxy autonivelante, mortero epoxi, epoxi de flakes, epoxi antiestático\",\"Habitual en aparcamientos, salas de máquinas y zonas de servicio; debe listarse aparte del vinilo en bobina y del pavimento acrílico.\"\nmat,EM,fr,\"Époxy autolissant, mortier époxy, époxy à flakes, époxy antistatique\",\"Courant dans les parkings, les locaux techniques et les zones de service ; à distinguer du sol PVC et du sol acrylique.\"\nmat,EM,it,\"Epoxy autolivellante, malta epossidica, epoxy con scaglie, epoxy antistatico\",\"Comune in parcheggi, locali tecnici e zone di servizio; da elencare separatamente dal PVC e dal pavimento in acrylico.\"\nmat,EM,pt,\"Epóxi autonivelante, argamassa epóxi, epóxi com flakes, epóxi antiestático\",\"Comum em estacionamentos, casas de máquinas e áreas de serviço; deve ser listado à parte do vinílico em rolo e do piso acrílico.\"\nmat,EM,ru,\"Полимерный наливной эпоксид, эпоксидный раствор, эпоксид с кварцевой крошкой, антистатический эпоксид\",\"Обычно встречается на парковках, в технических помещениях и в подсобных зонах; указывают отдельно от линолеума ПВХ и акриловых покрытий.\"\nmat,CS,zh,硅酸钙板、纤维水泥板、硅钙板吊顶基材,常用于防火与湿区基层；与石膏板 PB、矿棉板 MW 分列，遇火反应等级按 GB 8624 标注。\nmat,CS,en,\"Calcium silicate board, fibre cement board, calcium silicate ceiling substrate\",Used for fire-rated and wet-area substrates; list it apart from plasterboard (PB) and mineral wool board (MW) and declare the reaction-to-fire class to GB 8624.\nmat,CS,ja,珪酸鈣板、繊維セメント板、珪酸鈣板の野縁下地,防火・湿式の下地として使う。石膏ボード（PB）、鉱棉板（MW）と分け、耐火等級を GB 8624 で表示する。\nmat,CS,ko,\"규산칼슘 보드, 섬유 시멘트 보드, 천장 틀용 규산칼슘 보드\",\"내화·습식 하부재로 쓰며, 석고보드(PB)·미네랄울 보드(MW)와 구분하고 연소성능 등급은 GB 8624로 표기한다.\"\nmat,CS,es,\"Placa de silicato de calcio, placa de fibrocemento, substrate de techo de silicato de calcio\",Se usa como soporte ignífugo y en zonas húmedas; debe listarse aparte de la placa de yeso (PB) y de la placa de lana mineral (MW) y declararse su clase de reacción al fuego según GB 8624.\nmat,CS,fr,\"Plaque de silicate de calcium, plaque de fibrociment, support de plafond en silicate de calcium\",\"Utilisée en support feu et en locaux humides ; à distinguer de la plaque de plâtre (PB) et de la plaque de laine minérale (MW), avec classe de réaction au feu selon GB 8624.\"\nmat,CS,it,\"Lastra di silicato di calcio, lastra in fibrocemento, supporto di soffitto in silicato di calcio\",Impiegata come supporto ignifugo e in ambienti umidi; va elencata separatamente dal cartongesso (PB) e dal pannello di lana minerale (MW) e va dichiarata la classe di reazione al fuoco secondo GB 8624.\nmat,CS,pt,\"Placa de silicato de cálcio, placa de fibrocimento, suporte de teto em silicato de cálcio\",\"Usada como suporte ignífugo e em zonas húmidas; deve ser listada à parte da placa de gesso (PB) e da placa de lã mineral (MW), com classe de reação ao fogo segundo GB 8624.\"\nmat,CS,ru,\"Силикатно-кальциевая плита, фиброцементная плита, подложка подвесного потолка из силикатного материала\",\"Применяют как огнестойкую и влагостойкую основу; указывают отдельно от гипсокартона (PB) и минераловатной плиты (MW), класс реакции на огонь — по GB 8624.\"\nmat,MW,zh,矿棉吸音板、矿棉天花板、矿棉墙体填充板,常用于吊顶与隔墙吸声；与吸音板 AP 同域，按吸声等级与面层区分。\nmat,MW,en,\"Mineral wool acoustic board, mineral wool ceiling tile, mineral wool infill panel\",Common in ceilings and partitions for acoustic performance; it sits in the same family as acoustic panel (AP) and is told apart by the absorption rating and facing.\nmat,MW,ja,鉱棉吸音板、鉱棉天井板、鉱棉壁充填板,吸音天井と間仕切りに用いる。吸音板（AP）と同じ領域にあり、吸音率と表層で区別する。\nmat,MW,ko,\"미네랄울 흡음판, 미네랄울 천장 타일, 미네랄울 충전재 판\",\"흡음 천장과 칸막이에 쓰며, 흡음판(AP)과 같은 영역이므로 흡음률과 표면재로 구분한다.\"\nmat,MW,es,\"Placa acústica de lana mineral, baldosa de techo de lana mineral, panel de relleno de lana mineral\",Se usa en techos y tabiques por su comportamiento acústico; comparte familia con el panel acústico (AP) y se distingue por el índice de absorción y el revestimiento.\nmat,MW,fr,\"Plaque acoustique en laine minérale, dalle de plafond en laine minérale, panneau de remplissage en laine minérale\",\"Courante en plafonds et cloisons pour les performances acoustiques ; même famille que le panneau acoustique (AP), à distinguer par l'absorption et la finition.\"\nmat,MW,it,\"Pannello acustico in lana minerale, pannello per controsoffitto in lana minerale, pannello di tamponamento in lana minerale\",Usato per soffitti e tramezzi per le prestazioni acustiche; è della stessa famiglia del pannello acustico (AP) e si distingue per l'assorbimento e la finitura.\nmat,MW,pt,\"Placa acústica de lã mineral, placa de teto em lã mineral, painel de enchimento em lã mineral\",Usada em tetos e tabiques pelo desempenho acústico; pertence à mesma família do painel acústico (AP) e distingue-se pelo índice de absorção e pelo revestimento.\nmat,MW,ru,\"Минераловатная акустическая плита, минераловатная потолочная плита, минераловатная заполняющая плита\",\"Применяют в потолках и перегородках ради акустических свойств; относится к той же группе, что и акустическая панель (AP), и отличается величиной поглощения и облицовкой.\"\nmat,PLY,zh,覆膜板、多层板、阻燃胶合板、装饰胶合板,多用于木作基层与造型；与细木工板、密度板分列。\nmat,PLY,en,\"Faced plywood, multi-layer plywood, fire-rated plywood, decorative plywood\",Mostly used as a substrate and for formed joinery; list it apart from blockboard and fibreboard.\nmat,PLY,ja,単板積層板、積層合板、耐火合板、装飾合板,木工の下地や造型に用いる。ブロックボードや繊維板とは分けて記載する。\nmat,PLY,ko,\"합판, 다층 합판, 내화 합판, 장식 합판\",\"목공 바탕과 조형에 쓰며, 블록보드와 섬유판은 구분해 표기한다.\"\nmat,PLY,es,\"Contrachapado chapado, contrachapado multicapa, contrachapado ignífugo, contrachapado decorativo\",Se usa como soporte de carpintería y en formas; debe listarse aparte del tablero de listones y del tablero de fibra.\nmat,PLY,fr,\"Contreplaqué plaqué, contreplaqué multicouche, contreplaqué ignifuge, contreplaqué décoratif\",Utilisé comme support de menuiserie et en habillage ; à distinguer du panneau lamellé et du panneau de fibres.\nmat,PLY,it,\"Compensato placcato, compensato multistrato, compensato ignifugo, compensato decorativo\",Usato come supporto per la carpenteria e per le forme; va elencato separatamente dal pannello listellato e dal pannello di fibra.\nmat,PLY,pt,\"Compensado revestido, compensado multicamada, compensado ignífugo, compensado decorativo\",Usado como suporte de marcenaria e em formas; deve ser listado à parte do painel de ripas e do painel de fibra.\nmat,PLY,ru,\"Облицованная фанера, многослойная фанера, огнестойкая фанера, декоративная фанера\",Применяют как основу для столярных работ и для форм; указывают отдельно от столярного щита и от древесноволокнистой плиты.\nobj,DR,zh,实木门、复合门、钢木门、玻璃门、门套与门垛,属门表条目；与五金 HW、隔断分列，防火门须标注耐火时限。\nobj,DR,en,\"Solid timber door, composite door, steel-core timber door, glass door, frame and lining\",\"Sits in the door schedule; list it apart from hardware (HW) and partitions, and state the fire resistance rating for fire doors.\"\nobj,DR,ja,木製建具、複層建具、鋼木製建具、ガラス建具、枠・見切り,建具表の項目。金物（HW）、間仕切りとは分けて記載し、防火扉は耐火時間を明記する。\nobj,DR,ko,\"목재문, 복합문, 강목문, 유리문, 문틀 및 문선\",\"도어 스케줄에 해당하며, 철물(HW)·칸막이와 구분하고 방화문은 내화시간을 명시한다.\"\nobj,DR,es,\"Puerta de madera maciza, puerta compuesta, puerta de acero y madera, puerta de cristal, marco y jambas\",\"Va en el cuadro de puertas; debe listarse aparte de los herrajes (HW) y de los tabiques, y las puertas cortafuegos llevan indicada su resistencia al fuego.\"\nobj,DR,fr,\"Porte en bois massif, porte composite, porte acier-bois, porte vitrée, huisserie et chambranle\",\"Relève du tableau des portes ; à distinguer de la quincaillerie (HW) et des cloisons, et les portes coupe-feu portent leur classement feu.\"\nobj,DR,it,\"Porta in legno massello, porta composita, porta acciaio-legno, porta in vetro, telaio e controtelaio\",\"Rientra nel quadro delle porte; va elencata separatamente dalla ferramenta (HW) e dai tramezzi, e le porte tagliafuoco riportano la classe di resistenza al fuoco.\"\nobj,DR,pt,\"Porta de madeira maciça, porta composta, porta de aço e madeira, porta de vidro, caixilho e guarnição\",\"Integra o quadro de portas; deve ser listado à parte das ferragens (HW) e das divisórias, e as portas corta-fogo indicam a classe de resistência ao fogo.\"\nobj,DR,ru,\"Деревянная дверь, комбинированная дверь, стально-деревянная дверь, стеклянная дверь, коробка и наличник\",\"Относится к ведомости дверей; указывают отдельно от фурнитуры (HW) и перегородок, а у противопожарных дверей указывают предел огнестойкости.\"\nlight,RC,zh,方形日光灯盘、条形日光灯盘、嵌入式 LED 平板灯,办公室常用；与面板灯 PN、吸顶灯 CL 分列。\nlight,RC,en,\"Square light troffer, strip light troffer, recessed LED troffer\",Common in offices; list it apart from panel light (PN) and ceiling light (CL).\nlight,RC,ja,方形埋込直管灯器具、連続形埋込器具、埋込 LED パネル灯,オフィスに多い。パネルライト（PN）、シーリングライト（CL）とは分けて記載する。\nlight,RC,ko,\"사각 매입등기구, 일자형 매입등기구, 매입 LED 패널등\",\"사무실에서 흔하며, 패널등(PN)·천장등(CL)과 구분해 표기한다.\"\nlight,RC,es,\"Troffer cuadrado, troffer de tira, panel LED empotrado\",Habitual en oficinas; debe listarse aparte del panel light (PN) y de la luz de techo (CL).\nlight,RC,fr,\"Plafonnier carré, plafonnier linéaire, panneau LED encastré\",Courant dans les bureaux ; à distinguer du panneau LED (PN) et du plafonnier (CL).\nlight,RC,it,\"Plafoniera quadrata, plafoniera lineare, pannello LED incassato\",Comune negli uffici; da elencare separatamente dal pannello LED (PN) e dalla plafoniera (CL).\nlight,RC,pt,\"Troffer quadrado, troffer linear, painel LED encastrado\",Comum em escritórios; deve ser listado à parte do painel LED (PN) e da luminária de teto (CL).\nlight,RC,ru,\"Квадратный встраиваемый светильник, линейный встраиваемый светильник, встраиваемый светодиодный панельный светильник\",Обычен в офисах; указывают отдельно от панельного светильника (PN) и потолочного светильника (CL).\nlight,GR,zh,单头格栅射灯、双头格栅射灯、防眩格栅射灯,与射灯 SL 同族，按有无格栅与防眩片区分。\nlight,GR,en,\"Single-head grid spot, double-head grid spot, anti-glare grid spot\",Sits in the same family as spot light (SL) and is told apart by the louvre and anti-glare blades.\nlight,GR,ja,1灯グリッドスポット、2灯グリッドスポット、遮光グリッドスポット,スポットライト（SL）と同じ系統で、ルーバーと遮光ブレードの有無で区別する。\nlight,GR,ko,\"1등 그리드 스포트, 2등 그리드 스포트, 차광 그리드 스포트\",\"스포트라이트(SL)와 같은 계열이며, 루버와 차광 블레이드의 유무로 구분한다.\"\nlight,GR,es,\"Foco de rejilla de una cabeza, de dos cabezas y con lamas antideslumbramiento\",Comparte familia con el foco direccional (SL) y se distingue por la rejilla y las lamas antideslumbramiento.\nlight,GR,fr,\"Spot à grille une tête, deux têtes, à lames anti-éblouissement\",Appartient à la famille du spot (SL) ; se distingue par la grille et les lames anti-éblouissement.\nlight,GR,it,\"Faretto a griglia a una testa, a due teste, con lamelle antialbaggio\",Appartiene alla famiglia dello spot (SL) e si distingue per la griglia e le lamelle antialbaggio.\nlight,GR,pt,\"Spot com grelha de uma cabeça, de duas cabeças, com lâminas antioderramamento\",Pertence à mesma família do spot (SL) e distingue-se pela grelha e pelas lâminas antioderramamento.\nlight,GR,ru,\"Одноточечный прожектор с решёткой, двухточечный, с антибликовыми пластинами\",\"Относится к той же группе, что и спот (SL), и отличается наличием решётки и антибликовых пластин.\"\nfinish,AN,zh,铝型材阳极氧化、氧化铝饰面、阳极氧化铝板,多用于铝型材与铝板；与电泳 EC、氟碳 FC 分列。\nfinish,AN,en,\"Anodized aluminium profiles, anodized aluminium sheet, anodic finishes\",Common on aluminium profiles and panels; list it apart from e-coating (EC) and fluorine coat (FC).\nfinish,AN,ja,アルマイト処理したアルミ形材、アルミ板の陽極酸化,アルミ形材やアルミ板に多い。電着（EC）、フッ素樹脂塗装（FC）とは分けて記載する。\nfinish,AN,ko,\"양극산화 알루미늄 프로파일, 양극산화 알루미늄 판\",\"알루미늄 프로파일과 판재에 흔하며, 전도도장(EC)·불소 코팅(FC)과 구분해 표기한다.\"\nfinish,AN,es,\"Perfiles de aluminio anodizado, chapa de aluminio anodizada, acabados anódicos\",Habitual en perfiles y chapas de aluminio; debe listarse aparte del electrocoat (EC) y del recubrimiento de fluorocarbono (FC).\nfinish,AN,fr,\"Profilés en aluminium anodisé, tôle d'aluminium anodisée, finitions anodiques\",Courant sur les profils et les tôles d'aluminium ; à distinguer de l'électrodéposition (EC) et du revêtement au fluorocarbone (FC).\nfinish,AN,it,\"Profili in alluminio anodizzato, lamiera in alluminio anodizzata, finiture anodiche\",Comune su profili e lamiere di alluminio; da elencare separatamente dall'elettrocoat (EC) e dalla vernice a fluorocarbone (FC).\nfinish,AN,pt,\"Perfis de alumínio anodizado, chapa de alumínio anodizada, acabamentos anódicos\",Comum em perfis e chapas de alumínio; deve ser listado à parte do electrocoat (EC) e do revestimento de fluorocarbono (FC).\nfinish,AN,ru,\"Анодированные алюминиевые профили, анодированный алюминиевый лист, анодированные покрытия\",Обычно применяют на алюминиевых профилях и листах; указывают отдельно от электроокраски (EC) и покрытия фторуглеродом (FC).\nfinish,EC,zh,电泳漆面、电泳涂装铝型材、电泳板,与粉末喷涂 PC、氟碳 FC 分列；多用于铝型材底涂。\nfinish,EC,en,\"Electrodeposited coating, e-coated aluminium profile, electrocoated sheet\",List it apart from powder coating (PC) and fluorine coat (FC); it is mostly used as the base coat on aluminium profiles.\nfinish,EC,ja,電着塗装、電着処理アルミ形材、電着鋼板,粉体塗装（PC）、フッ素樹脂塗装（FC）とは分けて記載する。アルミ形材の下地塗装として多い。\nfinish,EC,ko,\"전도도장, 전도도장 알루미늄 프로파일, 전도 도장 강판\",\"분체도장(PC)·불소 코팅(FC)과 구분해 표기하며, 알루미늄 프로파일의 하도(base coat)로 많이 쓰인다.\"\nfinish,EC,es,\"Recubrimiento por electrodeposición, perfil de aluminio electrocoatado, chapa electrocoatada\",Debe listarse aparte del recubrimiento en polvo (PC) y del fluorocarbono (FC); se usa sobre todo como capa base en perfiles de aluminio.\nfinish,EC,fr,\"Revêtement par électrodéposition, profilé en aluminium électrodéposé, tôle électrodéposée\",À distinguer du poudrage (PC) et du revêtement au fluorocarbone (FC) ; s'emploie surtout comme couche de base sur les profilés aluminium.\nfinish,EC,it,\"Rivestimento per electrodeposizione, profilo in alluminio elettrocoated, lamiera elettrocoated\",Da elencare separatamente dalla verniciatura a polvere (PC) e dalla vernice a fluorocarbone (FC); si usa soprattutto come primer sui profili in alluminio.\nfinish,EC,pt,\"Revestimento por electrodeposição, perfil de alumínio eletrocoated, chapa eletrocoberta\",Deve ser listado à parte do revestimento em pó (PC) e do fluorocarbono (FC); usa-se sobretudo como camada base em perfis de alumínio.\nfinish,EC,ru,\"Электрофоретическое покрытие, электроокрашенный алюминиевый профиль, электроокрашенный лист\",Указывают отдельно от порошковой окраски (PC) и покрытия фторуглеродом (FC); чаще всего применяют как грунт на алюминиевых профилях.\nmat,SK,zh,实木踢脚线、金属踢脚线、PVC 踢脚、石材／瓷砖加工踢脚、GRG 石膏踢脚、铝合金踢脚,踢脚线常与地面同材；石材踢脚须注明“与地面同材同磨”；GRG／石膏踢脚属地区特有（见中国澳门、印度条目）；与五金 HDW 分列，勿并入地面材料行。\nmat,SK,en,\"Solid wood skirting, metal skirting, PVC skirting, stone or ceramic cut skirting, GRG plaster skirting, aluminium skirting\",Skirting normally matches the floor finish; stone skirting must state “same material and same finish as the floor”. GRG or plaster skirting is region-specific (see the Macau and India entries). Keep it on a separate line from the hardware (HDW).\nmat,SK,ja,木製巾木、金属製巾木、PVC 巾木、石材・タイル加工の巾木、GRG プラスター巾木、アルミ製巾木,巾木は床材と同じ仕上げに揃えることが多い。石材巾木は「床材と同材・同仕上げ」と明記すること。GRG／石膏の巾木は地域固有（中国マカオ・インドの項目参照）。金物（HDW）行とは分けて記載する。\nmat,SK,ko,\"목재 걸레받이, 금속 걸레받이, PVC 걸레받이, 석재·타일加工 걸레받이, GRG 석고 걸레받이, 알루미늄 걸레받이\",걸레받이는 바닥재와 동일 마감으로 맞추는 경우가 많다. 석재 걸레받이는 “바닥재와 동일 재질·동일 마감”으로 명시한다. GRG·석고 걸레받이는 지역 고유(중국 마카오·인도 항목 참조). 금속 하드웨어(HDW) 항목과 분리해서 기재한다.\nmat,SK,es,\"Rodapié de madera, rodapié metálico, rodapié de PVC, rodapié recortado en piedra o cerámica, rodapié de placho GRG, rodapié de aluminio\",El rodapié suele igualar el acabado del piso; en piedra debe indicarse “mismo material y mismo acabado que el piso”. El rodapié de GRG o yeso es propio de cada región (véanse las entradas de Macao e India). Se lista aparte de la partida de herrajes (HDW).\nmat,SK,fr,\"Plinthe en bois, plinthe métallique, plinthe PVC, plinthe en pierre ou céramique découpée, plinthe en plâtre GRG, plinthe aluminium\",\"La plinthe reprend généralement le sol ; en pierre, préciser « même matériau et même finition que le sol ». La plinthe GRG ou plâtre est propre à chaque région (cf. Macao et Inde). À inscrire séparément de la ligne quincaillerie (HDW).\"\nmat,SK,it,\"Zoccolo in legno, zoccolo metallico, zoccolo in PVC, zoccolo in pietra o ceramica tagliato, zoccolo in gesso GRG, zoccolo in alluminio\",Lo zoccolo segue di solito la finitura del pavimento; per la pietra indicare « stesso materiale e stessa finitura del pavimento ». Lo zoccolo in GRG o gesso è tipico di ogni regione (vedi Macao e India). Va riportato separatamente dalla voce della ferramenta (HDW).\nmat,SK,pt,\"Rodapé de madeira, rodapé metálico, rodapé de PVC, rodapé cortado em pedra ou cerâmica, rodapé de gesso GRG, rodapé de alumínio\",\"O rodapé costuma seguir o acabamento do piso; em pedra, indicar “mesmo material e mesmo acabamento que o piso”. O rodapé de GRG ou gesso é próprio de cada região (ver as entradas de Macau e Índia). Deve ser listado à parte da linha de ferragens (HDW).\"\nmat,SK,ru,\"Плинтус деревянный, плинтус металлический, ПВХ-плинтус, плинтус из камня или керамогранита, гипсовый плинтус GRG, алюминиевый плинтус\",\"Плинтус обычно повторяет отделку пола; для камня указывают «тот же материал и та же обработка, что у пола». Плинтус GRG или гипсовый — региональный материал (см. записи по Макао и Индии). Указывается отдельной строкой, не в строке фурнитуры (HDW).\"\n","regions.csv":"id,flag,local_lang,script\ncn,🇨🇳,zh,\nhk,🇭🇰,zh,hant\ntw,🇹🇼,zh,hant\njp,🇯🇵,ja,\nkr,🇰🇷,ko,\nwest,🇬🇧,en,\nlatam,🌎,es,\nmena,🏙,en,\nfr,🇫🇷,fr,\nit,🇮🇹,it,\npt,🇵🇹,pt,\nru,🇷🇺,ru,\nmo,🇲🆿,zh,hant\nin,🇮🇳,en,\n","region_text.csv":"region_id,lang,label,intro,warn,basis,sources,foot_src\ncn,zh,中国大陆,国内没有强制的材料代码国标，实际出图以本项目材料表图例（Material Legend）为唯一准绳。全国层面可对照的材料与灯具图例标准是 JGJ/T 244-2011《房屋建筑室内装饰装修制图标准》第 4 章「常用房屋建筑室内装饰装修材料和设备图例」，含 19 类材料图例（混凝土、钢筋混凝土、加气混凝土、水泥砂浆、石材、普通砖、饰面砖、木材、胶合板、细木工板、石膏板、硅钙板、矿棉板、玻璃、地毯、金属、金属网、纤维材料、防水材料）与 16 类灯具图例（筒灯、方形筒灯、射灯、调向射灯、单头／双头格栅射灯、导轨射灯、方形／条形日光灯盘、日光灯支架、暗藏发光灯带、吸顶灯、造型吊灯、壁灯、落地灯、地灯）。本表基准取自深圳《居住建筑室内装饰装修工程建筑信息模型设计交付标准》表 4.2.4 与各地精装施工图实例；DL、SP、SL、PL 是跨专业最易出错的四个代码。,同一代码在不同设计公司/项目可能含义不同，跨项目套用前必须先读该项目的 Material Legend。,中国内地没有强制的装饰材料代码国标，这套代码体系由各地住建标准、行业协会与设计单位在实务中逐步约定形成；全国性制图层面的共同依据是 JGJ/T 244-2011 的材料与设备图例，各地在其之上叠加地方细则（如福建省 DBJ/T 13-123-2010 的材料图例表与灯具图例表）。,JGJ/T 244-2011《房屋建筑室内装饰装修制图标准》（住建部公告第 1053 号，2012-03-01 实施）第 4 章常用房屋建筑室内装饰装修材料和设备图例 ; 福建省地方标准 DBJ/T 13-123-2010《建筑装饰装修工程设计制图标准》表 5.2.5 常用建筑装饰装修材料图例表与表 5.3.4 常用建筑装饰装修工程灯具图例表 ; 《居住建筑室内装饰装修工程建筑信息模型设计交付标准》（深圳）表 4.2.4 装饰材料代码表 ; GB/T 50325《住宅装饰装修工程施工规范》 ; GB 50210《建筑装饰装修工程质量验收标准》 ; 粤建质〔2009〕41号《住宅室内装饰装修工程质量验收规范》（广东省） ; JGJ/T 331《建筑室内装饰装修工程制图标准》；GB 8624《建筑材料及制品燃烧性能分级》,资料口径：基准取自 JGJ/T 244-2011《房屋建筑室内装饰装修制图标准》第 4 章材料与设备图例、福建省 DBJ/T 13-123-2010 的材料与灯具图例表，以及深圳《居住建筑室内装饰装修工程建筑信息模型设计交付标准》表 4.2.4，并结合 GB/T 50325、GB 50210、粤建质〔2009〕41号、JGJ/T 331 与 GB 8624 整理。\ncn,en,Mainland China,\"Mainland China has no mandatory national material-code standard, so drawings actually follow the project's own Material Legend. The one national reference for material and luminaire legends is JGJ/T 244-2011 Drawing standard for interior decoration and renovation of building, whose chapter 4 lists 19 material legends (concrete, reinforced concrete, aerated concrete, cement mortar, stone, common brick, facing brick, timber, plywood, blockboard, gypsum board, calcium silicate board, mineral wool board, glass, carpet, metal, metal mesh, fibrous materials, waterproof materials) and 16 luminaire legends (downlight, square downlight, spot, adjustable spot, single and double grid spot, track spot, square and strip light troffer, fluorescent batten holder, concealed light cove, ceiling light, decorative pendant, wall light, floor light, ground light). This table is based on table 4.2.4 of the Shenzhen BIM delivery standard and on local fit-out drawings; DL, SP, SL and PL are the four codes most often mixed up across disciplines.\",The same code may mean different things in different practices or projects: always read the project's own Material Legend before reusing it.,\"Mainland China has no mandatory decoration-material code standard: the system has grown by convention among local housing authorities, industry associations and design offices. The national drawing-level common denominator is the material and equipment legends of JGJ/T 244-2011, with provincial rules layered on top (such as the Fujian local standard DBJ/T 13-123-2010).\",\"JGJ/T 244-2011 Drawing standard for interior decoration and renovation of building (MOHURD Announcement No. 1053, in force 1 March 2012), chapter 4 material and equipment legends ; Fujian local standard DBJ/T 13-123-2010 Standard for building decoration engineering design drawing, table 5.2.5 material legends and table 5.3.4 luminaire legends ; the Shenzhen BIM delivery standard for residential interior decoration and renovation, table 4.2.4 decoration material code table ; GB/T 50325 Code for construction of residential decoration and renovation engineering ; GB 50210 Standard for quality acceptance of building decoration and renovation engineering ; Guangdong Yuejianzhi [2009] No. 41 ; JGJ/T 331 Standard for drawing of interior decoration engineering ; GB 8624 Classification of burning behaviour of building materials and products\",\"Sources: chapter 4 of JGJ/T 244-2011 (material and equipment legends), the material and luminaire legend tables of Fujian DBJ/T 13-123-2010, and table 4.2.4 of the Shenzhen BIM delivery standard, read together with GB/T 50325, GB 50210, Yuejianzhi [2009] No. 41, JGJ/T 331 and GB 8624.\"\ncn,ja,中国,中国内地には材料コードの強制的な国家規格がなく、実際の図面はプロジェクトごとの Material Legend に従う。材料と器具の凡例について全国で参照できる唯一の基準は JGJ/T 244-2011《房屋建築室内装飾装修製図標準》第 4 章「常用房屋建築室内装飾装修材料及び設備凡例」で、19 種の材料凡例（コンクリート、鉄筋コンクリート、凍石ブロック、水泥モルタル、石材、普通煉瓦、化粧煉瓦、木材、積層合板、集成材、石膏ボード、珪酸鈣板、鉱棉板、硝子、カーペット、金属、金属網、繊維材料、防水材料）と 16 種の器具凡例（ダウンライト、方形ダウンライト、スポット、調向スポット、1 灯／2 灯グリッドスポット、トラックスポット、方形／連続形直管灯器具、直管灯受け、埋込発光帯、シーリングライト、造型ペンダント、ウォールライト、フロアライト、埋込ライト）がある。本表は深圳の BIM 納品標準 表 4.2.4 と各地域の施工図実例を基準とし、DL・SP・SL・PL が部門をまたいで最も誤られやすい 4 コードである。,同じコードでも設計事務所・プロジェクトで意味が異なる場合があります。転用前に必ず当該プロジェクトの Material Legend を確認してください。,中国内地には装飾内装材料の強制的なコード国標がなく、この体系は各地域の住宅建設主管部門、業界団体、設計事務所が実務の中で段階的に取り決めた而成である。全国的な製図レベルの共通根拠は JGJ/T 244-2011 の材料・設備凡例であり、その上に各省の細則（福建省 DBJ/T 13-123-2010 の材料凡例表と器具凡例表など）が積み重なる。,JGJ/T 244-2011《房屋建築室内装飾装修製図標準》（住房都市建設部公告第 1053 号、2012 年 3 月 1 日施行）第 4 章 常用房屋建築室内装飾装修材料及び設備凡例 ; 福建省地方標準 DBJ/T 13-123-2010《建築装飾装修工程設計製図標準》表 5.2.5 常用建築装飾装修材料凡例表および表 5.3.4 常用建築装飾装修工程器具凡例表 ; 深圳《居住建築室内装飾装修工程建築情報モデル設計納品標準》表 4.2.4 装飾材料コード表 ; GB/T 50325《住宅装飾装修工程施工規範》 ; GB 50210《建築装飾装修工程質量驗収標準》 ; 粤建質〔2009〕41号《住宅室内装飾装修工程質量驗収規範》（広東省） ; JGJ/T 331《建築室内装飾装修工程製図標準》；GB 8624《建築材料及び製品の燃焼性能等級》,資料の根拠：JGJ/T 244-2011《房屋建築室内装飾装修製図標準》第 4 章の材料・設備凡例、福建省 DBJ/T 13-123-2010 の材料凡例表と器具凡例表、深圳の BIM 納品標準 表 4.2.4、ならびに GB/T 50325、GB 50210、粤建質〔2009〕41号、JGJ/T 331、GB 8624 を併せて整理したもの。\ncn,ko,중국 본토,\"중국 내에는 자재 코드의 강제 국표가 없으며, 실제 도면은 프로젝트별 Material Legend 를 따른다. 자재·설비 범례에 관해 전국적으로 참조할 수 있는 기준은 JGJ/T 244-2011 《房屋建筑室内装饰装修制图标准》 제 4 장 「常用房屋建筑室内装饰装修材料和设备图例」(자재·설비 범례)이며, 자재 범례 19종(콘크리트, 철근콘크리트, 기포 콘크리트, 시멘트 모르타르, 석재, 일반 벽돌, 마감 벽돌, 목재, 합판, 블록보드, 석고보드, 규산칼슘 보드, 미네랄울 보드, 유리, 카펫, 금속, 금속망, 섬유 재료, 방수 재료)과 조명 범례 16종(다운라이트, 사각 다운라이트, 스포트, 조정 스포트, 1등·2등 그리드 스포트, 트랙 스포트, 사각·일자형 매입등, 직관등 받침, 매입 발광 밴드, 천장등, 장식 펜던트, 월등, 플로어등, 매입등)이 담겨 있다. 본 표는 선전시의 BIM 인도 표준 표 4.2.4 와 각 지역 시공도 사례를 기준으로 하며, DL·SP·SL·PL 이 분야를 가로질러 가장 자주 혼동되는 네 코드다.\",\"동일한 코드라도 설계사무소·프로젝트에 따라 의미가 다를 수 있으므로, 다른 프로젝트에 적용하기 전 반드시 해당 프로젝트의 Material Legend를 확인하세요.\",\"중국 내에는 장식 마감자재 코드의 강제 국표가 없고, 이 체계는 각지의 지방 건설 주관 부서, 협회, 설계사무소가 실무에서 점진적으로 합의해 온 결과다. 전국 차원의 도면 기준은 JGJ/T 244-2011 의 자재·설비 범례이며, 그 위에 성(省) 단위의 세칙(예: 푸젠성 DBJ/T 13-123-2010 의 자재·조명 범례표)이 얹힌다.\",\"JGJ/T 244-2011《房屋建筑室内装饰装修制图标准》(住房和城乡建设부 공고 제 1053 호, 2012-03-01 시행) 제 4 장 「常用房屋建筑室内装饰装修材料和设备图例」(자재·설비 범례) ; 푸젠성 지방표준 DBJ/T 13-123-2010《建筑装饰装修工程设计制图标准》 표 5.2.5 常用建筑装饰装修材料图例表 및 표 5.3.4 常用建筑装饰装修工程灯具图例表 ; 《居住建筑室内装饰装修工程建筑信息模型设计交付标准》(선전시) 표 4.2.4 装饰材料代码表 ; GB/T 50325《住宅装饰装修工程施工规范》 ; GB 50210《建筑装饰装修工程质量验收标准》 ; 粤建质〔2009〕41号《住宅室内装饰装修工程质量验收规范》(광둥성) ; JGJ/T 331《建筑室内装饰装修工程制图标准》；GB 8624《建筑材料及制品燃烧性能分级》\",\"자료 출처: JGJ/T 244-2011《房屋建筑室内装饰装修制图标准》 제 4 장 자재·설비 범례, 푸젠성 DBJ/T 13-123-2010 의 자재·조명 범례표, 선전시의 BIM 인도 표준 표 4.2.4, 그리고 GB/T 50325, GB 50210, 粤建质〔2009〕41号, JGJ/T 331, GB 8624 을 함께 정리한 것.\"\ncn,es,China continental,\"En China continental no existe una norma nacional obligatoria de códigos de material, de modo que los planos siguen en la práctica la Material Legend de cada proyecto. La única referencia nacional para las leyendas de materiales y luminarias es el JGJ/T 244-2011 Standard for drawing of interior decoration and renovation of building, cuyo capítulo 4 recoge 19 leyendas de material (hormigón, hormigón armado, hormigón celular, mortero de cemento, piedra, ladrillo común, ladrillo de acabado, madera, contrachapado, tablero de listones, placa de yeso, placa de silicato de calcio, placa de lana mineral, vidrio, moqueta, metal, malla metálica, materiales fibrosos, materiales de impermeabilización) y 16 leyendas de luminaria (downlight, downlight cuadrado, foco, foco orientable, foco de rejilla simple y doble, foco de carril, plafón cuadrado y de tira, portalámparas de fluorescente, Cove de luz oculta, plafón, colgante decorativo, aplique de pared, lámpara de pie y empotrable en suelo). Esta tabla toma como base la tabla 4.2.4 del estándar de entrega BIM de Shenzhen y los planos de decoración local; DL, SP, SL y PL son los cuatro códigos que más se confunden entre disciplinas.\",El mismo código puede significar cosas distintas según el estudio o el proyecto: lea siempre la leyenda de materiales del proyecto antes de reutilizarlo.,\"China continental carece de norma nacional obligatoria de códigos de materiales de decoración: el sistema se ha ido Consolidando por convención entre las autoridades de vivienda locales, las asociaciones del sector y las oficinas de diseño. El denominador común a nivel nacional de dibujo son las leyendas de materiales y equipos de JGJ/T 244-2011, sobre las que se superponen las reglas provinciales (como las tablas de leyendas de materiales y luminarias de la norma local de Fujian DBJ/T 13-123-2010).\",\"JGJ/T 244-2011 Standard for drawing of interior decoration and renovation of building (MOHURD Announcement No. 1053, in force 1 March 2012), capítulo 4 con las leyendas de materiales y equipos ; norma local de Fujian DBJ/T 13-123-2010, tabla 5.2.5 de leyendas de materiales y tabla 5.3.4 de leyendas de luminarias ; estándar de entrega BIM de Shenzhen para decoración de interiores residenciales, tabla 4.2.4 ; GB/T 50325 ; GB 50210 ; Yuejianzhi [2009] No. 41 de Guangdong ; JGJ/T 331 ; GB 8624\",\"Fuentes: capítulo 4 de JGJ/T 244-2011 (leyendas de materiales y equipos), las tablas de leyendas de materiales y luminarias de DBJ/T 13-123-2010 de Fujian y la tabla 4.2.4 del estándar de entrega BIM de Shenzhen, leídos junto con GB/T 50325, GB 50210, Yuejianzhi [2009] No. 41, JGJ/T 331 y GB 8624.\"\nhk,zh,中国香港,香港工程图例多用英式英文与粤语习惯术语：亚加力（Acrylic）、家私、地胶、胶片、发纹；石材金属常用 MTL／ALU／GYB／TIL 等较长缩写，假天花（False Ceiling）与防火门（Fire Door）亦属常见项目。以本项目 Material Legend 为准。,香港项目多用较长的英式缩写与粤语行话，同一字母在不同顾问公司之间含义可不同（LT 既可指照明，也可指灯槽）。跨项目套用前，必须先读该项目的 Material Legend。,香港没有统一的装饰材料代码规范，材料表图例由发展商、总承建商与设计顾问按屋宇署装修工程指引与消防条例的实务要求自行编制。,屋宇署《住宅装修工程指引》（Code of Practice for Renovation of Residential Premises） ; 屋宇署《办公室装修工程实务指引》（Code of Practice for Office Renovation） ; 《消防安全（商业处所）规例》（Cap. 502F）及《防火（处所）规例》 ; BS EN 14411《陶瓷砖——定义、规格与标记》、BS 8300《住宅装修工程实务与性能》 ; 香港测量师学会与香港室内设计协会的图则及材料表惯例（粤语术语：亚加力、家私、地胶、胶片、发纹）,资料口径：按屋宇署《住宅装修工程指引》《办公室装修工程实务指引》、Cap. 502F《消防安全（商业处所）规例》，以及 BS EN 14411、BS 8300 等英式标准与港式材料表惯例整理。\nhk,en,\"Hong Kong, China\",\"Hong Kong drawings lean on British English and Cantonese trade terms: acrylic (亚加力), furniture (家私), vinyl flooring (地胶), light diffusers (胶片) and hairline (发纹). Longer abbreviations such as MTL, ALU, GYB and TIL are common, and false ceilings (假天花) and fire doors (防火门) appear as standard items. The project's Material Legend still rules.\",\"Hong Kong drawings favour longer British abbreviations and Cantonese trade terms, and the same letters can differ between consultants (LT may mean luminaires or light trunk). Read the project's own Material Legend before reusing any code.\",\"Hong Kong has no unified decoration-code standard: material legends are drawn up by developers, main contractors and consultants against the Buildings Department renovation codes and fire-safety ordinances.\",\"Buildings Department — Code of Practice for Renovation of Residential Premises ; Buildings Department — Code of Practice for Office Renovation ; Fire Safety (Commercial Premises) Ordinance (Cap. 502F) and Fire Safety (Places) Regulations ; BS EN 14411 Ceramic tiles — Definitions, specifications and marking; BS 8300 Code of practice for renovation of residential dwellings ; Common practice of HK surveyors' and HKIDA drawing offices (Cantonese terms: 亚加力 acrylic, 家私 furniture, 地胶 vinyl, 胶片 diffuser, 发纹 hairline)\",\"Sources: the Buildings Department renovation codes (residential and office), the Fire Safety (Commercial Premises) Ordinance Cap. 502F, plus BS EN 14411, BS 8300 and common HK schedule practice.\"\nhk,ja,中国香港,香港の図面はイギリス英語と広東語の商用語を好む：アクリル（亞加力）、傢俬、塩ビ床材（地膠）、ライトパネル（膠片）、ヘアライン（髮紋）。MTL／ALU／GYB／TIL といった長め，略称が一般的で、假天花（False Ceiling）や防火門（防火門）も通常の項目。基準は当該プロジェクトの Material Legend。,香港の図面は長い英式略称と広東語の行語を好み、同じ英字が設計顾问社ごとに意味が異なること（LT は照明器具にも燈槽にもあたる）があります。転用前に必ず当該プロジェクトの Material Legend を確認してください。,香港には統一された装飾材料コードの規範がなく、材料表図例は開発者・ゼネコン・設計顾问が屋宇署の改修工事指针と消防条例の实务要求に沿って自行作成する。,屋宇署《住宅改装工事指针》（Code of Practice for Renovation of Residential Premises） ; 屋宇署《事务室改装工事实务指针》（Code of Practice for Office Renovation） ; 《火災安全（商業場所）規例》（Cap. 502F）、《火災安全（場所）規例》 ; BS EN 14411《セラミックタイル―定義・規格・表示》、BS 8300《住宅改装工事の实务と性能》 ; 香港測量師学会と香港インテリアデザイン協会、図則・材料表の慣行（広東語用語：亞加力、傢俬、地膠、膠片、髮紋）,資料の口径：屋宇署《住宅改装工事指针》《事務室改装工事实务指针》、Cap. 502F《火災安全（商業場所）規例》、および BS EN 14411、BS 8300 等の英式標準と香港の材料表慣行に基づき整理。\nhk,ko,중국 홍콩,\"홍콩 도면은 영국식 영어와 광둥어 관용어를 즐겨 씁니다: 아크릴(亞加力), 가구(傢俬), 비닐 바닥재(地膠), 조명 디퓨저(膠片), 헤어라인(髮紋). MTL·ALU·GYB·TIL 처럼 긴 약어가 흔하며, 천장(假天花)·방화문(防火門)도 흔한 항목입니다. 기준은 해당 프로젝트의 Material Legend입니다.\",홍콩 도면은 긴 영식 약어와 광둥어 관용어를 선호하며 같은 영문이 컨설턴트마다 의미가 다를 수 있습니다(LT는 조명기구이자 燈槽). 적용 전 반드시 해당 Material Legend를 확인하세요.,\"홍콩에는 통일된 장식 재료 코드 규범이 없으며, 재료표 범례는 발주사·총承包·설계 컨설턴트가屋宇署의 보수 공사 지침과 화재 안전 조례 실무 요건에 따라 자체 작성한다.\",\"屋宇署 《주거裝修工事 지침》(Code of Practice for Renovation of Residential Premises) ; 屋宇署 《업소裝修工事 실무지침》(Code of Practice for Office Renovation) ; 《화재안전(상업적 장소) 조례》(Cap. 502F) 및 《소방(장소) 규칙》 ; BS EN 14411 세라믹 타일 — 정의·규격·표시, BS 8300 주거 개축 공사 실무와 성능 ; 홍콩 측량사 학회와 HKIDA의 도면·재료표 관행(광둥어 용어: 亞加力, 傢俬, 地膠, 膠片, 髮紋)\",\"자료 근거:屋宇署 《주거裝修工事 지침》《업소裝修工事 실무지침》, Cap. 502F 「화재안전(상업적 장소) 조례」, 그리고 BS EN 14411, BS 8300 등 영식 표준과홍콩식 재료표 관행에 따라 정리했다.\"\nhk,es,Hong Kong (China),\"Los planos de Hong Kong apuntan al inglés británico y a los términos de oficio de Cantón: acrílico (亚加力), mobiliario (家私), suelo de vinilo (地胶), difusores (胶片) y cepillado (发纹). Son habituales las abreviaturas largas (MTL, ALU, GYB, TIL) y el falso techo (假天花) y las puertas cortafuegos (防火门). Mandará la leyenda de materiales del proyecto.\",\"Los planos de Hong Kong prefieren abreviaturas británicas largas y términos de Cantón, y las mismas letras cambian entre consultores (LT puede ser luminarias o light trunk). Lea la leyenda de materiales del proyecto antes de reutilizar.\",\"Hong Kong no tiene norma unificada de códigos de decoración: cada promotor, contratista y consultor redacta su leyenda según las directrices de reforma del Buildings Department y las ordenanzas de seguridad contra incendios.\",\"Buildings Department — Código de práctica para reforma de viviendas ; Buildings Department — Código de práctica para reforma de locales de oficina ; Ordenanza de Seguridad contra Incendios (Locales Comerciales) Cap. 502F y Reglamentos de Seguridad contra Incendios (Recintos de Stromidad) ; BS EN 14411 Baldosas cerámicas — Definiciones, especificaciones y marcado; BS 8300 Código de práctica para reforma de viviendas ; Práctica habitual de los estudios de Hong Kong (topógrafos) y HKIDA, con términos de Cantón: 亚加力 acrílico, 家私 mobiliario, 地胶 vinilo, 胶片 difusor, 发纹 cepillado\",\"Fuentes: las directrices de reforma del Buildings Department (residencial y oficinas), la Ordenanza de Seguridad contra Incendios Cap. 502F, además de BS EN 14411, BS 8300 y la práctica habitual de Hong Kong.\"\ntw,zh,中国台湾,台湾图例以繁体中文搭配行业英文缩写为主：压克力、人造石、石英砖、美耐板、系统橱柜、灯具 LT／筒灯 DL 分工明确，防火板常写 FP、壁纸壁布常写 WC。以本项目 Material Legend 为准。,台湾地区同一缩写常见不同义（MR 可指大理石 Marble，也可指镜面 Mirror）；跨项目套用前，必须先读该项目的 Material Legend。,台湾地区的材料代码由建筑与室内设计事务所自行订定，技术依据以内政部建筑法规与 CNS 国家标准为准。,内政部《建筑技术规则》 ; 内政部《建筑物室内设计与装修规范》 ; CNS 国家标准：CNS 1527《陶瓷砖》、CNS 6475《塑胶地板》、CNS 4299《玻璃》相关标准 ; 台湾室内设计协会与建材厂商的材料表格式惯例（美耐板、系统橱柜、轻钢龙骨等）,资料口径：按内政部《建筑技术规则》《建筑物室内设计与装修规范》、CNS 1527／6475／4299 等国家标准，并按台湾设计事务所材料表惯例整理。\ntw,en,\"Taiwan, China\",\"Taiwanese drawings pair traditional Chinese with trade abbreviations: 压克力, 人造石, 石英砖, 美耐板 and 系统橱柜. Lighting is split as LT for fixtures and DL for downlights, laminate is often FP, and wall coverings WC. The project's Material Legend still rules.\",\"In Taiwan, China the same abbreviation often carries two meanings (MR may be Marble or Mirror); always read the project's own Material Legend before reusing a code.\",\"In Taiwan, China the codes are set by each architecture and interior practice, with the Ministry of the Interior's building regulations and CNS national standards as the technical basis.\",\"Ministry of the Interior — Code for Construction Standards (建筑技术规则) ; Ministry of the Interior — Code Governing Interior Design and Decoration of Buildings ; CNS national standards: CNS 1527 Ceramic tiles, CNS 6475 Plastic floor coverings, CNS 4299 Glass ; Practice of Taiwan interior design associations and material suppliers (美耐板 compact laminate, 系统橱柜 fitted joinery, 轻钢龙骨 light-gauge steel studs)\",\"Sources: the Ministry of the Interior's Building Code and interior-decoration rules, CNS standards (1527, 6475, 4299) and Taiwan practice for material schedules.\"\ntw,ja,中国台湾,台湾の図例は繁体字中国語と業界略称の組み合わせ：壓克力、人造石、石英磚、美耐板、系統櫥櫃。照明は LT＝照明器具、DL＝ダウンライトと明確に分担し、化粧ボードは FP、壁紙・壁布は WC。基準は当該プロジェクトの Material Legend。,台湾地区では同じ略称が二つの意味を持つことが多い（MR は Marble にも Mirror にも当たります）。転用前に必ず当該プロジェクトの Material Legend を確認してください。,台湾地区では建築・インテリア事務所が個々に略称を設定し、技術的根拠は内政部の建築法規と CNS 国家標準による。,内政部《建築技術規則》 ; 内政部《建築物室內設計與裝修規範》 ; CNS 国家標準：CNS 1527《セラミックタイル》、CNS 6475《プラスチック床材》、CNS 4299《ガラス》 ; 台湾のインテリアデザイン協会と建材メーカーの材料表の慣行（美耐板、系統櫥櫃、輕鋼龍骨など）,資料の口径：内政部《建築技術規則》《建築物室內設計與裝修規範》、CNS 1527／6475／4299 等の国家標準、および台湾の設計事務所における材料表の慣行に基づき整理。\ntw,ko,중국 대만,\"대만 도면은 번체 중국어와 업계 약칭의 결합입니다: 壓克力, 人造石, 石英磚, 美耐板, 系統櫥櫃. 조명은 LT=조명기구, DL=다운라이트로 명확히 나뉘며, 합판은 FP, 벽지는 WC로 표기합니다. 기준은 해당 프로젝트의 Material Legend입니다.\",대만(중국)에서는 같은 약어가 두 가지 의미로 쓰이는 경우가 많습니다(MR이 Marble일 수도 Mirror일 수도). 적용 전 반드시 해당 Material Legend를 확인하세요.,\"대만(중국)에서는 건축·인테리어 사무소가 각자의 코드를 정하며, 기술 근거는 내정부 건축 법규와 CNS 국가 표준이다.\",\"내정부 《建築技術規則》 ; 내정부 《建築物室內設計與裝修規範》 ; CNS 국가 표준: CNS 1527 세라믹 타일, CNS 6475 플라스틱 바닥재, CNS 4299 유리 ; 대만(중국) 인테리어 디자인 협회와 자재 업체의 재료표 관행(美耐板, 系統櫥櫃, 輕鋼龍骨 등)\",\"자료 근거: 내정부 「建築技術規則」「建築物室內設計與裝修規範」, CNS 1527·6475·4299 등 국가 표준, 그리고 대만(중국) 설계사무소 재료표 관행에 따라 정리했다.\"\ntw,es,Taiwán (China),\"Los planos de Taiwán combinan chino tradicional con abreviaturas del sector: 压克力, 人造石, 石英砖, 美耐板, 系统橱柜. La iluminación se reparte como LT (luminarias) y DL (downlights); el laminado suele ser FP y el revestimiento mural WC.\",En Taiwán (China) la misma abreviatura suele tener dos significados (MR puede ser Marble o Mirror); lea la leyenda de materiales del proyecto antes de reutilizar.,\"En Taiwán (China) cada estudio de arquitectura e interior fija sus códigos, con los reglamentos de construcción del Ministerio del Interior y las normas CNS como base técnica.\",\"Ministerio del Interior — Código de estándares de construcción (建筑技术规则) ; Ministerio del Interior — Norma de diseño interior y decoración de edificios ; Normas nacionales CNS: CNS 1527 Baldosas cerámicas, CNS 6475 Revestimientos de suelo plásticos, CNS 4299 Vidrio ; Práctica de las asociaciones de diseño interior y proveedores de materiales (美耐板 compacto, 系统橱柜 carpintería a medida, 轻钢龙骨 perfiles de acero ligero)\",\"Fuentes: el Código de construcción y la norma de decoración de interiores del Ministerio del Interior, las normas CNS (1527, 6475, 4299) y la práctica de los cuadros de materiales en Taiwán (China).\"\njp,zh,日本,日本图例以日文建材名加罗马字缩写为主：クロス（壁纸）、化妆ボード、增强石膏ボード（GB）、集成材、轻量铁骨（LGS）、サッシ（SS）；照明常写 LT（照明器具）与 DL（ダウンライト）。以本项目 Material Legend 为准。,日本工程多以日文建材名加罗马字缩写标注，DL 可指 Downlight，也可指下地；英日两套缩写常常混用。套用前必须先读该项目的材料表（材料表／仕様表）。,日本无统一的装饰材料代码国标，图面多以日文建材名为主、罗马字缩写为辅，并广泛采用 Integrated-CAD（建筑 BIM）统一建材记法。,JIS A 5905《内装用合成树脂板及塑胶地板》、JIS A 5908 ; 国土交通省“住宅性能表示制度”与《建筑基准法》相关告示 ; Integrated-CAD（建筑 BIM 推进会议）建材信息标准化：同一建材在各专业图纸上的记法统一 ; 日本建筑学会 标准设计书（JASS）与《建筑施工标准图》,资料口径：按 JIS A 5905／5908 等日本标准、国土交通省“住宅性能表示制度”与建筑基准法告示、Integrated-CAD 建材信息标准化，以及日本建筑学会标准设计书（JASS）与建筑施工标准图整理。\njp,en,Japan,\"Japanese drawings read as Japanese trade names plus roman abbreviations: kurosu for wallpaper, shitsu kabe for gypsum board, sekai zai for laminated timber, LGS for light-gauge steel and sashi for aluminium sash. Lighting is often LT for fixtures and DL for downlights. The project's Material Legend rules.\",\"Japanese projects label materials with Japanese trade names plus roman abbreviations, and DL may mean downlight or lining; English and Japanese codes often coexist. Read the project's own material schedule before reuse.\",\"Japan has no national code for decoration materials: drawings lean on Japanese trade names with roman abbreviations as support, and the Integrated-CAD (building BIM) material naming is widely adopted.\",JIS A 5905 Decorative polymer boards and PVC floor sheets for interior use; JIS A 5908 ; MLIT — Housing Performance Indicator System and Building Standards Act notifications ; Integrated-CAD (building BIM council) — standardisation of material information so the same product is named alike across disciplines ; Architectural Institute of Japan — Standard Design Documents (JASS) and Architectural Construction Standard Drawings,\"Sources: Japanese Standards such as JIS A 5905/5908, MLIT's Housing Performance Indicator System and Building Standards Act notices, Integrated-CAD material-information standardisation, and the AIJ Standard Design Documents (JASS).\"\njp,ja,日本,日本の図例は和文の建材名にローマ字略称を添える形：クロス（壁紙）、化粧ボード、強化石膏ボード（GB）、集成材、軽鉄骨（LGS）、サッシ（SS）。照明は LT＝照明器具、DL＝ダウンライトと書かれることが多い。基準は当該プロジェクトの Material Legend。,日本の案件は和文の建材名にローマ字略称を添えて記載し、DL はダウンライトにも下地にも当たります。英字と和文の略称が混在するため、転用前に必ず当該プロジェクトの材料表を確認してください。,日本には装飾材料コードの国家規範がなく、図面は和文の建材名を主、ローマ字略称を従とする。またIntegrated-CAD（建築 BIM）の建材情報標準化も普及している。,JIS A 5905《内装用合成樹脂ボード・塩ビシート》、JIS A 5908 ; 国土交通省「住宅性能表示制度」及び《建築基準法》関連告示 ; Integrated-CAD（建築 BIM 推進会議）建材情報の標準化：同じ建材を各専門図で同じ呼び方にする ; 日本建築学会 標準設計書（JASS）、建築施工標準図,資料の口径：JIS A 5905／5908 等の日本標準、国土交通省「住宅性能表示制度」及び建築基準法の告示、Integrated-CAD の建材情報標準化、日本建築学会の標準設計書（JASS）と建築施工標準図に基づき整理。\njp,ko,일본,\"일본 도면은 일본어 시공재 명칭에 로마자 약호를 붙이는 방식입니다: 크로스(벽지), 화장 보드, 강화 석고보드(GB), 적층 목재, 경량 철골(LGS), 새시(SS). 조명은 LT=조명기구, DL=다운라이트로 표기합니다.\",일본 현장은 일본어 시공재 명칭에 로마자 약호를 붙이며 DL은 다운라이트에도下地에도 적용됩니다. 영문·일본어 약어가 섞이므로 적용 전 반드시 해당 프로젝트의 재료표를 확인하세요.,\"일본에는 장식 재료 코드의 국가 규범이 없고, 도면은 일본어 시공재 명칭을 중심으로 로마자 약어를 보조적으로 쓰며, Integrated-CAD(건축 BIM)建材 정보 표준화도 널리 쓰인다.\",\"JIS A 5905 내장용 합성수지 보드·염비 시트, JIS A 5908 ; 국토교통부 「주택성능 표시제도」 및 「건축기준법」 관련 고시 ; Integrated-CAD(건축 BIM 추진 회의)建材 정보 표준화: 동일 부재를 전공 도면에서 동일하게 표기 ; 일본건축학회 표준 설계서(JASS)와 건축 시공 표준도\",\"자료 근거: JIS A 5905·5908 등 일본 표준, 국토교통부 「주택성능 표시제도」와 건축기준법 고시, Integrated-CAD 建材 정보 표준화, 일본건축학회 표준 설계서(JASS)와 건축 시공 표준도에 따라 정리했다.\"\njp,es,Japón,\"Los planos japoneses combinan nombres japoneses de material con abreviaturas romanas: kurosu (papel pintado), shitsu kabe (placa de yeso), sekai zai (madera laminada), LGS (perfil ligero) y sashi ( carpintería de aluminio). La iluminación suele ser LT para luminarias y DL para downlights.\",\"En Japón los materiales se rotulan con nombres japoneses y abreviaturas romanas, y DL puede ser downlight o lining; conviven códigos en inglés y japonés. Lea el cuadro de materiales del proyecto antes de reutilizar.\",\"Japón no tiene norma nacional de materiales: los planos usan nombres japoneses de material con abreviaturas romanas de apoyo, y la normalización Integrated-CAD (BIM de construcción) está extendida.\",JIS A 5905 Tableros decorativos de polímero y pavimentos de PVC para interior; JIS A 5908 ; MLIT — Sistema de Indicadores de Rendimiento de la Vivienda y notificaciones de la Ley de Estándares de Construcción ; Integrated-CAD (consejo de BIM de construcción) — normalización de la información de materiales para nombrar igual el mismo producto en todas las specialties ; Architectural Institute of Japan — Documentos de Diseño Estándar (JASS) y planos estándar de construcción,\"Fuentes: normas japonesas como JIS A 5905/5908, el Sistema de Indicadores de Rendimiento de la Vivienda del MLIT y sus notificaciones, la normalización Integrated-CAD y los Documentos de Diseño Estándar (JASS) del AIJ.\"\nkr,zh,韩国,韩国图例以韩文材料名配罗马字缩写：석재（SR）、타일（TL）、석고보드（PS）、인공석（AS）、벽돌（BR）、단열재（INS）；照明多写 SL（스포트）、SP（스페셜 페인트）。以本项目 Material Legend 为准。,韩国项目同一缩写在不同公司之间含义可能不同（SB 在旧体系指乳胶漆，新体系指不锈钢），英韩缩写并存。套用前必须先读该项目的材料表。 2026 年起 KS 认证制度改革与 K-ETS 第四阶段（2026–2030）实施，随材料进场的 KS 证书与 EPD／碳足迹声明成为验收必查项，套用本表前先确认供货方能否提供。,韩国无强制的装饰材料代码规范，材料表以设计事务所与施工方自订为主，技术依据为 KS 韩国标准与国家建设标准（KCS/ECS）。 2026 年的 KS 认证制度改革与 K-ETS 第四阶段（2026–2030）把材料合规从“进场抽检”推到“文件先行”。,KS 韩国产业标准：KS F 2271《建筑材料试验方法》、KS M 3802《弹性地板》、KS F 3200《地板材料》 ; KCS / ECS《建筑工事标准规格书》（国家建设标准中心） ; 国土交通部《建筑标准规范》建筑工事篇（内线/配管/精装各章） ; 韩国室内建筑学会与施工企业的材料表惯例（以英文缩写为主，辅以韩文材料名） ; KS Q 8001:2024《产品认证一般要求》（2024-10-31 实施） ; 2026 年 2 月 KS 认证制度改革（新增“故意不合格即撤销”“单一产品检验”制度，调查范围扩及仿冒标志） ; K-ETS 第四阶段（2026–2030）碳约束：建筑部门纳入减排范围，G-SEED 以 EPD 计分,资料口径：按 KS 韩国产业标准（KS F 2271、KS M 3802、KS F 3200）、KCS／ECS《建筑工事标准规格书》、国土交通部《建筑标准规范》，以及韩国设计事务所与施工方材料表惯例整理。 2026 年部分另按 KS Q 8001:2024 与 KS 认证制度改革口径补充。\nkr,en,South Korea,\"Korean schedules pair Hangul names with roman abbreviations: seokjae for stone (SR), tail for tile (TL), seogobodeu for gypsum board (PS), ingongseok for engineered stone (AS), byeokdol for brick (BR) and insulation (INS). Lighting often uses SL for spot and SP for special paint. The project's Material Legend rules.\",\"In Korean projects the same abbreviation can differ between firms (SB may be emulsion paint in older systems and stainless steel in newer ones), with English and Korean codes in parallel. Read the project's own material schedule before reuse. Since 2026 the KS certification reform and phase 4 of K-ETS (2026–2030) make the KS certificate and the EPD / carbon footprint declaration mandatory items at site acceptance; check before reusing this table that the supplier can provide them.\",\"South Korea has no mandatory decoration-code rule: schedules are mostly drawn up by studios and contractors, against KS Korean standards and the national construction standards (KCS/ECS). The 2026 reform of the KS certification system and phase 4 of K-ETS (2026–2030) shift material compliance from sampling on site to documentation first.\",\"KS Korean standards: KS F 2271 Test methods for building materials, KS M 3802 Rubber floor coverings, KS F 3200 Floor coverings ; KCS / ECS Standard Specifications for Construction Works (National Construction Standards Center) ; MOLIT Building Code — construction chapters (interior, electrical, plumbing) ; Practice of Korean interior institutes and contractors: English abbreviations with Korean material names alongside ; KS Q 8001:2024 General requirements for product certification (in force 2024-10-31) ; Reform of the KS certification system, February 2026 (revocation for deliberate non-compliance, single-product inspection, wider traceability of counterfeit marks) ; K-ETS phase 4 (2026–2030): buildings inside the emission cap, EPD scores under G-SEED\",\"Sources: KS Korean standards (KS F 2271, KS M 3802, KS F 3200), the KCS/ECS Standard Specifications for Construction Works, the MOLIT Building Code and Korean studio/contractor schedule practice. The 2026 additions follow KS Q 8001:2024 and the reformed KS certification rules.\"\nkr,ja,韓国,韓国の凡例はハングル名称にローマ字略称：石材 SR、タイル TL、石膏ボード PS、人工石 AS、煉瓦 BR、断熱材 INS。照明は SL（スポット）、SP（特殊塗料）が多い。基準は当該プロジェクトの Material Legend。,韓国の案件では同じ略称が会社ごとに意味が異なり（SB は旧体系ではラテックス塗装、新体系ではステンレス）、英字とハングルの略称が併存します。転用前に必ず当該プロジェクトの材料表を確認してください。 2026 年の KS 認証制度改革と K-ETS 第 4 フェーズ（2026–2030）により、KS 証明書と EPD／炭素足跡の宣言が材料引渡し時の検査項目になりました。本表を流用する前に、供給者が提出できるか確認してください。,韓国には強制的な装飾材料コードの規範がなく、材料表は設計事務所と施工側の自訂が主で、技術的根拠は KS 韓国標準と国家建設標準（KCS/ECS）。 2026 年の KS 認証制度改革と K-ETS 第 4 フェーズ（2026–2030）は、材料コンプライアンスを「現場でサンプリング」から「書類先行」に変えました。,KS 韓国産業標準：KS F 2271《建築材料試験方法》、KS M 3802《弾性床材》、KS F 3200《床材》 ; KCS / ECS《建築工事標準仕様書》（国家建設基準センター） ; 国土交通部《建築基準規範》建築工事編（内装・電気・配管） ; 韓国のインテリア建築学会と施工企業の材料表の慣行（英字略称を主とし、韩文材料名を併記） ; KS Q 8001:2024《製品認証の一般要求》（2024-10-31 発効） ; 2026 年 2 月の KS 認証制度改革（意図的な不合格の取消根拠の追加、単一製品検査制度、偽造マークの調査範囲拡大） ; K-ETS 第 4 フェーズ（2026–2030）：建築部門が排出枠対象となり、G-SEED では EPD が評価点になる,資料の口径：KS 韓国産業標準（KS F 2271、KS M 3802、KS F 3200）、KCS／ECS《建築工事標準仕様書》、国土交通部《建築基準規範》、および韓国の設計事務所・施工側の材料表慣行に基づき整理。 2026 年分の追記は KS Q 8001:2024 と改正後の KS 認証制度に依拠しています。\nkr,ko,대한민국,\"한국 도면은 한글 재료명과 로마자 약호를 결합합니다: 석재 SR, 타일 TL, 석고보드 PS, 인공석 AS, 벽돌 BR, 단열재 INS. 조명은 SL(스포트), SP(특수 도료)를 쓰는 경우가 많습니다. 기준은 해당 프로젝트의 Material Legend입니다.\",\"한국 현장에서는 같은 약어가 회사마다 달라질 수 있고(SB이 구 체계에서는 라텍스 페인트, 신 체계에서는 스테인리스) 영문·한글 약어가 병존합니다. 적용 전 반드시 해당 프로젝트의 재료표를 확인하세요. 2026 년부터 KS 인증 제도 개편과 K-ETS 4단계(2026–2030)가 시행되면서 KS 인증서와 EPD／탄소발자국 선언이 자재 반입 검수 필수 항목이 되었습니다. 이 표를 적용하기 전에 납품업체가 제출할 수 있는지 먼저 확인하십시오.\",\"한국에는 강제되는 장식 재료 코드 규범이 없어 재료표는 설계사무소와 시공 측의 자체 정의가 중심이며, 기술 근거는 KS 한국 표준과 국가건설기준(KCS/ECS)이다. 2026 년 KS 인증 제도 개편과 K-ETS 4단계(2026–2030)는 자재 적합성 확인을 ‘현장 샘플링’에서 ‘서류 우선’으로 바꾸었습니다.\",\"KS 한국 산업표준: KS F 2271 건축 재료 시험방법, KS M 3802 탄성 바닥재, KS F 3200 바닥재 ; KCS / ECS 「건축공사 표준시방서」(국가건설기준센터) ; 국토교통부 「건축기준규범」 건축공사 편(내장·전기·배관) ; 한국 인테리어 건축학회와施工企业의 재료표 관행(영문 약어를 중심으로 한글 재료명을 병기) ; KS Q 8001:2024《제품 인증 일반 요구사항》(2024-10-31 시행) ; 2026 년 2 월 KS 인증 제도 개편(고의적 부적합 즉시 취소 근거 추가, 단일 제품 검사制度, 위조 표시 조사 범위 확대) ; K-ETS 4단계(2026–2030): 건축 부문을 배출권 대상에 포함, G-SEED 에서 EPD 로 평가\",\"자료 근거: KS 한국 산업표준(KS F 2271, KS M 3802, KS F 3200), KCS·ECS 「건축공사 표준시방서」, 국토교통부 「건축기준규범」, 그리고 한국 설계사무소·시공 측 재료표 관행에 따라 정리했다. 2026 년 추가 내용은 KS Q 8001:2024 와 개정된 KS 인증 제도에 따릅니다.\"\nkr,es,Corea del Sur,\"Los cuadros coreanos combinan nombres en hangul con abreviaturas romanas: SR para piedra, TL para baldosa, PS para placa de yeso, AS para piedra artificial, BR para ladrillo e INS para aislamiento. En iluminación se usan SL para el foco y SP para la pintura especial.\",\"En Corea la misma abreviatura puede variar entre firmas (SB puede ser pintura plástica en sistemas antiguos y acero inoxidable en los nuevos), con códigos ingleses y coreanos en paralelo. Lea el cuadro de materiales del proyecto. Desde 2026, la reforma de la certificación KS y la fase 4 del K-ETS (2026–2030) convierten el certificado KS y la declaración EPD / huella de carbono en requisitos de aceptación en obra; compruébelo antes de reutilizar esta tabla.\",\"Corea del Sur no tiene norma obligatoria de códigos: los cuadros los redactan estudios y contratistas, con las normas KS y los estándares nacionales de construcción (KCS/ECS) como base. La reforma de 2026 de la certificación KS y la fase 4 del K-ETS (2026–2030) trasladan el cumplimiento del material del muestreo en obra a la documentación previa.\",\"Normas coreanas KS: KS F 2271 Métodos de ensayo de materiales de construcción, KS M 3802 Revestimientos de suelo elásticos, KS F 3200 Revestimientos de suelo ; KCS / ECS Especificaciones Estándar de Obras (Centro Nacional de Estándares de Construcción) ; MOLIT Código de Construcción — capítulos de ejecución (interiores, electricidad, fontanería) ; Práctica de los institutos de arquitectura de interiores y contratistas coreanos: abreviaturas en inglés con nombres de material en coreano ; KS Q 8001:2024 Requisitos generales para la certificación de productos (en vigor desde 2024-10-31) ; Reforma del sistema de certificación KS, febrero de 2026 (revocación por no conformidad deliberada, inspección de producto único, rastreo ampliado de marcas falsificadas) ; K-ETS fase 4 (2026–2030): el sector de la construcción entra en el cupo de emisiones y el G-SEED puntúa la EPD\",\"Fuentes: normas coreanas KS (KS F 2271, KS M 3802, KS F 3200), las Especificaciones Estándar KCS/ECS, el Código de Construcción del MOLIT y la práctica coreana de cuadros de materiales. Las añadiciones de 2026 siguen la KS Q 8001:2024 y la certificación KS reformada.\"\nwest,zh,欧美（美/英/欧）,\"欧美图例以英文全称为准，常用 Gypsum Board、Acoustic Ceiling Tile、VCT/LVP、MDF、WBP 等缩写；灯具分 Luminaire（LT）与 Downlight（DL），出口标志写 EX。注意表面处理里 Matt（MT）与材料类 Metal（MT）撞码。2026 年有两处更新直接影响读图：CSI MasterFormat 2026 对 09 章 Finishes 做了维护性更新（以标题澄清与小幅重整为主，全版新增 2,185 条、重整 617 条，结构变更的八成以上集中在 Division 32 Exterior Improvements 与 Division 34 Transportation）；NBS Uniclass 在 1 月、4 月、7 月三次季度更新中扩展了 CAD 表，用于支持与 ISO 标准对齐的 AutoCAD 图层命名约定。\",欧美项目的缩写多由建筑师在 Finish Schedule 中自行定义，同一缩写在不同承包商之间含义可能不同，且并无行业共识（MR 可指 Marble，也可指 Mirror）。套用前必须先读该项目的 Finish Schedule 与 Specification。,欧美没有跨国统一的材料代码体系，材料表由建筑师按项目编写，主要依据是分区规格书体系（美国 MasterFormat 09、英国 NBS Work Section 05/06、欧洲 Eurocodes 与各国国家标准）。,\"美国：CSI MasterFormat 2026（新增 2,185 条、重整 617 条；09 章 Finishes 与 01、06、10、26 章为维护性更新章节，Division 32 Exterior Improvements 与 Division 34 Transportation 占结构变更八成以上）与 ASTM／AWI 产品标准 ; 英国：NBS Source Work Section 05、06，NBS Uniclass 分类表（2026 年 1 月／4 月／7 月季度更新：1 月版扩展 CAD 表以支持与 ISO 对齐的 AutoCAD 图层命名并新增建筑轮廓与总外部面积代码，4 月版新增 12 条分类、修订 40 条，7 月版新增 42 条分类、修订 5 条，并把 Smoke dampers 更名为 Smoke control dampers；与 NRM3 的完整映射正在编制中），以及 BS 8300、BS EN 14411 ; 欧洲：EN 1991–1995 Eurocodes、DIN 18202《干式内墙》、EN 12004《瓷砖粘结剂》 ; 建筑师自订的 Finish Schedule 与产品样板（Cut Sheet）惯例（美国缩写较长且项目自定）\",资料口径：按美国 CSI MasterFormat 2026（09 章 Finishes）与 ASTM／AWI 标准、英国 NBS Source Work Section 05／06 与 Uniclass 2026 年季度更新表、BS 8300、BS EN 14411，以及欧洲 Eurocodes、DIN 18202、EN 12004，并结合建筑师自订 Finish Schedule 的惯例整理。\nwest,en,Western (US / UK / EU),\"Western schedules are written in English and lean on trade abbreviations such as Gypsum Board, Acoustic Ceiling Tile, VCT/LVP, MDF and WBP. Lighting separates the luminaire (LT) from the downlight (DL) and exit signs are EX. Note that Matt (MT) in the finish schedule collides with Metal (MT). Two 2026 updates bear directly on reading drawings: CSI MasterFormat 2026 carried out maintenance updates to division 09 Finishes (title clarifications and small reorganisations; 2,185 new and 617 reorganised listings overall, with over 80 per cent of the structural change in Division 32 Exterior Improvements and Division 34 Transportation), and NBS Uniclass extended its CAD table in the January, April and July 2026 quarterly releases to support AutoCAD layer naming aligned with ISO standards.\",\"In Western projects abbreviations are defined by the architect inside the Finish Schedule, so the same code can differ between contractors with no industry consensus (MR may be Marble or Mirror). Read the project's Finish Schedule and Specification before reuse.\",\"The West has no cross-border material-code system: schedules are written per project by the architect, drawing on division-based specifications (US MasterFormat 09, UK NBS Work Sections 05/06, European Eurocodes and national standards).\",\"United States: CSI MasterFormat 2026 (2,185 new and 617 reorganised listings; division 09 Finishes along with divisions 01, 06, 10 and 26 were maintenance updates, while Division 32 Exterior Improvements and Division 34 Transportation account for over 80 per cent of the structural change) plus ASTM and AWI product standards ; United Kingdom: NBS Source Work Sections 05 and 06, and the NBS Uniclass tables (January, April and July 2026 quarterly updates: the January release extended the CAD table for ISO-aligned AutoCAD layer naming and added building footprint and gross external area codes, the April release added 12 classifications and amended 40, the July release added 42 classifications and amended 5 and renamed Smoke dampers to Smoke control dampers; the full mapping to NRM3 is in progress), with BS 8300 and BS EN 14411 ; Europe: EN 1991–1995 Eurocodes, DIN 18202 Drylining, EN 12004 Adhesives for tiling ; Practice of the architect's own Finish Schedule and product cut sheets (US abbreviations are longer and set per project)\",\"Sources: US CSI MasterFormat 2026 (division 09 Finishes) with ASTM/AWI standards, UK NBS Source Work Sections 05/06 and the 2026 quarterly Uniclass releases, BS 8300, BS EN 14411, European Eurocodes, DIN 18202 and EN 12004, plus the architect's own Finish Schedule practice.\"\nwest,ja,欧米（米・英・欧）,\"欧米の凡例は英語全称を基本とし、Gypsum Board、Acoustic Ceiling Tile、VCT/LVP、MDF、WBP などの略称を使う。照明は Luminaire（LT）と Downlight（DL）を分け、誘導灯は EX と書く。仕上げ表の Matt（MT）と材料表の Metal（MT）は衝突する。2026 年の二つの更新は図面読みに直接影響する。CSI MasterFormat 2026 では 09 章 Finishes に保守的更新が入り（見出しの明確化と小幅な再編、版全体で 2,185 件追加・617 件再編、構造的変更の八割以上は Division 32 Exterior Improvements と Division 34 Transportation が占める）、NBS Uniclass は 1 月・4 月・7 月の四半期更新で CAD テーブルを拡張し、ISO 標準に沿った AutoCAD レイヤー命名に対応している。\",欧米案件の略称は建築士が Finish Schedule の中で個別に定義するため、同じコードでもゼネコンごとに意味が異なり、業界共通の合意もありません（MR は Marble にも Mirror にも）。転用前に必ず当該プロジェクトの Finish Schedule と Specification を確認してください。,欧米には国をまたぐ材料コード体系がなく、材料表は建築士が個別に作成する。根拠は区分仕様書体系（米国 MasterFormat 09、英国 NBS Work Section 05/06、欧州 Eurocodes と各国の国家標準）。,\"米国：CSI MasterFormat 2026（2,185 件追加・617 件再編。09 章 Finishes および 01・06・10・26 章は保守的更新、構造的変更の八割以上は Division 32 Exterior Improvements と Division 34 Transportation が占める）と ASTM／AWI 製品標準 ; 英国：NBS Source Work Section 05・06、および NBS Uniclass 分類表（2026 年 1 月・4 月・7 月四半期更新：1 月版は ISO 対応の AutoCAD レイヤー命名のため CAD テーブルを拡張し建築外形と総外部面積のコードを追加、4 月版は 12 件の分類追加と 40 件の修正、7 月版は 42 件の分類追加と 5 件の修正で Smoke dampers を Smoke control dampers に改称。NRM3 との完全なマッピングは編集中）、BS 8300、BS EN 14411 ; 欧州：EN 1991–1995 Eurocodes、DIN 18202《乾式内壁》、EN 12004《タイル用接着剤》 ; 建築주가個別に定める Finish Schedule と製品カットシートの慣行（米国の略称は長くプロジェクトごとに異なる）\",資料の根拠：米国 CSI MasterFormat 2026（09 章 Finishes）と ASTM／AWI 製品標準、英国 NBS Source Work Section 05／06 と Uniclass 2026 年四半期更新表、BS 8300、BS EN 14411、欧州 Eurocodes、DIN 18202、EN 12004、および建築주가個別に定める Finish Schedule の慣行。\nwest,ko,서구 (미국·영국·유럽),\"欧米의 범례는 영어 전칭을 기본으로 하며 Gypsum Board, Acoustic Ceiling Tile, VCT/LVP, MDF, WBP 등의 약어를 쓴다. 조명은 Luminaire(LT)와 Downlight(DL)를 나누고 유도등은 EX로 표기한다. 마감표의 Matt(MT)와 자재표의 Metal(MT)는 충돌한다. 2026년 두 가지 업데이트가 도면 읽기에 직접 영향을 준다. CSI MasterFormat 2026에서는 09장 Finishes에 보수적 개정이 이루어졌고(명칭 명확화와 소규모 재편, 판 전체에서 2,185건 추가와 617건 재편, 구조 변경의 80% 이상이 Division 32 Exterior Improvements와 Division 34 Transportation에 집중), NBS Uniclass는 1·4·7월 분기 업데이트에서 ISO 표준에 맞춘 AutoCAD 레이어 명명 지원을 위해 CAD 테이블을 확장했다.\",서방 프로젝트의 약어는 건축사가 Finish Schedule 안에서 직접 정의하기 때문에 같은 코드도 시공사마다 다르고 업계 공통 합의가 없습니다(MR이 Marble일 수도 Mirror일 수도). 적용 전 반드시 해당 Finish Schedule과 Specification을 확인하세요.,\"서방에는 국경을 넘는 재료 코드 체계가 없어 재료표는 건축사가 프로젝트별로 작성하며, 근거는 구역별 시방서 체계(미국 MasterFormat 09, 영국 NBS Work Section 05/06, 유럽 Eurocodes와 각국 국가 표준)이다.\",\"미국: CSI MasterFormat 2026(2,185건 추가, 617건 재편. 09장 Finishes와 01·06·10·26장은 보수적 개정, 구조 변경의 80% 이상이 Division 32 Exterior Improvements와 Division 34 Transportation이 차지) 및 ASTM／AWI 제품 규격 ; 영국: NBS Source Work Section 05·06, 그리고 NBS Uniclass 분류표(2026년 1·4·7월 분기 업데이트: 1월판은 ISO 정렬 AutoCAD 레이어 명명을 위해 CAD 테이블을 확장하고 건축 외곽과 총외부면적 코드를 추가, 4월판은 12개 분류 추가와 40개 수정, 7월판은 42개 분류 추가와 5개 수정으로 Smoke dampers를 Smoke control dampers로 명칭 변경. NRM3 완전 매핑은 진행 중), BS 8300, BS EN 14411 ; 유럽: EN 1991–1995 Eurocodes, DIN 18202《건식 내벽》, EN 12004《타일 접착제》 ; 건축주가 자체로 정하는 Finish Schedule와 제품 컷시트 관행(미국 약어는 길고 프로젝트마다 다름)\",\"자료 출처: 미국 CSI MasterFormat 2026(09장 Finishes)과 ASTM／AWI 제품 규격, 영국 NBS Source Work Section 05／06과 Uniclass 2026년 분기 업데이트표, BS 8300, BS EN 14411, 유럽 Eurocodes, DIN 18202, EN 12004, 그리고 건축주가 자체로 정하는 Finish Schedule 관행.\"\nwest,es,Occidente (EE. UU./UE),\"Las leyendas occidentales se escriben en inglés y usan abreviaturas del sector como Gypsum Board, Acoustic Ceiling Tile, VCT/LVP, MDF o WBP. La iluminación separa la luminaria (LT) del downlight (DL) y las placas de salida son EX. Nótese que Matt (MT) en el cuadro de acabados choca con Metal (MT) en el de materiales. Dos actualizaciones de 2026
