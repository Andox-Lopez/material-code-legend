sv":"rule_id,lang,title,detail,example\nR1,zh,两位代码 + 两位流水号,同一大类下材料按出现顺序编号，不足两位补零；一个编号只对应一种材料（同材质不同颜色也分号）,ST-01 / WD-03 / DL-07\nR1,en,Two-letter code + two-digit serial,Number sequentially within each category and pad with zeros; one number equals one material (different colours get separate numbers),ST-01 / WD-03 / DL-07\nR1,ja,2文字コード + 2桁の連番,同一分類内で出現順に番号付けし、2桁未満はゼロ埋め。1 番号＝1 材質（同一材質でも色は別番号）,ST-01 / WD-03 / DL-07\nR1,ko,2자리 코드 + 2자리 연번,같은 분류 안에서 등장 순서대로 번호를 매기고 2자리 미만은 0으로 채움. 1개 번호 = 1개 재료(색이 다르면 별도 번호),ST-01 / WD-03 / DL-07\nR1,es,Código de 2 letras + 2 dígitos de serie,\"Se numeran en orden de aparición dentro de cada categoría, rellenando con ceros; un número = un material (cada color lleva su número)\",ST-01 / WD-03 / DL-07\nR2,zh,代码 - 序号 - 材质名称,这是 BIM 与精装交付标准推荐的材质命名法，图纸会签时可直接对应模型构件,ST-01 米色石材 / GL-01 艺术玻璃\nR2,en,Code – number – material name,This is the naming method recommended by BIM and interior fit-out delivery standards; it maps directly onto model components at sign-off,ST-01 Beige Stone / GL-01 Art Glass\nR2,ja,コード - 連番 - 材質名,BIM・内装納 standards が推奨する命名法で、図面サインオフ時にモデル构件と直接対応する,ST-01 ベージュ石材 / GL-01 アートガラス\nR2,ko,코드 - 연번 - 재료명,\"BIM·인테리어 납품 표준이 권장하는 명명법으로, 도면 승인 시 모델 객체와 바로 대응\",ST-01 베이지 석재 / GL-01 아트 글래스\nR2,es,Código – número – nombre del material,Es el método de nomenclatura recomendado por BIM y por los estándares de entrega de decoración; se corresponde con los componentes del modelo,ST-01 Piedra beige / GL-01 Vidrio artístico\nR3,zh,编号 + 规格 + 防火等级 + 部位,材料表的标准五要素，缺一不可；防火等级按 GB 8624 填 A / B1 / B2,WD-01 白橡木饰面 0.6mm 天然木皮 B1 大堂墙面\nR3,en,Number + specification + fire rating + location,\"The five standard elements of a material schedule, none may be missing; fire rating per GB 8624 as A / B1 / B2\",WD-01 White oak veneer 0.6mm Natural veneer B1 Lobby wall\nR3,ja,番号 + 規格 + 防火等級 + 部位,材料表の標準 5 要素。すべて必須で、防火等級は GB 8624 に準じて A / B1 / B2 を記入,WD-01 ホワイトオーク突板 0.6mm 天然木皮 B1 ロビー壁\nR3,ko,번호 + 규격 + 내화 등급 + 부위,\"재료표의 표준 5요소로 모두 필수, 내화 등급은 GB 8624 기준 A / B1 / B2\",WD-01 화이트 오크 마루 veneer 0.6mm 천연 우드 B1 로비 벽면\nR3,es,Número + especificación + clase de fuego + ubicación,\"Los cinco elementos estándar de un cuadro de materiales, todos obligatorios; clase de fuego según GB 8624: A / B1 / B2\",\"WD-01 Revestimiento de roble blanco 0,6 mm Chapa natural B1 Muro del lobby\"\nR4,zh,新增顺延、作废不复用,改版新增材料编号向后顺延；已作废编号保留空号，避免旧图新图串号,ST-08 新增顺延；ST-07 作废保留空号\nR4,en,New items continue the series; retired numbers are never reused,\"On a revision, new materials continue from the last number; retired numbers stay empty so old and new drawings never clash\",ST-08 continues the series; ST-07 retired and left blank\nR4,ja,新規は順送り、廃止番号は再利用しない,改訂時は新規材料的番号を後続で継続。廃止番号は空番として残し、旧図と新図の混同を防ぐ,ST-08 は新番号へ順送り、ST-07 は廃止で空番のまま\nR4,ko,\"신규는 순차 연장, 폐지 번호는 재사용 금지\",\"개정 시 신규 재료 번호는 순서대로 이어 붙이고, 폐지 번호는 공란으로 남겨 구도·신도 혼동을 막음\",\"ST-08 새 번호로 순차 연장, ST-07 은 폐지 번호로 공란 유지\"\nR4,es,Los nuevos continúan la serie; los números retirados no se reutilizan,\"En una revisión, los materiales nuevos continúan desde el último número; los números retirados quedan vacíos para que el plano viejo y el nuevo no se confundan\",ST-08 continúa la serie; ST-07 queda anulado y en blanco\nR1,fr,Deux lettres de code + deux chiffres de série,\"Numérotation dans l'ordre d'apparition, complété de zéros ; un numéro = un matériau (chaque couleur a son numéro).\",\"ST-01, WD-03, DL-07\"\nR1,it,Due lettere di codice + due cifre di serie,\"Numerazione secondo l'ordine di comparsa, con zeri; un numero = un materiale (ogni colore ha il suo).\",\"ST-01, WD-03, DL-07\"\nR1,pt,Duas letras de código + dois algarismos de série,\"Numeração pela ordem de aparecimento, completada com zeros; um número = um material (cada cor tem o seu).\",\"ST-01, WD-03, DL-07\"\nR1,ru,Две буквы кода + две цифры порядкового номера,Нумерация по порядку появления с дополнением нулями; один номер — один материал (каждый цвет отдельно).,\"ST-01, WD-03, DL-07\"\nR2,fr,Code – numéro – nom du matériau,Méthode de dénomination recommandée par les référentiels BIM et de décoration : correspondance directe avec les composants du modèle.,ST-01 Pierre beige / GL-01 Verre artistique\nR2,it,Codice – numero – nome del materiale,Metodo di denominazione raccomandato dai riferimenti BIM e di decorazione: corrispondenza diretta con i componenti del modello.,ST-01 Pietra beige / GL-01 Vetro artistico\nR2,pt,Código – número – nome do material,Método de nomenclatura recomendado pelas normas de BIM e decoração: correspondência direta com os componentes do modelo.,ST-01 Pedra bege / GL-01 Vidro artístico\nR2,ru,Код – номер – наименование материала,\"Способ наименования, рекомендованный нормативами по BIM и отделке: прямое соответствие элементам модели.\",ST-01 Бежевый камень / GL-01 Художественное стекло\nR3,fr,Numéro + spécification + classement au feu + emplacement,Les cinq éléments d'une ligne de tableau ; le classement au feu suit GB 8624 (A / B1 / B2).,\"WD-01 Placage chêne blanc 0,6 mm Placage naturel B1 Mur du hall\"\nR3,it,Numero + specifica + classe di reazione al fuoco + posizione,I cinque elementi di una voce di capitolato; la classe al fuoco segue GB 8624 (A / B1 / B2).,\"WD-01 Impiallacciato di rovere 0,6 mm Impiallacciato naturale B1 Parete del lobby\"\nR3,pt,Número + especificação + classe de reação ao fogo + localização,Os cinco elementos de uma linha de quadro; a classe ao fogo segue GB 8624 (A / B1 / B2).,\"WD-01 Revestimento de carvalho 0,6 mm Folheado natural B1 Parede do átrio\"\nR3,ru,Номер + спецификация + класс пожарной опасности + местоположение,Пять обязательных элементов строки ведомости; класс пожарной опасности — по GB 8624 (A / B1 / B2).,\"WD-01 Шпон белого дуба 0,6 мм Натуральный шпон B1 Стена лобби\"\nR4,fr,\"Nouveaux numéros à la suite, numéros retirés non réutilisés\",\"En révision, les nouveaux matériaux continuent la série ; les numéros retirés restent vides pour éviter toute confusion entre anciens et nouveaux plans.\",ST-08 poursuit la série ; ST-07 est annulé et laissé en blanc\nR4,it,\"Nuovi numeri in sequenza, numeri annullati non riutilizzati\",In revisione i nuovi materiali proseguono la serie; i numeri annullati restano vuoti per non confondere i disegni vecchi con i nuovi.,ST-08 prosegue la serie; ST-07 è annullato e lasciato in bianco\nR4,pt,\"Novos números em sequência, números revogados não reutilizados\",\"Na revisão, os novos materiais continuam a série; os números revogados ficam vazios para não confundir projetos antigos e novos.\",ST-08 continua a série; ST-07 fica anulado e em branco\nR4,ru,\"Новые номера продолжают ряд, отменённые номера не переиспользуются\",\"При пересмотре новые материалы продолжают ряд; отменённые номера остаются пустыми, чтобы старые и новые чертежи не путались.\",ST-08 продолжает ряд; ST-07 аннулирован и оставлен пустым\n","i18n.csv":"key,zh,en,ja,ko,es,fr,it,pt,ru\ntitle,施工图材料代码 <em>多语对照表</em>,Material Code <em>Legend · Multilingual</em>,施工図 材料コード <em>多言語対照表</em>,施工도 면재 코드 <em>다국어 대조표</em>,Leyenda de códigos <em>de material · multilingüe</em>,Code <em>des matériaux · multilingue</em>,<em>Codici</em> dei materiali · multilingue,<em>Códigos</em> de material · multilíngue,<em>Коды</em> отделочных материалов · многоязычно\nsubtitle,缩写 · 英文全称 · 中文名称 · 包含内容,Abbreviation · Full name · Local name · Contents,略称 · 英語フルネーム · 現地語名称 · 内訳,약어 · 영문 풀네임 · 현지 명칭 · 포함 내용,Abreviatura · Nombre completo · Nombre local · Contenido,Abréviation · Nom complet · Nom local · Contenu,Abbreviazione · Nome completo · Nome locale · Contenuto,Abreviatura · Nome completo · Nome local · Conteúdo,Сокращение · Полное название · Местное название · Состав\nunit,条,entries,件,건,entradas,entrées,voci,entradas,записей\nsystems,个分类,categories,分類,분류,categorías,catégories,categorie,categorias,категорий\ndomain,精装 / 室内设计 · 材料表 Material Legend,Interior fit-out / interior design · Material Legend,内装・インテリア · 材料表 Material Legend,인테리어 마감·설계 · 재료표 Material Legend,Decoración de interiores · Cuadro de materiales,Décoration intérieure / design d'intérieur · légende des matériaux,Arredamento / interior design · legenda dei materiali,Decoração de interiores / design de interiores · legenda dos materiais,Отделка интерьера / дизайн интерьера · легенда материалов\nnote_label,先读这句,Read this first,先に読む,먼저 읽기,Lea esto primero,À lire d'abord,Da leggere prima,Leia primeiro,Сначала прочитайте\nsrc_note,国内没有统一强制的材料代码国标。上述代码取自《居住建筑室内装饰装修工程建筑信息模型设计交付标准》（深圳）表 4.2.4 装饰材料代码表、多地精装施工图材料表实例，以及设计公司通用的中英文对照缩写。实际出图以本项目材料表图例（Material Legend）为唯一准绳。,\"China has no mandatory national standard for material codes. The codes above are drawn from Table 4.2.4 of the Shenzhen BIM delivery standard for residential interior fit-out, from material schedules used in fit-out drawings around the country, and from the English-Chinese abbreviations common to design practices. Always issue drawings against the Material Legend of the project at hand.\",国内に強制される統一的な材料コード国標は存在しません。上記のコードは深圳の「居住建築室内装飾装修工程建築情報モデル設計交付標準」表 4.2.4、各地域の精装施工図における材料表の事例、および設計事務所で通用的な中英略称から採用したものです。実際の出図は当該プロジェクトの材料表凡例（Material Legend）を唯一の基準としてください。,\"중국에는 강제되는 통일된 재료 코드 국标이 없습니다. 위 코드는 선전시 「주거 건축 실내 장식 샹싱 건축정보모델 설계납품표준」 표 4.2.4, 각지、精装施工도 도면의 재료표 사례, 그리고 설계사무소 통용 영중 약칭에서 가져온 것입니다. 실제 출도는 해당 프로젝트의 재료표 범례(Material Legend)를 유일한 기준으로 삼으십시오.\",\"En China no existe una norma nacional obligatoria de códigos de material. Los códigos proceden de la tabla 4.2.4 del estándar de entrega BIM de decoración de interiores de Shenzhen, de cuadros de materiales de planos de decoración de distintas ciudades y de las abreviaturas inglés-chino más habituales en las estudios. Emita siempre los planos según la leyenda de materiales del propio proyecto.\",\"La Chine n'a pas de norme nationale obligatoire pour les codes de matériaux. Les codes ci-dessus proviennent du tableau 4.2.4 de la norme de livraison BIM de Shenzhen pour les logements, de tableaux de matériaux relevés sur des plans de décoration dans tout le pays, et des abréviations anglo-chinoises usuelles. Les plans doivent toujours être établis selon la légende des matériaux du projet.\",\"In Cina non esiste una norma nazionale obbligatoria sui codici dei materiali. I codici riportati derivano dalla tabella 4.2.4 della norma di consegna BIM di Shenzhen per gli alloggi, dai quadri dei materiali dei progetti di decorazione e dalle abbreviazioni anglo-cinesi più comuni. I disegni vanno sempre redatti secondo la legenda dei materiali del progetto.\",\"A China não existe norma nacional obrigatória de códigos de material. Os códigos aqui vem da tabela 4.2.4 da norma de entrega BIM de Shenzhen para habitações, de quadros de materiais de projetos de decoração e das abreviaturas anglo-chinesas mais comuns. Os projetos devem seguir sempre a legenda de materiais do próprio projeto.\",\"В Китае нет обязательного национального стандарта кодов отделочных материалов. Коды приведены по таблице 4.2.4 стандарта передачи BIM-модели жилых помещений (Шэньчжэнь), по ведомостям материалов из проектов отделки и по распространённым англо-китайским сокращениям. Чертежи всегда выпускают по легенде материалов конкретного проекта.\"\nwarn_note,同一代码在不同设计公司/项目可能含义不同，跨项目套用前必须先读该项目的 Material Legend。,The same code may mean different things in different practices or projects: always read the project's own Material Legend before reusing it.,同じコードでも設計事務所・プロジェクトで意味が異なる場合があります。転用前に必ず当該プロジェクトの Material Legend を確認してください。,\"동일한 코드라도 설계사무소·프로젝트에 따라 의미가 다를 수 있으므로, 다른 프로젝트에 적용하기 전 반드시 해당 프로젝트의 Material Legend를 확인하세요.\",El mismo código puede significar cosas distintas según el estudio o el proyecto: lea siempre la leyenda de materiales del proyecto antes de reutilizarlo.,Un même code peut signifier des choses différentes selon les bureaux d'études et les projets : lisez toujours la légende des matériaux du projet avant de le reprendre.,\"Lo stesso codice può avere significati diversi da studio a studio e da progetto a progetto: prima di riutilizzarlo, leggere sempre la legenda dei materiali del progetto.\",Um mesmo código pode significar coisas diferentes conforme o es C（假天花与氟碳喷涂）、FL（火烧面与泛光灯）、CL（亮漆罩面与吸顶灯）同码不同义，须按图纸类型与所在图层判断。饰面遇火反应等级 A1–F 与烟雾 s1–s3、滴落 d0–d2 的分级还须与消防局口径一致，娱乐场所的墙面与天花饰面尤其要核对。跨项目套用前，必须先读该项目的 Material Legend。":"澳門本地碼與內地、港台寫法有多處高頻衝突：LT 與 DL 按港式分工（LT＝燈具大類、DL＝筒燈），與內地 DL 一字雙義相反；PM（PM01 人造石）勿與內地 ST 石材混用，WD 多為木紋生態板而非實木。飾面代碼 FC（假天花與氟碳噴塗）、FL（火燒面與泛光燈）、CL（亮漆罩面與吸頂燈）同碼不同義，須按圖紙類型與所在圖層判斷。飾面遇火反應等級 A1–F 與煙霧 s1–s3、滴落 d0–d2 的分級還須與消防局口徑一致，娛樂場所的牆面與天花飾面尤其要核對。跨項目套用前，必須先讀該項目的 Material Legend。","澳门材料表多以 PM＋两位序号编排（PM01 人造石·雅士白）；勿与内地的 ST 石材码混用。":"澳門材料表多以 PM＋兩位序號編排（PM01 人造石·雅士白）；勿與內地的 ST 石材碼混用。","澳门材料表常以「WD＋序号」或「生态板」标示，与实木饰面分列，单列 MEL 便于识别。":"澳門材料表常以「WD＋序號」或「生態板」標示，與實木飾面分列，單列 MEL 便於識別。","澳门没有统一的装饰材料代码规范，材料表图例由发展商、总承建商与设计顾问按土地工务局《装修工程注意事项》的三级分类（家居简单装修工程／非家居简单装修工程／非简单装修工程）自行编制，所列范围包括假天花、内墙饰面、地板饰面、踢脚线、间隔墙、房门及洗手间配套。技术依据为第14/2021号法律《都市建筑法律制度》与第38/2022号行政法规细则、第15/2021号法律《楼宇及场地防火安全的法律制度》与第39/2022号行政法规《核准楼宇及场地防火安全技术规章》；市政署 IAM 负责公共工程、绿化区域与市政建设。":"澳門沒有統一的裝飾材料代碼規範，材料表圖例由發展商、總承建商與設計顧問按土地工務局《裝修工程注意事項》的三級分類（家居簡單裝修工程／非家居簡單裝修工程／非簡單裝修工程）自行編制，所列範圍包括假天花、內牆飾面、地板飾面、踢腳線、間隔牆、房門及洗手間配套。技術依據為第14/2021號法律《都市建築法律制度》與第38/2022號行政法規細則、第15/2021號法律《樓宇及場地防火安全的法律制度》與第39/2022號行政法規《核准樓宇及場地防火安全技術規章》；市政署 IAM 負責公共工程、綠化區域與市政建設。","澳门沿用港式 LT＝灯具大类、DL＝筒灯；材料表与灯位图须用同一套写法。":"澳門沿用港式 LT＝燈具大類、DL＝筒燈；材料表與燈位圖須用同一套寫法。","澳门的装修工程图例没有统一强制国标，材料表与图例由项目方与设计方自订；实务上沿用港式粤语区缩写习惯，云石（大理石）、瓷砖、石膏板 GYB、防火板 FP、假天花、傢俬等写法常见，灯具大类写 LT、筒灯仍写 DL。石材与板材类材料则按《材料白皮书》的「两位类别字母＋两位序号」编排，例如 PM01 人造石（雅士白）、WD01 浅色木纹生态板。同时，墙面与天花饰面须符合《都市建筑法律制度》及防火安全法律制度所定的遇火反应等级（A1–F，并注烟雾 s1–s3、滴落 d0–d2）。以本项目 Material Legend 为准。":"澳門的裝修工程圖例沒有統一強制國標，材料表與圖例由項目方與設計方自訂；實務上沿用港式粵語區縮寫習慣，雲石（大理石）、瓷磚、石膏板 GYB、防火板 FP、假天花、傢俬等寫法常見，燈具大類寫 LT、筒燈仍寫 DL。石材與板材類材料則按《材料白皮書》的「兩位類別字母＋兩位序號」編排，例如 PM01 人造石（雅士白）、WD01 淺色木紋生態板。同時，牆面與天花飾面須符合《都市建築法律制度》及防火安全法律制度所定的遇火反應等級（A1–F，並注煙霧 s1–s3、滴落 d0–d2）。以本項目 Material Legend 為準。","澳门称地胶／胶地板；勿与塑胶板 PL 混。":"澳門稱地膠／膠地板；勿與塑膠板 PL 混。","澳门称铝塑板（铝塑复合板）；勿与中国内地的微水泥 MC 混用。":"澳門稱鋁塑板（鋁塑複合板）；勿與中國內地的微水泥 MC 混用。","澳门装修工程的常见项目，属土地工务局装修工程注意事项所列范围；与饰面处理 FC（氟碳喷涂）同码，须按图层判断。":"澳門裝修工程的常見項目，屬土地工務局裝修工程注意事項所列範圍；與飾面處理 FC（氟碳噴塗）同碼，須按圖層判斷。","澳门酒店与娱乐场地毯用量大；与地胶板 PVC 分列。":"澳門酒店與娛樂     if(rows[r].length === 1 && rows[r][0] === "") continue;
    var o = {};
    for(var c=0;c<head.length;c++) o[head[c]] = (rows[r][c] !== undefined) ? rows[r][c] : "";
    out.push(o);
  }
  return out;
}

function mapObj(o, fn){
  var r = {};
  for(var k in o){ if(Object.prototype.hasOwnProperty.call(o,k)) r[k] = fn(o[k]); }
  return r;
}

function assemble(texts){
  var L = LANGS_ORDER, csv = {};
  CSV_FILES.forEach(function(n){ csv[n] = parseCSV(texts[n] || ""); });

  var meta = {};
  (csv["meta.csv"] || []).forEach(function(r){ if(r.key) meta[r.key] = r.value || ""; });

  var i18n = {};
  csv["i18n.csv"].forEach(function(r){
    var o = {};
    L.forEach(function(lg){ o[lg] = r[lg] || ""; });
    i18n[r.key] = o;
  });

  var byKey = {};
  csv["entries.csv"].forEach(function(r){
    var e = {code:r.code, base:r.code, group:r.group, full:r.full_en, name:{}, loc:{}, s:""};
    L.forEach(function(lg){ e.name[lg] = r["name_"+lg] || ""; e.loc[lg] = {desc:"", note:""}; });
    byKey[r.group+"|"+r.code] = e;
  });
  csv["entry_text.csv"].forEach(function(r){
    var e = byKey[r.group+"|"+r.code]; if(!e) return;
    if(!e.loc[r.lang]) e.loc[r.lang] = {desc:"", note:""};
    e.loc[r.lang].desc = r.desc || "";
    e.loc[r.lang].note = r.note || "";
  });

  var rtext = {}, ctext = {}, rtext2 = {}, ovByRegion = {};
  csv["region_text.csv"].forEach(function(r){ rtext[r.region_id+"|"+r.lang] = r; });
  csv["conflict_text.csv"].forEach(function(r){ ctext[r.code+"|"+r.lang] = r; });
  csv["rule_text.csv"].forEach(function(r){ rtext2[r.rule_id+"|"+r.lang] = r; });
  csv["region_codes.csv"].forEach(function(r){
    var m = ovByRegion[r.region_id] || (ovByRegion[r.region_id] = {});
    m[(r.group||"")+"|"+r.base_code] = r;
  });

  var regions = {};
  csv["regions.csv"].forEach(function(rg){
    var rid = rg.id, localLang = rg.local_lang || "zh";
    var view = {id:rid, flag:rg.flag, local_lang:localLang, script:rg.script||"",
                label:{}, intro:{}, warn:{}, sources:{}, foot_src:{}, groups:{}, extras:[],
                conflicts:[], rules:[], diff:[], index:[]};
    L.forEach(function(lg){
      var t = rtext[rid+"|"+lg] || {};
      view.label[lg] = t.label || "";
      view.intro[lg] = t.intro || "";
      view.warn[lg] = t.warn || "";
      view.sources[lg] = (t.sources||"").split(" ; ").filter(function(x){return x.trim();});
      view.foot_src[lg] = t.foot_src || "";
    });
    var ov = ovByRegion[rid] || {};
    ["mat","obj","light","finish"].forEach(function(g){
      var rows = [];
      Object.keys(byKey).forEach(function(k){
        var e = byKey[k];
        if(e.group !== g) return;
        var o = ov[g+"|"+e.code] || ov["|"+e.code];
        var code = (o && o.code) || e.code;
        var row = {code:code, base:e.code, group:g, full:(o && o.full) || e.full,
                   name:(o && o.name) || e.name[localLang] || e.name.zh || e.code,
                   loc:{}, rnote:(o && o.note) || "", s:""};
        L.forEach(function(lg){ row.loc[lg] = e.loc[lg]; });
        var parts = [code, e.code, row.full, row.name];
        L.forEach(function(lg){ parts.push(e.name[lg], e.loc[lg].desc, e.loc[lg].note); });
        row.s = parts.join(" ").toLowerCase();
        rows.push(row);
        if(code !== e.code) view.diff.push({base:e.code, code:code, name:row.name, full:row.full, group:g});
      });
      view.groups[g] = rows;
    });
    csv["region_extras.csv"].forEach(function(r){
      if(r.region_id !== rid) return;
      var ex = {code:r.code, base:r.code, full:r.full, name:r.name, loc:{}, s:""};
      L.forEach(function(lg){ ex.loc[lg] = {desc:r.desc, note:r.note}; });
      ex.s = [r.code, r.full, r.name, r.desc, r.note].join(" ").toLowerCase();
      view.extras.push(ex);
    });
    csv["conflicts.csv"].forEach(function(c){
      var a = c.a_ref ? byKey[c.a_ref.replace(":", "|")] : null;
      var b = c.b_ref ? byKey[c.b_ref.replace(":", "|")] : null;
      var item = {code:c.code, a:{}, b:{}, howto:{}, is_extra:false};
      L.forEach(function(lg){
        item.a[lg] = (a ? a.name[lg] : "") || c["a_"+lg] || "";
        item.b[lg] = (b ? b.name[lg] : "") || c["b_"+lg] || "";
        item.howto[lg] = (ctext[c.code+"|"+lg] || {})[lg] || "";
      });
      view.conflicts.push(item);
    });
    csv["region_conflicts.csv"].forEach(function(c){
      if(c.region_id !== rid) return;
      var item = {code:c.code, a:{}, b:{}, howto:{}, is_extra:true};
      L.forEach(function(lg){
        item.a[lg] = c["a_"+lg] || ""; item.b[lg] = c["b_"+lg] || ""; item.howto[lg] = c["howto_"+lg] || "";
      });
      view.conflicts.push(item);
    });
    csv["rules.csv"].forEach(function(rr){
      var item = {title:{}, detail:{}, example:{}};
      L.forEach(function(lg){
        var t = rtext2[rr.rule_id+"|"+lg] || {};
        item.title[lg] = t.title || "";
        item.detail[lg] = t.detail || "";
        item.example[lg] = t.example || rr.example;
      });
      view.rules.push(item);
    });
    ["mat","obj","light","finish"].forEach(function(g){
      view.groups[g].forEach(function(row){
        view.index.push({code:row.code, base:row.base, full:row.full, group:g, name:row.name});
      });
    });
    view.extras.forEach(function(ex){
      view.index.push({code:ex.code, base:ex.code, full:ex.full, group:"extra", name:ex.name});
    });
    regions[rid] = view;
  });

  /* 繁体地区：把中文换成繁体，并生成该地区用的 i18n_zh */
  Object.keys(regions).forEach(function(rid){
    var v = regions[rid];
    if(v.script !== "hant") return;
    var map = HANT[rid] || {};
    function cv(x){ return (x && map[x]) ? map[x] : x; }
    v.label = mapObj(v.label, cv);
    v.intro = mapObj(v.intro, cv);
    v.warn = mapObj(v.warn, cv);
    v.foot_src = mapObj(v.foot_src, cv);
    v.sources = mapObj(v.sources, function(arr){ return arr.map(cv); });
    Object.keys(v.groups).forEach(function(g){
      v.groups[g].forEach(function(row){
        row.name = cv(row.name);
        row.loc = mapObj(row.loc, function(o){ return {desc:cv(o.desc), note:cv(o.note)}; });
      });
    });
    v.extras.forEach(function(ex){ ex.name = cv(ex.name); });
    v.conflicts.forEach(function(c){
      c.a = mapObj(c.a, cv); c.b = mapObj(c.b, cv); c.howto = mapObj(c.howto, cv);
    });
    v.rules.forEach(function(r){
      r.title = mapObj(r.title, cv); r.detail = mapObj(r.detail, cv); r.example = mapObj(r.example, cv);
    });
    v.i18n_zh = {};
    Object.keys(i18n).forEach(function(k){ v.i18n_zh[k] = cv(i18n[k].zh); });
  });

  return {regions:regions, regionOrder:Object.keys(regions), i18n:i18n, meta:meta,
          sections:SECTIONS, tabs:TABS, langs:LANGS};
}

/* ---------------- 离线版：自动检查并替换为 Release 上的最新离线版 ---------------- */
var REPO = "Andox-Lopez/material-code-legend";
var API_LATEST = "https://api.github.com/repos/" + REPO + "/releases/latest";
var RAW_OFFLINE = "https://raw.githubusercontent.com/" + REPO + "/main/"
                + encodeURIComponent("施工图材料代码多语对照表.html");
var OFFLINE_NAME = "material-code-legend-offline.html";

function metaVal(k){
  return (PAYLOAD && PAYLOAD.meta && PAYLOAD.meta[k]) || "";
}

/* 当前页面托管在 Gitee 就用 Gitee 的地址，否则用 GitHub */
function onGitee(){
  return (location.hostname || "").toLowerCase().indexOf("gitee.com") >= 0;
}
function giteeBase(){
  var o = metaVal("gitee_owner"), r = metaVal("gitee_repo");
  return (o && r) ? ("https://gitee.com/" + o + "/" + r) : "";
}
function dlLink(){
  if(onGitee()){
    var gb = giteeBase();
    if(gb) return '<a href="' + gb + '/releases" target="_blank" rel="noopener">' + esc(t("dl_text")) + '</a>';
  }
  return '<a href="https://github.com/' + REPO + '/releases/latest/download/' + OFFLINE_NAME
       + '" target="_blank" rel="noopener">' + esc(t("dl_text")) + '</a>';
}

function renderUpdateRow(){
  var box = document.getElementById("footUpdate");
  if(!box) return;
  if(MODE !== "offline"){ box.innerHTML = ""; return; }
  box.innerHTML = '<span class="update-row">'
    + '<button class="update-btn" id="updateBtn">' + esc(t("update_btn")) + '</button>'
    + '<span class="update-note" id="updateNote"></span></span>';
  document.getElementById("updateBtn").addEventListener("click", function(){ doUpdate(true); });
}

function currentTag(){
  return (PAYLOAD.meta && PAYLOAD.meta.release_tag) || "";
}

function latestRelease(){
  return fetch(API_LATEST, {headers:{"Accept":"application/vnd.github+json"}})
    .then(function(r){
      if(!r.ok) throw new Error("GitHub API " + r.status);
      return r.json();
    })
    .then(function(j){
      var assets = j.assets || [];
      var hit = null;
      for(var i=0;i<assets.length;i++){
        if(/\.html$/i.test(assets[i].name)){ hit = assets[i]; break; }
      }
      return {tag: j.tag_name || "", published: (j.published_at || "").slice(0,10),
              url: hit ? hit.browser_download_url : null};
    });
}

function giteeRelease(){
  var gb = giteeBase();
  if(!gb) return Promise.reject(new Error("gitee not configured"));
  return fetch("https://gitee.com/api/v5/repos/" + metaVal("gitee_owner") + "/" + metaVal("gitee_repo") + "/releases/latest")
    .then(function(r){
      if(!r.ok){ var e = new Error("Gitee API " + r.status); e.status = r.status; throw e; }
      return r.json();
    })
    .then(function(j){
      var assets = j.assets || [], hit = null;
      for(var i=0;i<assets.length;i++){
        if(/\.html$/i.test(assets[i].name)){ hit = assets[i]; break; }
      }
      return {tag: j.tag_name || "", published: (j.created_at || j.published_at || "").slice(0,10),
              url: hit ? (hit.browser_download_url || hit.download_url) : null};
    });
}

/* 不走 API、用 /releases/latest 的重定向取版本（不占 API 配额） */
function latestViaRedirect(base, name){
  return fetch(base + "/releases/latest", {redirect:"follow"}).then(function(r){
    var u = r.url || "";
    var m = u.match(/\/releases\/tag\/([^/?#]+)/);
    if(!m) throw new Error("tag not found: " + u);
    return {tag: decodeURIComponent(m[1]), published: "",
            url: base + "/releases/download/" + encodeURIComponent(m[1]) + "/" + name};
  });
}

/* GitHub 返回 403/404（限流或无权限）时改用 Gitee；两者都不行再用网页重定向兜底 */
function pickRelease(){
  return latestRelease().catch(function(err){
    var st = err && (err.status || (err.message||"").match(/(\d{3})/));
    if(st === 403 || st === 404){
      return giteeRelease().catch(function(e2){
        var gb = giteeBase();
        if(gb){
          return latestViaRedirect(gb, OFFLINE_NAME).catch(function(e3){
            return latestViaRedirect("https://github.com/" + REPO, OFFLINE_NAME);
          });
        }
        return latestViaRedirect("https://github.com/" + REPO, OFFLINE_NAME);
      });
    }
    return latestViaRedirect("https://github.com/" + REPO, OFFLINE_NAME);
  });
}

function doUpdate(manual){
  var btn = document.getElementById("updateBtn");
  var note = document.getElementById("updateNote");
  if(btn) btn.disabled = true;
  if(note) note.textContent = t("update_btn") + "…";
  pickRelease().then(function(rel){
    if(!rel.tag){ throw new Error("no release"); }
    var cur = currentTag();
    if(cur && rel.tag === cur){
      if(note) note.textContent = t("update_status").replace(/\{v\}/g, rel.tag).replace(/\{d\}/g, rel.published);
      if(manual && window.confirm(rel.tag + "\n" + t("update_status").replace(/\{v\}/g, rel.tag).replace(/\{d\}/g, rel.published))){
        /* 与当前一致时也允许强制替换 */
      }
      if(btn) btn.disabled = false;
      return;
    }
    if(!window.confirm(t("update_status").replace(/\{v\}/g, rel.tag).replace(/\{d\}/g, rel.published)
       + "\n\n" + (t("update_btn") + "?"))){
      if(btn) btn.disabled = false;
      return;
    }
    var urls = [];
    if(rel.url) urls.push(rel.url);
    var gb = giteeBase();
    if(gb) urls.push(gb + "/raw/master/" + encodeURIComponent("施工图材料代码多语对照表.html"));
    urls.push(RAW_OFFLINE);
    return fetchFirst(urls).then(function(text){
      if(!text || text.length < 20000) throw new Error("bad payload");
      document.open(); document.write(text); document.close();
    });
  }).catch(function(err){
    if(note) note.textContent = t("update_fail").replace(/\{msg\}/g, String(err.message || err));
    if(btn) btn.disabled = false;
  });
}

function fetchFirst(urls){
  var i = 0;
  function next(){
    if(i >= urls.length) return Promise.reject(new Error("no source"));
    var u = urls[i++];
    return fetch(u).then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    }).catch(function(){ return next(); });
  }
  return next();
}

function boot(){
  var ready;
  if(MODE === "offline"){
    ready = Promise.resolve(EMBEDDED);
  } else {
    ready = Promise.all(CSV_FILES.map(function(n){
      return fetch(CSVBASE + n).then(function(r){
        if(!r.ok) throw new Error(n + " → HTTP " + r.status);
        return r.text();
      });
    })).then(function(list){
      var o = {};
      CSV_FILES.forEach(function(n,i){ o[n] = list[i]; });
      return o;
    });
  }
  ready.then(function(texts){
    PAYLOAD = assemble(texts);
    I18N = PAYLOAD.i18n;
    REGIONS = PAYLOAD.regions;
    if(!REGIONS[state.region]) state.region = PAYLOAD.regionOrder[0];
    document.body.classList.remove("loading");
    renderHeader(); renderMain(); bind();
  }).catch(function(err){
    document.body.classList.remove("loading");
    var el = document.getElementById("bootErr");
    if(el){ el.style.display = "block"; el.textContent = "数据加载失败：" + err.message; }
  });
}

function $(s, r){ return (r||document).querySelector(s); }
function t(k){
  var R = REGIONS[state.region];
  if(state.lang === "zh" && R && R.i18n_zh && R.i18n_zh[k]) return R.i18n_zh[k];
  return (I18N[k] && I18N[k][state.lang]) || (I18N[k] && I18N[k].en) || k;
}
function REG(){ return REGIONS[state.region]; }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function hl(text, kw){
  var s = String(text==null?"":text);
  if(!kw) return esc(s);
  var low = s.toLowerCase(), i = low.indexOf(kw);
  if(i < 0) return esc(s);
  return esc(s.slice(0,i)) + "<mark>" + esc(s.slice(i, i+kw.length)) + "</mark>" + esc(s.slice(i+kw.length));
}
function toast(msg){
  var el = $("#toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(el._tm); el._tm = setTimeout(function(){ el.classList.remove("on"); }, 1500);
}
function hits(row, kw){ return !kw || row.s.indexOf(kw) > -1; }
function groupRows(R, g){
  if(g === "extra") return R.extras;
  return R.groups[g] || [];
}

/* ---------------- 地区代码对照 ---------------- */
function diffHtml(R){
  if(!R.diff.length) return "";
  var kw = state.q.toLowerCase();
  var list = R.diff.filter(function(d){ return hits(d, kw); });
  if(!list.length) return "";
  var cells = list.map(function(d){
    return '<div class="dcell"><div class="dtop">'+
      '<span class="from">'+esc(d.base)+'</span><span class="arrow">→</span>'+
      '<span class="to">'+esc(d.code)+'</span></div>'+
      '<div class="dn">'+hl(d.name, kw)+'</div>'+
      '<div class="df">'+hl(d.full, kw)+'</div>'+
      (d.note ? '<div class="dnote">'+hl(d.note, kw)+'</div>' : '')+'</div>';
  }).join("");
  return '<section class="blk"><h2>'+esc(t("g_region_title"))+'<em>'+esc(t("g_region_sub"))+'</em>'+
    '<span class="h2count">'+list.length+'</span></h2><div class="diffmap">'+cells+'</div></section>';
}

/* ---------------- tables ---------------- */
function tableFor(sec, R){
  var kw = state.q.toLowerCase();
  var lg = state.lang;
  var head, rows, body = "";

  if(sec.key === "conflict"){
    head = ["col_code","col_a","col_b","col_desc2"];
    body = R.conflicts.filter(function(r){ return hits(r, kw); }).map(function(r){
      return '<tr class="conflict'+(r.is_extra?" extra":"")+'">'+
        '<td class="code" data-copy="'+esc(r.code)+'">'+esc(r.code)+
          (r.is_extra ? '<span class="badge region">'+esc(t("region_badge"))+'</span>' : '')+'</td>'+
        '<td class="name">'+hl(r.a[lg], kw)+'</td>'+
        '<td class="desc">'+hl(r.b[lg], kw)+'</td>'+
        '<td class="note">'+hl(r.howto[lg], kw)+'</td></tr>';
    }).join("");
  } else {
    head = ["col_code","col_full","col_region_name", sec.col, "col_note"];
    body = groupRows(R, sec.group).filter(function(r){ return hits(r, kw); }).map(function(r){
      var L = r.loc[lg] || {desc:"", note:""};
      var alt = "";
      if(R.local_lang !== lg && r.loc[lg]){
        alt = ""; // 名称副标题统一使用地区语言，这里保持单一
      }
      var rnote = r.rnote
        ? '<span class="rnote">'+hl(r.rnote, kw)+'</span>' : '';
      var baseTag = (r.code !== r.base)
        ? '<span class="badge base">'+esc(t("col_base_code"))+' '+esc(r.base)+'</span>' : '';
      return '<tr>'+
        '<td class="code" data-copy="'+esc(r.code)+'">'+esc(r.code)+baseTag+
          (sec.group === "extra" ? '<span class="badge region">'+esc(t("region_badge"))+'</span>' : '')+'</td>'+
        '<td class="full">'+hl(r.full, kw)+'</td>'+
        '<td class="name">'+hl(r.name, kw)+alt+'</td>'+
        '<td class="desc">'+hl(L.desc, kw)+'</td>'+
        '<td class="note">'+rnote+hl(L.note, kw)+'</td></tr>';
    }).join("");
  }

  return '<div class="card"><div class="scroll"><table><thead><tr>'+
    head.map(function(k,i){
      var cls = i===0 ? ' class="code"' : (k==="col_full" ? ' class="full"' : "");
      return "<th"+cls+">"+esc(t(k))+"</th>";
    }).join("")+'</tr></thead><tbody>'+(body || "")+'</tbody></table></div>';
}

function rulesHtml(R){
  var kw = state.q.toLowerCase();
  var lg = state.lang;
  var items = R.rules.filter(function(r){ return hits(r, kw); });
  return '<div class="rules">' + items.map(function(r, i){
    var ex = (typeof r.example === "string") ? r.example : (r.example[lg] || "");
    return '<div class="rule"><h3>'+(i+1)+'. '+hl(r.title[lg], kw)+'</h3>'+
      '<div class="eg">'+esc(ex)+'</div><p>'+hl(r.detail[lg], kw)+'</p></div>';
  }).join("") + '</div>';
}

/* ---------------- index cards ---------------- */
function indexHtml(R){
  var kw = state.q.toLowerCase();
  var lg = state.lang;
  var list = R.index.filter(function(r){
    if(state.group !== "all" && state.group !== r.group) return false;
    return hits(r, kw);
  }).sort(function(a,b){
    var c = a.code.localeCompare(b.code);
    return c !== 0 ? c : a.group.localeCompare(b.group);
  });
  if(!list.length) return '<div class="card"><div class="empty">'+esc(t("no_result"))+'</div></div>';

  var out = "", lastLetter = "";
  list.forEach(function(r){
    var L = r.code.charAt(0);
    if(L !== lastLetter){ out += '<div class="letter">'+esc(L)+'</div>'; lastLetter = L; }
    out += '<div class="icard" data-code="'+esc(r.code)+'" data-group="'+esc(r.group)+'">'+
      '<div class="code">'+esc(r.code)+'<span class="grp">'+esc(t(tabLabelFor(r.group)))+'</span></div>'+
      '<div class="full">'+hl(r.full, kw)+'</div>'+
      (r.name === r.full ? "" : '<div class="name">'+hl(r.name, kw)+'</div>')+'</div>';
  });
  return '<div class="idx">'+out+'</div>';
}

function tabLabelFor(g){
  var map = {mat:"tab_mat", obj:"tab_obj", light:"tab_light", finish:"tab_finish",
             extra:"tab_extra", conflict:"tab_conflict"};
  return map[g] || "tab_all";
}

/* ---------------- main ---------------- */
function renderMain(){
  var R = REG();
  var main = $("#main");
  var kw = state.q.toLowerCase();

  if(state.view === "index"){
    var n = R.index.filter(function(r){
      if(state.group !== "all" && state.group !== r.group) return false;
      return hits(r, kw);
    }).length;
    main.innerHTML =
      '<section class="blk"><h2>'+esc(t("g_index"))+'<em>'+esc(t("g_index_sub"))+'</em>'+
      '<span class="h2count">'+n+'</span></h2>'+indexHtml(R)+'</section>'+
      ((state.group === "all" && R.diff.length) ? diffHtml(R) : '')+
      '<section class="blk"><h2>'+esc(t("g_rules"))+'<em>'+esc(t("g_rules_sub"))+'</em></h2>'+rulesHtml(R)+'</section>';
    updateCount(n);
    return;
  }

  var html = (state.group === "all" ? diffHtml(R) : ""), visible = 0;
  SECTIONS.forEach(function(sec){
    if(sec.key === "rules"){
      if(state.group !== "all") return;
      html += '<section class="blk"><h2>'+esc(t(sec.title))+'<em>'+esc(t(sec.sub))+'</em></h2>'+rulesHtml(R)+'</section>';
      return;
    }
    if(state.group !== "all" && state.group !== sec.group) return;
    if(sec.group === "extra" && !R.extras.length) return;
    var n = (sec.key === "conflict" ? R.conflicts : groupRows(R, sec.group))
      .filter(function(r){ return hits(r, kw); }).length;
    visible += n;
    html += '<section class="blk"><h2>'+esc(t(sec.title))+'<em>'+esc(t(sec.sub))+'</em>'+
      '<span class="h2count">'+n+'</span></h2>'+tableFor(sec, R)+'</section>';
  });
  main.innerHTML = html;
  updateCount(visible);
}

function updateCount(n){
  var kw = state.q.trim();
  $("#cnt").textContent = t("showing") + " " + n + " " + t("unit") +
    (kw ? "（" + t("keyword") + ": " + kw + "）" : "");
}

/* ---------------- events ---------------- */
function bind(){
  $("#regionSel").addEventListener("change", function(e){
    state.region = e.target.value;
    syncUrl();
    state.group = "all";
    try{ localStorage.setItem("mcl.region", state.region); }catch(err){}
    renderHeader(); renderMain();
  });
  $("#langSel").addEventListener("change", function(e){
    state.lang = e.target.value;
    try{ localStorage.setItem("mcl.lang", state.lang); }catch(err){}
    syncUrl(); renderHeader(); renderMain();
  });
  $("#tabs").addEventListener("click", function(e){
    var b = e.target.closest(".tab"); if(!b) return;
    state.group = b.dataset.tab;
    renderTabs(); renderMain();
  });
  $("#viewSeg").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    state.view = b.dataset.view;
    $("#viewSeg").innerHTML =
      '<button data-view="table" class="'+(state.view==="table"?"on":"")+'">'+esc(t("view_table"))+'</button>' +
      '<button data-view="index" class="'+(state.view==="index"?"on":"")+'">'+esc(t("view_index"))+'</button>';
    renderMain();
  });
  $("#q").addEventListener("input", function(e){ state.q = e.target.value; renderMain(); });
  $("#clearBtn").addEventListener("click", function(){ state.q = ""; $("#q").value = ""; renderMain(); $("#q").focus(); });
  $("#themeBtn").addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", cur);
    try{ localStorage.setItem("mcl.theme", cur); }catch(err){}
    renderHeader();
  });
  $("#printBtn").addEventListener("click", function(){ window.print(); });
  $("#main").addEventListener("click", function(e){
    var code = e.target.closest("[data-copy]");
    if(code){
      var txt = code.getAttribute("data-copy");
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt);
      } else {
        var ta = document.createElement("textarea");
        ta.value = txt; document.body.appendChild(ta); ta.select();
        try{ document.execCommand("copy"); }catch(err){}
        document.body.removeChild(ta);
      }
      toast(t("copied") + " · " + txt);
      return;
    }
    var card = e.target.closest(".icard");
    if(card){
      state.q = card.getAttribute("data-code");
      state.group = "all";
      state.view = "table";
      $("#q").value = state.q;
      renderTabs();
      $("#viewSeg").innerHTML =
        '<button data-view="table" class="'+(state.view==="table"?"on":"")+'">'+esc(t("view_table"))+'</button>' +
        '<button data-view="index" class="'+(state.view==="index"?"on":"")+'">'+esc(t("view_index"))+'</button>';
      renderMain();
      window.scrollTo({top:0, behavior:"smooth"});
    }
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "/" && document.activeElement !== $("#q")){ e.preventDefault(); $("#q").focus(); }
    if(e.key === "Escape" && document.activeElement === $("#q")){ state.q=""; $("#q").value=""; renderMain(); }
  });
}

boot();
</script>
</body>
</html>
