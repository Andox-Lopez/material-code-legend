 afectan directamente a la lectura de planos: CSI MasterFormat 2026 aplicó actualizaciones de mantenimiento a la división 09 Finishes (aclaraciones de título y pequeñas reorganizaciones; 2.185 entradas nuevas y 617 reorganizadas en total, con más del 80 por ciento del cambio estructural en Division 32 Exterior Improvements y Division 34 Transportation), y NBS Uniclass amplió su tabla CAD en las actualizaciones trimestrales de enero, abril y julio de 2026 para admitir la nomenclatura de capas AutoCAD alineada con las normas ISO.\",\"En proyectos occidentales las abreviaturas las define el arquitecto en el Finish Schedule, así que el mismo código puede variar entre contratistas sin consenso de sector (MR puede ser Marble o Mirror). Lea el Finish Schedule y las especificaciones del proyecto.\",\"Occidente no tiene un sistema de códigos transnacional: los cuadros los redacta el arquitecto proyecto a proyecto, con las especificaciones por división (MasterFormat 09 en EE. UU., NBS Work Sections 05/06 en Reino Unido, Eurocodes y normas nacionales en Europa).\",\"Estados Unidos: CSI MasterFormat 2026 (2.185 entradas nuevas y 617 reorganizadas; la división 09 Finishes junto con las divisiones 01, 06, 10 y 26 recibieron actualizaciones de mantenimiento, mientras que Division 32 Exterior Improvements y Division 34 Transportation concentran más del 80 por ciento del cambio estructural) más las normas de producto ASTM y AWI ; Reino Unido: NBS Source Work Sections 05 y 06, y las tablas NBS Uniclass (actualizaciones trimestrales de enero, abril y julio de 2026: la versión de enero amplió la tabla CAD para la nomenclatura de capas AutoCAD alineada con ISO y añadió códigos de huella del edificio y superficie exterior bruta, la de abril añadió 12 clasificaciones y modificó 40, y la de julio añadió 42 clasificaciones, modificó 5 y renombró Smoke dampers como Smoke control dampers; la correspondencia completa con NRM3 está en curso), junto con BS 8300 y BS EN 14411 ; Europa: EN 1991–1995 Eurocodes, DIN 18202 Drylining, EN 12004 Adhesives for tiling ; Práctica del Finish Schedule propio del arquitecto y de las fichas de producto (las abreviaturas en EE. UU. son más largas y se fijan por proyecto)\",\"Fuentes: CSI MasterFormat 2026 de EE. UU. (división 09 Finishes) con las normas ASTM/AWI, NBS Source Work Sections 05/06 y las actualizaciones trimestrales de Uniclass 2026 del Reino Unido, BS 8300, BS EN 14411, los Eurocodes europeos, DIN 18202 y EN 12004, más la práctica del Finish Schedule propio del arquitecto.\"\nlatam,zh,西班牙 / 拉丁美洲,西班牙语区多用西语缩写：MAD（madera）、VID（vidrio）、MET（metal）、CER（cerámica）、PIN（pintura）、YES（yeso）、ALF（alfombra）、MUE（mobiliario）、LUM（luminaria）；砖石砌体另用 LADR、MOR、HORM。以本项目 Material Legend 为准。 饰面按石材／陶瓷业的西语写法：apomazado（哑光）、pulido（抛光）、arenado（喷砂）、apagado／flameado（火烧）、abujardado（荔枝面）、envejecido（仿古）；灯具按 luminaria 体系：empotrada（筒灯）、plafón（吸顶）、suspensión（吊灯）、proyector sobre carril（轨道射灯）、applique（壁灯）。,西语区项目多以西语材料名与英文缩写并置，各顾问公司的缩写体系互不统一，材料表常以 Cuadro de Materiales 命名。套用前必须先读该项目的 Material Legend。,西班牙与拉丁美洲的装饰材料代码多源自各国技术规范与建筑制图传统（CTE、NBE、NCh），并在顾问公司的材料表（Cuadro de Materiales）中统一。,西班牙 CTE《建筑技术规范》（CTE DB-SI 消防、DB-HS 卫生、DB-HR 声学） ; 墨西哥 NBE《基本建筑规范》、智利 NCh 系列标准 ; UNE（西班牙）/ NMX（墨西哥）产品标准系列 ; Cuadro de Materiales / Leyenda de acabados 的编制惯例：多以石材、瓷砖、涂装三大类缩写起头（如 PIED／MAR／CT／PINT）,资料口径：按西班牙 CTE《建筑技术规范》、墨西哥 NBE《基本建筑规范》、智利 NCh 标准与 UNE／NMX 产品标准系列，并按顾问公司 Cuadro de Materiales 的编制惯例整理。\nlatam,en,Spain & Latin America,\"Hispanic-market drawings favour Spanish abbreviations: MAD for madera, VID for vidrio, MET for metal, CER for cerámica, PIN for pintura, YES for yeso, ALF for alfombra, MUE for mobiliario and LUM for luminaria, with LADR, MOR and HORM for masonry. The project's Material Legend rules. Finishes follow the Spanish stone and ceramic terminology (apomazado honed, pulido polished, arenado sandblasted, apagado/flameado flamed, abujardado bush-hammered, envejecido antiqued); luminaires follow the Spanish luminaria system (empotrada downlight, plafón surface-mounted, suspensión pendant, proyector sobre carril track, applique wall).\",In Spanish-speaking projects local material names sit alongside English abbreviations and each consultant keeps its own system; the schedule is often titled Cuadro de Materiales. Read the project's own Material Legend before reuse.,\"Codes in Spain and Latin America come mostly from each country's technical rules and drafting tradition (CTE, NBE, NCh), unified inside the consultant's Cuadro de Materiales.\",\"Spain: CTE Código Técnico de la Edificación (DB-SI fire, DB-HS health, DB-HR acoustics) ; Mexico: NBE Normas Básicas de Edificación; Chile: NCh standards ; UNE (Spain) / NMX (Mexico) product standard series ; Practice of the Cuadro de Materiales / leyenda de acabados: usually headed by three families — stone, tile and paint (e.g. PIED / MAR / CT / PINT)\",\"Sources: the Spanish CTE, Mexico's NBE, Chilean NCh standards, the UNE/NMX product-standard series, and the practice of the consultant's Cuadro de Materiales.\"\nlatam,ja,スペイン語圏（西・南米）,スペイン語圏は西語略称を用いる：MAD（madera）、VID（vidrio）、MET（metal）、CER（cerámica）、PIN（pintura）、YES（yeso）、ALF（alfombra）、MUE（mobiliario）、LUM（luminaria）。組積は LADR、MOR、HORM。基準は当該プロジェクトの Material Legend。 仕上げは石材・陶磁器のスペイン語表記に準じる（apomazado＝つや消し、pulido＝研磨、arenado＝噴砂、apagado／flameado＝火焼き、abujardado＝ブッシュハンマー|envejecido＝antique）。照明器具はスペイン語の luminaria 体系で、empotrada＝埋込ダウンライト、plafón＝天井直付、suspensión＝吊り下げ、proyector sobre carril＝レールスポット、applique＝壁付照明。,スペイン語圏の案件は現地語的材料名と英文略称を併記し、顾问社ごとに体系が異なります。材料表は Cuadro de Materiales と呼ばれることが多い。転用前に必ず当該プロジェクトの Material Legend を確認してください。,スペイン語圏のコードは各国の技術規範と製図伝統（CTE、NBE、NCh）に由来し、顾问会社の材料表（Cuadro de Materiales）で統一される。,スペイン：CTE《建築技術規範》（DB-SI 火災、DB-HS 衛生、DB-HR 音響） ; メキシコ：NBE《基本建築規範》、チリ：NCh 規格 ; UNE（スペイン）/ NMX（メキシコ）製品規格シリーズ ; Cuadro de Materiales / leyenda de acabados の慣行：石材・タイル・塗装の三大分類で始めることが多い（PIED／MAR／CT／PINT など）,資料の口径：スペイン CTE《建築技術規範》、メキシコ NBE《基本建築規範》、チリ NCh 標準、UNE／NMX 製品規格シリーズ、および顾问会社の Cuadro de Materiales の作成慣行に基づき整理。\nlatam,ko,스페인·라틴아메리카,\"스페인어권 도면은 스페인어 약호를 씁니다: MAD(목재), VID(유리), MET(금속), CER(세라믹), PIN(도료), YES(석고), ALF(카펫), MUE(가구), LUM(조명기구). 벽돌 조적은 LADR·MOR·HORM을 씁니다. 마감은 석재·도자기의 스페인어 표기를 따른다(apomazado=무광, pulido=광택研磨, arenado=샌드블라스트, apagado/flameado=화염면, abujardado=부시해머, envejecido=앤티크). 조명기구는 스페인어 luminaria 체계(empotrada=매입 다운라이트, plafón=천장 직부, suspensión=매달림, proyector sobre carril=레일 스포트, applique=벽등).\",스페인어권 프로젝트는 현지어 재료명과 영문 약어를 병기하며 컨설턴트마다 체계가 다릅니다. 재료표는 Cuadro de Materiales로 불리는 경우가 많습니다. 적용 전 반드시 해당 Material Legend를 확인하세요.,\"스페인어권 코드는 각국의 기술 규범과 도법 전통(CTE, NBE, NCh)에서 나와 컨설턴트의 재료표(Cuadro de Materiales)로 통일된다.\",\"스페인: CTE 「건축기술규범」(DB-SI 소방, DB-HS 위생, DB-HR 음향) ; 멕시코: NBE 「기본건축규범\"\", 칠레: NCh 표준 ; UNE(스페인)/NMX(멕시코) 제품 표준 시리즈 ; Cuadro de Materiales / leyenda de acabados 관행: 석재·타일·도장 세大类으로 시작하는 경우가 많다(PIED／MAR／CT／PINT 등)\",\"자료 근거: 스페인 CTE 「건축기술규범」, 멕시코 NBE 「기본건축규범」, 칠레 NCh 표준, UNE·NMX 제품 표준 시리즈, 그리고 컨설턴트 Cuadro de Materiales 작성 관행에 따라 정리했다.\"\nlatam,es,Hispanoamérica (España y LATAM),\"Los planos del mercado hispanohablante emplean abreviaturas del español: MAD (madera), VID (vidrio), MET (metal), CER (cerámica), PIN (pintura), YES (yeso), ALF (alfombra), MUE (mobiliario) y LUM (luminaria); el mampostero se marca con LADR, MOR y HORM. Los acabados siguen la terminología española de la piedra y la cerámica (apomazado, pulido, arenado, apagado o flameado, abujardado y envejecido); las luminarias siguen el sistema español de luminarias (empotrada, plafón, suspensión, proyector sobre carril y aplique).\",En la región hispanohablante los nombres locales conviven con abreviaturas inglesas y cada consultor mantiene su propio sistema; el cuadro suele llamarse Cuadro de Materiales. Lea la leyenda de materiales del proyecto antes de reutilizar.,\"Los códigos en España y Latinoamérica provienen de las normas técnicas y la tradición de dibujo de cada país (CTE, NBE, NCh), unificados en el Cuadro de Materiales del consultor.\",\"España: CTE Código Técnico de la Edificación (DB-SI incendio, DB-HS salud, DB-HR acústica) ; México: NBE Normas Básicas de Edificación; Chile: normas NCh ; Series de producto UNE (España) y NMX (México) ; Práctica del Cuadro de Materiales: suele organizarse por las familias piedra, baldosa y pintura (p. ej. PIED / MAR / CT / PINT)\",\"Fuentes: el CTE español, las NBE mexicanas, las normas NCh chilenas, las series UNE/NMX de producto y la práctica de redacción del Cuadro de Materiales del consultor.\"\nmena,zh,中东与东南亚,海湾与东南亚项目大量采用英文缩写与当地供货商术语：MS（软钢）、GI（镀锌钢板）、GP（石膏板）、PLC／HPL（防火板）、GRG（玻纤石膏）、GMS（轻钢龙骨）、FC（假天花）。石材另分 GRN 花岗岩、MRN 大理石。以本项目 Material Legend 为准。,中东项目材料表常按分包与品牌分区编写，同一缩写在不同分包之间含义不同（DL 在室内分包指照明，在景观分包指景观照明），且 TBC 待确认项须在定案前逐条销项。套用前必须先读该项目的材料表与送审要求。,中东与东南亚没有本地国标，实务以总包／顾问图例与送审（Submittal）制度为主，技术依据参照海湾通用规范与新加坡、迪拜的本地法规。,沙特 SBC《沙特建筑规范》、GCC 海湾通用规范（ESMA / GSO） ; 迪拜 Municipality《Manual of Building Regulations》、阿布扎比 Estidama 绿色建筑评级体系 ; 新加坡 BCA《Code on Accessibility》与 SS 563《消防安全》、MS ISO 系列 ; Submittal（送审）标注惯例：TBC 待确认、TBA 待定、MOQ 起订量、GP 通用产品、MFG 矿棉天花,资料口径：按沙特 SBC、GCC 通用规范、迪拜 Municipality《Manual of Building Regulations》、阿布扎比 Estidama 体系、新加坡 BCA 与 SS 563，并按 Submittal（送审）制度下的图例与标注惯例整理。\nmena,en,Middle East & Southeast Asia,\"Gulf and Southeast Asian projects lean on English abbreviations and supplier terminology: MS for mild steel, GI for galvanized iron, GP for gypsum board, PLC/HPL for laminate, GRG for glass-fibre gypsum, GMS for light-gauge studs and FC for false ceiling. Stone is split into GRN for granite and MRN for marble. The project's Material Legend rules.\",\"In Middle East projects schedules are split by package and brand, so the same abbreviation changes between packages (DL may be interior lighting or landscape lighting) and every TBC must be closed out before issue. Read the project's own material schedule and submittal requirements before reuse.\",\"The Middle East and Southeast Asia have no local standard: practice runs on consultant and contractor legends plus the submittal regime, technically referring to the GCC codes and the Singapore/Dubai regulations.\",\"Saudi Building Code (SBC); GCC general codes (ESMA / GSO) ; Dubai Municipality Manual of Building Regulations; Abu Dhabi Estidama Pearl Rating System ; Singapore BCA Code on Accessibility and SS 563 Code of Practice for Fire Safety; MS ISO series ; Submittal notation in practice: TBC to be confirmed, TBA to be advised, MOQ minimum order quantity, GP general purpose, MFG mineral-fibre grid\",\"Sources: the Saudi Building Code, GCC general codes, the Dubai Municipality Manual of Building Regulations, Abu Dhabi's Estidama system, Singapore BCA and SS 563, read together with submittal-stage legend and notation practice.\"\nmena,ja,中東・東南アジア,湾岸・東南アジアの工事では英字略称と現地調達先の用語を多用：MS（軟鋼）、GI（亜鉛鋼板）、GP（石膏ボード）、PLC／HPL（化粧ボード）、GRG（ガラス繊維石膏）、GMS（軽鉄骨）、FC（仮天井）。石材は GRN（花崗岩）と MRN（大理石）に分ける。基準は当該プロジェクトの Material Legend。,中東案件の材料表は分包・ブランドごとに分かれ、同じ略称でも分包で意味が異なります（DL は室内分包で照明、ランドスケープ分包で屋外照明）。また TBC（要確認）項目は発行前に全て解消が必要です。転用前に必ず当該プロジェクトの材料表と送审要求を確認してください。,中東・東南アジアには本地国標がなく、実務はゼネコン／顾问の図例と送審制度が主で、技術的根拠は GCC 共通規範とシンガポール・ドバイの法規を参照する。,サウジ・ビルディングコード（SBC）、GCC 共通規範（ESMA / GSO） ; ドバイ Municipality《Manual of Building Regulations》、アブダビ Estidama 評価制度 ; シンガポール BCA《Code on Accessibility》と SS 563《火災安全》、MS ISO シリーズ ; 送審（Submittal）での注記慣行：TBC 要確認、TBA 別途通知、MOQ 最低発注数量、GP 一般品、MFG 鉱維系天井,資料の口径：サウジ SBC、GCC 共通規範、ドバイ Municipality《Manual of Building Regulations》、アブダビ Estidama、シンガポール BCA と SS 563、および送審段階の図例・注記慣行に基づき整理。\nmena,ko,중동·동남아,\"걸프·동남아 프로젝트는 영문 약호와 현지 납품처 용어를 널리 씁니다: MS(연강), GI(아연도금 강판), GP(석고보드), PLC/HPL(합성수지 판), GRG(유리섬유 석고), GMS(경량 철골), FC(천장). 석재는 GRN(화강석)과 MRN(대리석)으로 나눕니다.\",\"중동 현장의 재료표는 하도급·브랜드별로 나뉘어 같은 약어도 하도급에 따라 의미가 달라집니다(DL은 실내分包에서는 조명, 조경分包에서는 조경 조명). TBC 항목은 발행 전에 모두 정리해야 하며, 적용 전 해당 재료표와 승인 요건을 확인하세요.\",\"중동·동남아에는本地 국표가 없어 실무는 총承包·컨설턴트 범례와 승인(Submittal) 제도가 중심이며, 기술 근거는 GCC 공통 규범과 싱가포르·두바이 규정을 참조한다.\",\"사우디 건축코드(SBC), GCC 공통 규범(ESMA/GSO) ; 두바이 Municipality 「Manual of Building Regulations», 아부다비 Estidama 등급 체계 ; 싱가포르 BCA 「Code on Accessibility」와 SS 563 「소방안전」, MS ISO 시리즈 ; Submittal 표기 관행: TBC 확인 필요, TBA 별도 통보, MOQ 최소 발주량, GP 일반 제품, MFG 미네랄 파이버 천장\",\"자료 근거: 사우디 SBC, GCC 공통 규범, 두바이 Municipality 「Manual of Building Regulations」, 아부다비 Estidama, 싱가포르 BCA와 SS 563, 그리고 승인(Submittal) 단계의 범례·표기 관행에 따라 정리했다.\"\nmena,es,Oriente Medio y Sudeste Asiático,\"Los proyectos del Golfo y del Sudeste Asiático emplean abreviaturas inglesas y nomenclatura de proveedores: MS (acero al carbono), GI (chapa galvanizada), GP (placa de yeso), PLC/HPL (laminado), GRG (yeso con fibra de vidrio), GMS (perfil ligero) y FC (falso techo). La piedra se divide en GRN (granito) y MRN (mármol).\",\"En Oriente Medio los cuadros se dividen por paquete y marca, así que la abreviatura cambia entre paquetes (DL puede ser iluminación interior o paisajismo) y cada TBC debe cerrarse antes de emitir. Lea el cuadro de materiales y los requisitos de aprobación del proyecto.\",\"Oriente Medio y el Sudeste Asiático no tienen norma local: la práctica se apoya en las leyendas de consultor y contratista y en el régimen de aprobaciones, remitiendo a los códigos del GCC y a los reglamentos de Singapur y Dubái.\",\"Saudi Building Code (SBC); códigos generales del GCC (ESMA / GSO) ; Manual of Building Regulations de Dubai Municipality; sistema de pearls Estidama de Abu Dhabi ; Code on Accessibility de BCA de Singapur y SS 563 Código de Práctica para la Seguridad contra Incendios; serie MS ISO ; Notación habitual en los submittals: TBC por confirmar, TBA pendiente de advise, MOQ cantidad mínima, GP producto genérico, MFG techo de fibra mineral\",\"Fuentes: el Saudi Building Code, los códigos del GCC, el Manual of Building Regulations de Dubai, el sistema Estidama de Abu Dhabi, BCA y SS 563 de Singapur, junto con la práctica de leyendas y notación en la etapa de submittal.\"\nfr,zh,法国 / 法语区（法、比、瑞）,法国、比利时与瑞士法语区没有统一的装饰材料代码，材料表由承包商与顾问按法国规范体系编制：做法引用 NF DTU 规范与 CSTB 技术意见书，产品引用 NF EN 标准，图纸标注以法语术语为主。实际出图以本项目材料表图例为唯一准绳。,法语区常见的同码多义：MR 既可能是 Miroir（镜子）也可能是 Marbre（大理石）；PLQ 与英文写法 GYP 指同一种石膏板。,法国没有强制性的装饰材料代码国标，体系由 NF DTU 规范、CSTB 与 EN 产品标准共同支撑。,NF DTU 体系：DTU 52.2（拼花地板）、DTU 52.10（地面饰面）、DTU 25.41（石膏板隔墙） ; NF EN 14411《陶瓷砖——定义、规格与标记》、NF EN 13501-1《建筑产品燃烧性能分级》 ; CSTB 技术意见书与技术评估、ATEC 评估意见 ; Règles de l'art Grenelle Environnement（Th-Bat 环境法规）与 Code du travail 劳动安全法规,资料口径：按 NF DTU 规范、NF EN 14411／13501-1、CSTB 技术意见书与 Th-Bat 环保法规整理。\nfr,en,France / French-speaking regions,\"France, Belgium and the French-speaking part of Switzerland have no unified decoration-code system: schedules are drawn up by contractors and consultants around the French rulebook — NF DTU technical rules, CSTB assessments, and NF EN product standards — with drawings labelled mainly in French.\",Typical ambiguities in the zone: MR can be Miroir (mirror) or Marbre (marble); PLQ and the English GYP denote the same plasterboard.,\"There is no mandatory national code for decoration materials: the system rests on NF DTU, CSTB and EN product standards.\",\"NF DTU technical rules: DTU 52.2 (parquets), DTU 52.10 (floor coverings), DTU 25.41 (plasterboard partitions) ; NF EN 14411 Ceramic tiles — definitions, specifications and marking; NF EN 13501-1 Reaction to fire classification ; CSTB technical assessments and ATEC evaluations ; Règles de l'art Grenelle Environnement (Th-Bat) and Code du travail safety rules\",\"Sources: NF DTU technical rules, NF EN 14411 / 13501-1, CSTB assessments and the Th-Bat environmental rules.\"\nfr,ja,フランス／フランス語圏,フランス・ベルギー・スイスフランス語圏には統一された装飾材料コードがなく、材料表は承包商と設計顧問が DTU 規範、CSTB 評価書、NF EN 製品規格に基づいて法国語で作成される。実際の出図は当該プロジェクトの材料表凡例が基準。,フランス語圏の典型的な同码多義：MR は Miroir（鏡）にも Marbre（大理石）にも当たる；PLQ と英語表記 GYP は同じ石膏ボードを指す。,フランスに強制的な装飾材料コード国標はなく、NF DTU・CSTB・EN 製品規格が体系を支える。,NF DTU 体系：DTU 52.2（寄木床）、DTU 52.10（床材）、DTU 25.41（石膏ボード間仕切） ; NF EN 14411《セラミックタイル―定義・規格・表示》、NF EN 13501-1《建築製品の燃焼性能分類》 ; CSTB 技術意見書・ATEC 評価 ; Règles de l'art Grenelle Environnement（Th-Bat 環境規則）と労働安全法規,資料の口径：NF DTU、NF EN 14411／13501-1、CSTB 技術意見書、Th-Bat 環境規則に基づき整理。\nfr,ko,프랑스 / 프랑스어 권역,\"프랑스·벨기에·스위스 프랑스어 권역에는 통일된 장식 재료 코드가 없으며, 재료표는 시공사와 설계 컨설턴트가 DTU 규범, CSTB 평가서, NF EN 제품 규격을 바탕으로 프랑스어로 작성한다. 실제 출도는 해당 프로젝트의 Material Legend를 기준으로 한다.\",\"프랑스어 권역의 전형적인 동코드 다의미: MR은 Miroir(거울)일 수도 Marbre(대리석)일 수도 있고, PLQ와 영어 표기 GYP는 같은 석고보드를 가리킨다.\",\"프랑스에는 강제되는 장식 재료 코드 국표가 없고, NF DTU·CSTB·EN 제품 규격이 체계를 지탱한다.\",\"NF DTU 체계: DTU 52.2(마루), DTU 52.10(바닥 마감), DTU 25.41(석고보드 칸막이) ; NF EN 14411 세라믹 타일 — 정의·규격·표시, NF EN 13501-1 건축 제품 연소 성능 분류 ; CSTB 기술 의견서와 ATEC 평가 ; Règles de l'art Grenelle Environnement(Th-Bat 환경 규칙)와 노동 안전 규정\",\"자료 근거: NF DTU, NF EN 14411·13501-1, CSTB 기술 의견서와 Th-Bat 환경 규칙에 따라 정리.\"\nfr,es,Francia / zona francófona,\"Francia, Bélgica y la zona francófona de Suiza no tienen un sistema unificado de códigos de decoración: los cuadros los redactan contratistas y consultores según el bloque francés —reglas técnicas NF DTU, evaluaciones CSTB y normas de producto NF EN—, con los planos rotulados principalmente en francés.\",Ambiguedades habituales en la zona: MR puede ser Miroir (espejo) o Marbre (mármol); PLQ y la forma inglesa GYP designan el mismo.panel de yeso.,\"No existe norma nacional obligatoria de materiales de decoración: el sistema se apoya en NF DTU, CSTB y normas de producto EN.\",\"Reglas técnicas NF DTU: DTU 52.2 (parquets), DTU 52.10 (revestimientos de suelo), DTU 25.41 (tabiquería de placas de yeso) ; NF EN 14411 Baldosas cerámicas — definiciones, especificaciones y marcado; NF EN 13501-1 Clasificación de la reacción al fuego ; Evaluaciones técnicas CSTB y dictámenes ATEC ; Règles de l'art Grenelle Environnement (Th-Bat) y reglamentos de seguridad laboral (Code du travail)\",\"Fuentes: reglas técnicas NF DTU, NF EN 14411 / 13501-1, evaluaciones CSTB y el reglamento ambiental Th-Bat.\"\nfr,fr,France / zone francophone,\"La France, la Belgique et la partie francophone de la Suisse n'ont pas de système unifié de codes de décoration : les tableaux de matériaux sont rédigés par les entreprises et les bureaux d'études à partir du référentiel français — règles techniques NF DTU, avis CSTB et normes produits NF EN —, les plans étant libellés en français.\",Ambiguïtés fréquentes dans la zone : MR peut valoir Miroir ou Marbre ; PLQ et la forme anglaise GYP désignent le même panneau de plâtre.,\"Il n'existe pas de norme nationale obligatoire pour les matériaux de décoration : le système repose sur les NF DTU, le CSTB et les normes produits EN.\",\"Règles techniques NF DTU : DTU 52.2 (parquets), DTU 52.10 (revêtements de sol), DTU 25.41 (ouvrages en plaques de plâtre) ; NF EN 14411 Carreaux céramiques — définitions, spécifications et marquage ; NF EN 13501-1 Classement de la réaction au feu ; Avis techniques CSTB et attestations ATEC ; Règles de l'art Grenelle Environnement (Th-Bat) et Code du travail\",\"Sources : règles techniques NF DTU, NF EN 14411 / 13501-1, avis CSTB et règles environnementales Th-Bat.\"\nfr,it,Francia / area francofona,\"Francia, Belgio e la zona francofona della Svizzera non hanno un sistema unificato di codici decorativi: i quadri dei materiali sono redatti da imprese e studi secondo il riferimento francese — regole tecniche NF DTU, attestati CSTB e norme di prodotto NF EN —, con i disegni redatti in francese.\",Ambiguità frequenti nella zona: MR può valere Miroir o Marbre; PLQ e la forma inglese GYP indicano lo stesso pannello di cartongesso.,\"Non esiste una norma nazionale obbligatoria sui materiali di decorazione: il sistema poggia su NF DTU, CSTB e norme di prodotto EN.\",\"Regole tecniche NF DTU: DTU 52.2 (parquet), DTU 52.10 (pavimenti), DTU 25.41 (controsoffitti in lastre di cartongesso) ; NF EN 14411 Piastrelle ceramiche — definizioni, specifiche e marcatura; NF EN 13501-1 Classificazione della reazione al fuoco ; Attestati tecnici CSTB e attestati ATEC ; Règles de l'art Grenelle Environnement (Th-Bat) e Codice del lavoro\",\"Fonti: regole tecniche NF DTU, NF EN 14411 / 13501-1, attestati CSTB e regole ambientali Th-Bat.\"\nfr,pt,França / zona francófona,\"A França, a Bélgica e a zona francófona da Suíça não há um sistema unificado de códigos de decoração: os quadros de materiais são redigidos por construtoras e consultoras segundo o referencial francês — regras técnicas NF DTU, pareceres CSTB e normas de produto NF EN —, com os desenhos rotulados sobretudo em francês.\",Ambiguidades frequentes na zona: MR pode ser Miroir ou Marbre; PLQ e a forma inglesa GYP designam o mesmo painel de gesso.,\"Não existe norma nacional obrigatória de materiais de decoração: o sistema assenta nas NF DTU, no CSTB e nas normas de produto EN.\",\"Regras técnicas NF DTU: DTU 52.2 (parquetes), DTU 52.10 (revestimentos de piso), DTU 25.41 (tabiques de placas de gesso) ; NF EN 14411 Azulejos cerâmicos — definições, especificações e marcação; NF EN 13501-1 Classificação da reação ao fogo ; Pareceres técnicos do CSTB e pareceres ATEC ; Règles de l'art Grenelle Environnement (Th-Bat) e regras de segurança no trabalho\",\"Fontes: regras técnicas NF DTU, NF EN 14411 / 13501-1, pareceres CSTB e regras ambientais Th-Bat.\"\nfr,ru,Франция / франкоязычная зона,\"Во Франции, Бельгии и франкоязычной части Швейцарии нет единой системы кодов отделки: ведомости пишут подрядчики и проектировщики по французскому блоку — правилам NF DTU, заключениям CSTB и стандартам продукции NF EN, — а чертежи подписывают преимущественно по-французски.\",Типичные неоднозначности зоны: MR — это Miroir (зеркало) или Marbre (мрамор); PLQ и английское GYP обозначают один и тот же гипсокартон.,\"Обязательного национального стандарта по отделочным материалам нет: система опирается на NF DTU, CSTB и стандарты продукции EN.\",\"Технические правила NF DTU: DTU 52.2 (паркет), DTU 52.10 (напольные покрытия), DTU 25.41 (перегородки из ГКЛ) ; NF EN 14411 Керамическая плитка — определения, требования и маркировка; NF EN 13501-1 Классификация пожарной опасности ; Технические заключения CSTB и заключения ATEC ; Règles de l'art Grenelle Environnement (Th-Bat) и нормы охраны труда (Code du travail)\",\"Источники: технические правила NF DTU, NF EN 14411 / 13501-1, заключения CSTB и экологические правила Th-Bat.\"\nit,zh,意大利,意大利的装饰材料代码没有统一国标，做法依据国家规范（UNI）与建筑技术指令（Direttive Tecniche）及工程量清单（Capitolato），工程清单中的材料名称以意大利语为主、缩写多沿用英文。实际出图以本项目材料表图例为唯一准绳。,意大利常见的同码多义：SPE 既可能是 Specchio（镜子）也可能是 Special Finish（特殊饰面）；PMMA 同时指亚克力和甲基丙烯酸甲酯板材。,意大利无强制性的装饰材料代码国标，体系由 UNI／EN 标准与行业 Capitolato 惯例支撑。,UNI / UNI EN 14411《陶瓷砖——定义、规格与标记》、UNI EN 13501-1《燃烧性能分级》 ; Direttive Tecniche（技术指令）与 Capitolati tecnici（工程量清单） ; CEI 64-8《施工场所电气装置》与 CEI 照明相关规范 ; D.Lgs. 50/2016《公共合同法令》附件中的工艺做法说明,资料口径：按 UNI／EN 标准、Direttive Tecniche 与 Capitolati 惯例整理。\nit,en,Italy,\"Italy has no unified national code for decoration materials: practice follows UNI and EN standards, the Direttive Tecniche and the Capitolato tecnico (bill of quantities with specifications), where materials are named in Italian while abbreviations often stay English.\",Typical ambiguities in Italy: SPE can be Specchio (mirror) or Special Finish; PMMA denotes both acrylic sheet and the polymethyl methacrylate compound.,There is no mandatory national code for decoration materials: the system rests on UNI/EN standards and on the Italian capitolato practice.,\"UNI / UNI EN 14411 Ceramic tiles — definitions, specifications and marking; UNI EN 13501-1 Reaction to fire classification ; Direttive Tecniche and Capitolati tecnici (technical specifications for each work package) ; CEI 64-8 Electrical installations of construction sites and CEI lighting standards ; D.Lgs. 50/2016 — Code of public contracts, technical specifications annexes\",\"Sources: UNI/EN standards, Direttive Tecniche and capitolato practice.\"\nit,ja,イタリア,イタリアには装飾材料コードの統一国標がなく、実務は UNI・EN 規格、Direttive Tecniche（技術指令）、Capitolato（工事仕様書）に基づく。仕様書では材料名をイタリア語で書き、略称は英語のまま残すことが多い。実際の出図は当該プロジェクトの材料表凡例が基準。,イタリアの典型的な同码多義：SPE は Specchio（鏡）にも Special Finish にも当たる；PMMA はアクリル板とメタクリル酸メチルの両方を指す。,イタリアに強制的な装飾材料コード国標はなく、UNI／EN 規格と Capitoli（仕様書）慣習が体系を支える。,UNI / UNI EN 14411《セラミックタイル―定義・規格・表示》、UNI EN 13501-1《燃焼性能分類》 ; Direttive Tecniche（技術指令）と Capitolati tecnici（工種別仕様書） ; CEI 64-8《施工中の電気設備》と CEI の照明関連規格 ; D.Lgs. 50/2016《公共契約령》の附則仕様（工艺附属仕様）,資料の口径：UNI／EN 規格、Direttive Tecniche、Capitolati 慣習に基づき整理。\nit,ko,이탈리아,\"이탈리아에는 장식 재료 코드의 통일된 국표가 없고, 실무는 UNI·EN 규격, Direttive Tecniche(기술 지침), Capitolato(공사 시방서)를 따릅니다. 시방서에는 재료명을 이탈리아어로 쓰고 약어는 영어로 두는 경우가 많습니다. 실제 출도는 해당 프로젝트의 Material Legend를 기준으로 합니다.\",\"이탈리아의 전형적인 동코드 다의미: SPE는 Specchio(거울)일 수도 Special Finish일 수도 있고, PMMA는 아크릴 판과 메틸메타크릴라이트를 모두 가리킵니다.\",\"이탈리아에 강제되는 장식 재료 코드 국표는 없으며, UNI·EN 규격과 Capitoli(시방서) 관행이 체계를 지탱합니다.\",\"UNI / UNI EN 14411 세라믹 타일 — 정의·규격·표시, UNI EN 13501-1 연소 성능 분류 ; Direttive Tecniche(기술 지침)와 Capitolati tecnici(공종별 시방서) ; CEI 64-8 시공 중 전기 설비와 CEI 조명 관련 규격 ; D.Lgs. 50/2016 공공 계약령 부속 시공 규격\",\"자료 근거: UNI·EN 규격, Direttive Tecniche와 Capitolati 관행에 따라 정리.\"\nit,es,Italia,\"Italia no tiene un código nacional unificado de materiales de decoración: la práctica sigue las normas UNI y EN, las Direttive Tecniche y el Capitolato (prescripciones por partida), donde los materiales se nombran en italiano y las abreviaturas suelen mantenerse en inglés.\",Ambigüedades habituales en Italia: SPE puede ser Specchio (espejo) o Special Finish; PMMA designa tanto el panel acrílico como el metacrilato de metilo.,No existe norma nacional obligatoria de materiales de decoración: el sistema se apoya en las normas UNI/EN y en la práctica del capitolato.,\"UNI / UNI EN 14411 Baldosas cerámicas — definiciones, especificaciones y marcado; UNI EN 13501-1 Clasificación de la reacción al fuego ; Direttive Tecniche y Capitolati tecnici (especificaciones por capítulo de obra) ; CEI 64-8 Instalaciones eléctricas en obras y normas de iluminación CEI ; D.Lgs. 50/2016 — Código de los contratos públicos, anexos de prescripciones técnicas\",\"Fuentes: normas UNI/EN, Direttive Tecniche y práctica del capitolato.\"\nit,fr,Italie,\"L'Italie n'a pas de code national unifié des matériaux de décoration : la pratique suit les normes UNI et EN, les Direttive Tecniche et le Capitolato (prescriptions par lot), où les matériaux sont nommés en italien tandis que les abréviations restent souvent en anglais.\",Ambiguïtés courantes en Italie : SPE peut valoir Specchio ou Special Finish ; PMMA désigne à la fois le panneau acrylique et le méthacrylate de méthyle.,Il n'existe pas de norme nationale obligatoire pour les matériaux de décoration : le système repose sur les normes UNI/EN et sur la pratique des capitolati.,\"UNI / UNI EN 14411 Carreaux céramiques — définitions, spécifications et marquage ; UNI EN 13501-1 Classement de la réaction au feu ; Direttive Tecniche et Capitolati tecnici (prescriptions par lot d'ouvrage) ; CEI 64-8 Installations électriques de chantier et normes d'éclairage CEI ; D.Lgs. 50/2016 — Code des contrats publics, annexes de prescriptions techniques\",\"Sources : normes UNI/EN, Direttive Tecniche et pratique des capitolati.\"\nit,it,Italia,\"L'Italia non ha un codice nazionale unificato per i materiali di decorazione: la pratica segue le norme UNI ed EN, le Direttive Tecniche e il Capitolato (prescrizioni per voce di capitolato), dove i materiali si nominano in italiano e le abbreviazioni restano spesso inglesi.\",Ambiguità ricorrenti in Italia: SPE può valere Specchio o Special Finish; PMMA indica sia il pannello acrilico sia il metacrilato di metile.,Non esiste una norma nazionale obbligatoria sui materiali di decorazione: il sistema poggia sulle norme UNI/EN e sulla pratica dei capitolati.,\"UNI / UNI EN 14411 Piastrelle ceramiche — definizioni, specifiche e marcatura; UNI EN 13501-1 Classificazione della reazione al fuoco ; Direttive Tecniche e Capitolati tecnici (prescrizioni per voce di opera) ; CEI 64-8 Impianti elettrici di cantiere e norme di illuminazione CEI ; D.Lgs. 50/2016 — Codice dei contratti pubblici, allegati di prescrizioni tecniche\",\"Fonti: norme UNI/EN, Direttive Tecniche e pratica dei capitolati.\"\nit,pt,Itália,\"A Itália não tem um código nacional unificado de materiais de decoração: a prática segue as normas UNI e EN, as Direttive Tecniche e o Capitolato (especificações por item), onde os materiais são designados em italiano e as abreviaturas costumam permanecer em inglês.\",Ambiguidades comuns em Itália: SPE pode ser Specchio ou Special Finish; PMMA designa tanto o painel acrílico quanto o metacrilato de metilo.,Não existe norma nacional obrigatória de materiais de decoração: o sistema assenta nas normas UNI/EN e na prática dos capitolati.,\"UNI / UNI EN 14411 Azulejos cerâmicos — definições, especificações e marcação; UNI EN 13501-1 Classificação da reação ao fogo ; Direttive Tecniche e Capitolati tecnici (especificações por item de obra) ; CEI 64-8 Instalações elétricas em obra e normas de iluminação CEI ; D.Lgs. 50/2016 — Código dos contratos públicos, anexos de especificações técnicas\",\"Fontes: normas UNI/EN, Direttive Tecniche e prática dos capitolati.\"\nit,ru,Италия,\"В Италии нет единого национального кода отделочных материалов: практика опирается на стандарты UNI и EN, технические директивы (Direttive Tecniche) и Capitolato — спецификации по видам работ, где материалы называют по-итальянски, а сокращения часто оставляют английскими.\",\"Типичные неоднозначности в Италии: SPE — это Specchio (зеркало) или Special Finish; PMMA обозначает и акриловый лист, и метилметакрилат.\",Обязательного национального стандарта по отделочным материалам нет: система опирается на UNI/EN и практику capitolati.,\"UNI / UNI EN 14411 Керамическая плитка — определения, требования и маркировка; UNI EN 13501-1 Классификация пожарной опасности ; Direttive Tecniche и Capitolati tecnici (спецификации по видам работ) ; CEI 64-8 Электроустановки на строительных площадках и нормы освещения CEI ; D.Lgs. 50/2016 — Кодекс государственных закупок с приложениями технических спецификаций\",\"Источники: стандарты UNI/EN, Direttive Tecnice и практика capitolati.\"\npt,zh,葡萄牙 / 巴西,葡萄牙与巴西没有统一的装饰材料代码：做法依据国家技术规范（NP）、建筑总则（RGE）与欧规（Eurocódigos），材料名称以葡语为主、缩写多沿用英语（尤其巴西）。实际出图以本项目材料表图例为唯一准绳。,葡语区常见的同码多义：POL 既可能指聚合涂料也可能指聚碳酸酯板；MR 既可能是 Marmore（大理石）也可能是 Espelho（镜子）。,葡萄牙与巴西均无强制性的装饰材料代码国标，体系由 NP／LNEC、欧规与顾问公司的材料表惯例支撑。,NP / NP EN 14411《陶瓷砖——定义、规格与标记》、NP EN 1991（地震与结构） ; RGE《建筑总则》（Decreto-Lei n.º 10/2010，葡萄牙）与 NBR（巴西） ; LNEC 试验与评估（E 470 等）、Eurocódigos ; 葡萄牙与巴西顾问公司的 Submittal 与产品样板惯例（Cadernos de Finish）,资料口径：按 NP／EN 标准、RGE、NBR、LNEC 与当地材料表惯例整理。\npt,en,Portugal / Brazil,\"Portugal and Brazil have no unified decoration-code system: practice follows national standards (NP), the General Building Regulations (RGE) and the Eurocodes, with materials named in Portuguese while abbreviations often stay English — particularly in Brazil.\",Typical ambiguities in the zone: POL can mean polymer paint or polycarbonate sheet; MR can be Marmore (marble) or Espelho (mirror).,\"Neither Portugal nor Brazil has a mandatory national code for decoration materials: the system rests on NP/LNEC standards, the Eurocodes and consultant schedule practice.\",\"NP / NP EN 14411 Ceramic tiles — definitions, specifications and marking; NP EN 1991 (seismic and structural) ; RGE — General Building Regulations (Decreto-Law 10/2010, Portugal) and NBR standards (Brazil) ; LNEC testing and assessment (E 470 and others) and the Eurocodes ; Consultant submittal and finish-schedule practice in Portugal and Brazil\",\"Sources: NP/EN standards, the RGE, NBR, LNEC and local schedule practice.\"\npt,ja,ポルトガル・ブラジル,ポルトガルとブラジルには統一された装飾材料コードがなく、実務は国家規格（NP）、建築一般規制（RGE）、Eurocódigos に拠る。材料名はポルトガル語、略称は英語のまま（特にブラジル）が多い。実際の出図は当該プロジェクトの材料表凡例が基準。,ポルトガル語圏の典型的な同码多義：POL は重合塗料にもポリ碳酸Arkポリマー板にも当たる；MR は Marmore（大理石）にも Espelho（鏡）にも当たる。,ポルトガル・ブラジルともに強制的な装飾材料コード国標はなく、NP／LNEC 規格と Eurocodes、顧問会社の材料表慣習が体系を支える。,NP / NP EN 14411《セラミックタイル―定義・規格・表示》、NP EN 1991（耐震・構造） ; RGE《建築一般規制》（ポルトガル Decree-Law 10/2010）とブラジルの NBR 規格 ; LNEC の試験・評価（E 470 など）と Eurocódigos ; ポルトガル・ブラジルの Submittal と仕上げ表（Cadernos de Finish）の慣習,資料の口径：NP／EN 規格、RGE、NBR、LNEC と当地の材料表慣習に基づき整理。\npt,ko,포르투갈 / 브라질,\"포르투갈과 브라질에는 통일된 장식 재료 코드가 없으며, 실무는 국가 규격(NP), 건축 일반 규정(RGE), 유로코드에 따릅니다. 재료명은 포르투갈어로 쓰고 약어는 영어로 두는 경우가 많습니다(브라질 특히). 실제 출도는 해당 프로젝트의 Material Legend를 기준으로 합니다.\",\"포르투갈어 권역의 전형적인 동코드 다의미: POL은 중합 도료일 수도 폴리카보네이트 판일 수도 있고, MR은 Marmore(대리석)일 수도 Espelho(거울)일 수도 있습니다.\",\"포르투갈과 브라질 모두 강제되는 장식 재료 코드 국표가 없으며, NP·LNEC 규격과 유로코드, 컨설턴트 재료표 관행이 체계를 지탱합니다.\",\"NP / NP EN 14411 세라믹 타일 — 정의·규격·표시, NP EN 1991(내진·구조) ; RGE 「건축 일반 규정」(포르투갈 Decreto-Law 10/2010)과 브라질 NBR 표준 ; LNEC 시험·평가(E 470 등)와 유로코드 ; 포르투갈·브라질의 Submittal 및 마감표(Cadernos de Finish) 관행\",\"자료 근거: NP·EN 규격, RGE, NBR, LNEC와当地材料表 관행에 따라 정리.\"\npt,es,Portugal / Brasil,\"Portugal y Brasil no tienen un sistema unificado de códigos de decoración: la práctica sigue las normas nacionales (NP), el Reglamento General de Edificaciones (RGE) y los Eurocódigos, con materiales nombrados en portugués y abreviaturas que suelen quedar en inglés — sobre todo en Brasil.\",Ambigüedades habituales en la zona: POL puede ser pintura polimérica o chapa de policarbonato; MR puede ser Marmore (mármol) o Espelho (espejo).,\"Ni Portugal ni Brasil tienen norma nacional obligatoria de materiales de decoración: el sistema se apoya en NP/LNEC, los Eurocódigos y la práctica de los consultores.\",\"NP / NP EN 14411 Azulejos cerâmicos — definições, especificações e marcação; NP EN 1991 (sísmico e estrutural) ; RGE — Regulamento Geral das Edificações (Decreto-Lei 10/2010, Portugal) e normas NBR (Brasil) ; Ensaios e avaliação do LNEC (E 470 e outros) e os Eurocódigos ; Prática de submittal e de cadernos de finish dos consultores em Portugal e no Brasil\",\"Fuentes: normas NP/EN, RGE, NBR, LNEC y la práctica local de cuadros de materiales.\"\npt,fr,Portugal / Brésil,\"Le Portugal et le Brésil n'ont pas de système unifié de codes de décoration : la pratique suit les normes nationales (NP), le RGE et les Eurocodes, les matériaux étant nommés en portugais tandis que les abréviatures restent souvent en anglais — surtout au Brésil.\",Ambiguïtés fréquentes dans la zone : POL peut désigner une peinture polymère ou une plaque de polycarbonate ; MR peut être Marmore ou Espelho.,\"Ni le Portugal ni le Brésil n'ont de norme nationale obligatoire pour les matériaux de décoration : le système repose sur NP/LNEC, les Eurocodes et la pratique des bureaux d'études.\",\"NP / NP EN 14411 Carreaux céramiques — définitions, spécifications et marquage ; NP EN 1991 (parasismique et structure) ; RGE — Regulamento Geral das Edificações (Decreto-Lei 10/2010, Portugal) et normes NBR (Brésil) ; Essais et évaluation LNEC (E 470 et autres) et Eurocodes ; Pratique des submittals et des cahiers de finishes des bureaux d'études au Portugal et au Brésil\",\"Sources : normes NP/EN, RGE, NBR, LNEC et pratique locale des tableaux de matériaux.\"\npt,it,Portogallo / Brasile,\"Portogallo e Brasile non hanno un sistema unificato di codici decorativi: la pratica segue le norme nazionali (NP), il RGE e gli Eurocodici, con i materiali nominati in portoghese e le abbreviazioni spesso lasciate in inglese — soprattutto in Brasile.\",Ambiguità frequenti nella zona: POL può valere vernice polimerica o lastra di policarbonato; MR può essere Marmore o Espelho.,\"Né Portogallo né Brasile hanno norma nazionale obbligatoria sui materiali di decorazione: il sistema poggia su NP/LNEC, sugli Eurocodici e sulla pratica degli studi.\",\"NP / NP EN 14411 Piastrelle ceramiche — definizioni, specifiche e marcatura; NP EN 1991 (sismico e strutturale) ; RGE — Regulamento Geral das Edificações (Decreto-Lei 10/2010, Portogallo) e norme NBR (Brasile) ; Prove e valutazioni LNEC (E 470 e altre) e Eurocodici ; Prassi di submittal e di quadri di finish degli studi in Portogallo e Brasile\",\"Fonti: norme NP/EN, RGE, NBR, LNEC e prassi locale dei quadri dei materiali.\"\npt,pt,Portugal / Brasil,\"Portugal e Brasil não têm um sistema unificado de códigos de decoração: a prática segue as normas nacionais (NP), o Regulamento Geral das Edificações (RGE) e os Eurocódigos, com materiais designados em português e abreviaturas que permanecem souvent em inglês — sobretudo no Brasil.\",Ambiguidades comuns na zona: POL pode designar tinta polimérica ou chapa de policarbonato; MR pode ser Marmore ou Espelho.,\"Nem Portugal nem Brasil têm norma nacional obrigatória de materiais de decoração: o sistema assenta nas normas NP/LNEC, nos Eurocódigos e na prática das consultoras.\",\"NP / NP EN 14411 Azulejos cerâmicos — definições, especificações e marcação; NP EN 1991 (sísmico e estrutural) ; RGE — Regulamento Geral das Edificações (Decreto-Lei 10/2010, Portugal) e normas NBR (Brasil) ; Ensaios e avaliação do LNEC (E 470 e outros) e os Eurocódigos ; Prática de submittal e de cadernos de finish das consultoras em Portugal e no Brasil\",\"Fontes: normas NP/EN, RGE, NBR, LNEC e a prática local de quadros de materiais.\"\npt,ru,Португалия / Бразилия,\"Ни в Португалии, ни в Бразилии нет единой системы кодов отделки: практика опирается на национальные стандарты (NP), Общие правила застройки (RGE) и Еврокоды; материалы называют по-португальски, а сокращения часто оставляют английскими — особенно в Бразилии.\",Типичные неоднозначности зоны: POL — это полимерная краска или лист поликарбоната; MR — Marmore (мрамор) или Espelho (зеркало).,\"Обязательного национального стандарта по отделочным материалам нет ни в Португалии, ни в Бразилии: система опирается на NP/LNEC, Еврокоды и практику проектных бюро.\",\"NP / NP EN 14411 Керамическая плитка — определения, требования и маркировка; NP EN 1991 (сейсмика и конструкции) ; RGE — Общие правила застройки (Decreto-Law 10/2010, Португалия) и нормы NBR (Бразилия) ; Испытания и оценки LNEC (E 470 и др.) и Еврокоды ; Практика submittal и «cadernos de finish» проектных бюро в Португалии и Бразилии\",\"Источники: нормы NP/EN, RGE, NBR, LNEC и местная практика ведомостей материалов.\"\nru,zh,俄罗斯 / 东欧,俄罗斯与东欧没有统一的装饰材料代码：做法依据俄罗斯建筑规范（СП）与 СП 70.13330、产品标准（ГОСТ），材料名称以俄语为主，图纸中大量使用俄文缩写或西里尔字母。实际出图以本项目材料表图例为唯一准绳。,俄语区常见的同码多义：MR 既可能是 Зеркало（镜子）也可能是 Мрамор（大理石）；СМ（смесь）常用于砂浆与混合料两类条目。,俄罗斯无强制性的装饰材料代码国标，体系由 СП／ГОСТ 规范与顾问公司的材料表惯例支撑。,СП 70.13330《非居住建筑装饰要求》、ГОСТ Р 53316《陶瓷砖》、ГОСТ 32310《玻璃制品》 ; ГОСТ Р 53254《照明灯具技术》、ГОСТ 32314《塑钢门窗》 ; НПБ 133-2000《防火规范》与 ФЗ-123《消防技术规范》 ; 顾问公司的 Материалы / Отделка 清单惯例与 ТТХ（технико-экономические характеристики）卡片,资料口径：按 СП／ГОСТ 规范、防火规范与材料清单惯例整理。\nru,en,Russia / Eastern Europe,\"Russia and Eastern Europe have no unified decoration-code system: practice follows the Russian building codes (СП) and product standards (ГОСТ), with materials named in Russian and drawings heavy on Russian or Cyrillic abbreviations.\",Typical ambiguities in the zone: MR can be Зеркало (mirror) or Мрамор (marble); СМ is used both for mortar and for mixed/compound items.,There is no mandatory national code for decoration materials: the system rests on СП/ГОСТ standards and on consultant schedule practice.,СП 70.13330 Requirements for decoration of non-residential buildings; ГОСТ Р 53316 Ceramic tiles; ГОСТ 32310 Glass products ; ГОСТ Р 53254 Luminaires; ГОСТ 32314 PVC windows and doors ; НПБ 133-2000 Fire safety rules and ФЗ-123 Fire safety technical regulations ; Consultant practice for Материалы / Отделка schedules and ТТХ product data sheets,\"Sources: СП / ГОСТ codes, fire-safety regulations and material-schedule practice.\"\nru,ja,ロシア・東欧,ロシアと東欧には統一された装飾材料コードがなく、実務はロシア建築規範（СП）と製品標準（ГОСТ）に拠り、材料名はロシア語、図面にはロシア語略称やキリル文字が頻出する。実際の出図は当該プロジェクトの材料表凡例が基準。,ロシア語圏の典型的な同码多義：MR は Зеркало（鏡）にも Мрамор（大理石）にも当たる；СМ はモルタルと混合材料的双方に使われる。,ロシアに強制的な装飾材料コード国標はなく、СП／ГОСТ 規範と顧問会社の材料表慣習が体系を支える。,СП 70.13330《非住宅建築の装飾要件》、ГОСТ Р 53316《セラミックタイル》、ГОСТ 32310《ガラス製品》 ; ГОСТ Р 53254《照明器具》、ГОСТ 32314《sal PVC 窓・扉》 ; НПБ 133-2000《防火規範》と ФЗ-123《消防技術規範》 ; 顧問会社の Материалы／Отделка 清单慣行と ТТХ 製品データシート,資料の口径：СП／ГОСТ 規範、防火規範と材料表慣習に基づき整理。\nru,ko,러시아 / 동유럽,\"러시아와 동유럽에는 통일된 장식 재료 코드가 없으며, 실무는 러시아 건축 규정(СП)과 제품 표준(ГОСТ)을 따르고, 재료명은 러시아어, 도면에는 러시아어 약호와 키릴 문자가 자주 쓰입니다. 실제 출도는 해당 프로젝트의 Material Legend를 기준으로 합니다.\",\"러시아어 권역의 전형적인 동코드 다의미: MR은 Зеркало(거울)일 수도 Мрамор(대리석)일 수도 있고, СМ은 모르타르와 혼합 재료를 모두 가리킵니다.\",\"러시아에 강제되는 장식 재료 코드 국표는 없으며, СП·ГОСТ 규범과 컨설턴트 재료표 관행이 체계를 지탱합니다.\",\"СП 70.13330 비주거 건축물 마감 요구사항, ГОСТ Р 53316 세라믹 타일, ГОСТ 32310 유리 제품 ; ГОСТ Р 53254 조명기구, ГОСТ 32314 PVC 창호 ; НПБ 133-2000 소방 규범과 ФЗ-123 소방기술 규범 ; 컨설턴트의 Материалы／Отделка清单 관행과 ТТХ 제품 자료시트\",\"자료 근거: СП·ГОСТ 규범, 소방 규범과 재료표 관행에 따라 정리.\"\nru,es,Rusia / Europa oriental,\"Rusia y Europa oriental no tienen un sistema unificado de códigos de decoración: la práctica sigue los códigos de construcción rusos (СП) y las normas de producto (ГОСТ), con materiales nombrados en ruso y planos con abundance de abreviaturas直接或 cirílicas.\",Ambigüedades habituales en la zona: MR puede ser Зеркало (espejo) o Мрамор (mármol); СМ designa tanto morteros como mezclas.,No existe norma nacional obligatoria de materiales de decoración: el sistema se apoya en СП/ГОСТ y en la práctica de los consultores.,СП 70.13330 Requisitos de decoración de edificios no residenciales; ГОСТ Р 53316 Baldosas cerámicas; ГОСТ 32310 Productos de vidrio ; ГОСТ Р 53254 Luminarias; ГОСТ 32314 Ventanas y puertas de PVC ; НПБ 133-2000 Normas de seguridad contra incendios y ФЗ-123 Reglamento técnico de protección contra incendios ; Práctica de consultores en los cuadros Материалы / Отделка y fichas ТТХ,\"Fuentes: códigos СП / ГОСТ, normativa de incendios y práctica de cuadros de materiales.\"\nru,fr,Russie / Europe de l'Est,\"La Russie et l'Europe de l'Est n'ont pas de système unifié de codes de décoration : la pratique suit les codes de construction russes (СП) et les normes produits (ГОСТ), les matériaux étant nommés en russe et les plans riches en abréviations russes ou cyrilliques.\",Ambiguïtés fréquentes dans la zone : MR peut valoir Зеркало ou Мрамор ; СМ sert à la fois aux mortiers et aux mélanges.,Il n'existe pas de norme nationale obligatoire pour les matériaux de décoration : le système repose sur СП/ГОСТ et sur la pratique des bureaux d'études.,СП 70.13330 Exigences de décoration des bâtiments non résidentiels ; ГОСТ Р 53316 Carreaux céramiques ; ГОСТ 32310 Produits en verre ; ГОСТ Р 53254 Luminaires ; ГОСТ 32314 Fenêtres et portes en PVC ; НПБ 133-2000 Règles de sécurité incendie et ФЗ-123 Règlement technique de sécurité incendie ; Pratique des tableaux Материалы / Отделка et des fiches produits ТТХ,\"Sources : codes СП / ГОСТ, réglementation incendie et pratique des tableaux de matériaux.\"\nru,it,Russia / Europa orientale,\"Russia ed Europa orientale non hanno un sistema unificato di codici decorativi: la pratica segue le norme di costruzione russe (СП) e le norme di prodotto (ГОСТ), con i materiali nominati in russo e disegni ricchi di abbreviazioni russe o cirilliche.\",Ambiguità frequenti nella zona: MR può valere Зеркало o Мрамор; СМ indica sia malte sia miscele.,Non esiste una norma nazionale obbligatoria sui materiali di decorazione: il sistema poggia su СП/ГОСТ e sulla pratica degli studi.,СП 70.13330 Requisiti didecorazione degli edifici non residenziali; ГОСТ Р 53316 Piastrelle ceramiche; ГОСТ 32310 Prodotti in vetro ; ГОСТ Р 53254 Apparecchi di illuminazione; ГОСТ 32314 Finestre e porte in PVC ; НПБ 133-2000 Norme di sicurezza antincendio e ФЗ-123 Regolamento tecnico di sicurezza antincendio ; Prassi dei quadri Материалы / Отделка e delle schede prodotto ТТХ,\"Fonti: codici СП / ГОСТ, normativa antincendio e prassi dei quadri dei materiali.\"\nru,pt,Rússia / Europa de Leste,\"A Rússia e a Europa de Leste não há sistema unificado de códigos de decoração: a prática segue os códigos de construção russos (СП) e as normas de produto (ГОСТ), com materiais designados em russo e projetos ricos em abreviaturas russas ou cirílicas.\",Ambiguidades comuns na zona: MR pode ser Зеркало ou Мрамор; СМ designa tanto argamassas quanto misturas.,Não existe norma nacional obrigatória de materiais de decoração: o sistema assenta nas СП/ГОСТ e na prática das consultoras.,СП 70.13330 Requisitos de decoração de edifícios não residenciais; ГОСТ Р 53316 Azulejos cerâmicos; ГОСТ 32310 Produtos de vidro ; ГОСТ Р 53254 Luminárias; ГОСТ 32314 Janelas e portas de PVC ; НПБ 133-2000 Normas de segurança contra incêndio e ФЗ-123 Regulamento técnico de segurança contra incêndios ; Prática das consultoras nos quadros Материалы / Отделка e nas fichas ТТХ,\"Fontes: códigos СП / ГОСТ, regulamentação de incêndio e prática de quadros de materiais.\"\nru,ru,Россия / Восточная Европа,\"В России и Восточной Европе нет единой системы кодов отделки: практика опирается на российские строительные нормы (СП) и стандарты продукции (ГОСТ); материалы называют по-русски, а на чертежах широко используются русские и кириллические сокращения.\",\"Типичные неоднозначности зоны: MR — это Зеркало (зеркало) или Мрамор (мрамор); СМ обозначает и растворы, и смесевые позиции.\",Обязательного национального стандарта по отделочным материалам нет: система опирается на СП/ГОСТ и практику проектных бюро.,СП 70.13330 Требования к отделке нежилых зданий; ГОСТ Р 53316 Керамическая плитка; ГОСТ 32310 Изделия из стекла ; ГОСТ Р 53254 Светильники; ГОСТ 32314 Окна и двери из ПВХ ; НПБ 133-2000 Правила пожарной безопасности и ФЗ-123 Технический регламент о требованиях пожарной безопасности ; Практика консультантов по ведомостям Материалы / Отделка и паспортам ТТХ,\"Источники: СП / ГОСТ, противопожарные нормы и практика ведомостей материалов.\"\ncn,fr,Chine continentale,\"La Chine continentale ne dispose d'aucune norme nationale obligatoire de codes matériaux : dans la pratique, les plans suivent la Material Legend de chaque projet. La seule référence nationale pour les légendes de matériaux et de luminaires est le JGJ/T 244-2011 Standard for drawing of interior decoration and renovation of building, dont le chapitre 4 recense 19 légendes de matériaux (béton, béton armé, béton cellulaire, mortier de ciment, pierre, brique commune, brique de parement, bois, contreplaqué, panneau lamellé, plaque de plâtre, plaque de silicate de calcium, plaque de laine minérale, verre, moquette, métal, maille métallique, matériaux fibreux, matériaux d'étanchéité) et 16 légendes de luminaires (downlight, downlight carré, spot, spot orientable, spot à grille simple et double, spot sur rail, plafonnier carré et linéaire, support de tube fluorescent, corniche lumineuse encastrée, plafonnier, suspension décorative, applique murale, lampadaire et projecteur encastré au sol). Le tableau s'appuie sur la table 4.2.4 du standard de livraison BIM de Shenzhen et sur les plans de décoration locaux ; DL, SP, SL et PL sont les quatre codes les plus souvent confondus entre disciplines.\",Un même code peut changer de sens d'un bureau d'études à l'autre (DL = category d'éclairage ou downlight) : lisez la légende du projet avant toute reprise.,\"La Chine continentale ne possède pas de norme nationale obligatoire pour les codes de matériaux de décoration : le système s'est constitué par convention entre les autorités locales du logement, les organisations professionnelles et les agences de conception. Le dénominateur commun au niveau national pour le dessin sont les légendes de matériaux et d'équipements de JGJ/T 244-2011, complétées par les règles provinciales (comme les tableaux de légendes de matériaux et de luminaires de la norme locale du Fujian DBJ/T 13-123-2010).\",\"JGJ/T 244-2011 Standard for drawing of interior decoration and renovation of building (annonce MOHURD n° 1053, en vigueur au 1er mars 2012), chapitre 4 ; norme locale du Fujian DBJ/T 13-123-2010, tableau 5.2.5 des légendes de matériaux et tableau 5.3.4 des légendes de luminaires ; standard de livraison BIM de Shenzhen pour la décoration de logements, table 4.2.4 ; GB/T 50325 ; GB 50210 ; Yuejianzhi [2009] n° 41 du Guangdong ; JGJ/T 331 ; GB 8624\",\"Sources : chapitre 4 de JGJ/T 244-2011 (légendes de matériaux et d'équipements), tableaux de légendes de matériaux et de luminaires de la norme du Fujian DBJ/T 13-123-2010, table 4.2.4 du standard de livraison BIM de Shenzhen, lus avec GB/T 50325, GB 50210, Yuejianzhi [2009] n° 41, JGJ/T 331 et GB 8624.\"\ncn,it,Cina continentale,\"La Cina continentale non ha una norma nazionale obbligatoria sui codici dei materiali: nei fatti i disegni seguono la Material Legend di ogni progetto. L'unico riferimento nazionale per le legende di materiali e apparecchi è il JGJ/T 244-2011 Standard for drawing of interior decoration and renovation of building, il cui capitolo 4 raccoglie 19 legende di materiale (calcestruzzo, calcestruzzo armato, calcestruzzo cellulare, malta di cemento, pietra, mattone comune, mattone di facciata, legno, compensato, pannello listellato, cartongesso, lastra di silicato di calcio, pannello di lana minerale, vetro, moquette, metallo, rete metallica, materiali fibrosi, materiali impermeabilizzanti) e 16 legende di apparecchi (downlight, downlight quadrato, spotlight, spotlight orientabile, spotlight a griglia singolo e doppio, spotlight su binario, plafoniera quadrata e lineare, portalampada per tubo fluorescente, cornice luminosa incassata, plafoniera, pendant decorativo, applique a parete, lampada da terra e incassato a terra). La tabella si basa sulla tabella 4.2.4 dello standard di consegna BIM di Shenzhen e sui disegni di finitura locali; DL, SP, SL e PL sono i quattro codici più spesso confusi tra discipline diverse.\",Lo stesso codice può cambiare senso da uno studio all'altro (DL = categoria di illuminazione o downlight): leggere la legenda del progetto prima di riutilizzarlo.,\"La Cina continentale non ha una norma nazionale obbligatoria sui codici dei materiali di finitura: il sistema si è costituito per convenzione fra le autorità locali, le associazioni di categoria e gli studi di progettazione. Il denominatore comune a livello nazionale per il disegno sono le legende di materiali e attrezzature del JGJ/T 244-2011, sulle quali si aggiungono le regole provinciali (come le tabelle di legende di materiali e apparecchi della norma locale del Fujian DBJ/T 13-123-2010).\",\"JGJ/T 244-2011 Standard for drawing of interior decoration and renovation of building (annuncio MOHURD n. 1053, in vigore dal 1° marzo 2012), capitolo 4 ; norma locale del Fujian DBJ/T 13-123-2010, tabella 5.2.5 delle legende di materiali e tabella 5.3.4 delle legende di apparecchi ; standard di consegna BIM di Shenzhen per la decorazione di interni residenziali, tabella 4.2.4 ; GB/T 50325 ; GB 50210 ; Yuejianzhi [2009] n. 41 del Guangdong ; JGJ/T 331 ; GB 8624\",\"Fonti: capitolo 4 del JGJ/T 244-2011 (legende di materiali e attrezzature), le tabelle di legende di materiali e apparecchi della norma del Fujian DBJ/T 13-123-2010 e la tabella 4.2.4 dello standard di consegna BIM di Shenzhen, letti insieme a GB/T 50325, GB 50210, Yuejianzhi [2009] n. 41, JGJ/T 331 e GB 8624.\"\ncn,pt,China continental,\"A China continental não existe norma nacional obrigatória de códigos de material, pelo que na prática os desenhos seguem a Material Legend de cada projeto. A única referência nacional para as legendas de materiais e luminárias é o JGJ/T 244-2011 Standard for drawing of interior decoration and renovation of building, cujo capítulo 4 reúne 19 legendas de material (betão, betão armado, betão Cellular, argamassa de cimento, pedra, tijolo comum, tijolo de revestimento, madeira, compensado, painel de ripas, placa de gesso, placa de silicato de cálcio, placa de lã mineral, vidro, alcatifa, metal, malha metálica, materiais fibrosos, materiais de impermeabilização) e 16 legendas de luminárias (downlight, downlight quadrado, spot, spot orientável, spot de grelha simples e duplo, spot de calha, luminária quadrada e linear, porta-lâmpadas fluorescente, calha de luz embutida, plafoniera, pendente decorativo, aplique de parede, candeeiro de pé e encastrado no chão). A tabela parte da tabela 4.2.4 do standard de entrega BIM de Shenzhen e dos desenhos de acabamento locais; DL, SP, SL e PL são os quatro códigos mais confundidos entre disciplinas.\",O mesmo código pode mudar de sentido entre escritórios (DL = categoria de iluminação ou downlight): leia a legenda do projeto antes de reutilizá-lo.,\"A China continental não tem norma nacional obrigatória de códigos de materiais de acabamento: o sistema consolidou-se por convenção entre as autoridades locais de habitação, as associações do setor e as sociedades de projeto. O denominador comum ao nível nacional do desenho são as legendas de materiais e equipamentos do JGJ/T 244-2011, sobre as quais se somam as regras provinciais (como as tabelas de legendas de materiais e luminárias da norma local de Fujian DBJ/T 13-123-2010).\",\"JGJ/T 244-2011 Standard for drawing of interior decoration and renovation of building (anúncio MOHURD n.º 1053, em vigor desde 1 de março de 2012), capítulo 4 ; norma local de Fujian DBJ/T 13-123-2010, tabela 5.2.5 de legendas de materiais e tabela 5.3.4 de legendas de luminárias ; standard de entrega BIM de Shenzhen para decoração de interiores residenciais, tabela 4.2.4 ; GB/T 50325 ; GB 50210 ; Yuejianzhi [2009] n.º 41 de Guangdong ; JGJ/T 331 ; GB 8624\",\"Fontes: capítulo 4 do JGJ/T 244-2011 (legendas de materiais e equipamentos), as tabelas de legendas de materiais e luminárias da norma de Fujian DBJ/T 13-123-2010 e a tabela 4.2.4 do standard de entrega BIM de Shenzhen, lidos em conjunto com GB/T 50325, GB 50210, Yuejianzhi [2009] n.º 41, JGJ/T 331 e GB 8624.\"\ncn,ru,Китай (материковый),\"В материковом Китае нет обязательного национального стандарта кодов материалов, поэтому на практике чертежи следуют Material Legend каждого проекта. Единственный национальный ориентир по легендам материалов и светильников — JGJ/T 244-2011 «Стандарт выполнения чертежей внутренней отделки зданий», глава 4 «Легенды常用房屋建筑室内装饰装修材料和设备图例»: 19 легенд материалов (бетон, железобетон, газобетон, цементный раствор, камень, обычный кирпич, лицевой кирпич, древесина, фанера, столярный щит, гипсокартон, силикатно-кальциевая плита, минераловатная плита, стекло, ковёр, металл, металлическая сетка, волокнистые материалы, гидроизоляционные материалы) и 16 легенд светильников (встраиваемый светильник, квадратный встраиваемый светильник, спот, направляемый спот, одно- и двухголовый прожектор с решёткой, прожектор на шинопроводе, квадратный и линейный встраиваемый светильник, держатель линейной лампы, скрытая световая ниша, потолочный светильник, декоративный подвесной светильник, настенный светильник, торшер и встраиваемый в пол светильник). За основу таблицы взяты таблица 4.2.4 шэньчжэньского стандарта передачи BIM-моделей и местные чертежи отделки; DL, SP, SL и PL — четыре кода, которые чаще всего путают между специалистами.\",Один и тот же код может означать разное в разных бюро (DL — категория освещения или точечный светильник): перед переносом читайте легенду проекта.,\"В материковом Китае нет обязательного национального стандарта кодов отделочных материалов: система складывалась по договорённости между местными жилищными ведомствами, отраслевыми ассоциациями и проектными организациями. Общим на уровне черчения основанием служат легенды материалов и оборудования JGJ/T 244-2011, поверх которых добавляются провинциальные правила (например, таблицы легенд материалов и светильников фуцзянского местного стандарта DBJ/T 13-123-2010).\",\"JGJ/T 244-2011 «Стандарт выполнения чертежей внутренней отделки зданий» (постановление МИНСТРОЯ КНР № 1053 от 04.07.2011, введен в действие 01.03.2012), глава 4 ; местный стандарт Фуцзяни DBJ/T 13-123-2010, таблица 5.2.5 «Легенды常用建筑装饰装修材料图例» и таблица 5.3.4 «Легенды常用建筑装饰装修工程灯具图例» ; шэньчжэньский стандарт передачи BIM-моделей по внутренней отделке жилых зданий, таблица 4.2.4 ; GB/T 50325 ; GB 50210 ;粤建质〔2009〕41号 (Гуандун) ; JGJ/T 331 ; GB 8624\",\"Источники: глава 4 JGJ/T 244-2011 (легенды материалов и оборудования), таблицы легенд материалов и светильников DBJ/T 13-123-2010 (Фуцзянь) и таблица 4.2.4 шэньчжэньского стандарта передачи BIM-моделей, прочитанные вместе с GB/T 50325, GB 50210, 粤建质〔2009〕41号, JGJ/T 331 и GB 8624.\"\nhk,fr,Hong Kong (Chine),\"À Hong Kong, les légendes de matériaux sont rédigées par les promoteurs, les entrepreneurs et les bureaux d'études, en 英式 anglais et en termes cantonais (亞加力, 傢俬, 地膠, 膠片, 髮紋). Les codes y sont souvent plus longs (MTL, ALU, GYB, TIL).\",LT peut désigner les luminaires comme le light trunk : la légende du projet tranche.,\"Renvois : directives de la BD sur les travaux de rénovation, Cap. 502F, BS EN 14411 et BS 8300.\",\"Buildings Department — Code de pratique pour la rénovation de logements ; Buildings Department — Code de pratique pour la rénovation de locaux de bureau ; Ordonnance sur la sécurité contre l'incendie (locaux commerciaux) Cap. 502F ; BS EN 14411 Carreaux céramiques — définitions, spécifications et marquage ; BS 8300 ; Pratique des méridiens de Hong Kong et de la HKIDA : acronymes longs et termes cantonais\",\"Sources : directives de rénovation du Buildings Department, ordonnance Cap. 502F, BS EN 14411 et BS 8300, ainsi que la pratique courante des tableaux de matériaux hongkongais.\"\nhk,it,Hong Kong (Cina),\"A Hong Kong le leggende dei materiali sono redatte da sviluppatori, imprese e studi, in inglese britannico e con termini cantonese (亞加力, 傢俬, 地膠, 膠片, 髮紋); sono frequenti le abbreviazioni lunghe (MTL, ALU, GYB, TIL).\",LT può indicare i corpi illuminanti come il light trunk: decide la legenda del progetto.,\"Riferimenti: direttive del Buildings Department sui lavori di ristrutturazione, Cap. 502F, BS EN 14411 e BS 8300.\",\"Buildings Department — Codice di pratica per la ristrutturazione di alloggi ; Buildings Department — Codice di pratica per la ristrutturazione di uffici ; Ordinanza sulla sicurezza antincendio (locali commerciali) Cap. 502F ; BS EN 14411 Piastrelle ceramiche — definizioni, specifiche e marcatura; BS 8300 ; Prassi dei periti di Hong Kong e della HKIDA: abbreviazioni lunghe e termini cantonese\",\"Fonti: direttive di ristrutturazione del Buildings Department, ordinanza Cap. 502F, BS EN 14411 e BS 8300, più la prassi dei quadri dei materiali di Hong Kong.\"\nhk,pt,Hong Kong (China),\"Em Hong Kong as legendas de materiais são redigidas porCCI, construtoras e consultores, em inglês britânico e com termos cantonenses (亞加力, 傢俬, 地膠, 膠片, 髮紋); são comuns as abreviaturas longas (MTL, ALU, GYB, TIL).\",LT pode designar os luminários como o light trunk: a legenda do projeto decide.,\"Referências: diretrizes do Buildings Department sobre obras de remodelação, Cap. 502F, BS EN 14411 e BS 8300.\",\"Buildings Department — Código de prática para remodelação de habitações ; Buildings Department — Código de prática para remodelação de escritórios ; Ordenança de Segurança contra Incêndios (Locais Comerciais) Cap. 502F ; BS EN 14411 Azulejos cerâmicos — definições, especificações e marcação; BS 8300 ; Prática dos topógrafos de Hong Kong e da HKIDA: abreviaturas longas e termos cantonenses\",\"Fontes: diretrizes de remodelação do Buildings Department, Cap. 502F, BS EN 14411 e BS 8300, além da prática corrente de quadros de materiais de Hong Kong.\"\nhk,ru,Гонконг (Китай),\"В Гонконге легенды материалов составляют заказчики, подрядчики и проектировщики — на британском английском и с кантонскими терминами (亞加力, 傢俬, 地膠, 膠片, 髮紋); типичны длинные сокращения (MTL, ALU, GYB, TIL).\",\"LT может означать и светильники, и световой карниз (light trunk) — решает легенда проекта.\",\"Ориентиры: указания Департамента зданий по ремонту, Cap. 502F, BS EN 14411 и BS 8300.\",\"Департамент зданий — Кодекс практики по переустройству жилых помещений ; Департамент зданий — Кодекс практики по переустройству офисных помещений ; Указ о пожарной безопасности (коммерческие помещения), Cap. 502F ; BS EN 14411 Керамическая плитка — определения, требования и маркировка; BS 8300 ; Практика гонконгских землемеров и ассоциации HKIDA: длинные сокращения и кантонские термины\",\"Источники: указания Департамента зданий по ремонту, указ Cap. 502F, BS EN 14411 и BS 8300, а также принятая в Гонконге практика ведомостей материалов.\"\ntw,fr,Taïwan (Chine),\"À Taïwan, les codes de matériaux sont propres à chaque bureau d'études ; la base technique reste le règlement de construction du ministère de l'Intérieur et les normes CNS. L'écriture des matériaux est en chinois traditionnel et les abréviations sont souvent calquées de l'anglais.\",\"MR désigne tantôt le marbre, tantôt le miroir : vérifiez la légende du projet.\",\"Renvois : Code de construction du ministère de l'Intérieur, CNS 1527 / 6475 / 4299.\",\"Ministère de l'Intérieur — Code des normes de construction ; Ministère de l'Intérieur — Règlement de la décoration intérieure des bâtiments ; Normes nationales CNS : CNS 1527 carreaux céramiques, CNS 6475 revêtements de sol plastiques, CNS 4299 verre ; Pratique des associations de design d'intérieur et des fournisseurs taïwanais (美耐板, 系統櫥櫃, 輕鋼龍骨)\",\"Sources : Code de construction et règlement de décoration intérieure du ministère de l'Intérieur, normes CNS 1527 / 6475 / 4299, et la pratique taïwanaise des tableaux de matériaux.\"\ntw,it,Taiwan (Cina),A Taiwan i codici dei materiali sono definiti da ciascuno studio di progettazione; la base tecnica resta il regolamento edilizio del ministero dell'Interno e le norme CNS. I materiali si scrivono in cinese tradizionale e le abbreviazioni sono spesso derivate dall'inglese.,MR può valere marmo o specchio: verificare la legenda del progetto.,\"Riferimenti: regolamento edilizio del ministero dell'Interno, CNS 1527 / 6475 / 4299.\",\"Ministero dell'Interno — Codice delle norme di costruzione ; Ministero dell'Interno — Regolamento sulla decorazione interna degli edifici ; Norme nazionali CNS: CNS 1527 piastrelle ceramiche, CNS 6475 rivestimenti plastici, CNS 4299 vetro ; Prassi delle associazioni di design e dei fornitori taiwanesi (美耐板, 系統櫥櫃, 輕鋼龍骨)\",\"Fonti: regolamento edilizio e regolamento sulla decorazione del ministero dell'Interno, norme CNS 1527 / 6475 / 4299 e prassi taiwanese dei quadri dei materiali.\"\ntw,pt,Taiwan (China),\"Em Taiwan, os códigos de material são definidos por cada escritório de projeto; a base técnica mantém-se o regulamento de construção do Ministério do Interior e as normas CNS. Os materiais escrevem-se em chinês tradicional e as abreviaturas derivam souvent do inglês.\",MR tanto pode ser mármore como espelho: confirme a legenda do projeto.,\"Referências: regulamento de construção do Ministério do Interior, CNS 1527 / 6475 / 4299.\",\"Ministério do Interior — Código de normas de construção ; Ministério do Interior — Regulamento de decoração interior de edifícios ; Normas nacionais CNS: CNS 1527 azulejos cerâmicos, CNS 6475 revestimentos plásticos, CNS 4299 vidro ; Prática das associações de design de interiores e dos fornecedores taiwaneses (美耐板, 系統櫥櫃, 輕鋼龍骨)\",\"Fontes: regulamento de construção e de decoração do Ministério do Interior, normas CNS 1527 / 6477 / 4299 e a prática taiwanesa de quadros de materiais.\"\ntw,ru,Тайвань (Китай),\"На Тайване коды материалов каждое проектное бюро определяет самостоятельно; техническая база — строительные нормы Министерства внутренних дел и стандарты CNS. Наименования материалов пишут традиционными иероглифами, сокращения чаще всего заимствованы из английского.\",\"MR может означать и мрамор, и зеркало — сверяйтесь с легендой проекта.\",\"Ориентиры: Строительные нормы Министерства внутренних дел, CNS 1527 / 6475 / 4299.\",\"Министерство внутренних дел — Нормы строительства ; Министерство внутренних дел — Нормы отделки помещений ; Национальные стандарты CNS: CNS 1527 керамическая плитка, CNS 6475 пластиковые напольные покрытия, CNS 4299 стекло ; Практика ассоциаций дизайна и поставщиков Тайваня (美耐板, 系統櫥櫃, 輕鋼龍骨)\",\"Источники: строительные нормы и нормы отделки Министерства внутренних дел, стандарты CNS 1527 / 6475 / 4299 и принятая на Тайване практика ведомостей материалов.\"\njp,fr,Japon,\"Au Japon, aucun code national ne régit les matériaux de finition : les drawings s'appuient sur les noms japonais (クロス, 化粧ボード, 集成材, LGS, サッシ) avec des abréviations romaines en appui. La normalisation Integrated-CAD (BIM) tend à unifier l'écriture des produits entre张学.\",DL peut désigner le downlight comme le下地 (ossature) : vérifiez la légende.,\"Renvois : JIS A 5905, système d'évaluation du logement du MLIT, Integrated-CAD, JASS.\",JIS A 5905 Panneaux décoratifs synthétiques et sols PVC d'intérieur ; JIS A 5908 ; MLIT — Système d'indicateurs de performance du logement et notifications de la loi de construction ; Integrated-CAD (conseil BIM du bâtiment) — normalisation des informations matière ; Architectural Institute of Japan — Documents de design standard (JASS) et plans standard de construction,\"Sources : normes japonaises (JIS A 5905/5908), le dispositif MLIT d'évaluation du logement, la normalisation Integrated-CAD et les documents JASS de l'Institut japonais d'architecture.\"\njp,it,Giappone,\"In Giappone non esiste una norma nazionale sui materiali di finitura: i disegni usano i nomi giapponesi (クロス, 化粧ボード, 集成材, LGS, サッシ) con abbreviazioni romane di appoggio. La normalizzazione Integrated-CAD (BIM) unifica la denominazione dei prodotti fra le varie specializzazioni.\",DL può indicare il downlight come il下地 (ossature): verificare la legenda.,\"Riferimenti: JIS A 5905, sistema MLIT di valutazione delle abitazioni, Integrated-CAD, JASS.\",JIS A 5905 Pannelli decorativi sintetici e pavimenti in PVC per interni; JIS A 5908 ; MLIT — Sistema di indicatori di prestazione delle abitazioni e notifiche della legge edilizia ; Integrated-CAD (consiglio BIM per l'edilizia) — normalizzazione delle informazioni sui materiali ; Architectural Institute of Japan — Documenti di design standard (JASS) e disegni standard di cantiere,\"Fonti: norme giapponesi (JIS A 5905/5908), il sistema MLIT di valutazione delle abitazioni, la normalizzazione Integrated-CAD e i documenti JASS dell'Istituto giapponese di architettura.\"\njp,pt,Japão,\"No Japão não há norma nacional para materiais de acabamento: os desenhos usam nomes japoneses (クロス, 化粧ボード, 集成材, LGS, サッシ) com abreviaturas romanas de apoio. A normalização Integrated-CAD (BIM) unifica a designação dos produtos entre especialidades.\",DL pode designar o downlight ou o下地 (estrutura): confirme a legenda.,\"Referências: JIS A 5905, sistema de avaliação da habitação do MLIT, Integrated-CAD, JASS.\",JIS A 5905 Tabelas decorativas sintéticas e pisos de PVC para interiores; JIS A 5908 ; MLIT — Sistema de indicadores de desempenho da habitação e avisos da lei de construção ; Integrated-CAD (conselho de BIM da construção) — normalização da informação de materiais ; Architectural Institute of Japan — Documentos de desenho padrão (JASS) e desenhos padrão de construção,\"Fontes: normas japoneses (JIS A 5905/5908), o sistema de avaliação da habitação do MLIT, a normalização Integrated-CAD e os documentos JASS do Instituto de Arquitetos do Japão.\"\njp,ru,Япония,\"В Японии нет национального стандарта кодов отделочных материалов: на чертежах используют японские наименования (クロス, 化粧ボード, 集成材, LGS, サッシ) с латинскими сокращениями в дополнение. Нормализация Integrated-CAD (BIM) стремится унифицировать наименование изделий между разделами.\",\"DL может означать и точечный светильник, и каркас (下地) — сверяйтесь с легендой.\",\"Ориентиры: JIS A 5905, система оценки жилья MLIT, Integrated-CAD, JASS.\",JIS A 5905 Декоративные пластиковые панели и ПВХ-покрытия пола для интерьеров; JIS A 5908 ; MLIT — Система показателей качества жилья и уведомления Закона о строительстве ; Integrated-CAD (совет по BIM в строительстве) — стандартизация информации о материалах ; Архитектурный институт Японии — Типовые проектные документы (JASS) и типовые чертежи производства работ,\"Источники: японские стандарты (JIS A 5905/5908), система оценки жилья MLIT, нормализация Integrated-CAD и документы JASS Японского архитектурного института.\"\nkr,fr,Corée du Sud,\"En Corée du Sud, les légendes de matériaux sont librement établies par les studios et les entreprises, sur la base des normes KS et des spécifications de construction KCS/ECS. Les abréviations sont surtout anglaises, complétées par les noms coréens.\",\"SB peut désigner la peinture acrylique dans les anciens systèmes et l'inox dans les récents. Depuis 2026, la réforme de la certification KS et la phase 4 du K-ETS (2026–2030) font du certificat KS et de la déclaration EPD / empreinte carbone des pièces de réception sur site ; vérifiez que le fournisseur les fournit avant de réutiliser ce tableau.\",\"Renvois : KS F 2271, KS M 3802, KS F 3200, KCS/ECS. La réforme de 2026 de la certification KS et la phase 4 du K-ETS (2026–2030) font passer la conformité des matériaux d’un échantillonnage sur site à une documentation préalable.\",\"Normes KS : KS F 2271 méthodes d'essai des matériaux, KS M 3802 revêtements de sol élastiques, KS F 3200 revêtements de sol ; KCS / ECS Spécifications standard des travaux de construction (Centre national des normes) ; MOLIT Code de construction — chapitres d'exécution (intérieurs, électricité, plomberie) ; Pratique des instituts coréens d'architecture d'intérieur : abréviatures anglaises et noms coréens ; KS Q 8001:2024 Exigences générales relatives à la certification des produits (en vigueur depuis le 2024-10-31) ; Réforme du système de certification KS, février 2026 (retrait pour non-conformité délibérée, inspection de produit unique, traçage élargi des marques contrefaites) ; K-ETS phase 4 (2026–2030) : le bâtiment entre dans le quota d’émissions et le G-SEED note les DPE\",\"Sources : normes KS, spécifications KCS/ECS, Code de construction du MOLIT et la pratique coréenne des tableaux de matériaux. Les ajouts 2026 suivent la KS Q 8001:2024 et la certification KS réformée.\"\nkr,it,Corea del Sud,\"In Corea del Sud le legende dei materiali sono redatte liberamente da studi e imprese, sulla base delle norme KS e delle specifiche di costruzione KCS/ECS. Le abbreviazioni sono per lo più inglesi, affiancate dai nomi coreani.\",SB può valere vernice acrilica nei vecchi sistemi e acciaio inox nei recenti. Dal 2026 la riforma della certificazione KS e la fase 4 del K-ETS (2026–2030) rendono obbligatori in cantiere il certificato KS e la dichiarazione EPD / impronta di carbonio; verificate che il fornitore li fornisca prima di riutilizzare questa tabella.,\"Riferimenti: KS F 2271, KS M 3802, KS F 3200, KCS/ECS. La riforma del 2026 della certificazione KS e la fase 4 del K-ETS (2026–2030) spostano la conformità dei materiali dal campionamento in cantiere alla documentazione preventiva.\",\"Norme KS: KS F 2271 metodi di prova dei materiali, KS M 3802 pavimenti elastici, KS F 3200 rivestimenti di pavimento ; KCS / ECS Specifiche standard per i lavori di costruzione (Centro nazionale delle norme) ; MOLIT Codice di costruzione — capitoli di esecuzione (interni, elettrico, idraulica) ; Prassi degli istituti coreani di architettura d'interni: abbreviazioni inglesi e nomi coreani ; KS Q 8001:2024 Requisiti generali per la certificazione di prodotto (in vigore dal 2024-10-31) ; Riforma del sistema di certificazione KS, febbraio 2026 (revoca per non conformità intenzionale, ispezione di prodotto singolo, tracciabilità estesa dei marchi falsificati) ; K-ETS fase 4 (2026–2030): il settore edilizio entra nel limite di emissioni e il G-SEED punteggia l’EPD\",\"Fonti: norme KS, specifiche KCS/ECS, Codice di costruzione del MOLIT e la prassi coreana dei quadri dei materiali. Le aggiunte 2026 seguono la KS Q 8001:2024 e la certificazione KS riformata.\"\nkr,pt,Coreia do Sul,\"Na Coreia do Sul as legendas de materiais são livremente estabelecidas por escritórios e construtoras, com base nas normas KS e nas especificações de construção KCS/ECS. As abreviaturas são sobretudo inglesas, acompanhadas dos nomes coreanos.\",\"SB pode designar tinta acrílica em sistemas antigos e aço inoxidável nos recentes. Desde 2026, a reforma da certificação KS e a fase 4 do K-ETS (2026–2030) tornam obrigatórios em obra o certificado KS e a declaração EPD / pegada de carbono; verifique se o fornecedor os apresenta antes de reutilizar esta tabela.\",\"Referências: KS F 2271, KS M 3802, KS F 3200, KCS/ECS. A reforma de 2026 da certificação KS e a fase 4 do K-ETS (2026–2030) passam a conformidade dos materiais da amostragem em obra para a documentação prévia.\",\"Normas KS: KS F 2271 métodos de ensaio de materiais, KS M 3802 revestimentos elásticos, KS F 3200 revestimentos de piso ; KCS / ECS Especificações padrão de obras (Centro Nacional de Normas de Construção) ; MOLIT Código de Construção — capítulos de execução (interiores, elétrica, canalizações) ; Prática dos institutos coreanos de arquitetura de interiores: abreviaturas inglesas e nomes coreanos ; KS Q 8001:2024 Requisitos gerais para a certificação de produtos (em vigor desde 2024-10-31) ; Reforma do sistema de certificação KS, fevereiro de 2026 (revogação por não conformidade deliberada, inspeção de produto único, rastreio alargado de marcas falsificadas) ; K-ETS fase 4 (2026–2030): o sector da construção entra na quota de emissões e o G-SEED pontua a DAP\",\"Fontes: normas KS, especificações KCS/ECS, Código de Construção do MOLIT e a prática coreana de quadros de materiais. Os acréscimos de 2026 seguem a KS Q 8001:2024 e a certificação KS reformada.\"\nkr,ru,Республика Корея,\"В Республике Корея легенды материалов проектные бюро и подрядчики составляют свободно, опираясь на стандарты KS и спецификации строительных работ KCS/ECS. Сокращения в основном английские, дополненные корейскими наименованиями.\",\"SB в старых системах означает акриловую краску, а в новых — нержавейку. С 2026 года реформа системы сертификации KS и четвёртый этап K-ETS (2026–2030) делают сертификат KS и декларацию EPD / углеродный след обязательными при приёмке материалов на объекте; убедитесь, что поставщик их предоставит, прежде чем пользоваться этой таблицей.\",\"Ориентиры: KS F 2271, KS M 3802, KS F 3200, KCS/ECS. Реформа 2026 года по системе сертификации KS и четвёртый этап K-ETS (2026–2030) переносят подтверждение соответствия материалов от выборочного контроля на объекте к предварительным документам.\",\"Стандарты KS: KS F 2271 методы испытаний строительных материалов, KS M 3802 эластичные напольные покрытия, KS F 3200 напольные покрытия ; KCS / ECS Стандартные спецификации строительных работ (Национальный центр стандартов) ; Министерство земли и инфраструктуры — Строительный кодекс, разделы по производству работ (отделка, электрика, сантехника) ; Практика корейских институтов архитектуры интерьера: английские сокращения при корейских наименованиях ; KS Q 8001:2024 Общие требования к сертификации продукции (введён в действие 2024-10-31) ; Реформа системы сертификации KS, февраль 2026 (отзыв сертификата за умышленное несоответствие, институт проверки единичной продукции, расширенный контроль поддельных знаков) ; K-ETS, этап 4 (2026–2030): строительный сектор включён в квоты выбросов, G-SEED учитывает ЭПД\",\"Источники: стандарты KS, спецификации KCS/ECS, Строительный кодекс MOLIT и принятая в Корее практика ведомостей материалов. Дополнения 2026 года опираются на KS Q 8001:2024 и обновлённую систему сертификации KS.\"\nwest,fr,Occident (US / UK / UE),\"Les légendes occidentales s'écrivent en anglais et emploient des abréviatures du métier comme Gypsum Board, Acoustic Ceiling Tile, VCT/LVP, MDF ou WBP. L'éclairage distingue le luminaire (LT) du downlight (DL) et les panneaux de sortie sont notés EX. Noter que Matt (MT) dans le tableau des finitions entre en conflit avec Metal (MT) dans celui des matériaux. Deux mises à jour de 2026 touchent directement la lecture des plans : CSI MasterFormat 2026 a appliqué des mises à jour de maintien à la division 09 Finishes (clarifications de titres et petites réorganisations ; 2 185 entrées nouvelles et 617 réorganisées au total, plus de 80 pour cent du changement structurel portant sur Division 32 Exterior Improvements et Division 34 Transportation), et NBS Uniclass a étendu sa table CAD lors des mises à jour trimestrielles de janvier, avril et juillet 2026 pour permettre une convention de nommage des calques AutoCAD alignée sur les normes ISO.\",Les abréviations sont définies par chaque architecte : MR peut valoir Marble ou Mirror selon le projet.,\"Renvois : CSI MasterFormat, NBS Source, BS 8300, BS EN 14411, DIN 18202, EN 12004.\",\"États-Unis : CSI MasterFormat 2026 (2 185 entrées nouvelles et 617 réorganisées ; la division 09 Finishes ainsi que les divisions 01, 06, 10 et 26 ont reçu des mises à jour de maintien, tandis que Division 32 Exterior Improvements et Division 34 Transportation concentrent plus de 80 pour cent du changement structurel) et les normes de produit ASTM et AWI ; Royaume-Uni : NBS Source Work Sections 05 et 06, et les tables NBS Uniclass (mises à jour trimestrielles de janvier, avril et juillet 2026 : la version de janvier a étendu la table CAD pour la convention de nommage des calques AutoCAD alignée sur l'ISO et a ajouté des codes d'emprise et de surface extérieure brute, celle d'avril a ajouté 12 classifications et modifié 40 codes, celle de juillet a ajouté 42 classifications, modifié 5 codes et renommé Smoke dampers en Smoke control dampers ; la correspondance complète avec NRM3 est en cours), avec BS 8300 et BS EN 14411 ; Europe : EN 1991–1995 Eurocodes, DIN 18202 Drylining, EN 12004 Adhesives for tiling ; Pratique du Finish Schedule propre à l'architecte et des fiches produit (les abréviations américaines sont plus longues et propres à chaque projet)\",\"Sources : CSI MasterFormat 2026 des États-Unis (division 09 Finishes) avec les normes ASTM/AWI, NBS Source Work Sections 05/06 et les mises à jour trimestrielles d'Uniclass 2026 du Royaume-Uni, BS 8300, BS EN 14411, les Eurocodes européens, DIN 18202 et EN 12004, plus la pratique du Finish Schedule propre à l'architecte.\"\nwest,it,Occidente (USA / UK / UE),\"Le legende occidentali si scrivono in inglese e usano abbreviazioni di settore come Gypsum Board, Acoustic Ceiling Tile, VCT/LVP, MDF e WBP. L'illuminazione distingue il luminaire (LT) dal downlight (DL) e la segnaletica di uscita è EX. Si noti che Matte (MT) nel quadro delle finiture coincide con Metal (MT) nel quadro dei materiali. Due aggiornamenti del 2026 incidono direttamente sulla lettura dei disegni: CSI MasterFormat 2026 ha applicato aggiornamenti di manutenzione alla divisione 09 Finishes (chiarimenti di titolo e piccole riorganizzazioni; 2.185 nuove voci e 617 riorganizzate complessivamente, con oltre l'80 per cento delle modifiche strutturali in Division 32 Exterior Improvements e Division 34 Transportation), e NBS Uniclass ha esteso la tabella CAD nelle revisioni trimestrali di gennaio, aprile e luglio 2026 per supportare una convenzione di denominazione dei layer AutoCAD allineata alle norme ISO.\",Le abbreviazioni sono definite da ciascun architetto: MR può valere Marble o Mirror secondo il progetto.,\"Riferimenti: CSI MasterFormat, NBS Source, BS 8300, BS EN 14411, DIN 18202, EN 12004.\",\"Stati Uniti: CSI MasterFormat 2026 (2.185 nuove voci e 617 riorganizzate; la divisione 09 Finishes insieme alle divisioni 01, 06, 10 e 26 hanno ricevuto aggiornamenti di manutenzione, mentre Division 32 Exterior Improvements e Division 34 Transportation concentrano oltre l'80 per cento delle modifiche strutturali) e le norme di prodotto ASTM e AWI ; Regno Unito: NBS Source Work Sections 05 e 06 e le tabelle NBS Uniclass (revisioni trimestrali di gennaio, aprile e luglio 2026: la versione di gennaio ha esteso la tabella CAD per la denominazione dei layer AutoCAD allineata all'ISO e ha aggiunto i codici di footprint dell'edificio e di superficie esterna lorda, quella di aprile ha aggiunto 12 classificazioni e modificato 40, quella di luglio ha aggiunto 42 classificazioni, modificato 5 e rinominato Smoke dampers in Smoke control dampers; la corrispondenza completa con NRM3 è in corso), con BS 8300 e BS EN 14411 ; Europa: EN 1991–1995 Eurocodes, DIN 18202 Drylining, EN 12004 Adhesives for tiling ; Pratica del Finish Schedule redatto dall'architetto e delle schede di prodotto (le abbreviazioni US sono più lunghe e variano da progetto a progetto)\",\"Fonti: CSI MasterFormat 2026 degli Stati Un
