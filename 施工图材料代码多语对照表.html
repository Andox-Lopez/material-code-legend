<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117; --bg2:#0a0e14; --panel:#141a22; --panel2:#182029;
  --line:#232c38; --line2:#2c3644;
  --ink:#e7eef6; --ink2:#c3cedb; --muted:#8b98a9; --faint:#5d6b7c;
  --accent:#4da3ff; --accent-soft:rgba(77,163,255,.13); --accent-line:rgba(77,163,255,.4);
  --warn:#f0b429; --warn-soft:rgba(240,180,41,.1); --warn-line:rgba(240,180,41,.35);
  --ok:#3fd08a; --shadow:0 10px 30px rgba(0,0,0,.35); --radius:14px;
}
html[data-theme="light"]{
  --bg:#f4f6f9; --bg2:#eef1f5; --panel:#ffffff; --panel2:#f8fafc;
  --line:#e2e8f0; --line2:#d5dde7;
  --ink:#0f172a; --ink2:#26344a; --muted:#5c6b7f; --faint:#8797a8;
  --accent:#0f4c81; --accent-soft:rgba(15,76,129,.08); --accent-line:rgba(15,76,129,.28);
  --warn:#a15c07; --warn-soft:rgba(161,92,7,.08); --warn-line:rgba(161,92,7,.28);
  --ok:#12775a; --shadow:0 8px 24px rgba(15,23,42,.08);
}
body{
  font-family:"Inter","Segoe UI",system-ui,-apple-system,"Microsoft YaHei","PingFang SC",
    "Hiragino Sans GB","Noto Sans CJK SC","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;transition:background .25s,color .25s;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(90deg,var(--accent-soft) 1px,transparent 1px) 0 0/56px 56px,
    linear-gradient(var(--accent-soft) 1px,transparent 1px) 0 0/56px 56px;
  opacity:.5;
}
.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:30px 26px 80px}

/* ---------- hero ---------- */
.hero{
  border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(160deg,var(--panel) 0%,var(--bg2) 100%);
  padding:24px 26px 20px;box-shadow:var(--shadow);
}
/* 头部固定两行：标题行 + 控件行，不随语言与窗口宽度浮动 */
.hero-top{display:flex;gap:14px 20px;align-items:flex-start;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center;flex:1 1 100%;min-width:0}
.logo{
  width:46px;height:46px;flex:0 0 46px;border-radius:13px;overflow:hidden;line-height:0;
  box-shadow:0 4px 14px rgba(10,58,102,.28)
}
.logo svg{width:100%;height:100%;display:block}
h1{font-size:24px;font-weight:700;letter-spacing:.4px;line-height:1.25}
h1 em{font-style:normal;color:var(--accent)}
.sub{color:var(--muted);font-size:12.8px;margin-top:5px}
/* 控件组永不内部换行：宽度不足时整组移到标题下方，各语言表现一致 */
.hero-tools{display:flex;gap:14px;align-items:flex-end;flex-wrap:nowrap;min-width:0;flex:1 1 100%;justify-content:flex-start}
.lang-pick{display:flex;flex-direction:column;gap:4px;min-width:0}
.lang-pick select{
  border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;
  padding:8px 30px 8px 12px;font-size:13px;font-family:inherit;cursor:pointer;outline:none;
  appearance:none;-webkit-appearance:none;min-width:152px;text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat
}
.lang-pick select:hover{border-color:var(--accent-line)}
.hero-btns{display:flex;gap:8px;align-items:center;padding-bottom:1px}
.icon-btn{
  border:1px solid var(--line);background:var(--panel2);color:var(--ink2);cursor:pointer;
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;transition:.16s
}
.icon-btn:hover{border-color:var(--accent-line);color:var(--accent)}
.icon-btn svg{width:18px;height:18px}
.region-pick{display:flex;flex-direction:column;gap:4px;flex:0 1 auto;min-width:0}
.region-pick span{font-size:10.5px;color:var(--faint);letter-spacing:.5px;padding-left:3px;white-space:nowrap}
.region-pick select{
  border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;
  padding:8px 30px 8px 12px;font-size:13px;font-family:inherit;cursor:pointer;outline:none;
  appearance:none;-webkit-appearance:none;max-width:196px;text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat
}
.region-pick select:hover{border-color:var(--accent-line)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stat{
  border:1px solid var(--line);background:var(--panel2);border-radius:10px;
  padding:8px 14px;min-width:96px
}
.stat b{display:block;font-size:18px;color:var(--accent);line-height:1.2;font-family:"Consolas","SF Mono",monospace}
.stat span{font-size:11.5px;color:var(--muted)}

/* ---------- notice ---------- */
body.loading #main{opacity:.35}
.boot-err{display:none;margin-top:14px;border:1px solid var(--warn-line);background:var(--warn-soft);
  border-radius:10px;padding:12px 16px;color:var(--warn);font-size:13px}
.update-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.update-btn{
  border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);
  border-radius:999px;padding:4px 14px;font-size:12px;font-family:inherit;cursor:pointer;transition:.16s
}
.update-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.update-btn[disabled]{opacity:.55;cursor:default}
.update-note{font-size:11.8px;color:var(--muted)}
.notice{
  margin-top:16px;border:1px solid var(--warn-line);background:var(--warn-soft);
  border-left:3px solid var(--warn);border-radius:0 12px 12px 0;padding:14px 18px;
  font-size:12.8px;color:var(--ink2);line-height:1.75
}
.notice b{color:var(--warn)}
.notice .warnline{display:block;margin-top:6px;color:var(--muted)}
.region-note{
  margin-top:16px;border:1px solid var(--accent-line);background:var(--accent-soft);
  border-left:3px solid var(--accent);border-radius:0 12px 12px 0;padding:14px 18px;
  font-size:12.8px;color:var(--ink2);line-height:1.75
}
.region-note b{color:var(--accent)}
.region-note .rf{font-size:15px;margin-right:6px}
.region-note .rmeta{margin-left:10px;color:var(--muted);font-size:12.2px}
.region-note .warnline{display:block;margin-top:6px;color:var(--muted)}
/* ---------- 本地区资料依据 ---------- */
.sources{
  margin-top:14px;border:1px solid var(--line);background:var(--panel);
  border-radius:12px;padding:14px 18px;font-size:12.6px;color:var(--ink2)
}
.sources-head{
  font-size:12.6px;font-weight:700;color:var(--ink);display:flex;align-items:center;
  gap:10px;flex-wrap:wrap;margin-bottom:9px
}
.sources-head:before{content:"";width:4px;height:15px;background:var(--accent);border-radius:2px;flex:0 0 4px}
.sources-head em{font-style:normal;font-weight:400;font-size:11.8px;color:var(--muted)}
.sources ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:6px 22px}
.sources li{position:relative;padding-left:15px;line-height:1.65;color:var(--ink2)}
.sources li:before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--accent-line)}

/* ---------- toolbar ---------- */
.toolbar{
  position:sticky;top:0;z-index:40;margin-top:18px;padding:12px 0 10px;
  background:linear-gradient(var(--bg) 72%,transparent);backdrop-filter:blur(10px)
}
.tabs{display:flex;gap:7px;flex-wrap:wrap}
.tab{
  border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:999px;
  padding:6px 15px;font-size:12.8px;cursor:pointer;transition:.16s;font-family:inherit;white-space:nowrap
}
.tab:hover{border-color:var(--accent-line)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
html[data-theme="light"] .tab.on{color:#fff}
.searchrow{display:flex;gap:12px;align-items:center;margin-top:11px;flex-wrap:wrap}
.search{
  flex:1 1 320px;display:flex;align-items:center;gap:9px;border:1px solid var(--line);
  background:var(--panel);border-radius:11px;padding:0 12px;transition:.16s
}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{width:16px;height:16px;color:var(--muted);flex:0 0 16px}
.search input{
  flex:1;border:0;background:transparent;color:var(--ink);font-family:inherit;font-size:13.4px;
  padding:10px 0;outline:none;min-width:120px
}
.search input::-webkit-search-cancel-button{display:none}
.clear-btn{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:16px;line-height:1;padding:4px}
.clear-btn:hover{color:var(--danger)}
.seg{display:flex;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:3px;gap:3px}
.seg button{
  border:0;background:transparent;color:var(--muted);padding:5px 13px;border-radius:8px;
  font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s
}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.count{font-size:12.2px;color:var(--muted);white-space:nowrap}

/* ---------- section ---------- */
section.blk{margin-top:26px}
h2{
  font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-bottom:11px
}
h2:before{content:"";width:4px;height:17px;background:var(--accent);border-radius:2px;flex:0 0 4px}
h2 em{font-style:normal;font-weight:400;font-size:12px;color:var(--muted)}
.h2count{
  margin-left:auto;font-size:11.5px;color:var(--muted);border:1px solid var(--line);
  border-radius:999px;padding:2px 10px;font-family:"Consolas","SF Mono",monospace
}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow)
}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.2px;min-width:720px}
thead th{
  background:var(--panel2);text-align:left;font-weight:600;font-size:11.8px;color:var(--muted);
  padding:11px 13px;border-bottom:1px solid var(--line);letter-spacing:.4px;white-space:nowrap;
  position:sticky;top:0
}
tbody td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink2)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--accent-soft)}
td.code,th.code{
  font-family:"Consolas","SF Mono","JetBrains Mono",monospace;font-weight:700;color:var(--accent);
  white-space:nowrap;letter-spacing:.6px;cursor:copy;font-size:13.4px
}
td.code:hover{text-decoration:underline dotted}
td.full{color:var(--muted);font-size:12.4px}
td.name{color:var(--ink);font-weight:600}
td.desc{color:var(--ink2);font-size:12.8px}
td.note{color:var(--muted);font-size:12.2px}
tr.conflict td.code{color:var(--warn)}
.badge{
  display:inline-block;font-size:10.5px;border-radius:5px;padding:1px 7px;margin-left:6px;
  background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line);vertical-align:1px
}
.badge.region{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.badge.base{
  background:transparent;color:var(--faint);border-color:var(--line2);font-weight:400;
  font-family:"Consolas",monospace;margin-left:6px
}
.subname{display:block;font-size:11.8px;color:var(--faint);font-weight:400;margin-top:2px}
.rnote{
  display:block;margin-bottom:5px;padding-left:8px;border-left:2px solid var(--accent);
  color:var(--accent);font-size:12px
}
mark{background:rgba(240,180,41,.32);color:inherit;padding:0 2px;border-radius:3px}
html[data-theme="light"] mark{background:rgba(240,180,41,.42)}

/* ---------- 地区对照表 ---------- */
.diffmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.dcell{
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--panel);
  display:flex;flex-direction:column;gap:4px
}
.dcell .dtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dcell .from{font-family:"Consolas",monospace;font-size:11.5px;color:var(--faint)}
.dcell .arrow{color:var(--muted);font-size:11px}
.dcell .to{font-family:"Consolas",monospace;font-weight:700;color:var(--accent);font-size:14px;letter-spacing:.5px}
.dcell .dn{font-size:12.6px;color:var(--ink);font-weight:600}
.dcell .df{font-size:11.6px;color:var(--muted)}
.dcell .dnote{font-size:11.5px;color:var(--faint);border-top:1px dashed var(--line);padding-top:4px}

/* ---------- rules ---------- */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:13px}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px}
.rule h3{font-size:13.2px;margin-bottom:8px;color:var(--accent)}
.rule .eg{
  font-family:"Consolas",monospace;font-size:12px;background:var(--accent-soft);color:var(--ink);
  padding:4px 9px;border-radius:6px;display:inline-block;margin-bottom:9px;word-break:break-all
}
.rule p{font-size:12.4px;color:var(--muted);line-height:1.7}

/* ---------- index cards ---------- */
.idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.icard{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;
  cursor:pointer;transition:.16s;display:flex;flex-direction:column;gap:5px
}
.icard:hover{border-color:var(--accent-line);transform:translateY(-2px);box-shadow:var(--shadow)}
.icard .code{
  font-family:"Consolas","SF Mono",monospace;font-weight:700;color:var(--accent);
  font-size:15px;letter-spacing:.8px;display:flex;align-items:center;gap:8px
}
.icard .full{font-size:12.2px;color:var(--ink2);line-height:1.5}
.icard .name{font-size:12.4px;color:var(--muted);font-weight:600}
.icard .grp{
  font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-radius:5px;
  padding:1px 6px;margin-left:auto
}
.letter{
  grid-column:1/-1;font-size:12px;font-weight:700;color:var(--accent);
  border-bottom:1px solid var(--line);padding-bottom:5px;margin-top:6px;letter-spacing:1px
}

/* ---------- footer ---------- */
.foot{margin-top:36px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:12.2px;line-height:1.85}
.foot p{margin-bottom:5px}
.foot b{color:var(--ink2)}
.foot .muted{color:var(--faint);font-size:11.6px;margin-top:8px}
.empty{padding:38px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:12.8px;
  z-index:90;transition:.22s;box-shadow:var(--shadow)
}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .wrap{padding:18px 14px 60px}
  h1{font-size:20px}
  .hero{padding:18px 16px 16px}
  .hero-tools{width:100%}
}
/* 手机上控件自身折行（桌面与平板仍保持两行结构） */
/* 手机端：地区 / 语言 / (主题+打印) 三栏 */
@media (max-width:560px){
  .hero-tools{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
  .region-pick select,.lang-pick select{width:100%;min-width:0;max-width:none;padding-right:26px}
  .region-pick span,.lang-pick span{font-size:10px}
  .hero-btns{gap:6px}
  .icon-btn{width:34px;height:34px}
}
@media print{
  body{background:#fff;color:#000}
  body::before{display:none}
  .toolbar,.hero-tools,.idx,.region-pick{display:none!important}
  .hero,.card,.rule,.dcell{box-shadow:none;border-color:#ccc;background:#fff}
  .wrap{max-width:none;padding:0}
  tbody tr{break-inside:avoid}
  thead th{position:static}
}

 너베인 마감, 목재 몰딩, 걸레받이, 목재 그릴\",일부 프로젝트에서는 목재 마루를 WF로 별도 표기\nmat,WD,es,\"Madera maciza, chapa natural, molduras, rodapié, rejillas de madera\",En algunos proyectos el parqué de madera se codifica aparte como WF\nmat,WF,zh,实木地板、多层复合地板、竹木地板、SPC 木纹,部分体系直接并入 WD\nmat,WF,en,\"Solid wood flooring, engineered flooring, bamboo flooring, SPC wood-look\",Some systems merge it into WD\nmat,WF,ja,無垢フローリング、積層フローリング、竹フローリング、SPC 木目,一部のシステムでは WD に統合される\nmat,WF,ko,\"원목 마루, 다층 마루, 대나무 마루, SPC 목재 패턴\",일부 체계에서는 WD로 통합\nmat,WF,es,\"Parqué macizo, tarima multicapa, parqué de bambú, SPC imitación madera\",Algunos sistemas lo incluyen en WD\nmat,GL,zh,钢化、夹胶、夹丝、磨砂、艺术、烤漆玻璃,烤漆玻璃、夹丝玻璃常细分为 GL-0x\nmat,GL,en,\"Tempered, laminated, wired, frosted, art and lacquered glass\",Lacquered and wired glass are often subdivided as GL-0x\nmat,GL,ja,強化、複層、網入、曇り、アート、焼付ガラス,焼付ガラスと網入ガラスは GL-0x に細分されることが多い\nmat,GL,ko,\"강화, 접합, 와이어, 샌드블라스트, 아트, 래커 유리\",래커·와이어 유리는 GL-0x로 세분하는 경우가 많음\nmat,GL,es,\"Templado, laminado, armado, esmerilado, artístico y lacado\",El lacado y el armado suelen subdividirse como GL-0x\nmat,MR,zh,银镜、灰镜、茶镜、黑镜、装饰镜,也写作 GM（Mirror）或 BE\nmat,MR,en,\"Silvered, grey, bronze, black and decorative mirrors\",Also written GM (Mirror) or BE\nmat,MR,ja,銀鏡、グレーミラー、ブラウンミラー、黒鏡、装飾鏡,GM（Mirror）や BE と表記されることもある\nmat,MR,ko,\"은거울, 그레이 미러, 브라운 미러, 블랙 미러, 장식 거울\",GM(Mirror) 또는 BE로 표기하기도 함\nmat,MR,es,\"Espejos plateados, grises, bronce, negros y decorativos\",También se escribe GM (Mirror) o BE\nmat,MT,zh,不锈钢、铜、铁艺、铝板、金属网、金属编织,常细分为 SS 不锈钢、BR 铜、AL 铝\nmat,MT,en,\"Stainless steel, copper, ironwork, aluminium panels, metal mesh\",\"Often subdivided as SS stainless, BR bronze, AL aluminium\"\nmat,MT,ja,ステンレス、銅、鉄工、アルミパネル、メタルメッシュ,SS ステンレス、BR 真鍮、AL アルミなどに細分される\nmat,MT,ko,\"스테인리스, 구리, 철공예, 알루미늄 패널, 메탈 메시\",\"SS 스테인리스, BR 구리, AL 알루미늄 등으로 세분\"\nmat,MT,es,\"Acero inoxidable, cobre, hierro forjado, panel de aluminio, malla metálica\",\"Suele subdividirse: SS acero, BR bronce, AL aluminio\"\nmat,AL,zh,铝扣板、铝单板、铝方通、铝塑板、铝格栅,铝合金门窗/型材也用 AL\nmat,AL,en,\"Aluminium ceiling tiles, solid panels, square baffles, composite panels, grilles\",\"Also used for aluminium doors, windows and profiles\"\nmat,AL,ja,アルミ天井板、アルミ単板、アルミバッフル、アルミ複合板、アルミ格子,アルミ窓・形材にも AL を使う\nmat,AL,ko,\"알루미늄 천장판, 알루미늄 단판, 알루미늄 방울, 알루미늄 복합판, 알루미늄 그릴\",알루미늄 창호·프레이밍에도 AL 사용\nmat,AL,es,\"Placas de techo, panel liso, deflectores cuadrados, panel compuesto, rejillas de aluminio\",\"También para ventanas, puertas y perfiles de aluminio\"\nmat,MC,zh,铝塑复合板、铝蜂窝板、钛锌复合板,也有项目 MC = 微水泥，务必核对\nmat,MC,en,\"Aluminium composite panel, honeycomb panel, titanium-zinc composite\",In some projects MC = micro cement — always verify\nmat,MC,ja,アルミ複合板、アルミハニカム板、亜鉛・チタン複合板,MC = マイクロセメントとなるプロジェクトもあるため必ず確認\nmat,MC,ko,\"알루미늄 복합판, 알루미늄 허니콤 패널, 아연-티타늄 복합판\",\"일부 프로젝트에서는 MC = 마이크로 시멘트, 반드시 확인\"\nmat,MC,es,\"Panel de aluminio, panel de nido de abeja, panel de zinc-titanio\",\"En algunos proyectos MC = microcemento, verifique siempre\"\nmat,CT,zh,地砖、墙砖、抛光砖、仿古砖、玻化砖、马赛克砖,最通用写法；与 TL 二选一，勿混用\nmat,CT,en,\"Floor and wall tiles, polished, rustic and vitrified tiles, mosaic tiles\",\"The most common code; use either CT or TL, never both\"\nmat,CT,ja,床タイル、壁タイル、研磨タイル、古色タイル、磁器タイル、モザイクタイル,最も汎用の表記。TL との併用には注意\nmat,CT,ko,\"바닥·벽 타일, 폴리싱 타일, 앤티크 타일, 비자화 타일, 모자이크 타일\",가장 범용적인 표기. TL과 병행 금지\nmat,CT,es,\"Baldosas de suelo y pared, pulidas, tipo rústico, vitrificadas y de mosaico\",\"La forma más común: use CT o TL, nunca ambas\"\nmat,TL,zh,同上，泛指面砖类,与 CT 同义，部分港资/外资图纸用 TL\nmat,TL,en,Same as CT — refers to tiles in general,Synonym of CT; used by some Hong Kong and foreign-funded drawings\nmat,TL,ja,タイル類全般,CT と同義で、一部の香港・外資図面で使用\nmat,TL,ko,\"동일, 타일류 총칭\",CT와 동치. 일부 홍콩·외자 도면에서 사용\nmat,TL,es,Igual que CT: denominación genérica de tile,Sinónimo de CT; usado en algunos planos de inversión extranjera\nmat,MO,zh,陶瓷马赛克、玻璃马赛克、石材马赛克、金属马赛克,也写作 MS\nmat,MO,en,\"Ceramic, glass, stone and metal mosaics\",Also written MS\nmat,MO,ja,セラミックモザイク、ガラスモザイク、石材モザイク、金属モザイク,MS と表記されることもある\nmat,MO,ko,세라믹·유리·석재·금속 모자이크,MS로 표기하기도 함\nmat,MO,es,\"Mosaicos de cerámica, vidrio, piedra y metal\",También se escribe MS\nmat,CA,zh,满铺地毯、方块地毯、手工毯、地毯拼花,软装类也用它做地毯编号\nmat,CA,en,\"Wall-to-wall carpet, carpet tiles, handmade rugs, rug patterns\",Also used to number carpets in FF&E schedules\nmat,CA,ja,全面カーペット、タイルカーペット、手織りラグ、カーペットデザイン,FF&E リストでもカーペットの記号として使う\nmat,CA,ko,\"양탄자 카펫, 타일 카펫, 수공 러그, 카펫 패턴\",FF&E 리스트에서도 카펫 번호로 사용\nmat,CA,es,\"Moqueta de suelo continuo, moqueta en baldosas, alfombras artesanas, motivos de moqueta\",También se usa para numerar alfombras en listas de FF&E\nmat,WC,zh,墙纸、墙布、壁布、草编/木纹壁纸,也写作 WP（Wall Paper）\nmat,WC,en,\"Wallpaper, wall cloth, non-woven wallcovering, grass and wood-grain papers\",Also written WP (Wall Paper)\nmat,WC,ja,壁紙、壁クロス、不織布クロス、藁目クロス・木目クロス,WP（Wall Paper）と表記されることもある\nmat,WC,ko,\"벽지, 벽포, 비천 벽지, 풀·나뭇결 벽지\",WP(Wall Paper)로 표기하기도 함\nmat,WC,es,\"Papel pintado, tela mural, papel pintado no tejido, mimbres y veta de madera\",También se escribe WP (Wall Paper)\nmat,CU,zh,卷帘、拉帘、纱帘、遮光帘、电动帘,铜的化学符号 Cu 也用 CU，注意冲突\nmat,CU,en,\"Roller blinds, drapes, sheer curtains, blackout and motorised blinds\",CU is also the chemical symbol for copper — watch for conflicts\nmat,CU,ja,ロールスクリーン、ドレープ、シアーカーテン、调光スクリーン、電動スクリーン,CU は Cu（銅の元素記号）と重複する表記なので紛らわしい\nmat,CU,ko,\"롤스크린, 드레이프, sheer 커튼, 암전 블라인드, 전동 블라인드\",Cu(구리) 화학기호와 충돌 주의\nmat,CU,es,\"Persianas enrollables, cortinas, visillos, opacos y motorizados\",CU es también el símbolo químico del cobre: cuidado con los conflictos\nmat,FA,zh,扪布、布艺软包、窗纱、纱线织物,旧体系把皮革一并归入 FA\nmat,FA,en,\"Upholstery fabric, textile soft furnishings, sheers, woven textiles\",Older systems also file leather under FA\nmat,FA,ja,張り布、布張り、ソフトファニリング、シアー、織物,以前のシステムでは革も FA に含めていた\nmat,FA,ko,\"패브릭 패딩, 패브릭 소프트 퍼니싱, sheer, 직조물\",구 체계에서는 가죽도 FA에 포함\nmat,FA,es,\"Tapicería, acolchados textiles, visillos, tejidos\",Los sistemas antiguos incluyen también la piel en FA\nmat,UP,zh,皮革硬包、布艺软包、吸音软包,较新的精装图纸常用\nmat,UP,en,\"Leather upholstery, textile upholstery, acoustic upholstery\",Common in recent interior fit-out drawings\nmat,UP,ja,革張り、布張り、吸音張り地,近年の内装施工図で一般的に使用\nmat,UP,ko,\"가죽 하드패널, 패브릭 소프트 패널, 흡음 패널\",최신 인테리어 도면에서 자주 사용\nmat,UP,es,\"Panelado en piel, acolchado textil, paneles acústicos\",Habitual en planos de decoración de reciente creación\nmat,LE,zh,真皮、超纤皮、PU 人造革、再生皮,也写作 LT\nmat,LE,en,\"Genuine leather, microfibre leather, PU synthetic leather, regenerated leather\",Also written LT\nmat,LE,ja,本革、マイクロファイバーレザー、PU 合成革、再生革,LT と表記されることもある\nmat,LE,ko,\"천연가죽, 마이크로파이버 가죽, PU 합성가죽, 재생가죽\",LT로 표기하기도 함\nmat,LE,es,\"Piel natural, piel de microfibra, piel sintética PU, piel regenerada\",También se escribe LT\nmat,PT,zh,乳胶漆、木器漆、氟碳喷涂、调和漆,最通用的涂料代码\nmat,PT,en,\"Emulsion paint, wood paint, fluorocarbon coating, mixed paint\",The most universal paint code\nmat,PT,ja,ラテックス塗装、木器塗装、フッ素樹脂塗装、調合塗料,最も汎用の塗料コード\nmat,PT,ko,\"라텍스 페인트, 목재 도료, 플루오로카본 코팅, 혼합 페인트\",가장 범용적인 도료 코드\nmat,PT,es,\"Pintura plástica, barniz para madera, recubrimiento de fluorocarbono, pintura preparada\",El código de pintura más universal\nmat,SP,zh,马来漆、微水泥、硅藻泥、肌理漆、艺术涂料,SP 也常被用作 射灯 Spot Light，见冲突表\nmat,SP,en,\"Malaysian paint, micro cement, diatomaceous earth, textured paint, artistic paint\",SP is also used for spot light — see the conflict table\nmat,SP,ja,マレーペイント、マイクロセメント、珪藻土系塗料、テクスチャ塗装、アート塗装,SP はスポットライトとしても使われ、衝突表を参照\nmat,SP,ko,\"말레이 페인트, 마이크로 시멘트, 규조토, 텍스처 페인트, 아트 페인트\",\"SP는 스포트라이트로도 사용됨, 충돌표 참조\"\nmat,SP,es,\"Pintura malaya, microcemento, tierra de diatomeas, pintura texturizada, pintura artística\",SP también se usa para el foco (Spot Light): véase la tabla de conflictos\nmat,PL,zh,亚克力板、PC 耐力板、灯片、塑料线条,旧体系 PL = 乳胶漆，冲突高发\nmat,PL,en,\"Acrylic sheet, polycarbonate sheet, light diffusers, plastic profiles\",Older systems use PL for emulsion paint — a frequent source of conflict\nmat,PL,ja,アクリル板、PC 板、ライト板、樹脂見切り,以前のシステムでは PL = ラテックス塗装、衝突が多い\nmat,PL,ko,\"아크릴판, PC 내력판, 조명판, 플라스틱 몰딩\",\"구 체계에서 PL = 라텍스 페인트, 충돌 빈번\"\nmat,PL,es,\"Plancha de acrílico, policarbonato, difusores, perfiles plásticos\",Los sistemas antiguos usan PL para pintura plástica: conflicto frecuente\nmat,AC,zh,亚克力透光板、灯箱面板、雕刻立体字,也有体系 AC = 矿棉板 Acoustic Ceiling\nmat,AC,en,\"Translucent acrylic panels, light box panels, engraved 3D letters\",Some systems use AC for acoustic ceiling\nmat,AC,ja,アクリル透過板、ライトボックスパネル、立体彫刻文字,仕様によっては AC = 吸音天井（Acoustic Ceiling）\nmat,AC,ko,\"아크릴 투광판, 라이트박스 패널, 입체 각인 글자\",일부 체계에서 AC = 흡음 천장(Aoustic Ceiling)\nmat,AC,es,\"Panel de acrílico translúcido, panel de caja de luz, letras 3D grabadas\",En algunos sistemas AC = techo acústico (Acoustic Ceiling)\nmat,PB,zh,纸面石膏板、防潮石膏板、水泥板、硅酸钙板,基层材料，也用于造型天花\nmat,PB,en,\"Paper-faced plasterboard, moisture-resistant board, cement board, calcium silicate board\",\"Base material, also used for shaped ceilings\"\nmat,PB,ja,化粧石膏ボード、耐湿石膏ボード、セメントボード、珪酸カルシウムボード,下地材で、化粧天井の造形にも使う\nmat,PB,ko,\"종이 석고보드, 내습 석고보드, 시멘트보드, 규산칼슘 보드\",\"바탕재로 사용, 장식 천장에도 적용\"\nmat,PB,es,\"Placa de yeso con papel, placa resistente a la humedad, fibrocemento, calcio-silicato\",Material base; también para techos con formas\nmat,LP,zh,防火板、抗倍特板、饰面三聚氰胺板,也写作 LM\nmat,LP,en,\"Laminates, compact HPL, decorative melamine boards\",Also written LM\nmat,LP,ja,化粧板、コンパクト板、装飾用 melamine 板,LM と表記されることもある\nmat,LP,ko,\"라미네이트, 내배트 판, 장식 멜라민 보드\",LM으로 표기하기도 함\nmat,LP,es,\"Laminados, compactos HPL, melamina decorativa\",También se escribe LM\nmat,SF,zh,金箔、银箔、树脂板、夯土板、透光石,也有体系 SF = 金银箔 Silver Foil\nmat,SF,en,\"Gold leaf, silver leaf, resin panels, rammed earth panels, translucent stone\",Some systems use SF for silver foil\nmat,SF,ja,ゴールドリーフ（Gold Leaf）、銀箔、樹脂パネル、版築パネル、透過石材,仕様によっては SF = 銀箔（Silver Foil）を指すこともある\nmat,SF,ko,\"금박, 은박, 수지 패널, 람메드 어스 패널, 투광석\",일부 체계에서 SF = 금은박(Silver Foil)\nmat,SF,es,\"Pan de oro, pan de plata, paneles de resina, paneles de tierra apisonada, piedra traslúcida\",Algunos sistemas usan SF para el pan de plata (Silver Foil)\nmat,WR,zh,SBS 卷材、自粘防水膜、防水涂料卷材,多见于地面/卫生间做法表\nmat,WR,en,\"SBS membrane, self-adhesive waterproof film, coated waterproofing membrane\",Common in floor and wet-area build-up tables\nmat,WR,ja,SBS 防水シート、自己粘着防水膜、防水塗膜,床・水まわりの仕様表に頻出\nmat,WR,ko,\"SBS 방수 시트, 자착식 방수막, 방수 코팅 시트\",바닥·화장실 시공표에 자주 등장\nmat,WR,es,\"Membrana SBS, lámina autoadhesiva, membrana impermeabilizante pintada\",Habitual en cuadros de sols y zonas húmedas\nmat,VF,zh,PVC 卷材地板、石塑地板、同质透心地板,也写作 PC、LVT\nmat,VF,en,\"Sheet PVC flooring, luxury vinyl tile, homogeneous vinyl flooring\",Also written PC or LVT\nmat,VF,ja,塩ビシート、LVT タイル、均質塩ビタイル,PC や LVT と表記されることもある\nmat,VF,ko,\"PVC 시트 바닥, LVT, 무질 투심 바닥\",\"PC, LVT로 표기하기도 함\"\nmat,VF,es,\"PVC en bobina, baldosas LVT, vinilo homogéneo\",También se escribe PC o LVT\nmat,RF,zh,健身房、医院、实验室专用橡胶地板,较少见，运动空间常用\nmat,RF,en,\"Rubber flooring for gyms, hospitals and laboratories\",Less common; typical of sports spaces\nmat,RF,ja,ジム、病院、研究所向けのゴム床,比較的稀で、運動空間に多く使われる\nmat,RF,ko,\"체육관, 병원, 연구소용 고무 바닥\",\"드물게 사용, 운동 공간에 흔함\"\nmat,RF,es,\"Suelo de caucho para gimnasios, hospitales y laboratorios\",Menos habitual; típico de espacios deportivos\nmat,SC,zh,透光软膜、A 级防火膜、UV 打印膜,也写作 SMS、SZ；SC 也可能指屏风 Screen\nmat,SC,en,\"Translucent membrane, A-grade fire-rated membrane, UV printed membrane\",Also written SMS or SZ; SC may also mean screen\nmat,SC,ja,半透明フィルム、A 級防火膜、UV プリントフィルム,SMS、SZ とも表記され、SC は間仕切り（Screen）を指すこともある\nmat,SC,ko,\"투광 필름, A급 난연막, UV 인쇄 필름\",\"SMS, SZ로 표기하기도 함. SC는 스크린을 뜻하기도 함\"\nmat,SC,es,\"Lámina translúcida, lámina ignífuga clase A, lámina impresa UV\",También se escribe SMS o SZ; SC puede significar tabique (Screen)\nmat,AP,zh,木丝吸音板、聚酯纤维吸音板、穿孔吸音板,也有体系写作 AC\nmat,AP,en,\"Wood wool panels, polyester fibre panels, perforated panels\",Also written AC in some systems\nmat,AP,ja,木糸吸音板、ポリエステルファイバ吸音板、有孔吸音板,仕様によっては AC と表記\nmat,AP,ko,\"목사울 흡음판, 폴리에스터 섬유 흡음판, 타공 흡음판\",일부 체계에서 AC로 표기\nmat,AP,es,\"Paneles de lana de madera, de fibra de poliéster, perforados\",En algunos sistemas se escribe AC\nmat,PF,zh,玻璃膜、装饰膜、保护膜、车贴膜,临时/保护类也用它\nmat,PF,en,\"Glass film, decorative film, protective film, vehicle decal film\",Also used for temporary and protective films\nmat,PF,ja,ガラスフィルム、装飾フィルム、保護フィルム、車フィルム,仮材・保護材としても使用\nmat,PF,ko,\"유리 필름, 장식 필름, 보호 필름, 차량 필름\",임시·보호 용도로도 사용\nmat,PF,es,\"Película de vidrio, decorativa, de protección, para rotulación de vehículos\",También para films temporales y de protección\nobj,DL,zh,筒灯、射灯、灯带、吊灯、轨道灯等全套灯具,材料表里是“类别”；图例/型号里指筒灯\nobj,DL,en,\"Downlights, spotlights, LED tape, pendants, track lights — the full lighting set\",In the material schedule it is a category; in legends and model codes it means downlight\nobj,DL,ja,ダウンライト、スポットライト、LED テープ、ペンダント、トラックライト等の照明全般,マテリアル表では「分類」、凡例・型番ではダウンライトを指す\nobj,DL,ko,\"다운라이트, 스포트라이트, LED 테이프, 펜던트, 트랙라이트 등 전체 조명\",\"재료표에서는 분류, 범례·모델명에서는 다운라이트를 의미\"\nobj,DL,es,\"Downlights, focos, tiras LED, colgantes, focos de carril: el set completo\",\"En el cuadro de materiales es una categoría; en leyendas y modelos, un downlight\"\nobj,FR,zh,活动家具、固定家具、柜体、台面,也写作 FUR\nobj,FR,en,\"Loose furniture, fixed furniture, casework and counters\",Also written FUR\nobj,FR,ja,可動家具、造付家具、収納、カウンター,FUR と表記されることもある\nobj,FR,ko,\"이동 가구, 고정 가구, 수납장, 상판\",FUR로 표기하기도 함\nobj,FR,es,\"Mobiliario móvil, fijo, armarios y encimeras\",También se escribe FUR\nobj,HW,zh,门锁、合页、拉手、玻璃五金、结构五金,旧体系 HW = 洁具 + 五金\nobj,HW,en,\"Locks, hinges, handles, glass hardware and structural hardware\",Older systems use HW for sanitary ware plus hardware\nobj,HW,ja,建具金物、蝶番、引手、ガラス金物、構造金物,以前のシステムでは HW = 衛生器具 + 金物\nobj,HW,ko,\"문잠, 경첩, 손잡이, 유리 철물, 구조 철물\",구 체계에서 HW = 위생기구 + 철물\nobj,HW,es,\"Cerraduras, bisagras, tiradores, herrajes de vidrio y estructurales\",Los sistemas antiguos usan HW para sanitarios y herrajes\nobj,SW,zh,坐便器、台盆、龙头、花洒、地漏,也有体系写作 SAN\nobj,SW,en,\"WCs, basins, taps, showers and floor drains\",Some systems write SAN\nobj,SW,ja,洋式トイレ、洗面器、蛇口、シャワー、床排水,SAN と表記されることもある\nobj,SW,ko,\"변기, 세면대, 수도꼭지, 샤워기, 바닥배수구\",SAN으로 표기하기도 함\nobj,SW,es,\"Inodoros, lavabos, grifos, duchas y sumideros\",En algunos sistemas se escribe SAN\nobj,KIT,zh,操作台、烟罩、冷柜、洗碗机、厨具,也简写 K\nobj,KIT,en,\"Worktops, canopies, cold storage, dishwashers and cookware\",Also shortened to K\nobj,KIT,ja,調理台、排煙罩、冷蔵庫、食洗機、調理器具,K と略されることもある\nobj,KIT,ko,\"조리대, 후드, 냉장·냉동고, 식기세척기, 조리기구\",K로 축약하기도 함\nobj,KIT,es,\"Encimeras, campanas, cámaras frigoríficas, lavavajillas y utensilios\",También se abrevia K\nobj,PLT,zh,盆栽、植物墙、仿真植物、花器,软装清单常用\nobj,PLT,en,\"Potted plants, living walls, artificial plants and planters\",Common in FF&E schedules\nobj,PLT,ja,鉢植え、壁面緑化、造花、プランター,FF&E リストで一般的\nobj,PLT,ko,\"화분, 식물벽, 인조화, 화기\",FF&E 리스트에 자주 등장\nobj,PLT,es,\"Plantas en maceta, paneles verdes, plantas artificiales y jardineras\",Habitual en listas de FF&E\nobj,AR,zh,画作、装置、雕塑、摆件,AR 也常被用作 人造石 Artificial Stone\nobj,AR,en,\"Paintings, installations, sculptures and decorative objects\",AR is also used for artificial stone\nobj,AR,ja,絵画、インスタレーション、彫刻、置物,AR は人工石（Artificial Stone）を指すこともある\nobj,AR,ko,\"회화, 인스톨레이션, 조각, 소품\",AR은 인공석(Artificial Stone)을 뜻하기도 함\nobj,AR,es,\"Pinturas, instalaciones, esculturas y objetos de decoración\",AR también se usa para piedra artificial (Artificial Stone)\nobj,BDG,zh,床品、被褥、抱枕、床尾巾,酒店/样板房软装清单\nobj,BDG,en,\"Bed linen, duvets, cushions and bed runners\",Used in hotel and show-flat FF&E schedules\nobj,BDG,ja,シーツ、羽毛布団、クッション、ベッドランナー,ホテルやモデルルームの FF&E リスト\nobj,BDG,ko,\"침대용품, 이불, 쿠션, 침대 러너\",호텔·샵플릿 FF&E 리스트\nobj,BDG,es,\"Sábanas, edredones, cojines y tapices de cama\",En listas de FF&E de hoteles y modelos de vivienda\nobj,SSP,zh,开关面板、插座面板、智能控制面板,SS 亦指不锈钢，注意区分\nobj,SSP,en,\"Switch plates, socket plates and smart control panels\",SS may also mean stainless steel — distinguish carefully\nobj,SSP,ja,スイッチ盤、コンセント盤、スマート操作盤,SS はステンレスも意味するので見分けが必要\nobj,SSP,ko,\"스위치 패널, 콘센트 패널, 스마트 제어 패널\",SS는 스테인리스도 의미하므로 주의\nobj,SSP,es,\"Placas de interruptor, de enchufe y de control inteligente\",SS también puede ser acero inoxidable: conviene distinguir\nobj,EA,zh,电视、投影、音响应、家电,与灯具 DL 分开列\nobj,EA,en,\"Televisions, projectors, audio and home appliances\",Listed separately from lighting (DL)\nobj,EA,ja,テレビ、プロジェクター、音響機器、家電製品,照明器具（DL）とは別に記載\nobj,EA,ko,\"TV, 프로젝터, 오디오, 가전제품\",조명기구(DL)와 구분하여 표기\nobj,EA,es,\"Televisores, proyectores, audio y electrodomésticos\",Se listan aparte de la iluminación (DL)\nlight,DL,zh,≤Φ50mm 小口径筒灯有的体系另设 DS,DL 在材料表可指灯具大类，港澳台日韩多以 LT 区分；小口径另设 DS 的体系需看图例\nlight,DL,en,Recessed downlights of ≤Φ50 mm; some systems add DS for small apertures,\"DL can mean the lighting category in material schedules; Hong Kong, Taiwan, Japan and Korea use LT, and some systems add DS for small apertures\"\nlight,DL,ja,Φ50mm 以下のダウンライト、DS を使う仕様,DL はマテリアル表では照明器具の分類だが、香港・台湾・日本・韓国では LT を使い、DS を使う仕様もある\nlight,DL,ko,\"Φ50mm 이하 소구경 다운라이트, 일부 체계에서 DS를 별도 표기\",\"DL은 자재표에서 조명 기구 분류를 뜻하기도 하며, 홍콩·대만·일본·한국은 LT를 씁니다, 일부 체계는 소구경에 DS를 따로 표기\"\nlight,DL,es,Downlights empotrados de ≤Φ50 mm; algunos sistemas usan DS para los pequeños,\"DL puede designar la categoría de iluminación en los cuadros de materiales; en Hong Kong, Taiwán, Japón y Corea se usa LT\"\nlight,CL,zh,明装圆形/方形吸顶灯,CL 在饰面表也指亮漆罩面（Clear Lacquer），在灯具图例才是吸顶灯，且易与吊灯 PL 混\nlight,CL,en,Surface-mounted round or square ceiling fixtures,\"CL also means clear lacquer in finish schedules, and is easily confused with pendant PL\"\nlight,CL,ja,露出取付の丸型・角型シーリング,CL はマテリアル表ではクリアラッカー（Clear Lacquer）を表すこともあり、ペンダント PL と混同しやすい\nlight,CL,ko,매입형이 아닌 노출 원형·사각 천장등,CL은 마감표에서 클리어 래커(clear lacquer)를 뜻하기도 하고 펜던트 PL과 혼동되기 쉽습니다\nlight,CL,es,\"Luminarias de techo de superficie, redondas o cuadradas\",CL también designa el barniz transparente en los cuadros de acabado y se confunde con el colgante PL\nlight,PL,zh,装饰吊灯、线性吊灯,PL 也常指 面板灯 Panel Light\nlight,PL,en,Decorative pendants and linear pendants,PL may also mean panel light\nlight,PL,ja,装飾用ペンダント、リニアペンダント,PL はパネルライトを表すこともある\nlight,PL,ko,\"장식 펜던트, 리니어 펜던트\",PL은 패널 라이트를 의미하기도 함\nlight,PL,es,Colgantes decorativos y colgantes lineales,PL también puede significar panel light\nlight,PN,zh,办公/商业常用 600×600 平板灯,建议用 PN，避免与吊灯冲突\nlight,PN,en,600×600 flat panels common in offices and retail,Recommended code; avoids conflict with pendant\nlight,PN,ja,事務所・商業施設で一般的な 600×600 フラットパネル,推奨コード。ペンダントとの混同を回避\nlight,PN,ko,사무실·상업시설에서 흔한 600×600 평판등,\"권장 코드, 펜던트와의 혼동 방지\"\nlight,PN,es,Paneles planos de 600×600 mm comunes en oficinas y comercios,Código recomendado: evita la colisión con el colgante\nlight,WL,zh,床头壁灯、户外壁灯,WL 在日本也写作壁纸（クロス），须看图层区分壁灯\nlight,WL,en,Bedside wall lights and outdoor wall lights,\"WL also means wallpaper in Japan, so check the drawing layer\"\nlight,WL,ja,ベッドサイド用、屋外用ウォールライト,WL はクロス（壁紙）を指す使われ方もあるため、図面のレイヤーを確認する\nlight,WL,ko,\"침대 옆 벽등, 옥외 월등\",일본에서는 WL이 벽지(크로스)를 뜻하기도 하므로 도면 레이어를 확인\nlight,WL,es,Apliques de cabecera y de exterior,\"En Japón, WL también designa el papel pintado: revise la capa del plano\"\nlight,SL,zh,可调角度射灯、天花射灯,SL 也指灯带 Strip Light、特殊饰面\nlight,SL,en,\"Adjustable-angle spotlights, ceiling spots\",SL may also mean strip light or special finish\nlight,SL,ja,角度調整可能なスポット、天井スポット,SL はストリップライトや特殊仕上げも指す\nlight,SL,ko,\"각도 조절 가능한 스포트, 천장 스포트\",SL은 스트립 라이트나 특수 마감도 의미\nlight,SL,es,Focos de ángulo regulable y focos de techo,SL también puede ser tira de LED o acabado especial\nlight,FL,zh,户外泛光、广告牌照明,与 火烧面 Flamed 的 FL 不同语境\nlight,FL,en,Outdoor floodlights and advertising-board lighting,Different context from flamed finish (FL)\nlight,FL,ja,屋外投光、広告看板照明,フラッドライトの FL とは文脈が異なる\nlight,FL,ko,\"옥외 투광, 간판 조명\",화재 마감(FL)과는 문맥이 다름\nlight,FL,es,Focos de exterior e iluminación de rótulos,Contexto distinto del acabado flameado (FL)\nlight,TL,zh,两线/三线/四线轨道射灯,与 瓷砖 TL 冲突，看图纸专业\nlight,TL,en,\"Two-, three- or four-circuit track spotlights\",Conflicts with tile (TL) — check the drawing discipline\nlight,TL,ja,2回路/3回路/4回路のトラク照明,タイルの TL と混同するため、図面の専門を確認する\nlight,TL,ko,2선/3선/4선 트랙 조명,\"타일(TL)과 충돌, 도면 전문 확인 필요\"\nlight,TL,es,\"Focos de carril de dos, tres o cuatro circuitos\",Choca con tile (TL): revisa la disciplina del plano\nlight,LL,zh,线性灯、铝槽灯、无缝拼接线条灯,LL 与灯带（Strip Light）易混，旧体系里 L 是装饰照明的分部代号\nlight,LL,en,\"Linear luminaires, aluminium profile lights and seamless linear systems\",\"LL is easily confused with strip light, and L in older systems means the lighting division\"\nlight,LL,ja,リニア照明、アルミチャネル灯、継ぎ目なしのライン照明,LL はテープライトと混同しやすく、以前のシステムでは L が照明系の分岐記号を表す\nlight,LL,ko,\"리니어 등, 알루미늄 채널등, 무이음 리니어 시스템\",\"LL은 테이프 라이트와 혼동되기 쉽고, 예전 체계의 L은 조명 분부 기호입니다\"\nlight,LL,es,\"Lineales, luminarias con perfil de aluminio y sistemas lineales continuos\",LL se confunde con la tira de LED y en sistemas antiguos L es el código de la sección de iluminación\nlight,UL,zh,层板灯、柜内感应灯,UL 是较新的代码，旧图纸多写作灯带或 KL，跨项目套用前需核对图例\nlight,UL,en,Shelf lighting and sensor-activated cabinet lighting,UL is a newer code; older schedules list it as strip light or KL\nlight,UL,ja,棚下照明、庫内人感照明,UL は比較的新しいコードで、古い図面にはテープライトや KL と書かれるため凡例を確認する\nlight,UL,ko,\"선반등, 수납장 내부 인체감지 조명\",UL은 비교적 새로운 코드로 예전 도면에는 테이프 라이트나 KL로 표기\nlight,UL,es,Iluminación de balda y de interior de armario con sensor,UL es un código más nuevo; los cuadros antiguos lo listan como tira de LED o KL\nlight,ML,zh,磁吸轨道灯系统,ML 是较新的代码，旧图纸写作磁吸轨道灯，注意与轨道灯 TL 区分\nlight,ML,en,Magnetic track lighting systems,\"ML is a newer code; older drawings write magnetic track light, not to be mixed with track light TL\"\nlight,ML,ja,マグネット式トラック照明システム,ML は比較的新しいコードで、古い図面にはマグネットトラックライトと書かれ、トラックライト TL と混同しない\nlight,ML,ko,마그네틱 트랙 조명 시스템,ML은 비교적 새로운 코드로 예전 도면에는 마그네틱 트랙 라이트로 표기되며 트랙 라이트 TL과 혼동하지 않습니다\nlight,ML,es,Sistemas de iluminación de carril magnético,ML es un código más nuevo; los dibujos antiguos lo escriben como carril magnético y no debe confundirse con el carril TL\nlight,WW,zh,线性洗墙、擦墙照明,WW 多用于建筑照明专项说明而非灯具类型图例，常写作洗墙灯（Wall Washer）\nlight,WW,en,Linear wall-washing and grazing lighting,WW belongs to the architectural lighting spec rather than the fixture legend and is often written Wall Washer\nlight,WW,ja,リニア洗壁、擦壁照明,WW は建築照明の仕様書で扱うもので、器具種別の図例ではなく Wall Washer と書かれる\nlight,WW,ko,\"선형 월워시, 스침 조명\",WW는 조명 기구 범례보다 건축 조명 설계서에 주로 쓰이며 Wall Washer로 표기\nlight,WW,es,Lavado de muro lineal y luz rasante,WW pertenece a la especificación de iluminación arquitectónica más que a la leyenda de luminarias y suele escribirse Wall Washer\nlight,IL,zh,埋地灯、地脚灯,IL 指地埋灯，户外须另注防水等级（IP），并与水下灯 UW 区分\nlight,IL,en,Recessed ground lights and footlights,IL covers ground-recessed lights; outdoors add the IP rating and keep it separate from underwater light UW\nlight,IL,ja,埋込型地中灯、フットライト,IL は地中埋込の照明で、屋外では IP 等級を別記し、水中照明 UW と区別する\nlight,IL,ko,\"지중 매입등, 발밑 조명\",\"IL은 지중 매입등이며, 옥외에는 IP 등급을 별도로 표기하고 수중등 UW와 구분\"\nlight,IL,es,Focos empotrados en pavimento y balizas de suelo,IL corresponde a luces empotradas en suelo; en exterior indique el grado IP y sepárelas de la luz sumergida UW\nlight,UW,zh,泳池、水景照明,UW 为水下专用，泳池与水景须另注防水等级（IP）与安装方式，不可与地埋灯 IL 混\nlight,UW,en,Pool and water feature lighting,\"UW is for submerged use only; state the IP rating and mounting for pools and water features, and never mix it with in-ground light IL\"\nlight,UW,ja,プール、噴水照明,UW は水中専用で、プールや噴水には IP 等級と取付方法を明記し、地中照明 IL と混同しない\nlight,UW,ko,\"수영장, 수경 조명\",UW는 수중 전용으로 수영장과 수경에는 방수 등급(IP)과 설치 방식을 별도 표기하고 지중 매입등 IL과 혼동하지 않습니다\nlight,UW,es,Iluminación de piscinas y fuentes,\"UW es solo para uso sumergido: indique el grado IP y el montaje en piscinas y fuentes, y no lo confunda con la luz empotrada en suelo IL\"\nlight,EL,zh,应急筒灯、双头应急灯,电气专业图例，非装饰材料代码\nlight,EL,en,Emergency downlights and twin-head emergency units,\"An electrical-discipline legend item, not a finish material code\"\nlight,EL,ja,非常用ダウンライト、二灯式非常用灯,電気設備側の凡例項目で、仕上材コードではない\nlight,EL,ko,\"비상 다운라이트, 2헤드 비상등\",전기 설계 위의 범례 항목이며 마감재 코드가 아님\nlight,EL,es,Downlights de emergencia y luminarias de doble cabeza,\"Es una leyenda de instalaciones eléctricas, no un código de acabado\"\nlight,EXIT,zh,安全出口、疏散指示,电气专业图例\nlight,EXIT,en,Exit and escape-direction signage,Electrical-discipline legend\nlight,EXIT,ja,非常口、誘導灯,電気設備側の凡例\nlight,EXIT,ko,\"안전출구, 피난 유도 표시\",전기 설계 위의 범례\nlight,EXIT,es,Salidas de emergencia e indicación de evacuación,Leyenda de instalaciones eléctricas\nfinish,B,zh,镜面/玻璃边部磨斜边,边缘处理而非表面饰面，常与 E、F 叠加写成 EB、FB\nfinish,B,en,Chamfered or bevelled edges on mirrors and glass,Edge treatment rather than a surface finish; often stacked with E or F as EB and FB\nfinish,B,ja,鏡・ガラスの端部を面取り,表面仕上げではなくエッジ処理で、E や F と重ねて EB、FB と書く\nfinish,B,ko,거울·유리 가장자리를 모따기 처리,\"표면 마감재가 아니라 모서리 가공이며 E, F와 조합해 EB, FB로 표기\"\nfinish,B,es,Cantos biselados en espejos y vidrios,Tratamiento de canto y no de superficie; a menudo se combina con E o F como EB y FB\nfinish,E,zh,化学蚀刻、蒙砂,多用于玻璃，与石材磨砂 F 工艺不同却常被混写，需按图例确认\nfinish,E,en,Chemical etching or acid frosting,\"Usually glass; often confused with the abraded matt surface F used on stone, so check the legend\"\nfinish,E,ja,酸エッチング（Chemical Etching）、曇り面加工,主にガラスに用いるもので、石材の砂目仕上げ F とは工程が異なるため混同されやすい\nfinish,E,ko,\"화학 에칭, 산 부식 샌드\",주로 유리에 쓰이며 석재 샌드블라스트 무광면 F와 자주 혼동됨\nfinish,E,es,Grabado químico o frosting ácido,Se usa sobre todo en vidrio y se confunde a menudo con la superficie arenada mate F de la piedra\nfinish,EB,zh,蚀刻面并车斜边,组合代码，斜边与蚀刻同时表达，常与仅磨砂的 F 混淆\nfinish,EB,en,Etched face with bevelled edges,Combines bevelling and etching; easily confused with the plain frosted F and with the bevelled-only B\nfinish,EB,ja,エッチング面に面取り,面取りとエッチングを組み合わせたコードで、フロストのみの F と混同されやすい\nfinish,EB,ko,에칭 면에 모따기 가공,모따기와 에칭을 함께 쓰는 조합 코드로 단독 마트 F와 자주 혼동\nfinish,EB,es,Cara grabada con cantos biselados,Combina biselado y grabado; se confunde a menudo con el F esmerilado sin bisel\nfinish,F,zh,酸洗、蒙砂面,多为石材喷砂或磨蚀，与玻璃酸蚀 E 工艺不同，现场常互相写错\nfinish,F,en,Acid-washed or sandblasted matte face,Usually an abraded matt on stone; it differs from the acid-etched glass finish E and the two are often swapped\nfinish,F,ja,酸ウォッシュ、曇り面,主に石材の噴砂や摩耗によるもので、ガラスの酸エッチング E とは工程が異なり現場で混同されやすい\nfinish,F,ko,\"산 세척, 샌드블라스트 무광면\",주로 석재에 쓰이며 유리의 에칭 E와 공법이 달라 서로 혼동됨\nfinish,F,es,Superficie acidulada o arenada,\"Es un mate abrasionado sobre piedra y se confunde con el E grabado del vidrio, que es otra técnica\"\nfinish,FB,zh,磨砂面并车斜边,组合代码，磨砂与斜边同时表达，与仅蚀刻加斜边的 EB 易混\nfinish,FB,en,Frosted face with bevelled edges,A combined code; it carries both the matt face and the bevel and is easily mixed up with EB\nfinish,FB,ja,フロスト面に面取り,フロスト面と面取りを組み合わせたコードで、エッチングに面取りを加えた EB と混同されやすい\nfinish,FB,ko,프로스티드 면에 모따기 가공,마트와 모따기를 함께 쓰는 조합으로 에칭+모따기인 EB와 자주 혼동\nfinish,FB,es,Cara esmerilada con cantos biselados,Código combinado de mate y bisel; se confunde a menudo con el EB grabado y biselado\nfinish,H,zh,不锈钢/铝板长丝纹,也写 BS（Brushed）\nfinish,H,en,Long directional grain on stainless steel or aluminium panels,Also written BS (Brushed)\nfinish,H,ja,ステンレス・アルミ板の長いヘアライン,BS（Brushed）とも表記\nfinish,H,ko,스테인리스·알루미늄 패널의 긴 헤어라인 결,BS(Brushed)로 표기하기도 함\nfinish,H,es,Grano direccional largo en acero o aluminio,También se escribe BS (Brushed)\nfinish,ND,zh,无方向性短丝纹,与 H（拉丝）相反，为乱纹无方向，图纸常与 H 混写\nfinish,ND,en,Short grain with no direction,The opposite of H hairline: the grain has no direction so the two are often confused in legends\nfinish,ND,ja,無方向の短い木目,ヘアライン H と逆に、向きの指定がないため図例で混同されやすい\nfinish,ND,ko,방향성이 없는 짧은 결,헤어라인 H와 정반대로 방향성이 없어 자주 혼동됨\nfinish,ND,es,Grano corto sin direccionalidad,Es lo contrario del H cepillado: el grano no tiene dirección y ambos se confunden en las leyendas\nfinish,OX,zh,发黑、古铜、做旧氧化,仅用于金属仿铜、仿古氧化，不用于石材；旧体系常写作古铜或发黑\nfinish,OX,en,\"Blackened, bronzed and antique oxidation\",\"For metal only — bronze, brass or copper patina; it is never used on stone\"\nfinish,OX,ja,黒化、古銅、古色（Antique）の酸化処理,金属のブロンズ調や古色表現に使うもので石材には使わないが、古い仕様では古銅や黒化と書くことがある\nfinish,OX,ko,\"검게 변색, 청동색, 앤티크 산화\",금속(청동·황동·구리)에만 쓰는 마감이며 석재에는 쓰지 않음\nfinish,OX,es,\"Ennegrecido, bronceado y pátina envejecida\",\"Solo para metal — pátina de bronce, latón o cobre; no se usa en piedra\"\nfinish,S,zh,半哑光缎面,光泽介于 MA 与 P 之间，与 G、30G/50G/70G 光泽等级不可混用\nfinish,S,en,Semi-matte satin surface,Sheen sits between MA matt and P polish; it is not a gloss level like G 30G 50G or 70G\nfinish,S,ja,半マットなサテン面,光沢はマット MA とポリッシュ P の間で、グロス G、30G/50G/70G の段階とは区別する\nfinish,S,ko,반무광 새틴 표면,광택이 MA 무광과 P 폴리싱 사이이며 G·30G·50G·70G 광택 등급과는 다름\nfinish,S,es,Superficie semimate satén,El brillo queda entre MA mate y P pulido; no es un nivel de brillo como G 30G 50G o 70G\nfinish,P,zh,8K 镜面、抛光石材,与 G（光泽罩面）不同：P 是磨出的镜面，G 是涂层的亮光\nfinish,P,en,8K mirror polish and polished stone,Not to be confused with G which is a gloss coating over the surface rather than a ground mirror polish\nfinish,P,ja,8K 鏡面研磨、研磨石材,G は塗層の光沢、P は研磨による鏡面仕上げで、両者は意味が異なる\nfinish,P,ko,\"8K 거울면, 폴리싱 석재\",광택 코팅인 G와 다르며 G는 도장층의 광택 P는 실제 연마 광택\nfinish,P,es,Pulido espejo 8K y piedra pulida,No confundir con G que es un brillo de capa de acabado y no un pulido espejar\nfinish,HA,zh,手工锤纹铜/不锈钢,属机械敲击加工，与 SB 喷砂不同：HA 是工具成型，SB 是磨料喷射\nfinish,HA,en,Hand-hammered copper or stainless steel,\"Mechanical tooling by hammer or chisel, unlike SB sandblasting which uses abrasive blasting\"\nfinish,HA,ja,手打ちの銅・ステンレス,工具で叩き出して成形する手法で、SB のサンドブラスト（研削材で吹きつける）とは原理が異なる\nfinish,HA,ko,수공 해머링 구리·스테인리스,망치·조각질 같은 기계적 가공이며 샌드블라스트 SB와 다름(SB는 연마제 분사)\nfinish,HA,es,Cobre o acero martillado a mano,\"Es un mecanizado con martillo o cincel, distinto del arenado SB que proyecta abrasivo\"\nfinish,FL,zh,花岗岩火烧处理,与 泛光灯 FL 不同语境\nfinish,FL,en,Thermal flaming of granite,Different context from flood light (FL)\nfinish,FL,ja,花崗岩の火焼き仕上げ,フラッドライトの FL とは文脈が異なる\nfinish,FL,ko,화강암 화염 처리,플러드 라이트(FL)과는 문맥이 다름\nfinish,FL,es,Abanicado térmico del granito,Contexto distinto del foco flood (FL)\nfinish,MA,zh,哑光、无光,欧美表面处理表常写 MT(Matte)，与材料表 MT＝Metal 同码，须看在哪张表\nfinish,MA,en,\"Matt, no-gloss surface\",\"Western schedules often write MT (Matte), while MT means Metal in the material table\"\nfinish,MA,ja,無光、マット面,欧米の表面処理表では MT（Matte）と書くが、マテリアル表の MT は Metal なのでどちらの表か確認する\nfinish,MA,ko,\"무광, 매트 표면\",\"서양 마감표에는 MT(Matte)로 표기하며, 재료표의 MT는 Metal을 뜻함\"\nfinish,MA,es,\"Superficie mate, sin brillo\",\"En las tablas occidentales se escribe MT (Matte), mientras que MT significa Metal en la tabla de materiales\"\nfinish,SB,zh,喷砂玻璃、喷砂金属,喷砂属磨料喷射，与 HA 锤纹(机械敲击)、ND 乱纹(无方向纹理)工艺不同\nfinish,SB,en,Sandblasted glass and metal,\"Abrasive blasting, not the mechanical tooling of hammered HA or the non-directional grain of ND\"\nfinish,SB,ja,サンドブラスト仕上げ：ガラス・金属の均一な無光仕上げ,研削材を吹きつける加工で、HA の叩き出しや ND の無方向木目とは原理が異なる\nfinish,SB,ko,샌드블라스트 유리·금속,\"마모성 연마 방식이며, 해머 마감 HA(공구 타격)나 무방향 결 ND와는 다른 공정\"\nfinish,SB,es,Vidrio y metal arenados,\"Arenado por abrasivo, distinto del martillado HA (mecánico) y del grano no direccional ND\"\nfinish,CL,zh,清漆亮光保护层,与 吊灯 CL 不同语境\nfinish,CL,en,Clear lacquer protective coating,Different context from ceiling light (CL)\nfinish,CL,ja,無色ラッカーの保護層,シーリングライトの CL とは文脈が異なる\nfinish,CL,ko,투명 래커 보호층,천장등 CL과는 문맥이 다름\nfinish,CL,es,Capa protectora de laca transparente,Contexto distinto de la luz de techo (CL)\nfinish,OSCL,zh,木饰面着色后罩清漆,传统木饰面开放漆做法；PC 粉末喷涂与 FC 氟碳喷涂属金属型材体系\nfinish,OSCL,en,Wood finish stained with oil then lacquered,\"Traditional open-pore timber system; PC powder coating and FC fluorocarbon apply to metal profiles, not timber\"\nfinish,OSCL,ja,木質仕上げを油で染めてラッカーで被覆,従来の木仕上げのオープン塗装で、PC（electrostatic powder）と FC（fluorine coating）はアルミ形材向けのシステム\nfinish,OSCL,ko,목재 마감을 오일로 색칠 후 래커 마감,\"전통적인 목재 오픈포어 체계이며, PC 분체도장과 FC 불소 코팅은 금속 프로파일용\"\nfinish,OSCL,es,Madera teñida al aceite y lacada,\"Sistema tradicional de poro abierto; el polvo PC y el fluorocarbono FC son para perfiles metálicos, no para madera\"\nfinish,FC,zh,铝板氟碳漆、户外耐候,港澳及中东图例中 FC＝假天花(False Ceiling)，须确认它出现在哪张表\nfinish,FC,en,Fluorocarbon coating for aluminium panels and outdoor weatherability,\"FC also means false ceiling in Hong Kong, Macau and Middle East legends, so check which schedule it appears in\"\nfinish,FC,ja,アルミ板のフッ素樹脂塗装、屋外耐候,香港・マカオ・中東の図例では FC は False Ceiling を意味するので、どの表に記載されているか確認する\nfinish,FC,ko,\"알루미늄 판 불소 도장, 옥외 내후성\",홍콩·마카오·중동 범례에서는 FC가 천장(False Ceiling)을 뜻하므로 어느 표에 나타나는지 확인\nfinish,FC,es,Pintura de fluorocarbono para paneles de aluminio y exteriores,\"En las leyendas de Hong Kong, Macao y Oriente Medio FC significa también falso techo (False Ceiling); ver en qué cuadro aparece\"\nfinish,ZC,zh,热镀锌、电镀锌,属基材保护层而非装饰面，通常与面漆分列\nfinish,ZC,en,Hot-dip galvanising and electroplated zinc,\"A substrate protection rather than a decorative finish, usually listed apart from the paint system\"\nfinish,ZC,ja,熱浸亜鉛メッキ、電解亜鉛メッキ,装飾仕上げではなく下地材の保護で、一般に塗装システムと分けて記載する\nfinish,ZC,ko,\"핫디프 아연도금, 전기 아연도금\",\"장식 마감이 아니라 기재 보호층이며, 도장 체계와는 따로 표기\"\nfinish,ZC,es,Galvanizado en caliente y zincado electrolítico,Es protección del sustrato y no acabado decorativo; suele listarse aparte del sistema de pintura\nfinish,WX,zh,石材/木饰面上蜡,属叠加在其他饰面之上的养护工序，底饰面仍须单独标注\nfinish,WX,en,Wax finish on stone or timber,\"A maintenance step applied over another finish, so the base finish must still be specified\"\nfinish,WX,ja,石材・木質材へのワックス仕上げ,他の仕上げに重ねる保護工程で、下地の仕上げは別途記載が必要\nfinish,WX,ko,석재·목재 왁스 마감,다른 마감 위에 덧치는 유지보수 공정이므로 바탕 마감은 따로 지정\nfinish,WX,es,Cera sobre piedra o madera,Es un paso de mantenimiento sobre otro acabado; el acabado base debe indicarse aparte\nfinish,G,zh,亮光面,与 30G、50G、70G 同属一套光泽等级，同一图例应统一标注习惯\nfinish,G,en,High-gloss surface,\"Part of the same gloss scale as 30G, 50G and 70G; keep one gloss notation across the project\"\nfinish,G,ja,高い光沢面,30G・50G・70G と同じ光沢スケールで、プロジェクトごとに表記を統一する\nfinish,G,ko,광택면,30G·50G·70G와 같은 광택 등급 체계이므로 도면마다 표기 방식을 통일할 것\nfinish,G,es,Superficie de alto brillo,\"Pertenece a la misma escala de brillo que 30G, 50G y 70G; conviene unificar la notación en cada proyecto\"\nfinish,30G,zh,三分光,与 G、50G、70G 同属一套光泽等级，本图例统一用百分比写法\nfinish,30G,en,30 per cent gloss — a three-point sheen,\"Same gloss-scale family as G, 50G and 70G; this sheet writes gloss levels as percentages\"\nfinish,30G,ja,光沢度30%：光沢3段階表記のうち低光沢の段階,G・50G・70G と同じ光沢度スケールの一つ。本表ではパーセント表記に統一する\nfinish,30G,ko,\"광택 30%, 3분광\",\"G·50G·70G와 같은 광택 등급 계열이며, 도면 전체에서 표기 방식 하나만 쓸 것\"\nfinish,30G,es,Treinta por ciento de brillo (3 puntos),\"Misma familia de escala de brillo que G, 50G y 70G; conviene usar un solo criterio en toda la lámina\"\nfinish,50G,zh,五分光,与 G、30G、70G 同属一套光泽等级，本图例统一用百分比写法\nfinish,50G,en,50 per cent gloss — a five-point sheen,\"Same gloss-scale family as G, 30G and 70G; this sheet writes gloss levels as percentages\"\nfinish,50G,ja,光沢度50%：光沢3段階表記のうち中光沢の段階,G・30G・70G と同じ光沢度スケールの一つ。本表ではパーセント表記に統一する\nfinish,50G,ko,\"광택 50%, 5분광\",\"G·30G·70G와 같은 광택 등급 계열이며, 도면 전체에서 표기 방식 하나만 쓸 것\"\nfinish,50G,es,Cincuenta por ciento de brillo (5 puntos),\"Misma familia de escala de brillo que G, 30G y 70G; conviene usar un solo criterio en toda la lámina\"\nfinish,70G,zh,七分光,与 G、30G、50G 同属一套光泽等级，本图例统一用百分比写法\nfinish,70G,en,70 per cent gloss — a seven-point sheen,\"Same gloss-scale family as G, 30G and 50G; this sheet writes gloss levels as percentages\"\nfinish,70G,ja,光沢度70%：光沢3段階表記のうち高光沢の段階,G・30G・50G と同じ光沢度スケールの一つ。本表ではパーセント表記に統一する\nfinish,70G,ko,\"광택 70%, 7분광\",\"G·30G·50G와 같은 광택 등급 계열이며, 도면 전체에서 표기 방식 하나만 쓸 것\"\nfinish,70G,es,Setenta por ciento de brillo (7 puntos),\"Misma familia de escala de brillo que G, 30G y 50G; conviene usar un solo criterio en toda la lámina\"\nfinish,PC,zh,铝型材静电粉末喷涂,与 地胶板 PC 冲突\nfinish,PC,en,Electrostatic powder coating of aluminium profiles,Conflicts with PVC flooring (PC)\nfinish,PC,ja,アルミ形材の静電粉体塗装,塩ビ床材の PC と混同\nfinish,PC,ko,알루미늄 프로파일 정전기 분체도장,비닐 바닥재(PC)과 충돌\nfinish,PC,es,Pintura electrostática en polvo de perfiles de aluminio,Choca con el suelo de vinilo (PC)\nmat,ST,fr,\"Granit, marbre, jade, travertin, calcaire, pierre reconstituée\",Matériau principal ; la pierre sinterisée relève souvent de ST ou CT : vérifier la légende.\nmat,ST,it,\"Granito, marmo, giada, travertino, calcare, pietra ricostruita\",Materiale principale; la pietra sinterizzata rientra spesso in ST o CT: verificare la legenda.\nmat,ST,pt,\"Granito, mármore, jade, travertino, calcário, pedra reconstituída\",Material principal; a pedra sinterizada costuma entrar em ST ou CT — confira a legenda.\nmat,ST,ru,\"Гранит, мрамор, нефрит, травертин, известняк, искусственный камень\",Основной материал; синтетический камень обычно относят к ST или CT — сверяйтесь с легендой.\nmat,WD,fr,\"Bois massif, Placage de bois naturel, tasseaux, plinthes, claustra en bois\",Le parquet peut avoir son propre code WF selon le projet.\nmat,WD,it,\"Legno massello, impiallacciato naturale, listelli, battiscopa, grigliato in legno\",Il parquet può avere un codice WF dedicato in alcuni progetti.\nmat,WD,pt,\"Madeira maciça, lâmina natural, molduras, rodapés, ripado de madeira\",Em alguns projetos o piso de madeira recebe o código WF.\nmat,WD,ru,\"Массив, натуральный шпон, филёнки, плинтус, деревянная решётка\",В некоторых проектах паркет выделяют отдельным кодом WF.\nmat,WF,fr,\"Parquet massif, contreplaqué multicouche, parquet de bambou, imitation bois SPC\",Certains systèmes le fondent dans WD.\nmat,WF,it,\"Parquet massello, parquet multistrato, parquet di bambù, SPC effet bois\",Alcuni sistemi lo accorpano a WD.\nmat,WF,pt,\"Tábua maciça, piso multicamada, piso de bambu, SPC imitação de madeira\",Alguns sistemas o agrupam em WD.\nmat,WF,ru,\"Массивная доска, многослойная доска, бамбуковый паркет, SPC под дерево\",В части систем объединяется с WD.\nmat,GL,fr,\"Vitrage trempé, feuilleté, fileté, dépoli, artistique, émaillé\",Les vitrages émaillés et filetés sont souvent détaillés en GL-0x.\nmat,GL,it,\"Vetro temperato, stratificato, reticolato, satinato, artistico, smaltato\",I vetri smaltati e reticolati sono spesso suddivisi in GL-0x.\nmat,GL,pt,\"Vidro temperado, laminado, armado, jateado, artístico, esmaltado\",Vidro esmaltado e armado costumam ser detalhados como GL-0x.\nmat,GL,ru,\"Закалённое, многослойное, армированное, матовое, художественное, эмалированное\",Эмалированное и армированное стекло часто делят на GL-0x.\nmat,MR,fr,\"Miroirs argentés, gris, bronze, noirs, décoratifs\",Écrit aussi GM (Mirror) ou BE.\nmat,MR,it,\"Specchi argentati, grigi, bronzo, neri, decorativi\",Indicato anche come GM (Mirror) o BE.\nmat,MR,pt,\"Espelhos prateados, cinza, bronze, pretos, decorativos\",Também escrito GM (Mirror) ou BE.\nmat,MR,ru,\"Серебряные, серые, бронзовые, чёрные, декоративные зеркала\",Также пишут GM (Mirror) или BE.\nmat,MT,fr,\"Acier inoxydable, cuivre, ferronnerie, panneaux d'aluminium, tôle perforée, trame métallique\",\"Souvent décliné en SS (inox), BR (bronze), AL (aluminium).\"\nmat,MT,it,\"Acciaio inox, rame, ferro battuto, pannelli in alluminio, lamiera forata, rete metallica\",\"Spesso suddiviso in SS (inox), BR (bronze), AL (alluminio).\"\nmat,MT,pt,\"Aço inoxidável, cobre, ferro forjado, painel de alumínio, chapa perfurada, tela metálica\",\"Costuma ser dividido em SS (inox), BR (bronze), AL (alumínio).\"\nmat,MT,ru,\"Нержавеющая сталь, медь, кованые изделия, алюминиевые панели, перфорат, металлическая сетка\",\"Часто делят на SS (нержавейка), BR (бронза), AL (алюминий).\"\nmat,AL,fr,\"Plaques de plafond, panneaux pleins, ailettes carrées, panneaux composites, grilles en aluminium\",Aluminium utilisé aussi pour les menuiseries et les profilés.\nmat,AL,it,\"Pannelli per soffitto, pannelli pieni, alette quadrate, pannelli compositi, grigliati in alluminio\",L'alluminio è usato anche per infissi e profili.\nmat,AL,pt,\"Placas de teto, painel liso, defletores quadrados, painel composto, grelhas de alumínio\",O alumínio também é usado em esquadrias e perfis.\nmat,AL,ru,\"Потолочные плиты, цельные панели, квадратные дефлекторы, композитные панели, алюминиевые решётки\",Также применяется для оконных и дверных профилей.\nmat,MC,fr,\"Panneau composite aluminium, panneau en nid d'abeille, composite titane-zinc\",Dans certains projets MC = micro-béton : à vérifier impérativement.\nmat,MC,it,\"Pannello composito in alluminio, pannello nido d'ape, composito titanio-zinco\",In alcuni progetti MC = microcemento: verificare sempre.\nmat,MC,pt,\"Painel de alumínio, painel de honeycomb, painel de zinco-titânio\",Em alguns projetos MC = microcemento — confirme sempre.\nmat,MC,ru,\"Алюминиевый композит, сотовый алюминий, титан-цинковый композит\",В части проектов MC = микроцемент — обязательно сверяйтесь.\nmat,CT,fr,\"Carrelage de sol et de mur, grès cérame, grès émaillé, grès rustique, mosaïque\",\"Écriture la plus répandue : choisir CT ou TL, ne pas mélanger.\"\nmat,CT,it,\"Pavimenti e rivestimenti, gres ceramico, gres porcellanato, gres rustico, mosaico\",\"Notazione più diffusa: scegliere CT o TL, senza mescolarli.\"\nmat,CT,pt,\"Piso e parede, porcelanato, grês esmaltado, grês rústico, mosaico\",\"A forma mais comum: use CT ou TL, sem misturar.\"\nmat,CT,ru,\"Напольная и настенная плитка, керамогранит, глазурованная, рустик, мозаика\",Самая распространённая запись: выберите CT или TL и не смешивайте.\nmat,TL,fr,Identique à CT — dénomination générale des carreaux,\"Synonyme de CT, employé par certains bureaux d'études étrangers.\"\nmat,TL,it,Come CT — denominazione generica delle piastrelle,\"Sinonimo di CT, usato da alcuni studi esteri.\"\nmat,TL,pt,Igual a CT — denominação genérica de azulejos,\"Sinônimo de CT, usado por consultorias estrangeiras.\"\nmat,TL,ru,Аналогично CT — обобщённое название плитки,\"Синоним CT, используется некоторыми зарубежными проектировщиками.\"\nmat,MO,fr,\"Mosaïque céramique, verre, pierre, métal\",Écrit aussi MS.\nmat,MO,it,\"Mosaico in ceramica, vetro, pietra, metallo\",Indicato anche come MS.\nmat,MO,pt,\"Mosaico de cerâmica, vidro, pedra, metal\",Também escrito MS.\nmat,MO,ru,\"Керамическая, стеклянная, каменная, металлическая мозаика\",Также пишут MS.\nmat,CA,fr,\"Tapis pleine surface, dalles de tapis, tapis fait main, motifs en tapis\",Également utilisé pour numéroter les tapis dans les listes FF&E.\nmat,CA,it,\"Tappeto a tutto campo, tappeto a piastrelle, tappeto artigianale, disegni in tappeto\",Usato anche per numerare i tappeti nelle liste FF&E.\nmat,CA,pt,\"Tapete wall-to-wall, tapete modular, tapete artesanal, desenhos em tapete\",Também usado para numerar tapetes nas listas de FF&E.\nmat,CA,ru,\"Ковр полного покрытия, модульный ковёр, ручной ковёр, ковровые рисунки\",Также используется для нумерации ковров в списках FF&E.\nmat,WC,fr,\"Papier peint, tissu d'ameublement, revêtement non tissé, papier paille, papier imitation bois\",Écrit aussi WP (Wall Paper).\nmat,WC,it,\"Carta da parati, tessuto rivestimento, rivestimento non tessuto, carta paglia, carta effet legno\",Indicato anche come WP (Wall Paper).\nmat,WC,pt,\"Papel de parede, papel lambri, revestimento não tecido, papel de palha, papel amadeirado\",Também escrito WP (Wall Paper).\nmat,WC,ru,\"Обои, ворсовые покрытия, нетканые покрытия, соломенные обои, обои под дерево\",Также пишут WP (Wall Paper).\nmat,CU,fr,\"Stores roulants, rideaux, voilages, rideaux occultants, rideaux motorisés\",Cu est aussi le symbole chimique du cuivre : attention aux conflits.\nmat,CU,it,\"Tende a rullo, tende, tendaggi, tende blackout, tende motorizzate\",Cu è anche il simbolo chimico del rame: attenzione ai conflitti.\nmat,CU,pt,\"Rolôs, cortinas, vozes, cortinas blackout, cortinas motorizadas\",Cu também é o símbolo químico do cobre — atenção aos conflitos.\nmat,CU,ru,\"Рулонные шторы, шторы, тюль, блэкаут-шторы, моторизованные шторы\",Cu — ещё и химический символ меди: следите за совпадениями.\nmat,FA,fr,\"Tissu d'ameublement, garnissage textile, voilages, tissus\",Les anciens systèmes y rangent aussi le cuir.\nmat,FA,it,\"Rivestimento in tessuto, imbottitura tessile, tendaggi, tessuti\",I vecchi sistemi vi includono anche la pelle.\nmat,FA,pt,\"Revestimento de tecido, acolchoado têxtil, vozes, tecidos\",Sistemas antigos incluem também o couro.\nmat,FA,ru,\"Текстильная обивка, текстильные мягкие панели, тюль, ткани\",В старых системах сюда относили и кожу.\nmat,UP,fr,\"Panneaux cuir, garnissage textile, panneaux absorbants\",Usuel dans les plans de décoration récents.\nmat,UP,it,\"Pannelli in pelle, imbottitura in tessuto, pannelli acustici\",Comune nei recenti progetti di interior design.\nmat,UP,pt,\"Painel de couro, forração em tecido, painel acústico\",Comum em projetos de decoração recentes.\nmat,UP,ru,\"Кожаные панели, текстильная обивка, акустические панели\",Часто встречается в современных проектах отделки.\nmat,LE,fr,\"Cuir naturel, microfibre, simili-cuir PU, cuir régénéré\",Écrit aussi LT.\nmat,LE,it,\"Pelle naturale, microfibra, pelle PU, pelle rigenerata\",Indicata anche come LT.\nmat,LE,pt,\"Couro natural, microfibra, couro PU, couro regenerado\",Também escrito LT.\nmat,LE,ru,\"Натуральная кожа, микрофибра, искусственная кожа PU, регенерированная кожа\",Также пишут LT.\nmat,PT,fr,\"Peinture acrylique, peinture pour bois, revêtement thermolaque, peinture à liant\",Le code de peinture le plus universel.\nmat,PT,it,\"Vernice acrilica, vernice per legno, verniciatura termolaccata, tempera\",Il codice di pittura più universale.\nmat,PT,pt,\"Tinta acrílica, tinta para madeira, verniz fluorocarbono, tinta preparada\",O código de tinta mais universal.\nmat,PT,ru,\"Акриловая краска, краска по дереву, фторуглеродная окраска, масляная краска\",Самый универсальный код покраски.\nmat,SP,fr,\"Peinture malais, micro-béton, terre de diatomée, peinture texturée, peinture artistique\",SP sert aussi de spot light : voir le tableau des conflits.\nmat,SP,it,\"Malaysian paint, microcemento, terra diatomica, vernice strutturata, vernice artistica\",SP indica anche lo spot light: vedi la tabella dei conflitti.\nmat,SP,pt,\"Tinta malaya, microcemento, terra de diatomáceas, tinta texturizada, tinta artística\",SP também designa spot light: veja a tabela de conflitos.\nmat,SP,ru,\"Малайская краска, микроцемент, диатомит, фактурная краска, художественная краска\",SP также означает спотлайт — смотрите таблицу конфликтов.\nmat,PL,fr,\"Plaque de PVC rigide, plaque polycarbonate, diffuseur, profilé plastique\",\"Anciens systèmes : PL = peinture acrylique, conflits fréquents.\"\nmat,PL,it,\"Lastra in PVC, lastra in policarbonato, diffusore, profilo plastico\",Nei vecchi sistemi PL = vernice acrilica: conflitti frequenti.\nmat,PL,pt,\"Chapa de PVC, chapa de policarbonato, difusor, perfil plástico\",Em sistemas antigos PL = tinta acrílica: muitos conflitos.\nmat,PL,ru,\"Листовой ПВХ, поликарбонат, рассеиватель, пластиковый профиль\",В старых системах PL = акриловая краска — частые конфликты.\nmat,AC,fr,\"Panneau acrylique diffusant, panneau de caisson lumineux, lettres en relief\",Certains systèmes emploient AC = plafond acoustique.\nmat,AC,it,\"Lastra acrilica diffusiva, pannello per light box, lettere tridimensionali\",Alcuni sistemi usano AC = soffitto acustico.\nmat,AC,pt,\"Chapa acrílica difusora, painel de letreiro, letras em relevo\",Alguns sistemas usam AC = forro acústico.\nmat,AC,ru,\"Светорассеивающий акрил, панель светового короба, объёмные буквы\",В части систем AC = акустический потолок.\nmat,PB,fr,\"Plaque de plâtre papier, plaque hydrofuge, fibrociment, plaque silicate de calcium\",\"Matériau de base, aussi employé pour les plafonds moulurés.\"\nmat,PB,it,\"Cartongesso con rivestimento carta, cartongesso impermeabile, fibrocemento, pannello di silicato di calcio\",\"Materiale di base, usato anche per plafoni sagomati.\"\nmat,PB,pt,\"Placa de gesso com papel, placa resistente à umidade, fibrocimento, placa de silicato de cálcio\",\"Material de base, também usado em tetos moldados.\"\nmat,PB,ru,\"ГКЛ на бумаге, влагостойкий ГКЛ, фиброцемент, силикатный лист\",\"Базовый материал, применяется и для фигурных подвесных потолков.\"\nmat,LP,fr,\"Mélaminé, compact HPL, panneau mélaminé décoratif\",Écrit aussi LM.\nmat,LP,it,\"Laminato, pannello compatto HPL, pannello melaminico decorativo\",Indicato anche come LM.\nmat,LP,pt,\"Laminado, compacto HPL, painel melamínico decorativo\",Também escrito LM.\nmat,LP,ru,\"Ламинат, компакт HPL, декоративный меламиновый лист\",Также пишут LM.\nmat,SF,fr,\"Feuille d'or, feuille d'argent, panneau résine, panneau en terre crue, pierre translucide\",Certains systèmes emploient SF = feuille d'or ou d'argent.\nmat,SF,it,\"Foglia d'oro, foglia d'argento, pannello in resina, pannello in terra cruda, pietra traslucida\",Alcuni sistemi usano SF = foglia d'oro/argento.\nmat,SF,pt,\"Folha de ouro, folha de prata, painel de resina, painel de taipa, pedra translúcida\",Alguns sistemas usam SF = folha de ouro/prata.\nmat,SF,ru,\"Золотая фольга, серебряная фольга, панель из смолы, панель из самана, полупрозрачный камень\",В части систем SF = золотая/серебряная фольга.\nmat,WR,fr,\"Feutre bitumineux SBS, membrane adhésive, revêtement d'étanchéité liquide\",Courant dans les tableaux de sols et de locaux humides.\nmat,WR,it,\"Membrana bituminosa SBS, membrana autoadesiva, rivestimento impermeabilizzante liquido\",Frequente nelle tavole di pavimentazione e locali umidi.\nmat,WR,pt,\"Manta asfáltica SBS, manta autoadesiva, revestimento impermeabilizante\",Frequente em quadros de pisos e áreas molhadas.\nmat,WR,ru,\"Рулонная битумная мембрана SBS, самоклеящаяся плёнка, обмазочная гидроизоляция\",Часто встречается в таблицах полов и влажных зон.\nmat,VF,fr,\"Lame et dalles PVC, sol PVC en feuille, sol SPC\",Écrit aussi PC ou LVT.\nmat,VF,it,\"Pavimento in PVC in rotola, LVT, SPC\",Indicato anche come PC o LVT.\nmat,VF,pt,\"Piso de PVC em rolo, LVT, SPC\",Também escrito PC ou LVT.\nmat,VF,ru,\"Рулонный ПВХ, плитка LVT, SPC-покрытие\",Также пишут PC или LVT.\nmat,RF,fr,\"Revêtement caoutchouc pour salles de sport, hôpitaux et laboratoires\",\"Plus rare, fréquent dans les espaces sportifs.\"\nmat,RF,it,\"Pavimento in gomma per palestre, ospedali e laboratori\",\"Meno comune, diffuso nelle strutture sportive.\"\nmat,RF,pt,\"Piso de borracha para academias, hospitais e laboratórios\",Menos comum; frequente em espaços esportivos.\nmat,RF,ru,\"Резиновое покрытие для спортзалов, больниц и лабораторий\",Встречается реже; типично для спортивных помещений.\nmat,SC,fr,\"Membrane translucide, membrane coupe-feu classe A, membrane imprimé UV\",Écrit aussi SMS ou SZ ; SC peut aussi désigner un cloisonnement (Screen).\nmat,SC,it,\"Membrana traslucida, membrana omologata classe A, membrana stampata UV\",Indicato anche SMS o SZ; SC può indicare una divisoria (Screen).\nmat,SC,pt,\"Membrana translúcida, membrana corta-fogo classe A, membrana impressa UV\",Também escrito SMS ou SZ; SC pode indicar divisória (Screen).\nmat,SC,ru,\"Светопрозрачная плёнка, плёнка класса А (по горючести), плёнка с UV-печатью\",Также пишут SMS или SZ; SC может означать перегородку (Screen).\nmat,AP,fr,\"Panneau de laine de bois, panneau de fibre de polyester, panneau perforé\",Écrit AC dans certains systèmes.\nmat,AP,it,\"Pannello in lana di legno, pannello in fibra di poliestere, pannello forato\",In alcuni sistemi indicato AC.\nmat,AP,pt,\"Painel de lã de madeira, painel de fibra de poliéster, painel perfurado\",Em alguns sistemas escrito AC.\nmat,AP,ru,\"Панель из древесной шерсти, панель из полиэфирного волокна, перфорированная панель\",В части систем обозначается AC.\nmat,PF,fr,\"Film vitrage, film décoratif, film de protection, film de vitrage véhicule\",Également utilisé pour les films provisoires et de protection.\nmat,PF,it,\"Film per vetro, film decorativo, film protettivo, film per veicoli\",Usato anche per film provvisori e di protezione.\nmat,PF,pt,\"Filme de vidro, filme decorativo, filme protetor, filme veicular\",Também usado para filmes temporários e de proteção.\nmat,PF,ru,\"Стекольная плёнка, декоративная плёнка, защитная плёнка, автомобильная плёнка\",Также используется для временных и защитных плёнок.\nobj,DL,fr,\"Downlights, projecteurs, rubans LED, suspensions, spots sur rail et autres\",Catégorie dans le tableau des matériaux ; downlight dans les légendes et références.\nobj,DL,it,\"Downlight, spotlight, strip LED, sospensioni, binari e altri apparecchi\",Categoria nei quadri dei materiali; downlight nelle legende e nei codici.\nobj,DL,pt,\"Downlights, spots, fitas de LED, pendentes, trilhos e demais aparelhos\",Categoria no quadro de materiais; downlight nas legendas e referências.\nobj,DL,ru,\"Точечные, прожекторы, LED-ленты, подвесные, трековые и прочие светильники\",В таблице материалов — категория; в легендах и моделях — точечный светильник.\nobj,FR,fr,\"Mobilier mobile, mobilier fixé, placards, plans de travail\",Écrit aussi FUR.\nobj,FR,it,\"Mobiliario mobile, mobiliario fisso, armadi, piani di lavoro\",Indicato anche come FUR.\nobj,FR,pt,\"Móvel solto, fixo, armários, bancadas\",Também escrito FUR.\nobj,FR,ru,\"Мобильная и встроенная мебель, шкафы, столешницы\",Также пишут FUR.\nobj,HW,fr,\"Serrures, paumelles, poignées, quincaillerie de vitrage, quincaillerie structurelle\",Anciens systèmes : HW = sanitaires + quincaillerie.\nobj,HW,it,\"Serrature, cerniere, maniglie, ferramenta per vetro, ferramenta strutturale\",Nei vecchi sistemi HW = sanitari + ferramenta.\nobj,HW,pt,\"Fechaduras, dobradiças, puxadores, ferragens para vidro, ferragens estruturais\",Em sistemas antigos HW = sanitários + ferragens.\nobj,HW,ru,\"Замки, петли, ручки, стекольная и строительная фурнитура\",В старых системах HW = сантехника и фурнитура.\nobj,SW,fr,\"WC, lavabos, robinetterie, douches, siphons de sol\",Écrit SAN dans certains systèmes.\nobj,SW,it,\"WC, lavabi, rubinetteria, docce, scarichi a terra\",In alcuni sistemi indicato SAN.\nobj,SW,pt,\"Vaso, lavatório, metais, chuveiros, ralos\",Em alguns sistemas escrito SAN.\nobj,SW,ru,\"Унитазы, раковины, смесители, душевые, трапы\",В части систем обозначается SAN.\nobj,KIT,fr,\"Plans de travail, hottes, chambres froides, lave-vaisselle, ustensiles\",Souvent abrégé en K.\nobj,KIT,it,\"Piani di lavoro, cappe, celle frigorifere, lavastoviglie, utensili\",Spesso abbreviato in K.\nobj,KIT,pt,\"Bancadas, coifas, câmaras frias, lava-louças, utensílios\",Costuma ser abreviado como K.\nobj,KIT,ru,\"Рабочие поверхности, вытяжки, холодильное оборудование, посудомоечные машины, посуда\",Часто сокращают до K.\nobj,PLT,fr,\"Plantes en pot, mur végétal, plantes artificielles, cache-pots\",Courant dans les listes FF&E.\nobj,PLT,it,\"Piante in vaso, parete verde, piante artificiali, vasi\",Comune nelle liste FF&E.\nobj,PLT,pt,\"Plantas em vaso, jardim vertical, plantas artificiais, vasos\",Comum nas listas de FF&E.\nobj,PLT,ru,\"Кашпо, фитостена, искусственные растения, вазоны\",Часто встречается в списках FF&E.\nobj,AR,fr,\"Peintures, installations, sculptures, objets de décoration\",AR désigne aussi la pierre artificielle (Artificial Stone).\nobj,AR,it,\"Dipinti, installazioni, sculture, oggetti decorativi\",AR indica anche la pietra artificiale (Artificial Stone).\nobj,AR,pt,\"Pinturas, instalações, esculturas, objetos decorativos\",AR também designa pedra artificial (Artificial Stone).\nobj,AR,ru,\"Картины, инсталляции, скульптуры, декоративные объекты\",AR также означает искусственный камень (Artificial Stone).\nobj,BDG,fr,\"Draps et linge, couettes, coussins, jeté de lit\",Listes FF&E des hôtels et des modèles d'appartement.\nobj,BDG,it,\"Lenzuola, coperte, cuscini, copriletto\",Liste FF&E di hotel e appartamenti campione.\nobj,BDG,pt,\"Lençóis, edredons, travesseiros, caminho de cama\",Listas de FF&E de hotéis e apartamentos modelo.\nobj,BDG,ru,\"Бельё, одеяла, подушки, покрывала\",Списки FF&E для гостиниц и шоу-апартаментов.\nobj,SSP,fr,\"Plaques de commande, plaques de prise, plaques de commande connectées\",SS désigne aussi l'inox : à distinguer.\nobj,SSP,it,\"Placchette interruttore, placchette presa, placchette domotica\",SS indica anche l'inox: distinguere bene.\nobj,SSP,pt,\"Placas de interruptor, de tomada e de controle inteligente\",SS também indica o inox: diferencie.\nobj,SSP,ru,\"Накладки выключателей, розеток, панели умного дома\",SS также означает нержавейку — различайте.\nobj,EA,fr,\"Téléviseurs, projecteurs, audio, électroménager\",Listé séparément de l'éclairage DL.\nobj,EA,it,\"Televisori, proiettori, audio, elettrodomestici\",Elencato separatamente dall'illuminazione DL.\nobj,EA,pt,\"Televisores, projetores, áudio, eletrodomésticos\",Listado a parte da iluminação DL.\nobj,EA,ru,\"Телевизоры, проекторы, аудиотехника, бытовая техника\",Указаны отдельно от освещения DL.\nlight,DL,fr,\"Encastrés ronds, ≤ Φ50 mm ; certains bureaux créent DS pour les petits diamètres\",\"DL peut aussi désigner la catégorie d'éclairage dans les tableaux de matériaux ; à Hong Kong, Taïwan, au Japon et en Corée, on utilise LT, et certains systèmes ajoutent DS pour les petits diamètres.\"\nlight,DL,it,\"Incassati rotondi, ≤ Φ50 mm; alcuni studi prevedono DS per i piccoli diametri\",\"DL può indicare anche la categoria di illuminazione nei quadri dei materiali; a Hong Kong, Taiwan, Giappone e Corea si usa LT, e alcuni sistemi aggiungono DS per i piccoli diametri.\"\nlight,DL,pt,\"Embutidos redondos, ≤ Φ50 mm; alguns escritórios criam DS para pequenos diâmetros\",\"DL também pode designar a categoria de iluminação nos quadros de materiais; em Hong Kong, Taiwan, Japão e Coreia usa-se LT, e alguns sistemas acrescentam DS aos pequenos diâmetros.\"\nlight,DL,ru,\"Встраиваемые круглые, ≤ Φ50 мм; в некоторых бюро для малых диаметров вводят DS\",\"DL может означать и категорию освещения в ведомостях материалов; в Гонконге, на Тайване, в Японии и Корее используют LT, а в некоторых системах для малых диаметров вводят DS.\"\nlight,CL,fr,Plafonniers ronds ou carrés en applique,CL désigne aussi le vernis clair dans les tableaux de finition et se confond avec la suspension PL.\nlight,CL,it,Plafoniere tonde o quadrate a superficie,CL indica anche la vernice trasparente nei quadri di finitura e si confonde con la sospensione PL.\nlight,CL,pt,\"Luminárias de teto redondas ou quadradas, de sobrepor\",CL também designa o verniz transparente nos quadros de acabamento e confunde-se com o pendente PL.\nlight,CL,ru,\"Потолочные светильники круглые или квадратные, накладные\",CL также означает прозрачный лак в ведомостях отделки и путается с подвесным светильником PL.\nlight,PL,fr,Luminaires suspendus décoratifs et linéaires,PL peut aussi désigner un panneau lumineux (Panel Light).\nlight,PL,it,Sospensioni decorative e lineari,PL può indicare anche il pannello luminoso (Panel Light).\nlight,PL,pt,Luminárias pendentes decorativas e lineares,PL também pode designar o painel de luz (Panel Light).\nlight,PL,ru,Декоративные и линейные подвесные светильники,PL может означать и светодиодный панель (Panel Light).\nlight,PN,fr,Panneaux 600×600 pour bureaux et commerces,Code conseillé pour éviter la confusion avec la suspension.\nlight,PN,it,Pannelli 600×600 per uffici e commerci,Codice consigliato per non confonderlo con la sospensione.\nlight,PN,pt,Painéis 600×600 para escritórios e comércios,Código recomendado para evitar confusão com o pendente.\nlight,PN,ru,Панели 600×600 для офисов и магазинов,\"Рекомендуемый код, чтобы не путать с подвесным светильником.\"\nlight,WL,fr,Applies de chevet et appliques extérieures,\"Au Japon, WL désigne aussi le papier peint : vérifiez le calque du plan.\"\nlight,WL,it,Lampade da parete per testiera e da esterno,In Giappone WL indica anche la carta da parati: controllare il livello del disegno.\nlight,WL,pt,Arandelas de cabeceira e arandelas externas,\"No Japão, WL também designa papel de parede: verifique a camada do desenho.\"\nlight,WL,ru,Настенные светильники у изголовья и уличные,В Японии WL также означает обои: проверьте слой чертежа.\nlight,SL,fr,Spots à orientation réglable et spots en plafond,SL désigne aussi le ruban LED et les finitions spéciales.\nlight,SL,it,Spot orientabili e spot a soffitto,SL indica anche la strip LED e le finiture speciali.\nlight,SL,pt,Spots orientáveis e spots de teto,SL também designa fita de LED e acabamentos especiais.\nlight,SL,ru,Поворотные споты и потолочные споты,SL также означает LED-ленту и специальные отделки.\nlight,FL,fr,Projecteurs extérieurs et éclairage de panneaux publicitaires,À ne pas confondre avec le niveau de finition Flamed (FL).\nlight,FL,it,Floodlight per esterni e illuminazione di insegne,Da non confondere con la finitura Flamed (FL).\nlight,FL,pt,Floodlights externos e iluminação de letreiros,Não confundir com o acabamento Flamed (FL).\nlight,FL,ru,Наружные прожекторы и подсветка вывесок,Не путать с отделкой Flamed (FL).\nlight,TL,fr,\"Projecteurs sur rail à 1, 2 ou 3 circuits, avec accessoires de suspension\",En conflit avec le carrelage (TL) : la légende tranche.\nlight,TL,it,\"Binari a 1, 2 o 3 circuiti con accessori di sospensione\",In conflitto con la ceramica (TL): decide la legenda.\nlight,TL,pt,\"Trilhos de 1, 2 ou 3 circuitos com acessórios de suspensão\",Em conflito com o azulejo (TL): a legenda decide.\nlight,TL,ru,\"Треки на 1, 2 или 3 цепи с подвесными аксессуарами\",Конфликт с плиткой (TL) — решает легенда.\nlight,LL,fr,\"Luminaires linéaires, profilés aluminium et lignes continues\",\"LL se confond avec le ruban LED et, dans les anciens systèmes, L désigne la division éclairage.\"\nlight,LL,it,\"Luci lineari, profili in alluminio e linee continue\",LL si confonde con il nastro LED e nei sistemi antichi L è il codice della divisione illuminazione.\nlight,LL,pt,\"Luminárias lineares, perfis de alumínio e linhas contínuas\",LL confunde-se com a fita de LED e em sistemas antigos L é o código da divisão de iluminação.\nlight,LL,ru,\"Линейные светильники, алюминиевые профили и линейные системы\",\"LL путают с LED-лентой, а в старых системах L обозначает раздел освещения.\"\nlight,UL,fr,Éclairage d'étagère et éclairage de meuble avec détection,UL est un code plus récent ; les anciens tableaux l'indiquent comme ruban LED ou KL.\nlight,UL,it,Luci per ripiani e luce interno con sensore,UL è un codice più recente; i vecchi quadri lo indicano come nastro LED o KL.\nlight,UL,pt,Iluminação de prateleiras e interna com sensor,UL é um código mais recente; os quadros antigos indicam fita de LED ou KL.\nlight,UL,ru,Подсветка полок и внутренняя подсветка с датчиком,UL — более новый код; в старых ведомостях его пишут как LED-ленту или KL.\nlight,ML,fr,Systèmes de rails magnétiques,\"ML est un code plus récent ; les anciens dessins écrivent rail magnétique, à ne pas confondre avec le rail TL.\"\nlight,ML,it,Sistemi di binari magnetici,\"ML è un codice più recente; i vecchi disegni scrivono binario magnetico, da non confondere con il binario TL.\"\nlight,ML,pt,Sistemas de trilho magnético,\"ML é um código mais recente; os desenhos antigos escrevem trilho magnético, a não confundir com o trilho TL.\"\nlight,ML,ru,Системы магнитных треков,\"ML — более новый код; на старых чертежах его пишут магнитный трек, не путать с треком TL.\"\nlight,WW,fr,Luminaires linéaires de lavage et d'accentuation de mur,WW relève du cahier d'éclairage architectural plutôt que de la légende de luminaires et s'écrit souvent Wall Washer.\nlight,WW,it,Wall washer lineare e luce di valorizzazione del muro,WW appartiene alla specifica di illuminazione architettonica più che alla legenda delle apparecchiature e si scrive spesso Wall Washer.\nlight,WW,pt,Luminárias lineares de lavagem e recorte de parede,WW pertence à especificação de iluminação arquitetônica mais que à legenda de luminárias e costuma ser escrito Wall Washer.\nlight,WW,ru,Линейные wash-светильники и подсветка стен,\"WW относится к спецификации архитектурного освещения, а не к легенде светильников, и часто пишется Wall Washer.\"\nlight,IL,fr,Encastrables au sol et luminaires de pied,\"IL désigne les luminaires encastrés au sol ; en extérieur, indiquez l'indice IP et distinguez-les de l'éclairage immergé UW.\"\nlight,IL,it,Incassati a terra e luci di piede,IL indica gli apparecchi incassati a terra; all'esterno indicare il grado IP e distinguerli dall'illuminazione subacquea UW.\nlight,IL,pt,Luminárias embutidas no solo e balizas de solo,IL corresponde a luminárias embutidas no solo; no exterior indique o grau IP e separe-as da luz submersa UW.\nlight,IL,ru,Встраиваемые в грунт и напольные светильники,\"IL — светильники, встраиваемые в грунт; на улице указывают степень защиты IP и не смешивают с подводным светом UW.\"\nlight,UW,fr,Éclairage de piscine et de bassin,\"UW est réservé à l'usage immergé : indiquez l'indice IP et la fixation pour les piscines et bassins, et ne le confondez pas avec l'encastrable au sol IL.\"\nlight,UW,it,Illuminazione di piscine e laghetti,\"UW è solo per uso immerso: indicare il grado IP e il montaggio per piscine e vasche, e non confonderlo con l'incassato a terra IL.\"\nlight,UW,pt,Iluminação de piscin
